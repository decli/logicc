function pNorm(cs) {
  const mr = Math.min.apply(null, cs.map(c => c[0])), mc = Math.min.apply(null, cs.map(c => c[1]));
  return cs.map(c => [c[0] - mr, c[1] - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
function pRot(cs) { const mr = Math.max.apply(null, cs.map(c => c[0])); return pNorm(cs.map(c => [c[1], mr - c[0]])); }
function pKey(cs) { return pNorm(cs).map(c => c.join(',')).join(';'); }
function pDims(cs) { return [Math.max.apply(null, cs.map(c => c[0])) + 1, Math.max.apply(null, cs.map(c => c[1])) + 1]; }
function pAllRot(cs) { const out = [], seen = {}; let c2 = pNorm(cs); for (let i = 0; i < 4; i++) { const k = pKey(c2); if (!seen[k]) { seen[k] = 1; out.push(c2); } c2 = pRot(c2); } return out; }
const FIT_COLORS = ['#2E7DD1', '#E8452C', '#3FA34D', '#F5B921', '#7B4BC9', '#12A5A0'];
function pieceEl(cs, cell, color, gap) {
  const d = pDims(cs), g = el('div');
  g.style.display = 'grid';
  g.style.gridTemplateColumns = 'repeat(' + d[1] + ',' + px(cell) + ')';
  g.style.gridAutoRows = px(cell); g.style.gap = px(gap == null ? 2 : gap);
  const set = {}; cs.forEach(c => set[c[0] + ',' + c[1]] = 1);
  for (let r = 0; r < d[0]; r++) for (let c = 0; c < d[1]; c++) {
    const b = el('div');
    if (set[r + ',' + c]) b.style.cssText = 'background:' + color + ';border:2px solid var(--ink);border-radius:5px';
    g.appendChild(b);
  }
  return g;
}
function gFit(board, lv) {
  const cfg = G.fit.levels[lv - 1].cfg;
  const holder = el('div', 'col2'); holder.style.gap = '14px';
  const boardWrap = el('div'); boardWrap.style.display = 'grid'; boardWrap.className = 'fit-board';
  const tray = el('div', 'row2 fit-tray'); tray.style.gap = '16px';
  let cellPx = 34;

  /* ---------- 补洞：选出正好补上的那一块 ---------- */
  if (cfg.kind === 'hole') {
    const BW = 5, BH = 4;
    const piece = pNorm(pick(POLY.filter(p => p.length >= 3 && p.length <= 4)));
    const d = pDims(piece);
    const oy = rnd(BH - d[0] + 1), ox = rnd(BW - d[1] + 1);
    const hole = {}; piece.forEach(c => hole[(c[0] + oy) + ',' + (c[1] + ox)] = 1);
    const cells = [];
    for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) {
      const c = el('div');
      c.style.cssText = hole[y + ',' + x]
        ? 'background:repeating-linear-gradient(45deg,#EFE7D4 0 7px,transparent 7px 14px);border:3px dashed var(--orange);border-radius:6px'
        : 'background:#C9BFA8;border:2px solid var(--ink);border-radius:6px';
      c.dataset.k = y + ',' + x;
      cells.push(c); boardWrap.appendChild(c);
    }
    const rots = pAllRot(piece);
    const shown = cfg.rot && rots.length > 1 ? pick(rots.filter(r => pKey(r) !== pKey(piece))) : piece;
    const wrongPool = POLY.filter(p => pKey(pNorm(p)) !== pKey(piece) && p.length === piece.length);
    const cands = shuffle([{ cs: shown, ok: true }].concat(
      shuffle(wrongPool).slice(0, 2).map(p => ({ cs: pNorm(p), ok: false }))));
    cands.forEach((cd, i) => {
      const t = el('div', 'tile'); t.style.padding = '8px';
      t.appendChild(pieceEl(cd.cs, cellPx * .8, FIT_COLORS[i % FIT_COLORS.length]));
      t.addEventListener('click', () => {
        if (cd.ok) {
          Audio2.good(); t.classList.add('done');
          piece.forEach(c => {
            const cell = cells[(c[0] + oy) * BW + (c[1] + ox)];
            cell.style.background = FIT_COLORS[cands.indexOf(cd) % FIT_COLORS.length];
            cell.style.border = '2px solid var(--ink)'; cell.classList.add('pop');
          });
          setPrompt('正好补上了！');
          Voice.say('正好补上');
          later(700, () => roundWin(boardWrap));
        } else { miss(); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); Voice.say('这块放不进去，再看看形状'); }
      });
      tray.appendChild(t);
    });
    setPrompt(cfg.rot ? '哪一块<b>转一下</b>正好补上缺口？' : '哪一块正好补上缺口？');
    Voice.say(cfg.rot ? '下面哪一块，转一下以后正好补上这个缺口？先在脑子里转转看' : '下面哪一块正好补上这个缺口？');
    hintIn(15000, () => { const t = tray.children[cands.findIndex(c => c.ok)]; if (t) t.classList.add('pulse'); });
    holder.appendChild(boardWrap); holder.appendChild(tray); board.appendChild(holder);
    Fit.cb = () => {
      const b = boardBox();
      cellPx = cellFit(b.w * .9, b.h * .5, BW, BH, 3, 92);
      boardWrap.style.gap = '3px';
      boardWrap.style.gridTemplateColumns = 'repeat(' + BW + ',' + px(cellPx) + ')';
      boardWrap.style.gridAutoRows = px(cellPx);
      [...tray.children].forEach((t, i) => { t.innerHTML = ''; t.appendChild(pieceEl(cands[i].cs, cellPx * .72, FIT_COLORS[i % FIT_COLORS.length])); });
    };
    return;
  }

  /* ---------- 拼满 / 消消：选块 + 落位 ---------- */
  const isClear = cfg.kind === 'clear';
  const BW = isClear ? cfg.w : 4, BH = isClear ? cfg.h : 4;
  const occ = {};                      // 已占格
  const region = {};                   // 拼满模式下的目标区域
  let pieces = [];                     // 待放置的块
  let sel = -1, cleared = 0;
  const cells = [];

  function buildRegion() {             // 用 n 块随机拼出一块连通区域，保证有解
    for (let attempt = 0; attempt < 60; attempt++) {
      const used = {}, out = [];
      let okAll = true;
      for (let i = 0; i < cfg.pieces; i++) {
        let placed = false;
        const order = shuffle(POLY.filter(p => p.length >= 2 && p.length <= 4));
        for (const p of order) {
          for (const r of shuffle(pAllRot(p))) {
            const d = pDims(r);
            const spots = [];
            for (let y = 0; y + d[0] <= BH; y++) for (let x = 0; x + d[1] <= BW; x++) {
              if (r.every(c => !used[(c[0] + y) + ',' + (c[1] + x)])) {
                if (i === 0 || r.some(c => {
                  const yy = c[0] + y, xx = c[1] + x;
                  return used[(yy - 1) + ',' + xx] || used[(yy + 1) + ',' + xx] || used[yy + ',' + (xx - 1)] || used[yy + ',' + (xx + 1)];
                })) spots.push([y, x]);
              }
            }
            if (spots.length) { const [y, x] = pick(spots); r.forEach(c => used[(c[0] + y) + ',' + (c[1] + x)] = 1); out.push(pNorm(r)); placed = true; break; }
          }
          if (placed) break;
        }
        if (!placed) { okAll = false; break; }
      }
      if (okAll) return { used: used, pieces: out };
    }
    return null;
  }
  if (!isClear) {
    const g2 = buildRegion();
    if (g2) { Object.keys(g2.used).forEach(k => region[k] = 1); pieces = shuffle(g2.pieces); }
  } else {
    pieces = [0, 1, 2].map(() => pNorm(pick(pAllRot(pick(POLY.filter(p => p.length >= 2 && p.length <= 4))))));
  }
  for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) {
    const c = el('div'); c.dataset.y = y; c.dataset.x = x;
    c.addEventListener('click', () => drop(y, x));
    cells.push(c); boardWrap.appendChild(c);
  }
  function paintBoard() {
    cells.forEach(c => {
      const k = c.dataset.y + ',' + c.dataset.x;
      if (occ[k]) c.style.cssText = 'background:' + occ[k] + ';border:2px solid var(--ink);border-radius:6px';
      else if (!isClear && region[k]) c.style.cssText = 'background:repeating-linear-gradient(45deg,#EFE7D4 0 7px,transparent 7px 14px);border:3px dashed var(--orange);border-radius:6px';
      else c.style.cssText = isClear ? 'background:#fff;border:2px solid var(--line);border-radius:6px' : 'background:transparent;border:2px solid transparent';
      c.style.width = px(cellPx); c.style.height = px(cellPx);
    });
  }
  function paintTray() {
    tray.innerHTML = '';
    pieces.forEach((p, i) => {
      if (!p) { const gap = el('div'); gap.style.width = px(cellPx * 2); tray.appendChild(gap); return; }
      const t = el('div', 'tile' + (i === sel ? ' pick' : '')); t.style.padding = '7px';
      t.appendChild(pieceEl(p, cellPx * .68, FIT_COLORS[i % FIT_COLORS.length]));
      t.addEventListener('click', () => { sel = i; Audio2.tap(); paintTray(); });
      tray.appendChild(t);
    });
    if (cfg.rot || isClear) {
      const rb = el('button', 'sw', '🔄 转一下');
      rb.addEventListener('click', () => {
        if (sel < 0 || !pieces[sel]) { Voice.say('先选一块'); return; }
        pieces[sel] = pRot(pieces[sel]); Audio2.tap(); paintTray();
      });
      tray.appendChild(rb);
    }
  }
  function canPlace(p, y, x) {
    return p.every(c => {
      const yy = c[0] + y, xx = c[1] + x, k = yy + ',' + xx;
      if (yy < 0 || xx < 0 || yy >= BH || xx >= BW || occ[k]) return false;
      if (!isClear && !region[k]) return false;
      return true;
    });
  }
  function drop(y, x) {
    if (sel < 0 || !pieces[sel]) { Voice.say('先选一块方块'); return; }
    const p = pieces[sel];
    // 宽容落位：只要有一种摆法能盖住你点的格子就算
    let best = null;
    for (const c of p) { const oy = y - c[0], ox = x - c[1]; if (canPlace(p, oy, ox)) { best = [oy, ox]; break; } }
    if (!best) { miss(); const cell = cells[y * BW + x]; cell.classList.remove('shake'); void cell.offsetWidth; cell.classList.add('shake'); Voice.say('这里放不下，换个地方试试'); return; }
    const color = FIT_COLORS[sel % FIT_COLORS.length];
    p.forEach(c => occ[(c[0] + best[0]) + ',' + (c[1] + best[1])] = color);
    pieces[sel] = null; sel = -1; Audio2.pop(); paintBoard(); paintTray();
    if (isClear) checkLines(); else checkFull();
  }
  function checkFull() {
    const need = Object.keys(region).length, have = Object.keys(occ).length;
    setPrompt('还剩 <span class="num">' + (need - have) + '</span> 格');
    if (have >= need) { setPrompt('拼满啦！'); Voice.say('拼满啦'); later(500, () => roundWin(boardWrap)); }
    else if (pieces.every(p => !p)) { Voice.say('方块用完了，再来一次'); later(900, () => nextRound()); }
  }
  function checkLines() {
    let got = 0;
    for (let y = 0; y < BH; y++) { let full = true; for (let x = 0; x < BW; x++) if (!occ[y + ',' + x]) full = false; if (full) { for (let x = 0; x < BW; x++) delete occ[y + ',' + x]; got++; } }
    for (let x = 0; x < BW; x++) { let full = true; for (let y = 0; y < BH; y++) if (!occ[y + ',' + x]) full = false; if (full) { for (let y = 0; y < BH; y++) delete occ[y + ',' + x]; got++; } }
    if (got) { cleared += got; Audio2.star(); toast('消掉 ' + got + ' 行！'); paintBoard(); }
    setPrompt('已经消掉 <span class="num">' + cleared + '</span> / ' + cfg.goal + ' 行');
    if (cleared >= cfg.goal) { setPrompt('消够啦 🎉'); Voice.say('消够啦'); return later(500, () => roundWin(boardWrap)); }
    if (pieces.every(p => !p)) pieces = [0, 1, 2].map(() => pNorm(pick(pAllRot(pick(POLY.filter(p => p.length >= 2 && p.length <= 4))))));
    // 一块都放不下就换一批，不让孩子卡死
    const stuck = pieces.every(p => { if (!p) return true; for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) if (canPlace(p, y, x)) return false; return true; });
    if (stuck) { pieces = [0, 1, 2].map(() => pNorm(pick(pAllRot(pick(POLY.filter(p => p.length >= 2 && p.length <= 3)))))); toast('换一批方块 🔄'); }
    paintTray();
  }
  holder.appendChild(boardWrap); holder.appendChild(tray); board.appendChild(holder);
  setPrompt(isClear ? '填满一整行或一整列就会消掉' : '用下面的方块把虚线区域拼满');
  Voice.say(isClear ? '把方块放到棋盘上，填满一整行或者一整列就会消掉。不会掉下来，可以慢慢想'
    : '先点一块方块，再点要放的位置，把虚线的地方拼满');
  Fit.cb = () => {
    const b = boardBox();
    cellPx = cellFit(b.w * .92, b.h * .56, BW, BH, 3, 80);
    boardWrap.style.gap = '3px';
    boardWrap.style.gridTemplateColumns = 'repeat(' + BW + ',' + px(cellPx) + ')';
    boardWrap.style.gridAutoRows = px(cellPx);
    paintBoard(); paintTray();
  };
}

/* ===================== 11 小鱼朝哪边（选择性注意与抑制 / flanker） =====================
   替换掉原来的红绿灯反转：反转「红灯停绿灯行」会污染孩子的交通安全认知，
   为了练执行功能去改一条每天要用的生活规则，这笔账不划算。
   flanker（NIH Toolbox 儿童版就用小鱼）语义中性，干扰纯粹来自视觉，
   而且顺带练左右辨别。
   ================================================================================== */
function fishEl(dir, size, color) {
  const svg = svgEl('svg'); svg.setAttribute('viewBox', '0 0 100 60');
  svg.style.width = px(size); svg.style.height = px(size * .6); svg.style.display = 'block';
  const g = svgEl('g');
  if (dir < 0) g.setAttribute('transform', 'translate(100,0) scale(-1,1)');
  const body = svgEl('ellipse');
  body.setAttribute('cx', 52); body.setAttribute('cy', 30); body.setAttribute('rx', 30); body.setAttribute('ry', 19);
  body.setAttribute('fill', color); body.setAttribute('stroke', '#2A2523'); body.setAttribute('stroke-width', 4);
  const tail = svgEl('polygon');
  tail.setAttribute('points', '22,30 2,12 2,48');
  tail.setAttribute('fill', color); tail.setAttribute('stroke', '#2A2523'); tail.setAttribute('stroke-width', 4);
  const eye = svgEl('circle');
  eye.setAttribute('cx', 68); eye.setAttribute('cy', 24); eye.setAttribute('r', 4.5); eye.setAttribute('fill', '#2A2523');
  g.appendChild(tail); g.appendChild(body); g.appendChild(eye); svg.appendChild(g);
  return svg;
}
function arrowEl(dir, size, color) {
  const svg = svgEl('svg'); svg.setAttribute('viewBox', '0 0 100 60');
  svg.style.width = px(size); svg.style.height = px(size * .6); svg.style.display = 'block';
  const g = svgEl('g');
  if (dir < 0) g.setAttribute('transform', 'translate(100,0) scale(-1,1)');
  const a = svgEl('polygon');
  a.setAttribute('points', '5,22 58,22 58,6 95,30 58,54 58,38 5,38');
  a.setAttribute('fill', color); a.setAttribute('stroke', '#2A2523'); a.setAttribute('stroke-width', 4);
  g.appendChild(a); svg.appendChild(g);
  return svg;
}
function gFish(board, lv) {
  const cfg = G.fish.levels[lv - 1].cfg, N = cfg.n, PRACTICE = 2;
  const holder = el('div', 'col2'); holder.style.gap = '16px';
  const row = el('div', 'row2 fish-row'); row.style.gap = '10px';
  const bar = el('div'); bar.style.cssText = 'height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden';
  const barIn = el('div'); barIn.style.cssText = 'height:100%;width:100%;background:var(--yellow)';
  bar.appendChild(barIn);
  const btns = el('div', 'row2 fish-btns'); btns.style.gap = '22px';
  const leftBtn = el('div', 'tile', '⬅️'), rightBtn = el('div', 'tile', '➡️');
  leftBtn.addEventListener('click', () => answer(-1));
  rightBtn.addEventListener('click', () => answer(1));
  btns.appendChild(leftBtn); btns.appendChild(rightBtn);
  const tally = el('div'); tally.style.cssText = 'font-size:15px;color:var(--ink-soft)';

  const seq = [];
  for (let k = 0; k < N; k++) {
    const d = rnd(2) ? 1 : -1;
    seq.push({ d: d, inc: k >= PRACTICE && Math.random() < cfg.inc });
  }
  let i = 0, right = 0, timer = null, answered = false, over = false, size = 70;
  const draw = () => {
    row.innerHTML = '';
    if (i >= N) return;
    const it = seq[i], mk = cfg.arrow ? arrowEl : fishEl;
    const flankDir = it.inc ? -it.d : it.d;
    for (let k = 0; k < cfg.flank; k++) row.appendChild(mk(flankDir, size, '#9AA7B5'));
    const mid = el('div'); mid.style.cssText = 'padding:4px;border:4px solid var(--orange);border-radius:12px;background:#FFF7E2';
    mid.appendChild(mk(it.d, size, '#F5B921'));
    row.appendChild(mid);
    for (let k = 0; k < cfg.flank; k++) row.appendChild(mk(flankDir, size, '#9AA7B5'));
  };
  function tallyTx() { tally.textContent = (i < PRACTICE ? '练习中 · ' : '') + '第 ' + Math.min(i + 1, N) + ' / ' + N + '　答对 ' + right; }
  function show() {
    if (over) return;
    if (i >= N) return finish();
    answered = false; draw(); tallyTx();
    const t0 = Date.now(); barIn.style.width = '100%';
    clearInterval(timer);
    timer = every(70, tm => {
      if (over) { clearInterval(tm); return; }
      const p2 = 1 - (Date.now() - t0) / cfg.win;
      barIn.style.width = Math.max(0, p2 * 100) + '%';
      if (p2 <= 0) { clearInterval(tm); if (!answered) { answered = true; Audio2.soft(); i++; later(420, show); } }
    });
  }
  function answer(dir) {
    if (answered || over) return;
    answered = true; clearInterval(timer);
    const it = seq[i];
    if (dir === it.d) { if (i >= PRACTICE) right++; Audio2.good(); row.style.background = '#BFE8C4'; i++; later(460, () => { row.style.background = ''; show(); }); }
    else { if (i >= PRACTICE) miss(); row.style.background = '#FBD5CE'; Voice.say('只看中间那一条，它朝哪边'); i++; later(820, () => { row.style.background = ''; show(); }); }
  }
  function finish() {
    if (over) return; over = true; clearInterval(timer);
    const scoreable = N - PRACTICE, pass = right >= Math.ceil(scoreable * .7);
    tallyTx(); row.innerHTML = '';
    setPrompt(pass ? ('答对 <span class="num">' + right + '</span> / ' + scoreable + '，眼睛很稳！') : ('答对 <span class="num">' + right + '</span> / ' + scoreable + '，再来一次会更好'));
    Voice.say(pass ? '答对 ' + right + ' 个，眼睛很稳' : '答对 ' + right + ' 个，再来一次');
    if (pass) later(600, () => roundWin(row)); else later(1600, () => nextRound());
  }
  holder.appendChild(row); holder.appendChild(bar); holder.appendChild(btns); holder.appendChild(tally);
  board.appendChild(holder);
  setPrompt(cfg.flank ? '只看<b>中间</b>那一条，它朝哪边就点哪边' : '它朝哪边，就点哪边');
  Voice.say(cfg.flank ? '只看中间那一条，它朝左就点左边，朝右就点右边。旁边的不用管' : '它朝左就点左边，朝右就点右边');
  later(1200, show);
  Fit.cb = () => {
    const b = boardBox();
    const n = cfg.flank * 2 + 1;
    size = clamp(Math.min(b.w * .82 / n, b.h * .34), 34, 130);
    draw();
    bar.style.width = px(size * n * .9);
    const bs = clamp(Math.min(b.h * .2, b.w * .18), 54, 130);
    [leftBtn, rightBtn].forEach(x => { x.style.width = px(bs * 1.3); x.style.height = px(bs); x.style.fontSize = px(bs * .5); });
  };
}

/* ===================== 12 记住亮过的（空间工作记忆 / Corsi） =====================
   Corsi 方块范式。学龄前工作记忆容量实测大约 3.2 个条目，
   所以跨度定在 2~4；倒序版需要在脑子里翻转序列，负荷明显更高。
   =============================================================================== */
function gSpan(board, lv) {
  const cfg = G.span.levels[lv - 1].cfg, W = cfg.w, H = cfg.h, L = cfg.len;
  const holder = el('div', 'col2');
  const grid = el('div'); grid.style.display = 'grid';
  const cells = [];
  const all = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) all.push(y * W + x);
  const seq = shuffle(all).slice(0, L);
  let phase = 'show', step = 0;
  for (let k = 0; k < W * H; k++) {
    const c = el('div', 'tile'); c.dataset.k = k;
    c.addEventListener('click', () => tap(k, c));
    cells.push(c); grid.appendChild(c);
  }
  function light(k, on) { cells[k].style.background = on ? 'var(--yellow)' : '#fff'; if (on) cells[k].classList.add('pop'); else cells[k].classList.remove('pop'); }
  function playSeq() {
    setPrompt('看好哪些格子亮了');
    let i = 0;
    every(720, tm => {
      if (i > 0) light(seq[i - 1], false);
      if (i >= L) {
        clearInterval(tm); phase = 'input';
        setPrompt(cfg.rev ? '倒着点一遍（从最后一个开始）' : '照原样点一遍');
        Voice.say(cfg.rev ? '现在倒着点一遍，从最后亮的那个开始' : '现在照刚才的顺序点一遍');
        return;
      }
      light(seq[i], true); Audio2.count(i); i++;
    });
  }
  function want() { return cfg.rev ? seq.slice().reverse() : seq; }
  function tap(k, c) {
    if (phase !== 'input') return;
    const w = want();
    if (k === w[step]) {
      c.style.background = 'var(--green)'; c.classList.add('pop'); Audio2.good(); step++;
      if (step >= L) { setPrompt('全对！'); later(400, () => roundWin(grid)); }
    } else {
      miss(); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      Voice.say('不是这个，再想想');
    }
  }
  holder.appendChild(grid); board.appendChild(holder);
  setPrompt('看好哪些格子亮了');
  Voice.say(cfg.rev ? '看好格子亮的顺序，等一下要倒着点一遍' : '看好哪些格子亮了，等一下照原样点一遍');
  later(700, playSeq);
  hintIn(20000, () => { if (phase === 'input') { const w = want(); cells[w[step]].classList.add('pulse'); later(1600, () => cells[w[step]] && cells[w[step]].classList.remove('pulse')); } });
  Fit.cb = () => {
    const b = boardBox(), gap = clamp(b.w / 80, 6, 14);
    const c = cellFit(b.w, b.h, W, H, gap, 130);
    grid.style.gap = px(gap);
    grid.style.gridTemplateColumns = 'repeat(' + W + ',' + px(c) + ')';
    grid.style.gridAutoRows = px(c);
  };
}

const GAME_IMPL = { fit: gFit, fish: gFish, span: gSpan, schulte: gSchulte, dots: gDots, bond: gBond, match: gMatch, mirror: gMirror, connect: gConnect, link: gLink, maze: gMaze, pattern: gPattern };


/* ===================== 家长设置 / 贴纸册 ===================== */
function sheet(title, back) {
  var s = el('div', 'sheet');
  var bar = el('div', 'topbar');
  bar.appendChild(ibtn('⬅', '#fff', function () { s.remove(); if (back) back(); }));
  var t = el('div', 'barTitle'); t.appendChild(el('span', null, title)); bar.appendChild(t);
  bar.appendChild(el('div', 'grow'));
  s.appendChild(bar);
  return s;
}
function toggleRow(name, desc, get, set, warn) {
  var r = el('div', 'prow');
  var tx = el('div', 'tx'); tx.appendChild(el('b', null, name));
  tx.appendChild(el('span', warn ? 'warn' : null, desc));
  r.appendChild(tx);
  var b = el('button', 'tg' + (get() ? ' on' : ''), get() ? '开' : '关');
  b.addEventListener('click', function () { set(!get()); b.className = 'tg' + (get() ? ' on' : ''); b.textContent = get() ? '开' : '关'; save(); });
  r.appendChild(b);
  return r;
}
function openPanel() {
  if (document.querySelector('.sheet')) return;
  Audio2.init();
  var s = sheet('⚙️ 家长设置');
  var body = el('div', 'sheetBody');
  var cols = el('div', 'pcols');
  var c1 = el('div', 'pcard'); c1.appendChild(el('h3', null, '声音'));
  c1.appendChild(toggleRow('音效', '点对、消除、通关的提示音', function () { return Audio2.on; }, function (v) { Audio2.on = v; }));
  c1.appendChild(toggleRow('语音读题', '每道题自动朗读一遍，不识字也能玩', function () { return Voice.on; }, function (v) { Voice.on = v; if (!v && 'speechSynthesis' in window) speechSynthesis.cancel(); }));
  c1.appendChild(toggleRow('背景音乐', '朗读时自动压低', function () { return Music.on; }, function (v) { Music.on = v; if (v) Music.start(); else Music.stop(); }));
  var c2 = el('div', 'pcard'); c2.appendChild(el('h3', null, '玩法'));
  c2.appendChild(toggleRow('玩得顺时自动升关', '连续三关零失误升一级，一关错五次降一级', function () { return S.autoLevel; }, function (v) { S.autoLevel = v; }));
  c2.appendChild(toggleRow('慢慢来模式', '默认打开。题目分批出现而不是一次铺满；找数字这类关卡会拆成「先找 5 个」的小目标。孩子一看到满屏内容就发怵时开着。', function () { return S.easeIn; }, function (v) { S.easeIn = v; }));
  c2.appendChild(toggleRow('找数字：藏起要找的数', '默认关闭。打开后题目牌只显示「?」，数字只念一遍，孩子得自己记着数到几了——这部分工作记忆的负荷会回到她身上。点一下牌子能偷看 1.5 秒。', function () { return S.hideTarget; }, function (v) { S.hideTarget = v; }));
  c2.appendChild(toggleRow('卡住时发光提示', '默认关闭。打开后没动作时会点亮正确答案——等于替孩子做完了搜索，训练效果会打折。', function () { return S.hints; }, function (v) { S.hints = v; }, true));
  var c3 = el('div', 'pcard'); c3.appendChild(el('h3', null, '计时与记录'));
  c3.appendChild(toggleRow('给孩子看秒表', '关掉后孩子看不到计时，后台照常记录用时；容易紧张的孩子建议关', function () { return S.showTimer; }, function (v) { S.showTimer = v; }));
  c3.appendChild(toggleRow('跨天保存进度', '关卡、星星、贴纸、每关最快用时留在这台平板上', function () { return S.persist; }, function (v) { S.persist = v; if (v) save(); }));
  var clr = el('div', 'prow');
  var ctx = el('div', 'tx'); ctx.appendChild(el('span', null, '已记录 ' + Object.keys(S.days).length + ' 天 · 星星 ' + S.stars + ' 颗 · 贴纸 ' + S.stickers.length + ' 张'));
  clr.appendChild(ctx);
  var cb = el('button', 'tg'); cb.textContent = '清空'; cb.style.color = 'var(--red)'; cb.style.width = '110px';
  cb.addEventListener('click', function () {
    S.stars = 0; S.stickers = []; S.best = {}; S.days = {};
    GAMES.forEach(function (g) { S.level[g.id] = 1; S.streak[g.id] = 0; });
    save(); s.remove(); home(); toast('记录清空了');
  });
  clr.appendChild(cb); c3.appendChild(clr);
  cols.appendChild(c1); cols.appendChild(c2); cols.appendChild(c3);
  var box = el('div', 'lvbox');
  var hd = el('div'); hd.style.cssText = 'display:flex;align-items:baseline;gap:14px';
  hd.appendChild(el('h3', null, '手动调关卡'));
  hd.appendChild(el('span', null, '孩子也能在每个游戏的台阶里自己选')).style.cssText = 'font-size:19px;color:var(--ink-soft)';
  box.appendChild(hd);
  var grid = el('div', 'lvgrid');
  GAMES.forEach(function (g) {
    var ch = el('div', 'lvchip');
    ch.appendChild(el('span', 'n', g.emoji + ' ' + g.name));
    var mn = el('button', null, '−'), val = el('b', 'num', String(S.level[g.id]) + '/' + g.levels.length), pl = el('button', null, '+');
    mn.addEventListener('click', function () { S.level[g.id] = Math.max(1, S.level[g.id] - 1); val.textContent = S.level[g.id] + '/' + g.levels.length; save(); });
    pl.addEventListener('click', function () { S.level[g.id] = Math.min(g.levels.length, S.level[g.id] + 1); val.textContent = S.level[g.id] + '/' + g.levels.length; save(); });
    ch.appendChild(mn); ch.appendChild(val); ch.appendChild(pl);
    grid.appendChild(ch);
  });
  box.appendChild(grid);
  body.appendChild(cols); body.appendChild(box);
  s.appendChild(body);
  $('#screen').appendChild(s);
}
function openAlbum() {
  if (document.querySelector('.sheet')) return;
  var s = sheet('📖 我的贴纸 ' + S.stickers.length + '/' + STICKERS.length);
  var g = el('div', 'albumGrid');
  STICKERS.forEach(function (st) {
    var has = S.stickers.indexOf(st) >= 0;
    g.appendChild(el('s', has ? null : 'q', has ? st : '?'));
  });
  s.appendChild(g);
  $('#screen').appendChild(s);
}
function boot() {
  load();
  fitScale();
  Fit.boot();
  home();
  document.addEventListener('pointerdown', function () { Audio2.init(); Voice.unlock(); Music.start(); }, { once: true });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { Music.stop(); if ('speechSynthesis' in window) speechSynthesis.cancel(); } else Music.start(); });
}

boot();
