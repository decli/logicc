<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="思维小画本">
<meta name="theme-color" content="#FFFCF2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>思维小画本</title>
<style>
:root{
  --paper:#FFFCF2;
  --ink:#2A2523;
  --ink-soft:#6F665E;
  --line:#E4DCC9;
  --red:#E8452C;
  --orange:#F08A24;
  --yellow:#F5B921;
  --green:#3FA34D;
  --blue:#2E7DD1;
  --purple:#7B4BC9;
  --pink:#E4568E;
  --teal:#12A5A0;
  --vh:1vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overscroll-behavior:none}
body{
  background:var(--paper);
  background-image:radial-gradient(var(--line) 1.2px, transparent 1.3px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overflow:hidden;
}
.num{font-family:"Arial Rounded MT Bold","Avenir Next Rounded","Nunito","PingFang SC",sans-serif;font-weight:700}
#app{display:flex;flex-direction:column;height:100%;height:calc(var(--vh)*100);max-width:1240px;margin:0 auto;width:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* ---------- top bar ---------- */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.iconbtn{
  width:52px;height:52px;flex:0 0 auto;border:3px solid var(--ink);background:#fff;
  border-radius:16px;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:3px 3px 0 var(--ink);cursor:pointer;padding:0;
}
.iconbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#barTitle{flex:1 1 auto;min-width:0;font-size:22px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sayBtn{background:var(--yellow)}
#sayBtn.talking{animation:pl 1s infinite}
#starBox{display:flex;align-items:center;gap:6px;font-size:22px;padding:6px 14px;border:3px solid var(--ink);
  border-radius:999px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
#starBox .num{font-size:22px}
/* ---------- screen ---------- */
#screen{flex:1 1 auto;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;padding:0 14px 14px;display:flex;flex-direction:column}
/* ---------- home ---------- */
.hero{display:flex;align-items:baseline;gap:12px;padding:2px 4px 12px}
.hero h1{margin:0;font-size:30px;letter-spacing:.04em;transform:rotate(-1.2deg)}
.hero p{margin:0;color:var(--ink-soft);font-size:15px}
#cards{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:14px;min-height:0}
@media (orientation:landscape){#cards{grid-template-columns:repeat(4,1fr)}}
.card{
  border:4px solid var(--ink);border-radius:20px;background:#fff;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:5px 5px 0 var(--ink);cursor:pointer;padding:6px 6px 15%;
}
.card:nth-child(odd){transform:rotate(-1deg)}
.card:nth-child(even){transform:rotate(1deg)}
.card:active{transform:translate(4px,4px) rotate(0deg);box-shadow:0 0 0 var(--ink)}
.card .band{position:absolute;left:0;right:0;bottom:0;height:13%;background:var(--c)}
.card .emoji{font-size:min(7vh,5.5vw);line-height:1.1;position:relative;z-index:1}
.card .name{font-size:min(3vh,2.4vw);font-weight:700;position:relative;z-index:1}
.card .lv{position:absolute;top:8px;right:10px;font-size:13px;color:var(--ink-soft);z-index:1}
.card .band .stripe{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 6px,transparent 6px 14px)}
#stickerBar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 4px 2px;font-size:15px;color:var(--ink-soft);min-height:42px;flex-wrap:wrap}
#stickerBar span.st{font-size:26px}
/* ---------- game shell ---------- */
#dots{flex:0 0 auto;display:flex;gap:8px;justify-content:center;padding:2px 0 8px}
#dots i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:block}
#dots i.on{background:var(--yellow)}
#prompt{flex:0 0 auto;text-align:center;font-size:min(4vh,3vw);font-weight:700;padding:2px 0 8px;min-height:34px}
#board{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.center{display:flex;align-items:center;justify-content:center;flex-direction:column}
/* ---------- generic tiles ---------- */
.tile{
  border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.tile:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.tile.done{background:var(--green);color:#fff;border-color:var(--ink);box-shadow:none;transform:none;cursor:default}
.tile.pick{background:var(--yellow)}
.shake{animation:sh .34s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}50%{transform:translateX(7px)}80%{transform:translateX(-4px)}}
.pulse{animation:pl 1s infinite}
@keyframes pl{0%,100%{filter:none}50%{filter:brightness(1.12) drop-shadow(0 0 10px var(--yellow))}}
.pop{animation:pp .35s}
@keyframes pp{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
/* schulte */
#grid{display:grid;gap:min(1.6vh,12px)}
#grid .tile{font-size:min(6vh,5vw)}
#targetChip{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:64px;
  border:4px solid var(--ink);border-radius:20px;background:var(--yellow);box-shadow:4px 4px 0 var(--ink);
  font-size:min(4.6vh,34px);margin-left:10px;vertical-align:middle;padding:0 10px}
/* dots face */
.face{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  width:100%;height:100%;padding:10%;gap:4%}
.face.wide{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr)}
.face b{border-radius:50%;background:var(--ink);width:100%;aspect-ratio:1;align-self:center;justify-self:center;display:block}
.face b.off{background:transparent}
.face b.lit{background:var(--red);animation:pp .3s}
.domino{display:flex;flex-direction:column;border:4px solid var(--ink);border-radius:18px;background:#fff;
  box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.domino .half{flex:1 1 0;min-height:0;position:relative}
.domino .half+.half{border-top:4px solid var(--ink)}
.domino .qm{display:flex;align-items:center;justify-content:center;height:100%;font-size:min(8vh,46px);color:var(--line)}
.optrow{display:flex;gap:min(2.5vh,16px);align-items:stretch;justify-content:center;flex-wrap:wrap}
.opt{width:min(17vh,13vw);height:min(12vh,9vw)}
.opt.numopt{font-size:min(6vh,5vw);width:min(15vh,11vw);height:min(15vh,11vw)}
/* bond */
#bondWrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.bnode{width:min(12vh,9vw);height:min(12vh,9vw);border-radius:50%;border:4px solid var(--ink);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:min(6vh,4.5vw);box-shadow:4px 4px 0 var(--ink)}
.bnode.top{background:var(--blue);color:#fff}
.bnode.q{background:#fff;color:var(--line)}
.bnode.fill{background:var(--green);color:#fff}
/* match */
#matchWrap{position:relative;width:100%;height:100%}
#matchSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mcols{position:relative;display:flex;justify-content:space-between;height:100%;padding:0 2px}
.mcol{display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.mitem{padding:0 min(2.4vh,16px);height:min(8vh,7vw);font-size:min(4.2vh,3.2vw);letter-spacing:.06em}
.mitem.done{background:var(--purple);color:#fff}
/* mirror */
#mirrorWrap{display:grid;gap:min(1.2vh,8px);position:relative}
.mc{border-radius:8px;border:2px dashed var(--line);background:#fff}
.mc.left{border:2px solid var(--ink);background:var(--blue)}
.mc.blank{border:2px dashed var(--line)}
.mc.right{border:2px solid var(--ink);background:var(--pink);animation:pp .3s}
.mc.miss{background:var(--line);transition:background .5s}
.mirrorline{position:absolute;top:-4px;bottom:-4px;width:0;border-left:4px dashed var(--orange)}
/* connect */
#cSvg{width:100%;height:100%}
#cSvg .dot{fill:#fff;stroke:var(--ink);stroke-width:3}
#cSvg .dot.on{fill:var(--green)}
#cSvg .dot.next{fill:var(--yellow)}
#cSvg text{font-family:"Arial Rounded MT Bold","PingFang SC",sans-serif;font-weight:700;font-size:7px;fill:var(--ink);text-anchor:middle;pointer-events:none}
#cSvg .seg{stroke:var(--purple);stroke-width:7;stroke-linecap:round;fill:none}
#cSvg .shapefill{fill:var(--yellow);opacity:0;transition:opacity .6s}
#cSvg .shapefill.show{opacity:.85}
/* celebrate + reward */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.spark{position:absolute;font-size:30px;animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
#reward{position:absolute;inset:0;background:rgba(255,252,242,.96);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:6;text-align:center;padding:20px}
#reward .big{font-size:min(20vh,18vw);animation:pp .5s}
#reward h2{margin:0;font-size:min(5vh,30px)}
.bigbtn{border:4px solid var(--ink);border-radius:18px;background:var(--yellow);box-shadow:5px 5px 0 var(--ink);
  font-size:22px;font-weight:700;padding:14px 28px;font-family:inherit;color:var(--ink);cursor:pointer}
.bigbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.bigbtn.ghost{background:#fff}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
/* settings */
#panel{position:absolute;left:10px;right:10px;bottom:10px;max-width:560px;max-height:min(84vh,760px);overflow:auto;-webkit-overflow-scrolling:touch;margin:0 auto;background:#fff;border:4px solid var(--ink);
  border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:16px;z-index:7}
#panel h3{margin:0 0 10px;font-size:20px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:2px solid var(--line);font-size:17px}
.row:last-of-type{border-bottom:0}
.sw{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:6px 16px;font-size:16px;font-family:inherit;cursor:pointer}
.sw.on{background:var(--green);color:#fff}

/* 水果连连看 */
#llHolder{position:relative;display:inline-block}
#llWrap{display:grid;gap:min(1.4vh,10px)}
.ll{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.ll:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.ll.pick{background:var(--yellow)}
.ll.gone{visibility:hidden}
#llSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#llSvg polyline{fill:none;stroke:var(--teal);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
/* 走迷宫 */
#mzHolder{display:flex;flex-direction:column;align-items:center;gap:10px}
#mzWrap{display:grid;background:#fff;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);
  border-radius:4px;touch-action:none;position:relative}
.mz{position:relative;display:flex;align-items:center;justify-content:center;line-height:1}
.mz.wn{border-top:4px solid var(--ink)}
.mz.ww{border-left:4px solid var(--ink)}
.mz.trail{background:#FCEBB0}
.mz.sol{background:#CFE6FF}
.mz.won{background:#BFE8C4}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="iconbtn hide" id="backBtn" aria-label="回到首页">🏠</button>
    <div id="barTitle">思维小画本</div>
    <div id="starBox"><span>⭐</span><span class="num" id="starNum">0</span></div>
    <button class="iconbtn" id="sayBtn" aria-label="再读一遍题目">🔊</button>
    <button class="iconbtn" id="gearBtn" aria-label="家长设置">⚙️</button>
  </div>
  <div id="screen"></div>
</div>
<div id="fx"></div>

<script>
/* ============ 基础工具 ============ */
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const n = document.createElement(t); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
function setVH() { document.documentElement.style.setProperty('--vh', (window.innerHeight / 100) + 'px'); }
setVH(); window.addEventListener('resize', setVH); window.addEventListener('orientationchange', () => setTimeout(setVH, 250));
document.addEventListener('gesturestart', e => e.preventDefault());

/* ============ 声音 ============ */
const Audio2 = {
  ctx: null,
  on: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(freq, dur, type, vol) {
    if (!this.on) return; this.init(); if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.value = 0; o.connect(g); g.connect(this.ctx.destination);
    const t = this.ctx.currentTime, v = vol == null ? .14 : vol;
    g.gain.linearRampToValueAtTime(v, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); o.stop(t + dur + .02);
  },
  tap() { this.beep(520, .08, 'triangle', .08); },
  step() { this.beep(300 + rnd(90), .06, 'triangle', .05); },
  pop() { this.beep(880, .06, 'sine', .09); setTimeout(() => this.beep(1320, .1, 'sine', .07), 55); },
  star() { [784, 1047, 1319].forEach((f, i) => setTimeout(() => this.beep(f, .12, 'sine', .1), i * 70)); },
  page() { this.beep(380, .09, 'sine', .05); setTimeout(() => this.beep(560, .1, 'sine', .05), 70); },
  good() { this.beep(660, .1, 'sine'); setTimeout(() => this.beep(880, .14, 'sine'), 90); },
  soft() { this.beep(240, .16, 'sine', .07); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.beep(f, .2, 'triangle', .13), i * 110)); },
  fanfare() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => setTimeout(() => this.beep(f, .26, 'triangle', .13), i * 130)); },
  count(i) { this.beep(440 + i * 60, .07, 'square', .06); }
};
const Music = {
  on: true, playing: false, i: 0, timer: null, master: null,
  scale: [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50],
  mel: [0, 2, 4, 3, 1, 3, 2, null, 0, 3, 5, 4, 2, 4, 3, null, 4, 3, 1, 2, 0, 2, 3, null, 5, 4, 2, 3, 1, 3, 0, null],
  bass: [130.81, 146.83, 164.81, 196.00],
  ensure() {
    Audio2.init(); if (!Audio2.ctx) return false;
    if (!this.master) { this.master = Audio2.ctx.createGain(); this.master.gain.value = .5; this.master.connect(Audio2.ctx.destination); }
    return true;
  },
  note(f, dur, vol, type) {
    if (!this.ensure()) return;
    const c = Audio2.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(this.master);
    const t = c.currentTime;
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + .04);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); o.stop(t + dur + .05);
  },
  start() {
    if (!this.on || this.playing) return;
    if (!this.ensure()) return;
    this.playing = true; this.tick();
  },
  stop() { this.playing = false; clearTimeout(this.timer); },
  duck(on) { if (this.master && Audio2.ctx) this.master.gain.setTargetAtTime(on ? .12 : .5, Audio2.ctx.currentTime, .1); },
  tick() {
    if (!this.playing) return;
    const s = this.i % this.mel.length, n = this.mel[s];
    if (n != null) this.note(this.scale[n], .5, .045, 'triangle');
    if (s % 8 === 0) this.note(this.bass[((this.i / 8) | 0) % this.bass.length], 1.2, .05, 'sine');
    this.i++;
    this.timer = setTimeout(() => this.tick(), 340);
  }
};
const PRAISE = ['对啦', '真棒', '好厉害', '答对啦', '你真行'];
const Voice = {
  on: true, last: '', unlocked: false, voice: null, forced: null, scanned: false, failed: false, lastErr: '', tried: 0,
  list() { try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; } },
  isZh(v) {
    return /^(zh|cmn|yue)/i.test(v.lang || '') ||
      /chinese|mandarin|中文|普通话|国语/i.test(v.name || '');
  },
  candidates() {
    const zh = this.list().filter(v => this.isZh(v));
    const score = v => {
      const n = (v.name || '').toLowerCase(), l = v.lang || '';
      let s = 0;
      if (/google/.test(n)) s += 8;
      if (/ting-?ting|tingting|mei-?jia|sin-?ji|yu-?shu|li-?mu|xiaoxiao|xiaoyi|yunxi|huihui|kangkang|yaoyao|liangliang/.test(n)) s += 6;
      if (/zh[-_]?(cn|hans)|cmn/i.test(l)) s += 3;
      if (v.default) s += 2;
      if (v.localService) s += 1;
      // macOS 的趣味音色多半没下载，排到最后
      if (/eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|bells|bubbles|jester|organ|superstar|trinoids|whisper|wobble|zarvox/.test(n)) s -= 10;
      return s;
    };
    zh.sort((x, y) => score(y) - score(x));
    if (this.forced) return [this.forced].concat(zh.filter(v => v !== this.forced));
    return zh;
  },
  diag() {
    if (!('speechSynthesis' in window)) return '不支持语音合成';
    const ss = window.speechSynthesis;
    return '音色 ' + this.list().length + ' 个 / 中文 ' + this.candidates().length +
      ' 个 · speaking=' + ss.speaking + ' pending=' + ss.pending + ' paused=' + ss.paused +
      ' · 试过 ' + this.tried + ' 次 · ' + (this.lastErr ? ('错误码 ' + this.lastErr) : '没有任何错误回调');
  },
  status() {
    if (!('speechSynthesis' in window)) return '这个浏览器不支持语音合成，换 Safari 或 Chrome 试试';
    const n = this.list().length;
    if (!n) return '语音列表还没加载出来，点一下测试朗读';
    const c = this.candidates();
    if (!c.length) return '这台设备的 ' + n + ' 个语音里没有中文，需要装中文语音包';
    if (this.failed) return '所有中文音色都没出声，多半是这个浏览器的语音引擎没响应（Chrome on macOS 常见）。先彻底退出浏览器重开，或改用 Safari。诊断：' + this.diag();
    const v = this.voice || c[0];
    return '正在用：' + v.name + '（' + v.lang + '）· ' + this.diag();
  },
  unlock() {
    if (this.unlocked || !('speechSynthesis' in window)) return;
    this.unlocked = true;
    try {
      const u = new SpeechSynthesisUtterance('好');
      u.volume = 0; u.lang = 'zh-CN';
      const c = this.candidates(); if (c[0]) u.voice = c[0];
      speechSynthesis.speak(u);
    } catch (e) { }
  },
  say(t, keep) {
    if (!t) return;
    if (keep !== false) this.last = t;
    if (!this.on || !('speechSynthesis' in window)) return;
    if (!this.list().length && !this.scanned) {
      let done = false;
      const go = () => { if (done) return; done = true; this.scanned = true; this.fire(t, 0); };
      try { speechSynthesis.addEventListener('voiceschanged', go, { once: true }); } catch (e) { }
      setTimeout(go, 700);
      return;
    }
    this.scanned = true;
    this.fire(t, 0);
  },
  fire(t, idx) {
    const cands = this.candidates();
    if (idx === 0 && this.voice && !this.failed) {
      const i = cands.indexOf(this.voice);
      if (i > 0) cands.unshift(cands.splice(i, 1)[0]);
    }
    // 最后一档：完全不指定 voice，只给 lang，交给浏览器自己挑
    const chain = cands.concat([null]);
    if (idx >= chain.length) { this.failed = true; return; }
    const v = chain[idx];
    const cands2 = chain;
    let started = false, advanced = false;
    const btn = document.getElementById('sayBtn');
    const off = () => { Music.duck(false); if (btn) btn.classList.remove('talking'); };
    const nextTry = () => {
      if (advanced || started) return;
      advanced = true; off();
      if (idx + 1 < cands2.length) this.fire(t, idx + 1); else this.failed = true;
    };
    try {
      const ss = window.speechSynthesis;
      if (ss.speaking || ss.pending) ss.cancel();
      if (ss.paused) ss.resume();
      this.tried++;
      const u = new SpeechSynthesisUtterance(t);
      if (v) { u.voice = v; u.lang = v.lang || 'zh-CN'; } else u.lang = 'zh-CN';
      u.rate = .9; u.pitch = 1.12; u.volume = 1;
      u.onstart = () => {
        started = true; this.failed = false; if (v) this.voice = v;
        Music.duck(true); if (btn) btn.classList.add('talking');
      };
      u.onend = off;
      u.onerror = e => { this.lastErr = (e && (e.error || e.name)) || 'unknown'; nextTry(); };
      ss.speak(u);
      setTimeout(() => { try { if (!started && ss.paused) ss.resume(); } catch (e) { } }, 120);
      setTimeout(nextTry, 900);
    } catch (e) { nextTry(); }
  },
  short(t) { this.say(t, false); },
  praise() { this.short(pick(PRAISE)); },
  repeat() { this.unlock(); if (this.last) { this.on = true; this.failed = false; this.say(this.last); } }
};
if ('speechSynthesis' in window) {
  try {
    speechSynthesis.cancel();  // Chrome 的老毛病：不先清一次队列，之后可能一直不出声
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener('voiceschanged', () => { Voice.scanned = true; });
  } catch (e) { }
}

/* ============ 游戏 4：找一样 ============ */
function gMatch(board, lv) {

  }

          sel.classList.remove('pick'); sel = null;
        }
      }
    });
    return t;
  }
  leftOrder.forEach(v => { const t = mk(v, 'L'); map['L' + v] = t; cl.appendChild(t); });
  rightOrder.forEach(v => { const t = mk(v, 'R'); map['R' + v] = t; cr.appendChild(t); });
  function line(a, b) {
    const wr = wrap.getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', ra.right - wr.left); l.setAttribute('y1', ra.top - wr.top + ra.height / 2);

/* ============ 游戏 5：照镜子（对称） ============ */
function gMirror(board, lv) {
  const conf = [{ w: 3, h: 3, n: 3 }, { w: 4, h: 4, n: 5 }, { w: 4, h: 5, n: 6 }, { w: 5, h: 5, n: 8 }][Math.min(lv, 4) - 1];
  const W = conf.w, H = conf.h;
  const target = new Set();

  wrap.style.gridAutoRows = cell;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = el('div', 'mc');

/* ============ 游戏 8：走迷宫 ============ */
function genMaze(W, H) {
  const g = Array.from({ length: H }, () => Array.from({ length: W }, () => ({ n: 1, e: 1, s: 1, w: 1, v: false })));

    const nb = [];
    if (y > 0 && !g[y - 1][x].v) nb.push([y - 1, x, 'n', 's']);
    if (y < H - 1 && !g[y + 1][x].v) nb.push([y + 1, x, 's', 'n']);
    if (x > 0 && !g[y][x - 1].v) nb.push([y, x - 1, 'w', 'e']);
    if (x < W - 1 && !g[y][x + 1].v) nb.push([y, x + 1, 'e', 'w']);
    if (!nb.length) { st.pop(); continue; }
    const [ny, nx, a, b] = pick(nb);
    g[y][x][a] = 0; g[ny][nx][b] = 0; g[ny][nx].v = true; st.push([ny, nx]);
  }

}

    nodes[y] = [];

      const c = el('div', 'mz' + (g[y][x].n ? ' wn' : '') + (g[y][x].w ? ' ww' : ''));
      c.style.fontSize = 'calc(' + cell + ' * 0.6)';
      nodes[y][x] = c; wrap.appendChild(c);
    }
  }

  let cur = [0, 0], trail = [[0, 0]], won = false;
  nodes[0][0].classList.add('trail');
  const runner = el('span', null, '🐰');
  nodes[0][0].appendChild(runner);
  function place() { nodes[cur[0]][cur[1]].appendChild(runner); }
  function step(y, x) {
    if (won) return;
    const [cy, cx] = cur;
    const dy = y - cy, dx = x - cx;
    if (Math.abs(dy) + Math.abs(dx) !== 1) return false;
    const w = dy === -1 ? 'n' : dy === 1 ? 's' : dx === -1 ? 'w' : 'e';

      won = true; clearHint();
      trail.forEach(t => nodes[t[0]][t[1]].classList.add('won'));

    }

  }

  const lvRow = el('div', 'row'); lvRow.style.display = 'block';
  lvRow.appendChild(el('div', null, '各游戏当前关卡（点 +/− 手动调）'));
  const box = el('div'); box.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:8px';
  GAMES.forEach(g => {
    const chip = el('div'); chip.style.cssText = 'display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-size:15px';
    const lab = el('span', null, g.emoji + ' ' + g.name + ' ');
    const val = el('b', 'num', String(S.level[g.id]));
    const minus = el('button', 'sw', '−'); minus.style.padding = '2px 10px';
    const plus = el('button', 'sw', '+'); plus.style.padding = '2px 10px';
    minus.addEventListener('click', () => { S.level[g.id] = Math.max(1, S.level[g.id] - 1); val.textContent = S.level[g.id]; });
    plus.addEventListener('click', () => { S.level[g.id] = Math.min(GAME_MAXLV[g.id], S.level[g.id] + 1); val.textContent = S.level[g.id]; });
    chip.appendChild(lab); chip.appendChild(minus); chip.appendChild(val); chip.appendChild(plus);
    box.appendChild(chip);
  });
  lvRow.appendChild(box); p.appendChild(lvRow);
  const close = el('button', 'bigbtn', '好了');
  close.style.cssText += 'width:100%;margin-top:12px';
  close.addEventListener('click', () => { p.remove(); if (!Session) home(); });
  p.appendChild(close);
  $('#screen').appendChild(p);
}

/* ============ 启动 ============ */
$('#sayBtn').addEventListener('click', () => { Audio2.init(); Voice.unlock(); Voice.repeat(); });
document.addEventListener('pointerdown', () => { Audio2.init(); Voice.unlock(); Music.start(); }, { once: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Music.stop(); if ('speechSynthesis' in window) speechSynthesis.cancel(); } else Music.start(); });
$('#backBtn').addEventListener('click', () => { Audio2.page(); clearHint(); home(); });
$('#gearBtn').addEventListener('click', () => { Audio2.init(); openPanel(); });
home();
</script>
</body>
</html>
