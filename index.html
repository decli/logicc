<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="思维小画本">
<meta name="theme-color" content="#FFFCF2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>思维小画本</title>
<style>

:root{
  --paper:#FFFCF2; --ink:#2A2523; --ink-soft:#6F665E; --line:#E4DCC9;
  --red:#E8452C; --orange:#F08A24; --yellow:#F5B921; --green:#3FA34D;
  --blue:#2E7DD1; --purple:#7B4BC9; --pink:#E4568E; --teal:#12A5A0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overscroll-behavior:none;overflow:hidden}
body{
  background:var(--paper);
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.num{font-family:"Arial Rounded MT Bold","Avenir Next Rounded","Nunito","PingFang SC",sans-serif;font-weight:700}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* ---------- 顶栏 ---------- */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;min-width:0}
.iconbtn{width:46px;height:46px;flex:0 0 auto;border:3px solid var(--ink);background:#fff;border-radius:14px;
  font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);cursor:pointer;padding:0}
.iconbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#barTitle{flex:1 1 auto;min-width:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#starBox{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:19px;padding:5px 12px;border:3px solid var(--ink);
  border-radius:999px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
#sayBtn{background:var(--yellow)}
#sayBtn.talking{animation:pl 1s infinite}
/* ---------- 屏幕 ---------- */
#screen{flex:1 1 auto;position:relative;overflow:hidden;min-height:0}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 12px 12px;overflow:hidden}
/* ---------- 首页 ---------- */
.hero{flex:0 0 auto;display:flex;align-items:baseline;gap:10px;padding:0 4px 8px}
.hero h1{margin:0;font-size:26px;transform:rotate(-1.2deg)}
.hero p{margin:0;color:var(--ink-soft);font-size:14px}
#cards{flex:1 1 auto;display:grid;gap:10px;min-height:0}
.card{border:4px solid var(--ink);border-radius:18px;background:#fff;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:5px 5px 0 var(--ink);cursor:pointer;min-height:0;padding-bottom:12%}
.card:nth-child(odd){transform:rotate(-.8deg)}
.card:nth-child(even){transform:rotate(.8deg)}
.card:active{transform:translate(4px,4px) rotate(0);box-shadow:0 0 0 var(--ink)}
.card .band{position:absolute;left:0;right:0;bottom:0;height:11%;background:var(--c)}
.card .band i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 6px,transparent 6px 14px)}
.card .emoji{line-height:1.05;position:relative;z-index:1}
.card .name{font-weight:700;position:relative;z-index:1}
.card .lv{position:absolute;top:6px;right:9px;font-size:12px;color:var(--ink-soft);z-index:1}
#stickerBar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 4px 0;font-size:14px;color:var(--ink-soft);
  min-height:34px;overflow:hidden}
#stickerBar b{font-size:23px;font-weight:400}
/* ---------- 选关 ---------- */
#lvWrap{flex:1 1 auto;display:grid;gap:10px;min-height:0;align-content:center}
.lvcard{border:4px solid var(--ink);border-radius:16px;background:#fff;box-shadow:4px 4px 0 var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:0;position:relative}
.lvcard:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.lvcard .no{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);display:flex;
  align-items:center;justify-content:center;font-size:20px;background:var(--c);color:#fff}
.lvcard .tx{flex:1 1 auto;min-width:0}
.lvcard .t1{font-size:17px;font-weight:700}
.lvcard .t2{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvcard .st{flex:0 0 auto;font-size:13px;letter-spacing:1px;color:var(--orange)}
.lvcard .tag{position:absolute;top:-10px;right:10px;background:var(--green);color:#fff;font-size:11px;
  padding:2px 8px;border-radius:999px;border:2px solid var(--ink)}
/* ---------- 关卡外壳 ---------- */
#dots{flex:0 0 auto;display:flex;gap:7px;justify-content:center;padding:2px 0 6px}
#dots i{width:12px;height:12px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:block}
#dots i.on{background:var(--yellow)}
#prompt{flex:0 0 auto;text-align:center;font-weight:700;padding:0 0 6px;line-height:1.25}
#board{flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#targetChip{display:inline-flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:14px;
  background:var(--yellow);box-shadow:3px 3px 0 var(--ink);padding:0 10px;margin:0 6px;vertical-align:middle}
/* ---------- 通用块 ---------- */
.tile{border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.tile:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.tile.done{background:var(--green);color:#fff;box-shadow:none;transform:none;cursor:default}
.tile.pick{background:var(--yellow)}
.tile.rd{color:var(--red)}
.tile.bl{color:var(--blue)}
.shake{animation:sh .34s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}50%{transform:translateX(7px)}80%{transform:translateX(-4px)}}
.pulse{animation:pl 1s infinite}
@keyframes pl{0%,100%{filter:none}50%{filter:brightness(1.12) drop-shadow(0 0 10px var(--yellow))}}
.pop{animation:pp .35s}
@keyframes pp{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.row2{display:flex;align-items:center;justify-content:center}
.col2{display:flex;flex-direction:column;align-items:center;justify-content:center}
/* 点子 */
.face{display:grid;width:100%;height:100%;padding:9%;gap:4%;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.face.wide{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr)}
.face b{border-radius:50%;background:var(--ink);width:100%;aspect-ratio:1;align-self:center;justify-self:center;display:block}
.face b.off{background:transparent}
.face b.lit{background:var(--red);animation:pp .3s}
.domino{display:flex;flex-direction:column;border:4px solid var(--ink);border-radius:16px;background:#fff;
  box-shadow:5px 5px 0 var(--ink);overflow:hidden;flex:0 0 auto}
.domino .half{flex:1 1 0;min-height:0;position:relative}
.domino .half+.half{border-top:4px solid var(--ink)}
.qm{display:flex;align-items:center;justify-content:center;height:100%;color:var(--line)}
/* 数的分解 */
.bnode{border-radius:50%;border:4px solid var(--ink);background:#fff;display:flex;align-items:center;
  justify-content:center;box-shadow:4px 4px 0 var(--ink);flex:0 0 auto}
.bnode.top{background:var(--blue);color:#fff}
.bnode.q{color:var(--line)}
.bnode.fill{background:var(--green);color:#fff}
/* 找一样 */
#matchWrap{position:relative;width:100%;height:100%}
#matchSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mcols{position:relative;display:flex;justify-content:space-between;height:100%}
.mcol{display:flex;flex-direction:column;justify-content:space-around}
.mitem{letter-spacing:.06em}
.mitem.done{background:var(--purple);color:#fff}
/* 照镜子 */
.mgrid{display:grid;position:relative}
.mc{border-radius:6px;border:2px dashed var(--line);background:#fff}
.mc.on{border:2px solid var(--ink);background:var(--blue)}
.mc.put{border:2px solid var(--ink);background:var(--pink);animation:pp .3s}
.mc.bad{background:var(--red);opacity:.55}
.mc.show{box-shadow:inset 0 0 0 4px var(--green)}
.axis{position:absolute;border:0;border-left:4px dashed var(--orange)}
.axis.h{border-left:0;border-top:4px dashed var(--orange)}
/* 连点 */
#cSvg .dot{fill:#fff;stroke:var(--ink);stroke-width:3}
#cSvg .dot.on{fill:var(--green)}
#cSvg .dot.next{fill:var(--yellow)}
#cSvg text{font-family:"Arial Rounded MT Bold","PingFang SC",sans-serif;font-weight:700;font-size:7px;fill:var(--ink);
  text-anchor:middle;pointer-events:none}
#cSvg .seg{stroke:var(--purple);stroke-width:6;stroke-linecap:round;fill:none}
#cSvg .shapefill{fill:var(--yellow);opacity:0;transition:opacity .6s}
#cSvg .shapefill.show{opacity:.85}
/* 连连看 */
#llHolder{position:relative}
#llWrap{display:grid}
.ll{border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.ll:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.ll.pick{background:var(--yellow)}
.ll.gone{visibility:hidden}
#llSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#llSvg polyline{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
/* 迷宫 */
#mzWrap{display:grid;background:#fff;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);
  border-radius:4px;touch-action:none;position:relative}
.mz{position:relative;display:flex;align-items:center;justify-content:center;line-height:1}
.mz.wn{border-top:4px solid var(--ink)}
.mz.ww{border-left:4px solid var(--ink)}
.mz.trail{background:#FCEBB0}
.mz.sol{background:#CFE6FF}
.mz.won{background:#BFE8C4}
/* 找规律 */
.seqrow{display:flex;align-items:center;justify-content:center}
.seq{border:3px solid var(--ink);border-radius:12px;background:#fff;display:flex;align-items:center;
  justify-content:center;line-height:1;flex:0 0 auto}
.seq.q{background:var(--yellow);border-style:dashed}
/* 奖励 / 面板 */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.spark{position:absolute;font-size:28px;animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
#reward{position:absolute;inset:0;background:rgba(255,252,242,.96);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;z-index:20;text-align:center;padding:18px}
#reward .big{font-size:min(150px,22vh);animation:pp .5s}
#reward h2{margin:0;font-size:24px}
.bigbtn{border:4px solid var(--ink);border-radius:16px;background:var(--yellow);box-shadow:5px 5px 0 var(--ink);
  font-size:20px;font-weight:700;padding:13px 26px;font-family:inherit;color:var(--ink);cursor:pointer}
.bigbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.bigbtn.ghost{background:#fff}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#panel{position:absolute;left:10px;right:10px;bottom:10px;max-width:560px;max-height:86%;overflow:auto;
  -webkit-overflow-scrolling:touch;margin:0 auto;background:#fff;border:4px solid var(--ink);border-radius:20px;
  box-shadow:6px 6px 0 var(--ink);padding:14px;z-index:30}
#panel h3{margin:0 0 8px;font-size:19px}
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:2px solid var(--line);font-size:16px}
.prow:last-of-type{border-bottom:0}
.sw{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:5px 14px;font-size:15px;font-family:inherit;cursor:pointer}
.sw.on{background:var(--green);color:#fff}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 大屏横屏改版：首页 / 阶梯选难度 / 伙伴侧栏 / 奖励 / 家长设置 ===== */
:root{--k:1}

.pane{position:absolute;inset:0;display:flex;flex-direction:column;padding:0;overflow:hidden}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:calc(16px * var(--k));padding:calc(14px * var(--k)) calc(24px * var(--k))}
.iconbtn{width:calc(72px * var(--k));height:calc(72px * var(--k));flex:0 0 auto;border:calc(4px * var(--k)) solid var(--ink);background:#fff;border-radius:calc(20px * var(--k));font-size:calc(32px * var(--k));line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:calc(4px * var(--k)) calc(4px * var(--k)) 0 var(--ink);cursor:pointer;padding:0;font-family:inherit}
.iconbtn:active{transform:translate(calc(4px * var(--k)),calc(4px * var(--k)));box-shadow:0 0 0 var(--ink)}
.barTitle{flex:0 0 auto;min-width:0;font-size:calc(34px * var(--k));font-weight:700;white-space:nowrap;display:flex;align-items:baseline;gap:calc(16px * var(--k))}
.barTitle small{font-size:calc(22px * var(--k));font-weight:400;color:var(--ink-soft)}
.grow{flex:1 1 auto;min-width:0}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:calc(10px * var(--k));font-size:calc(28px * var(--k));padding:calc(8px * var(--k)) calc(18px * var(--k));border:calc(4px * var(--k)) solid var(--ink);border-radius:calc(999px * var(--k));background:#fff;box-shadow:calc(4px * var(--k)) calc(4px * var(--k)) 0 var(--ink);white-space:nowrap}
.dayPill{flex:1 1 auto;min-width:0;gap:calc(14px * var(--k));font-size:calc(24px * var(--k));font-weight:700}
.dayBar{flex:1 1 auto;height:calc(20px * var(--k));border:calc(3px * var(--k)) solid var(--ink);border-radius:calc(999px * var(--k));background:#F5F0E2;overflow:hidden;min-width:calc(60px * var(--k))}
.dayBar i{display:block;height:100%;background:var(--green)}
#cards{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(18px * var(--k));min-height:0;padding:calc(4px * var(--k)) calc(24px * var(--k)) calc(24px * var(--k))}
.card,.card:nth-child(odd),.card:nth-child(even){display:flex;overflow:hidden;border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(24px * var(--k));background:#fff;box-shadow:calc(7px * var(--k)) calc(7px * var(--k)) 0 var(--ink);cursor:pointer;min-height:0;padding:0;transform:none;flex-direction:row;align-items:stretch;justify-content:flex-start}
.card:active{transform:translate(calc(5px * var(--k)),calc(5px * var(--k)));box-shadow:0 0 0 var(--ink)}
.cardArt{flex:0 0 calc(148px * var(--k));background:var(--c);display:flex;align-items:center;justify-content:center;font-size:calc(84px * var(--k));line-height:1}
.cardTx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:calc(6px * var(--k));padding:calc(14px * var(--k)) calc(18px * var(--k))}
.cardName{font-size:calc(38px * var(--k));font-weight:700;line-height:1.1}
.cardTip{font-size:calc(21px * var(--k));color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardMeta{display:flex;align-items:center;gap:calc(12px * var(--k));margin-top:calc(4px * var(--k))}
.cardMeta .s{flex:none;white-space:nowrap;font-size:calc(25px * var(--k));font-weight:700;color:var(--orange)}
.cardMeta .b{flex:none;white-space:nowrap;font-size:calc(21px * var(--k));color:var(--ink-soft)}
.stair{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;gap:calc(20px * var(--k));padding:calc(132px * var(--k)) calc(26px * var(--k)) 0}
.step{flex:1 1 0;min-width:0;border:calc(5px * var(--k)) solid var(--ink);border-bottom:0;border-radius:calc(26px * var(--k)) calc(26px * var(--k)) 0 0;display:flex;flex-direction:column;align-items:center;gap:calc(10px * var(--k));padding:calc(18px * var(--k)) calc(12px * var(--k)) 0;position:relative;cursor:pointer}
.step .no{width:calc(92px * var(--k));height:calc(92px * var(--k));flex:none;border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(26px * var(--k));background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:calc(50px * var(--k))}
.step .nm{flex:none;width:100%;font-size:calc(25px * var(--k));font-weight:700;text-align:center;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step .mid{flex:1 1 auto;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.step .ft{flex:none;display:flex;flex-direction:column;align-items:center;gap:calc(4px * var(--k));padding-bottom:calc(16px * var(--k))}
.step .ft i{font-size:calc(21px * var(--k));font-style:normal;font-weight:700;white-space:nowrap}
.step .go{flex:none;width:100%;margin-bottom:calc(10px * var(--k));height:calc(88px * var(--k));border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(22px * var(--k));background:var(--ink);color:#fff;font-family:inherit;font-size:calc(30px * var(--k));font-weight:700;cursor:pointer}
.step .me{position:absolute;top:auto;bottom:100%;left:50%;margin-bottom:calc(42px * var(--k));font-size:calc(86px * var(--k));line-height:1;transform:translateX(-50%);animation:bob 3s infinite;pointer-events:none}
.step .tag{position:absolute;top:auto;bottom:100%;left:50%;margin-bottom:calc(8px * var(--k));transform:translateX(-50%);border:calc(4px * var(--k)) solid var(--ink);border-radius:999px;background:var(--green);color:#fff;font-size:calc(20px * var(--k));font-weight:700;padding:calc(3px * var(--k)) calc(14px * var(--k));white-space:nowrap;pointer-events:none}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-calc(10px * var(--k)))}}
.pv{display:grid;gap:calc(5px * var(--k))}
.pv span{border:calc(3px * var(--k)) solid var(--ink);border-radius:calc(8px * var(--k));background:#fff;display:block}
.pv span.hi{background:var(--yellow)}
.play{flex-direction:row}
.boardWrap{flex:1 1 auto;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:calc(28px * var(--k))}
#board{flex:1 1 auto;width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.side{flex:0 0 calc(380px * var(--k));background:#FFF4D6;border-left:calc(5px * var(--k)) solid var(--ink);display:flex;flex-direction:column;align-items:center;gap:calc(16px * var(--k));padding:calc(24px * var(--k));overflow:hidden}
.owl{display:flex;align-items:center;gap:calc(10px * var(--k));align-self:stretch;flex:none}
.owl .f{font-size:calc(56px * var(--k));line-height:1;flex:none;animation:bob2 3s infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-calc(8px * var(--k)))}}
#prompt{flex:1 1 auto;min-width:0;font-size:calc(24px * var(--k));font-weight:700;line-height:1.35;background:#fff;border:calc(4px * var(--k)) solid var(--ink);border-radius:calc(18px * var(--k));padding:calc(10px * var(--k)) calc(14px * var(--k));text-align:left}
#targetChip{display:inline-flex;align-items:center;justify-content:center;border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(24px * var(--k));background:var(--yellow);box-shadow:calc(6px * var(--k)) calc(6px * var(--k)) 0 var(--ink);padding:0 calc(12px * var(--k));margin:calc(6px * var(--k)) calc(4px * var(--k));vertical-align:middle}
#dots{flex:0 0 auto;display:flex;gap:calc(12px * var(--k));justify-content:center;padding:0}
#dots i{width:calc(40px * var(--k));height:calc(40px * var(--k));border-radius:50%;border:calc(5px * var(--k)) solid var(--ink);background:#fff;display:block}
#dots i.on{background:var(--yellow)}

<script>


/* ===================== 工具 ===================== */
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const svgEl = t => document.createElementNS('http://www.w3.org/2000/svg', t);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const px = n => Math.round(n) + 'px';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
document.addEventListener('gesturestart', e => e.preventDefault());

/* 按真实容器尺寸排版：cols×rows 的格子能用多大 */
function cellFit(w, h, cols, rows, gap, max) {
  const cw = (w - gap * (cols - 1)) / cols, ch = (h - gap * (rows - 1)) / rows;
  return clamp(Math.floor(Math.min(cw, ch)), 22, Math.round((max || 220) * 1.7));
}

/* ===================== 声音 ===================== */
const Audio2 = {
  ctx: null, on: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(f, d, type, vol) {
    if (!this.on) return; this.init(); if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(this.ctx.destination);
    const t = this.ctx.currentTime, v = vol == null ? .14 : vol;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.start(t); o.stop(t + d + .02);
  },
  tap() { this.beep(520, .08, 'triangle', .08); },
  step() { this.beep(300 + rnd(90), .06, 'triangle', .05); },
  pop() { this.beep(880, .06, 'sine', .09); setTimeout(() => this.beep(1320, .1, 'sine', .07), 55); },
  good() { this.beep(660, .1, 'sine'); setTimeout(() => this.beep(880, .14, 'sine'), 90); },
  soft() { this.beep(240, .16, 'sine', .07); },
  star() {[784, 1047, 1319].forEach((f, i) => setTimeout(() => this.beep(f, .12, 'sine', .1), i * 70)); },
  page() { this.beep(380, .09, 'sine', .05); setTimeout(() => this.beep(560, .1, 'sine', .05), 70); },
  count(i) { this.beep(440 + i * 60, .07, 'square', .06); },
  win() {[523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.beep(f, .2, 'triangle', .13), i * 110)); },
  fanfare() {[523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => setTimeout(() => this.beep(f, .26, 'triangle', .13), i * 130)); }
};
const Music = {
  on: true, playing: false, i: 0, timer: null, master: null,
  scale: [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50],
  mel: [0, 2, 4, 3, 1, 3, 2, null, 0, 3, 5, 4, 2, 4, 3, null, 4, 3, 1, 2, 0, 2, 3, null, 5, 4, 2, 3, 1, 3, 0, null],
  bass: [130.81, 146.83, 164.81, 196.00],
  ensure() {
    Audio2.init(); if (!Audio2.ctx) return false;
    if (!this.master) { this.master = Audio2.ctx.createGain(); this.master.gain.value = .5; this.master.connect(Audio2.ctx.destination); }
    return true;
  },
  note(f, d, v, type) {
    if (!this.ensure()) return;
    const c = Audio2.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(this.master);
    const t = c.currentTime;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .04);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.start(t); o.stop(t + d + .05);
  },
  start() { if (!this.on || this.playing) return; if (!this.ensure()) return; this.playing = true; this.tick(); },
  stop() { this.playing = false; clearTimeout(this.timer); },
  duck(on) { if (this.master && Audio2.ctx) this.master.gain.setTargetAtTime(on ? .12 : .5, Audio2.ctx.currentTime, .1); },
  tick() {
    if (!this.playing) return;
    const s = this.i % this.mel.length, n = this.mel[s];
    if (n != null) this.note(this.scale[n], .5, .045, 'triangle');
    if (s % 8 === 0) this.note(this.bass[((this.i / 8) | 0) % this.bass.length], 1.2, .05, 'sine');
    this.i++; this.timer = setTimeout(() => this.tick(), 340);
  }

const PRAISE = ['对啦', '真棒', '好厉害', '答对啦', '你真行'];
const Voice = {
  on: true, last: '', unlocked: false, voice: null, forced: null, scanned: false, failed: false, lastErr: '', tried: 0,
  list() { try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; } },
  isZh(v) { return /^(zh|cmn|yue)/i.test(v.lang || '') || /chinese|mandarin|中文|普通话|国语/i.test(v.name || ''); },
  candidates() {
    const zh = this.list().filter(v => this.isZh(v));
    const score = v => {
      const n = (v.name || '').toLowerCase(), l = v.lang || ''; let s = 0;
      if (/google/.test(n)) s += 8;
      if (/ting-?ting|tingting|mei-?jia|sin-?ji|yu-?shu|li-?mu|xiaoxiao|xiaoyi|yunxi|huihui|kangkang|yaoyao|liangliang/.test(n)) s += 6;
      if (/zh[-_]?(cn|hans)|cmn/i.test(l)) s += 3;
      if (v.default) s += 2;
      if (v.localService) s += 1;
      if (/eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|bells|bubbles|jester|organ|superstar|trinoids|whisper|wobble|zarvox/.test(n)) s -= 10;
      return s;
    };
    zh.sort((x, y) => score(y) - score(x));
    return this.forced ? [this.forced].concat(zh.filter(v => v !== this.forced)) : zh;
  },
  diag() {
    if (!('speechSynthesis' in window)) return '不支持语音合成';
    const ss = window.speechSynthesis;
    return '音色 ' + this.list().length + ' 个 / 中文 ' + this.candidates().length + ' 个 · speaking=' + ss.speaking +
      ' pending=' + ss.pending + ' paused=' + ss.paused + ' · 试过 ' + this.tried + ' 次 · ' + (this.lastErr ? ('错误码 ' + this.lastErr) : '没有任何错误回调');
  },
  status() {
    if (!('speechSynthesis' in window)) return '这个浏览器不支持语音合成，换 Safari 试试';
    const n = this.list().length;
    if (!n) return '语音列表还没加载出来，点一下测试朗读';
    const c = this.candidates();
    if (!c.length) return '这台设备的 ' + n + ' 个语音里没有中文，需要装中文语音包';
    if (this.failed) return '所有中文音色都没出声，多半是浏览器语音引擎没响应（Chrome on macOS 常见）。彻底退出浏览器重开，或改用 Safari。诊断：' + this.diag();
    const v = this.voice || c[0];
    return '正在用：' + v.name + '（' + v.lang + '）· ' + this.diag();
  },
  unlock() {
    if (this.unlocked || !('speechSynthesis' in window)) return;
    this.unlocked = true;
    try { const u = new SpeechSynthesisUtterance('好'); u.volume = 0; u.lang = 'zh-CN'; const c = this.candidates(); if (c[0]) u.voice = c[0]; speechSynthesis.speak(u); } catch (e) { }
  },
  say(t, keep) {
    if (!t) return;
    if (keep !== false) this.last = t;
    if (!this.on || !('speechSynthesis' in window)) return;
    if (!this.list().length && !this.scanned) {
      let done = false;
      const go = () => { if (done) return; done = true; this.scanned = true; this.fire(t, 0); };
      try { speechSynthesis.addEventListener('voiceschanged', go, { once: true }); } catch (e) { }
      setTimeout(go, 700); return;
    }
    this.scanned = true; this.fire(t, 0);
  },
  fire(t, idx) {
    const cs = this.candidates();
    if (idx === 0 && this.voice && !this.failed) {
      const i = cs.indexOf(this.voice); if (i > 0) cs.unshift(cs.splice(i, 1)[0]);
    }
    const chain = cs.concat([null]);
    if (idx >= chain.length) { this.failed = true; return; }
    const v = chain[idx];
    let started = false, advanced = false;
    const btn = document.getElementById('sayBtn');
    const off = () => { Music.duck(false); if (btn) btn.classList.remove('talking'); };
    const nextTry = () => { if (advanced || started) return; advanced = true; off(); if (idx + 1 < chain.length) this.fire(t, idx + 1); else this.failed = true; };
    try {
      const ss = window.speechSynthesis;
      if (ss.speaking || ss.pending) ss.cancel();
      if (ss.paused) ss.resume();
      this.tried++;
      const u = new SpeechSynthesisUtterance(t);
      if (v) { u.voice = v; u.lang = v.lang || 'zh-CN'; } else u.lang = 'zh-CN';
      u.rate = .9; u.pitch = 1.12; u.volume = 1;
      u.onstart = () => { started = true; this.failed = false; if (v) this.voice = v; Music.duck(true); if (btn) btn.classList.add('talking'); };
      u.onend = off;
      u.onerror = e => { this.lastErr = (e && (e.error || e.name)) || 'unknown'; nextTry(); };
      ss.speak(u);
      setTimeout(() => { try { if (!started && ss.paused) ss.resume(); } catch (e) { } }, 120);
      setTimeout(nextTry, 900);
    } catch (e) { nextTry(); }
  },
  short(t) { this.say(t, false); },
  praise() { this.short(pick(PRAISE)); },
  repeat() { this.unlock(); if (this.last) { this.on = true; this.failed = false; this.say(this.last); } }
};
if ('speechSynthesis' in window) {
  try { speechSynthesis.cancel(); speechSynthesis.getVoices(); speechSynthesis.addEventListener('voiceschanged', () => { Voice.scanned = true; }); } catch (e) { }
}

function previewShape(g, i) {
  var c = g.levels[i].cfg, cols = 3, rows = 3;
  if (g.id === 'schulte' || g.id === 'maze') { cols = c.n; rows = c.n; }
  else if (g.id === 'mirror') { cols = c.w * 2; rows = c.h; }
  else if (g.id === 'link') { cols = c.w; rows = c.h; }
  else if (g.id === 'match') { cols = 2; rows = Math.min(5, c.n); }
  else if (g.id === 'pattern') { cols = 6; rows = 1; }
  else if (g.id === 'dots') { cols = c.kind === 'make3' ? 3 : 2; rows = 1; }
  else if (g.id === 'bond') { cols = c.miss === 'three' ? 3 : 2; rows = 2; }
  else if (g.id === 'connect') { cols = Math.min(6, SHAPES[c.sh].pts.length); rows = 1; }
  return { cols: cols, rows: rows };
}

/* ===================== 7 水果连连看 ===================== */
const LL_EASY = ['🍎', '🍌', '🍇', '🍓', '🍉', '🍊', '🥕', '🌽', '🍄', '🍍', '🥑', '🍆'];
const LL_HARD = ['🍎', '🍏', '🍊', '🍋', '🍐', '🥝', '🍒', '🍓', '🫐', '🍇', '🍑', '🥭'];
function gLink(board, lv) {
  const cfg = G.link.levels[lv - 1].cfg, W = cfg.w, H = cfg.h, pairs = W * H / 2;
  const kinds = shuffle(cfg.hard ? LL_HARD : LL_EASY).slice(0, pairs);
  const Gd = Array.from({ length: H + 2 }, () => new Array(W + 2).fill(null));
  const nodes = Array.from({ length: H + 2 }, () => new Array(W + 2).fill(null));
  let left = W * H, sel = null, busy = false;
  const holder = el('div'); holder.id = 'llHolder';
  const wrap = el('div'); wrap.id = 'llWrap';
  const svg = svgEl('svg'); svg.id = 'llSvg';
  const vals = shuffle(kinds.concat(kinds)); let k = 0;
  for (let y = 1; y <= H; y++) for (let x = 1; x <= W; x++) {
    Gd[y][x] = vals[k++];
    const t = el('div', 'll', Gd[y][x]);
    t.addEventListener('click', () => tap(y, x));
    nodes[y][x] = t; wrap.appendChild(t);
  }
  holder.appendChild(wrap); holder.appendChild(svg); board.appendChild(holder);
  const clearH = (y, a, b) => { const s = Math.min(a, b), e = Math.max(a, b); for (let i = s + 1; i < e; i++) if (Gd[y][i]) return false; return true; };
  const clearV = (x, a, b) => { const s = Math.min(a, b), e = Math.max(a, b); for (let i = s + 1; i < e; i++) if (Gd[i][x]) return false; return true; };

    for (let n = 0; n < 50; n++) { const sh = shuffle(vs); spots.forEach((s, i) => { Gd[s[0]][s[1]] = sh[i]; nodes[s[0]][s[1]].textContent = sh[i]; }); if (anyPair()) return true; }
    return false;
  }

}

/* ===================== 8 走迷宫 ===================== */
function genMaze(W, H) {
  const g = Array.from({ length: H }, () => Array.from({ length: W }, () => ({ n: 1, e: 1, s: 1, w: 1, v: false })));

    if (y < H - 1 && !g[y + 1][x].v) nb.push([y + 1, x, 's', 'n']);
    if (x > 0 && !g[y][x - 1].v) nb.push([y, x - 1, 'w', 'e']);
    if (x < W - 1 && !g[y][x + 1].v) nb.push([y, x + 1, 'e', 'w']);

    const [ny, nx, a, b] = pick(nb);

  const nodes = [];
  for (let y = 0; y < H; y++) { nodes[y] = []; for (let x = 0; x < W; x++) { const c = el('div', 'mz' + (g[y][x].n ? ' wn' : '') + (g[y][x].w ? ' ww' : '')); nodes[y][x] = c; wrap.appendChild(c); } }
  let keyPos = null, hasKey = !cfg.key;
  if (cfg.key) { do { keyPos = [rnd(H), rnd(W)]; } while ((keyPos[0] < H / 2 && keyPos[1] < W / 2) || (keyPos[0] === H - 1 && keyPos[1] === W - 1)); nodes[keyPos[0]][keyPos[1]].textContent = '🔑'; }
  nodes[H - 1][W - 1].textContent = cfg.key ? '🚪' : '🥕';

  nodes[0][0].classList.add('trail');

    const w = dy === -1 ? 'n' : dy === 1 ? 's' : dx === -1 ? 'w' : 'e';

    if (trail.length > 1 && trail[trail.length - 2][0] === y && trail[trail.length - 2][1] === x) { nodes[cy][cx].classList.remove('trail'); trail.pop(); }
    else { trail.push([y, x]); nodes[y][x].classList.add('trail'); }
    cur = [y, x]; nodes[y][x].appendChild(runner); Audio2.step();
    if (cfg.key && !hasKey && keyPos && y === keyPos[0] && x === keyPos[1]) {
      hasKey = true; nodes[y][x].textContent = ''; nodes[y][x].appendChild(runner);
      Audio2.pop(); toast('拿到钥匙 🔑'); Voice.say('拿到钥匙了，去开门'); setPrompt('钥匙拿到了，去开门 🚪');
    }
    if (y === H - 1 && x === W - 1) {
      if (!hasKey) { Voice.say('先去拿钥匙'); toast('要先拿到钥匙 🔑'); return true; }
      won = true; clearHint();
      trail.forEach(t => nodes[t[0]][t[1]].classList.add('won'));
      setPrompt(cfg.key ? '门开啦 🎉' : '小兔子吃到胡萝卜啦');
      later(400, () => roundWin(wrap));
    }
    return true;
  }
  function toward(y, x) {
    for (let i = 0; i < 8; i++) {
      const [cy, cx] = cur; if (cy === y && cx === x) return;
      const dy = Math.sign(y - cy), dx = Math.sign(x - cx);
      let moved = false;
      if (Math.abs(y - cy) >= Math.abs(x - cx)) moved = !!dy && step(cy + dy, cx);
      if (!moved && dx) moved = step(cy, cx + dx);
      if (!moved && dy) moved = step(cy + dy, cx);
      if (!moved) return;
    }
  }
  let dragging = false;
  function at(ev) {
    const r = wrap.getBoundingClientRect();
    const x = Math.floor((ev.clientX - r.left) / (r.width / W)), y = Math.floor((ev.clientY - r.top) / (r.height / H));
    if (y < 0 || x < 0 || y >= H || x >= W) return;
    toward(y, x);
  }
  wrap.addEventListener('pointerdown', ev => { Audio2.init(); dragging = true; try { wrap.setPointerCapture(ev.pointerId); } catch (e) { } at(ev); ev.preventDefault(); });
  wrap.addEventListener('pointermove', ev => { if (dragging) at(ev); });
  wrap.addEventListener('pointerup', () => dragging = false);
  wrap.addEventListener('pointercancel', () => dragging = false);
  function solve(from, to) {
    const pv = {}; const q = [from]; pv[from.join(',')] = null;
    while (q.length) {
      const [y, x] = q.shift();
      if (y === to[0] && x === to[1]) { const path = []; let c = y + ',' + x; while (c) { path.push(c.split(',').map(Number)); c = pv[c]; } return path; }
      [['n', -1, 0], ['s', 1, 0], ['w', 0, -1], ['e', 0, 1]].forEach(([w, dy, dx]) => {
        if (g[y][x][w]) return;
        const ny = y + dy, nx = x + dx, nk = ny + ',' + nx;
        if (ny < 0 || nx < 0 || ny >= H || nx >= W || nk in pv) return;
        pv[nk] = y + ',' + x; q.push([ny, nx]);
      });
    }
    return [];
  }
  function flash() {
    const target = (cfg.key && !hasKey) ? keyPos : [H - 1, W - 1];
    const path = solve(cur, target);
    path.forEach(p => nodes[p[0]][p[1]].classList.add('sol'));
    setTimeout(() => path.forEach(p => nodes[p[0]][p[1]].classList.remove('sol')), 1400);
  }
  const help = el('button', 'sw', '💡 看一眼路（少一颗星）');
  help.addEventListener('click', () => { if (won) return; miss(); flash(); });
  holder.appendChild(wrap); board.appendChild(holder); addExtra(help, holder);
  setPrompt(cfg.key ? '先拿钥匙 🔑 再去开门 🚪' : '带小兔子走到胡萝卜那里');
  Voice.say(cfg.key ? '先用手指带小兔子拿到钥匙，再去开门' : '用手指按住小兔子，带它走到胡萝卜那里');
  hintIn(22000, () => { if (!won) flash(); });
  Fit.cb = () => {
    const b = boardBox();
    const c = cellFit(b.w, b.h - 46, W, H, 0, 110);
    wrap.style.gridTemplateColumns = 'repeat(' + W + ',' + px(c) + ')';
    wrap.style.gridAutoRows = px(c);
    wrap.querySelectorAll('.mz').forEach(n => n.style.fontSize = px(c * .6));
    holder.style.gap = '8px';
  };
}

/* ===================== 9 找规律 ===================== */
const PAT_TOKENS = ['🔴', '🔵', '🟡', '🟢', '🟣', '🟠', '⭐', '❤️', '🐶', '🐱', '🌸', '🍎'];
function gPattern(board, lv) {
  const cfg = G.pattern.levels[lv - 1].cfg;
  let seq = [], answer = null, opts3 = [];
  if (cfg.kind === 'rep' || cfg.kind === 'aab') {
    const p = cfg.kind === 'aab' ? 3 : cfg.p;
    const toks = shuffle(PAT_TOKENS).slice(0, cfg.kind === 'aab' ? 2 : p);
    const unit = cfg.kind === 'aab' ? [toks[0], toks[0], toks[1]] : toks;
    const len = p === 2 ? 7 : 8;
    for (let i = 0; i < len; i++) seq.push(unit[i % unit.length]);
    answer = seq[len - 1]; seq[len - 1] = null;
    opts3 = shuffle(Array.from(new Set([answer, ...shuffle(unit.concat(PAT_TOKENS)).filter(t => t !== answer)])).slice(0, 3));
  } else if (cfg.kind === 'num') {
    const stepv = pick([1, 2, 2, 3, 5]), start = 1 + rnd(4);
    for (let i = 0; i < 6; i++) seq.push(String(start + stepv * i));
    answer = seq[5]; seq[5] = null;
    const nA = +answer;
    opts3 = shuffle(Array.from(new Set([answer, String(nA + stepv), String(Math.max(0, nA - stepv)), String(nA + 1)])).slice(0, 3));
  } else {
    const tok = pick(PAT_TOKENS);
    for (let i = 1; i <= 5; i++) seq.push(tok.repeat(i));
    answer = seq[4]; seq[4] = null;
    opts3 = shuffle([answer, tok.repeat(3), tok.repeat(6)]);
  }
  const holder = el('div', 'col2');
  const row = el('div', 'seqrow');
  const cells = [];
  seq.forEach(v => { const c = el('div', 'seq' + (v == null ? ' q' : ''), v == null ? '?' : v); cells.push(c); row.appendChild(c); });
  const opts = el('div', 'seqrow');
  const oc = [];
  opts3.forEach(v => {
    const o = el('div', 'seq tile', v);
    o.addEventListener('click', () => {
      if (v === answer) {
        Audio2.good(); const q = cells[cells.length - 1]; q.textContent = v; q.classList.remove('q'); q.classList.add('pop');
        q.style.background = 'var(--green)'; later(600, () => roundWin(q));
      } else { miss(); o.classList.remove('shake'); void o.offsetWidth; o.classList.add('shake'); }
    });
    oc.push(o); opts.appendChild(o);
  });
  holder.appendChild(row); holder.appendChild(opts); board.appendChild(holder);
  setPrompt('接下来该是哪一个？');
  Voice.say('看看前面的规律，接下来该是哪一个？');
  hintIn(12000, () => oc.forEach(o => { if (o.textContent === answer) o.classList.add('pulse'); }));
  Fit.cb = () => {
    const b = boardBox(), gap = clamp(b.w / 80, 5, 12);
    const cs = cellFit(b.w, b.h * .45, cells.length, 1, gap, 110);
    row.style.gap = px(gap);
    cells.forEach(c => { c.style.width = px(cs); c.style.height = px(cs); c.style.fontSize = px(cs * (cfg.kind === 'grow' ? .3 : .5)); });
    const os = cellFit(b.w, b.h * .34, 3, 1, gap * 2, 130);
    opts.style.gap = px(gap * 2); opts.style.marginTop = px(clamp(b.h * .06, 8, 26));
    oc.forEach(o => { o.style.width = px(os); o.style.height = px(os); o.style.fontSize = px(os * (cfg.kind === 'grow' ? .26 : .5)); });
    holder.style.gap = '0';
  };
}

const GAME_IMPL = { schulte: gSchulte, dots: gDots, bond: gBond, match: gMatch, mirror: gMirror, connect: gConnect, link: gLink, maze: gMaze, pattern: gPattern };


/* ===================== 家长设置 / 贴纸册 ===================== */
function sheet(title, back) {

  bar.appendChild(el('div', 'grow'));

}

  r.appendChild(tx);

  b.addEventListener('click', function () { set(!get()); b.className = 'tg' + (get() ? ' on' : ''); b.textContent = get() ? '开' : '关'; save(); });
  r.appendChild(b);
  return r;
}

  c2.appendChild(toggleRow('卡住时发光提示', '默认关闭。打开后没动作时会点亮正确答案——等于替孩子做完了搜索，训练效果会打折。', function () { return S.hints; }, function (v) { S.hints = v; }, true));

  c3.appendChild(toggleRow('跨天保存进度', '关卡、星星、贴纸、每关最快用时留在这台平板上', function () { return S.persist; }, function (v) { S.persist = v; if (v) save(); }));
  var clr = el('div', 'prow');

  clr.appendChild(ctx);
  var cb = el('button', 'tg'); cb.textContent = '清空'; cb.style.color = 'var(--red)'; cb.style.width = '110px';
  cb.addEventListener('click', function () {
    S.stars = 0; S.stickers = []; S.best = {}; S.days = {};
    GAMES.forEach(function (g) { S.level[g.id] = 1; S.streak[g.id] = 0; });
    save(); s.remove(); home(); toast('记录清空了');
  });
  clr.appendChild(cb); c3.appendChild(clr);
  cols.appendChild(c1); cols.appendChild(c2); cols.appendChild(c3);
  var box = el('div', 'lvbox');

  box.appendChild(hd);

    ch.appendChild(el('span', 'n', g.emoji + ' ' + g.name));

    pl.addEventListener('click', function () { S.level[g.id] = Math.min(g.levels.length, S.level[g.id] + 1); val.textContent = S.level[g.id] + '/' + g.levels.length; save(); });
