<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="思维小画本">
<meta name="theme-color" content="#FFFCF2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>思维小画本</title>
<style>

:root{
  --paper:#FFFCF2; --ink:#2A2523; --ink-soft:#6F665E; --line:#E4DCC9;
  --red:#E8452C; --orange:#F08A24; --yellow:#F5B921; --green:#3FA34D;
  --blue:#2E7DD1; --purple:#7B4BC9; --pink:#E4568E; --teal:#12A5A0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overscroll-behavior:none;overflow:hidden}
body{
  background:var(--paper);
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.num{font-family:"Arial Rounded MT Bold","Avenir Next Rounded","Nunito","PingFang SC",sans-serif;font-weight:700}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* ---------- 顶栏 ---------- */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;min-width:0}
.iconbtn{width:46px;height:46px;flex:0 0 auto;border:3px solid var(--ink);background:#fff;border-radius:14px;
  font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);cursor:pointer;padding:0}
.iconbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#barTitle{flex:1 1 auto;min-width:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#starBox{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:19px;padding:5px 12px;border:3px solid var(--ink);
  border-radius:999px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
#sayBtn{background:var(--yellow)}
#sayBtn.talking{animation:pl 1s infinite}
/* ---------- 屏幕 ---------- */
#screen{flex:1 1 auto;position:relative;overflow:hidden;min-height:0}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 12px 12px;overflow:hidden}
/* ---------- 首页 ---------- */
.hero{flex:0 0 auto;display:flex;align-items:baseline;gap:10px;padding:0 4px 8px}
.hero h1{margin:0;font-size:26px;transform:rotate(-1.2deg)}
.hero p{margin:0;color:var(--ink-soft);font-size:14px}
#cards{flex:1 1 auto;display:grid;gap:10px;min-height:0}
.card{border:4px solid var(--ink);border-radius:18px;background:#fff;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:5px 5px 0 var(--ink);cursor:pointer;min-height:0;padding-bottom:12%}
.card:nth-child(odd){transform:rotate(-.8deg)}
.card:nth-child(even){transform:rotate(.8deg)}
.card:active{transform:translate(4px,4px) rotate(0);box-shadow:0 0 0 var(--ink)}
.card .band{position:absolute;left:0;right:0;bottom:0;height:11%;background:var(--c)}
.card .band i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 6px,transparent 6px 14px)}
.card .emoji{line-height:1.05;position:relative;z-index:1}
.card .name{font-weight:700;position:relative;z-index:1}
.card .lv{position:absolute;top:6px;right:9px;font-size:12px;color:var(--ink-soft);z-index:1}
#stickerBar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 4px 0;font-size:14px;color:var(--ink-soft);
  min-height:34px;overflow:hidden}
#stickerBar b{font-size:23px;font-weight:400}
/* ---------- 选关 ---------- */
#lvWrap{flex:1 1 auto;display:grid;gap:10px;min-height:0;align-content:center}
.lvcard{border:4px solid var(--ink);border-radius:16px;background:#fff;box-shadow:4px 4px 0 var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:0;position:relative}
.lvcard:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.lvcard .no{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);display:flex;
  align-items:center;justify-content:center;font-size:20px;background:var(--c);color:#fff}
.lvcard .tx{flex:1 1 auto;min-width:0}
.lvcard .t1{font-size:17px;font-weight:700}
.lvcard .t2{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvcard .st{flex:0 0 auto;font-size:13px;letter-spacing:1px;color:var(--orange)}
.lvcard .tag{position:absolute;top:-10px;right:10px;background:var(--green);color:#fff;font-size:11px;
  padding:2px 8px;border-radius:999px;border:2px solid var(--ink)}
/* ---------- 关卡外壳 ---------- */
#dots{flex:0 0 auto;display:flex;gap:7px;justify-content:center;padding:2px 0 6px}
#dots i{width:12px;height:12px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:block}
#dots i.on{background:var(--yellow)}
#prompt{flex:0 0 auto;text-align:center;font-weight:700;padding:0 0 6px;line-height:1.25}
#board{flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#targetChip{display:inline-flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:14px;
  background:var(--yellow);box-shadow:3px 3px 0 var(--ink);padding:0 10px;margin:0 6px;vertical-align:middle}
/* ---------- 通用块 ---------- */
.tile{border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.tile:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.tile.done{background:var(--green);color:#fff;box-shadow:none;transform:none;cursor:default}
.tile.pick{background:var(--yellow)}
.tile.rd{color:var(--red)}
.tile.bl{color:var(--blue)}
.shake{animation:sh .34s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}50%{transform:translateX(7px)}80%{transform:translateX(-4px)}}
.pulse{animation:pl 1s infinite}
@keyframes pl{0%,100%{filter:none}50%{filter:brightness(1.12) drop-shadow(0 0 10px var(--yellow))}}
.pop{animation:pp .35s}
@keyframes pp{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.row2{display:flex;align-items:center;justify-content:center}
.col2{display:flex;flex-direction:column;align-items:center;justify-content:center}
/* 找一样 */
#matchWrap{position:relative;width:100%;height:100%}
#matchSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mcols{position:relative;display:flex;justify-content:space-between;height:100%}
.mcol{display:flex;flex-direction:column;justify-content:space-around}
.mitem{letter-spacing:.06em}
.mitem.done{background:var(--purple);color:#fff}
/* 奖励 / 面板 */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.spark{position:absolute;font-size:28px;animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
#reward{position:absolute;inset:0;background:rgba(255,252,242,.96);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;z-index:20;text-align:center;padding:18px}
#reward .big{font-size:min(150px,22vh);animation:pp .5s}
#reward h2{margin:0;font-size:24px}
.bigbtn{border:4px solid var(--ink);border-radius:16px;background:var(--yellow);box-shadow:5px 5px 0 var(--ink);
  font-size:20px;font-weight:700;padding:13px 26px;font-family:inherit;color:var(--ink);cursor:pointer}
.bigbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.bigbtn.ghost{background:#fff}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#panel{position:absolute;left:10px;right:10px;bottom:10px;max-width:560px;max-height:86%;overflow:auto;
  -webkit-overflow-scrolling:touch;margin:0 auto;background:#fff;border:4px solid var(--ink);border-radius:20px;
  box-shadow:6px 6px 0 var(--ink);padding:14px;z-index:30}
#panel h3{margin:0 0 8px;font-size:19px}
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:2px solid var(--line);font-size:16px}
.prow:last-of-type{border-bottom:0}
.sw{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:5px 14px;font-size:15px;font-family:inherit;cursor:pointer}
.sw.on{background:var(--green);color:#fff}
@keyframes fadeUp{0%{opacity:0;transform:translateY(10px) scale(.92)}100%{opacity:1;transform:none}}
.stagger{animation:fadeUp .34s backwards}
.veil{opacity:.13;pointer-events:none;filter:grayscale(1)}
.veil.in{transition:opacity .45s,filter .45s;opacity:1;filter:none;pointer-events:auto}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 大屏横屏改版：首页 / 阶梯选难度 / 伙伴侧栏 / 奖励 / 家长设置 ===== */
:root{--k:1}

.pane{position:absolute;inset:0;display:flex;flex-direction:column;padding:0;overflow:hidden}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:calc(16px * var(--k));padding:calc(14px * var(--k)) calc(24px * var(--k))}
.iconbtn{width:calc(72px * var(--k));height:calc(72px * var(--k));flex:0 0 auto;border:calc(4px * var(--k)) solid var(--ink);background:#fff;border-radius:calc(20px * var(--k));font-size:calc(32px * var(--k));line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:calc(4px * var(--k)) calc(4px * var(--k)) 0 var(--ink);cursor:pointer;padding:0;font-family:inherit}
.iconbtn:active{transform:translate(calc(4px * var(--k)),calc(4px * var(--k)));box-shadow:0 0 0 var(--ink)}
.barTitle{flex:0 0 auto;min-width:0;font-size:calc(34px * var(--k));font-weight:700;white-space:nowrap;display:flex;align-items:baseline;gap:calc(16px * var(--k))}
.barTitle small{font-size:calc(22px * var(--k));font-weight:400;color:var(--ink-soft)}
.grow{flex:1 1 auto;min-width:0}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:calc(10px * var(--k));font-size:calc(28px * var(--k));padding:calc(8px * var(--k)) calc(18px * var(--k));border:calc(4px * var(--k)) solid var(--ink);border-radius:calc(999px * var(--k));background:#fff;box-shadow:calc(4px * var(--k)) calc(4px * var(--k)) 0 var(--ink);white-space:nowrap}
.dayPill{flex:1 1 auto;min-width:0;gap:calc(14px * var(--k));font-size:calc(24px * var(--k));font-weight:700}
.dayBar{flex:1 1 auto;height:calc(20px * var(--k));border:calc(3px * var(--k)) solid var(--ink);border-radius:calc(999px * var(--k));background:#F5F0E2;overflow:hidden;min-width:calc(60px * var(--k))}
.dayBar i{display:block;height:100%;background:var(--green)}
#cards{flex:1 1 auto;display:grid;gap:calc(18px * var(--k));min-height:0;padding:calc(4px * var(--k)) calc(24px * var(--k)) calc(24px * var(--k))}
.card,.card:nth-child(odd),.card:nth-child(even){display:flex;overflow:hidden;border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(24px * var(--k));background:#fff;box-shadow:calc(7px * var(--k)) calc(7px * var(--k)) 0 var(--ink);cursor:pointer;min-height:0;padding:0;transform:none;flex-direction:row;align-items:stretch;justify-content:flex-start}
.card:active{transform:translate(calc(5px * var(--k)),calc(5px * var(--k)));box-shadow:0 0 0 var(--ink)}
.cardArt{flex:0 0 calc(148px * var(--k));background:var(--c);display:flex;align-items:center;justify-content:center;font-size:calc(84px * var(--k));line-height:1}
.cardArt svg{width:calc(104px * var(--k));height:calc(104px * var(--k));filter:drop-shadow(0 calc(4px * var(--k)) 0 rgba(0,0,0,.18))}
.cardTx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:calc(6px * var(--k));padding:calc(14px * var(--k)) calc(18px * var(--k))}
.cardName{font-size:calc(38px * var(--k));font-weight:700;line-height:1.1}
.cardTip{font-size:calc(21px * var(--k));color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardMeta{display:flex;align-items:center;gap:calc(12px * var(--k));margin-top:calc(4px * var(--k))}
.cardMeta .s{flex:none;white-space:nowrap;font-size:calc(25px * var(--k));font-weight:700;color:var(--orange)}
.cardMeta .b{flex:none;white-space:nowrap;font-size:calc(21px * var(--k));color:var(--ink-soft)}
.stair{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;gap:calc(20px * var(--k));padding:calc(132px * var(--k)) calc(26px * var(--k)) 0}
.step{flex:1 1 0;min-width:0;border:calc(5px * var(--k)) solid var(--ink);border-bottom:0;border-radius:calc(26px * var(--k)) calc(26px * var(--k)) 0 0;display:flex;flex-direction:column;align-items:center;gap:calc(10px * var(--k));padding:calc(18px * var(--k)) calc(12px * var(--k)) 0;position:relative;cursor:pointer}
.step .no{width:calc(92px * var(--k));height:calc(92px * var(--k));flex:none;border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(26px * var(--k));background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:calc(50px * var(--k))}
.step .nm{flex:none;width:100%;font-size:calc(25px * var(--k));font-weight:700;text-align:center;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step .nm .nb{display:inline-block}
.step .mid{flex:1 1 auto;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.step .ft{flex:none;display:flex;flex-direction:column;align-items:center;gap:calc(4px * var(--k));padding-bottom:calc(16px * var(--k))}
.step .ft i{font-size:calc(21px * var(--k));font-style:normal;font-weight:700;white-space:nowrap}
.step .go{flex:none;width:100%;margin-bottom:calc(10px * var(--k));height:calc(88px * var(--k));border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(22px * var(--k));background:var(--ink);color:#fff;font-family:inherit;font-size:calc(30px * var(--k));font-weight:700;cursor:pointer}
.step .me{position:absolute;top:auto;bottom:100%;left:50%;margin-bottom:calc(42px * var(--k));font-size:calc(86px * var(--k));line-height:1;transform:translateX(-50%);animation:bob 3s infinite;pointer-events:none}
/* 关卡多（找规律 11 关）时台阶变窄：缩小间距和字，关名两行放得下五个字 */
.stair.many{gap:calc(9px * var(--k));padding-left:calc(14px * var(--k));padding-right:calc(14px * var(--k))}
.stair.many .step{padding-left:calc(4px * var(--k));padding-right:calc(4px * var(--k))}
.stair.many .step .no{width:calc(80px * var(--k));height:calc(80px * var(--k));font-size:calc(44px * var(--k))}
.stair.many .step .nm{font-size:calc(23px * var(--k))}
.stair.many .step .go{height:auto;padding:calc(8px * var(--k)) 0;font-size:calc(23px * var(--k));line-height:1.2}
.stair.many .step .ft i{font-size:calc(18px * var(--k))}
.step .tag{position:absolute;top:auto;bottom:100%;left:50%;margin-bottom:calc(8px * var(--k));transform:translateX(-50%);border:calc(4px * var(--k)) solid var(--ink);border-radius:999px;background:var(--green);color:#fff;font-size:calc(20px * var(--k));font-weight:700;padding:calc(3px * var(--k)) calc(14px * var(--k));white-space:nowrap;pointer-events:none}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-calc(10px * var(--k)))}}
.pv{display:grid;gap:calc(5px * var(--k))}
.pv span{border:calc(3px * var(--k)) solid var(--ink);border-radius:calc(8px * var(--k));background:#fff;display:block}
.pv span.hi{background:var(--yellow)}
.play{flex-direction:row}
.boardWrap{flex:1 1 auto;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:calc(28px * var(--k))}
#board{flex:1 1 auto;width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.side{flex:0 0 calc(380px * var(--k));background:#FFF4D6;border-left:calc(5px * var(--k)) solid var(--ink);display:flex;flex-direction:column;align-items:center;gap:calc(16px * var(--k));padding:calc(24px * var(--k));overflow:hidden}
.owl{display:flex;align-items:center;gap:calc(10px * var(--k));align-self:stretch;flex:none}
.owl .f{font-size:calc(56px * var(--k));line-height:1;flex:none;animation:bob2 3s infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-calc(8px * var(--k)))}}
#prompt{flex:1 1 auto;min-width:0;font-size:calc(24px * var(--k));font-weight:700;line-height:1.35;background:#fff;border:calc(4px * var(--k)) solid var(--ink);border-radius:calc(18px * var(--k));padding:calc(10px * var(--k)) calc(14px * var(--k));text-align:left}
#targetChip{display:inline-flex;align-items:center;justify-content:center;border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(24px * var(--k));background:var(--yellow);box-shadow:calc(6px * var(--k)) calc(6px * var(--k)) 0 var(--ink);padding:0 calc(12px * var(--k));margin:calc(6px * var(--k)) calc(4px * var(--k));vertical-align:middle}
#dots{flex:0 0 auto;display:flex;gap:calc(12px * var(--k));justify-content:center;padding:0}
#dots i{width:calc(40px * var(--k));height:calc(40px * var(--k));border-radius:50%;border:calc(5px * var(--k)) solid var(--ink);background:#fff;display:block}
#dots i.on{background:var(--yellow)}
.timer{align-self:stretch;flex:none;display:flex;flex-direction:column;align-items:center;gap:calc(2px * var(--k));border:calc(4px * var(--k)) solid var(--ink);border-radius:calc(22px * var(--k));background:#fff;box-shadow:calc(5px * var(--k)) calc(5px * var(--k)) 0 var(--ink);padding:calc(12px * var(--k))}

.timer .l{font-size:calc(19px * var(--k));color:var(--ink-soft)}
.extras{align-self:stretch;flex:none;display:flex;flex-direction:column;gap:calc(10px * var(--k))}
.sidebtn{height:calc(76px * var(--k));border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(22px * var(--k));background:#fff;box-shadow:calc(5px * var(--k)) calc(5px * var(--k)) 0 var(--ink);font-family:inherit;font-size:calc(26px * var(--k));font-weight:700;color:var(--ink);cursor:pointer;width:100%}
.sidebtn.y{background:var(--yellow);height:calc(80px * var(--k));font-size:calc(28px * var(--k))}
.sidebtn:active{transform:translate(calc(4px * var(--k)),calc(4px * var(--k)));box-shadow:0 0 0 var(--ink)}
.tile{border:calc(4px * var(--k)) solid var(--ink);border-radius:calc(16px * var(--k));box-shadow:calc(4px * var(--k)) calc(4px * var(--k)) 0 var(--ink)}
.tile:active{transform:translate(calc(4px * var(--k)),calc(4px * var(--k)));box-shadow:0 0 0 var(--ink)}
.sw{border:calc(4px * var(--k)) solid var(--ink);border-radius:calc(999px * var(--k));padding:calc(10px * var(--k)) calc(22px * var(--k));font-size:calc(24px * var(--k));font-family:inherit;font-weight:700;cursor:pointer}
#reward .big{font-size:calc(200px * var(--k));line-height:1}
#reward h2{font-size:calc(56px * var(--k));margin:0}
.timeline{display:flex;align-items:center;gap:calc(14px * var(--k));border:calc(5px * var(--k)) solid var(--ink);border-radius:calc(999px * var(--k));background:var(--green);color:#fff;box-shadow:calc(6px * var(--k)) calc(6px * var(--k)) 0 var(--ink);padding:calc(12px * var(--k)) calc(28px * var(--k));font-size:calc(30px * var(--k));font-weight:700;flex-wrap:wrap;justify-content:center}
.timeline b{font-size:calc(26px * var(--k));background:#fff;color:var(--green);border-radius:calc(999px * var(--k));padding:calc(4px * var(--k)) calc(18px * var(--k))}

  if (S.showTimer) {
    var tm = el('div', 'timer');
    var t1 = el('div', 't'); t1.appendChild(el('span', null, '⏱'));
    var tn = el('span', 'num', '0:00'); tn.id = 'timeNow'; t1.appendChild(tn); tm.appendChild(t1);
    var bt = S.best[g.id + '.' + lv];
    tm.appendChild(el('div', 'l', bt ? '上次最快 ' + fmt(bt) : '第一次玩这一关'));
    side.appendChild(tm);
  }
  var ex = el('div', 'extras'); ex.id = 'extras'; side.appendChild(ex);
  var sp = el('div'); sp.style.cssText = 'margin-top:auto;align-self:stretch;display:flex;flex-direction:column;gap:12px';
  var say = el('button', 'sidebtn y', '🔊 再读一遍'); say.id = 'sayBtn';
  say.addEventListener('click', function () { Audio2.init(); Voice.unlock(); Voice.repeat(); });
  var hm = el('button', 'sidebtn', '🏠 回家');
  hm.addEventListener('click', function () { Audio2.page(); clearHint(); stopTimer(); levelPicker(g); });
  sp.appendChild(say); sp.appendChild(hm); side.appendChild(sp);
  p.appendChild(bw); p.appendChild(side);
  $('#screen').innerHTML = ''; $('#screen').appendChild(p);
  startTimer();
  nextRound();
}
function updateDots() { var ds = document.querySelectorAll('#dots i'); for (var i = 0; i < ds.length; i++) ds[i].classList.toggle('on', i < Session.doneRounds); }
function setPrompt(html) {
  var p = $('#prompt'); if (!p) return;
  p.innerHTML = html;
  var chip = $('#targetChip');
  if (chip) { var cs = Math.round(104 * K); chip.style.height = cs + 'px'; chip.style.minWidth = cs + 'px'; chip.style.fontSize = Math.round(66 * K) + 'px'; }
}
function miss() { if (Session) { Session.miss++; Session.totalMiss++; } Audio2.soft(); }
function clearHint() { if (Session && Session.hintTimer) { clearTimeout(Session.hintTimer); Session.hintTimer = null; } }
function hintIn(ms, fn) { clearHint(); if (!Session || !S.hints) return; Session.hintTimer = setTimeout(function () { if (Session) fn(); }, ms); }
function nextRound() {
  if (!Session) return;
  clearHint(); Fit.cb = null; ROUND_ID++; Voice.lastFn = null;
  if (Session.doneRounds >= ROUNDS) return rewardScreen();
  Session.round++; Session.miss = 0;
  updateDots();
  var board = $('#board'); board.innerHTML = ''; board.style.cssText = '';
  var ex = $('#extras'); if (ex) ex.innerHTML = '';
  GAME_IMPL[Session.g.id](board, Session.lv);
  scheduleFit(0);
}
// hold：先不进下一关，由游戏自己放「下一题」按钮（找规律试错碰对时，给她听讲解的机会）
function roundWin(node, hold) {
  if (!Session || Session.won === ROUND_ID) return;
  Session.won = ROUND_ID;
  clearHint(); Audio2.win(); Voice.praise();
  var id = Session.g.id, maxLv = Session.g.levels.length;
  if (Session.miss === 0) S.streak[id]++; else if (Session.miss >= 3) S.streak[id] = 0;
  if (S.autoLevel) {
    if (S.streak[id] >= 3 && Session.lv < maxLv) { Session.lv++; S.level[id] = Session.lv; S.streak[id] = 0; toast('升到第 ' + Session.lv + ' 关啦 💪'); }
    else if (Session.miss >= 5 && Session.lv > 1) { Session.lv--; S.level[id] = Session.lv; toast('换个简单点的 🙂'); }
  }
  addStars(Session.miss === 0 ? 3 : 2);
  sparkleAt(node);
  Session.doneRounds++; updateDots(); save();
  if (!hold) later(1300, function () { if (Session) nextRound(); });
}
function rewardScreen() {
  stopTimer();
  var g = Session.g, lv = Session.startLv || Session.lv, total = elapsed();
  var key = g.id + '.' + lv, prev = S.best[key];
  var faster = (prev && total < prev) ? prev - total : 0;
  if (!prev || total < prev) S.best[key] = total;
  var dk = todayKey(); S.days[dk] = (S.days[dk] || 0) + ROUNDS;
  var left = STICKERS.filter(function (s) { return S.stickers.indexOf(s) < 0; });
  var sticker = pick(left.length ? left : STICKERS);
  S.stickers.push(sticker); save();
  Audio2.fanfare(); Voice.say('三关都通过了，得到一张贴纸');
  var r = el('div'); r.id = 'reward';
  r.appendChild(el('div', 'big', sticker));
  r.appendChild(el('h2', null, '三关都通过了！'));
  var tl = el('div', 'timeline');
  tl.appendChild(el('span', null, '⏱ 一共用了 ' + fmt(total)));
  if (faster) tl.appendChild(el('b', null, '比上次快 ' + faster + ' 秒 🚀'));
  else if (prev) tl.appendChild(el('b', null, '最快纪录 ' + fmt(prev)));
  else tl.appendChild(el('b', null, '新纪录'));
  if (Session.totalMiss === 0) tl.appendChild(el('b', null, '一次都没点错'));
  r.appendChild(tl);
  var al = el('div', 'album');
  al.appendChild(el('div', 't', '我的贴纸 ' + S.stickers.length + '/' + STICKERS.length));
  var shown = S.stickers.slice(-5);
  shown.forEach(function (s) { var n = el('s', s === sticker ? 'new' : null, s); al.appendChild(n); });
  for (var q = 0; q < Math.min(3, STICKERS.length - S.stickers.length); q++) al.appendChild(el('s', 'q', '?'));
  r.appendChild(al);
  var row = el('div', 'btnrow');
  var again = el('button', 'bigbtn', g.emoji + ' 再玩三关');
  again.addEventListener('click', function () { Audio2.tap(); r.remove(); Session.doneRounds = 0; Session.totalMiss = 0; Session.startLv = Session.lv; startTimer(); nextRound(); });
  var other = el('button', 'bigbtn ghost', '换个难度');
  other.addEventListener('click', function () { Audio2.tap(); levelPicker(g); });
  var back = el('button', 'bigbtn ghost', '🏠 回家');
  back.addEventListener('click', function () { Audio2.tap(); home(); });
  row.appendChild(again); row.appendChild(other); row.appendChild(back);
  r.appendChild(row);
  $('#screen').appendChild(r);
  sparkle(innerWidth / 2, innerHeight / 3, ['🎉', '⭐', '✨', '🎈']);
  setTimeout(function () { sparkle(innerWidth / 2, innerHeight / 3, ['🎉', '⭐', '✨']); }, 400);
}

/* ===================== 各游戏的代码 =====================
   闯关游戏和古诗小剧场各在自己的文件夹里：<id>/game.js，有自己样式的还有 <id>/game.css（找数字 schulte/、数点点 dots/、
   凑数字 bond/、古诗小剧场 shi/、照镜子 mirror/、找规律 pattern/、方块拼拼 fit/、记住亮过的 span/）。点开一个游戏时才加载它的文件，
   还是这一个页面，声音不用重新解锁。game.js 把「出一关」的函数登记进 GAME_IMPL；回首页、切到后台时要停下的东西登记进 GAME_HOOKS。
   sw.js 预先把这些文件存进离线缓存，没玩过的游戏断网也能打开。 */
const GAME_IMPL = {};
const GAME_HOOKS = { home: [], hide: [] };
const GAME_FILES = { schulte: ['game.js'], dots: ['game.css', 'game.js'], bond: ['game.css', 'game.js'], shi: ['game.css', 'game.js'],
  mirror: ['game.css', 'game.js'], pattern: ['game.css', 'game.js'], fit: ['game.css', 'game.js'], span: ['game.js'] };
const gameLoads = {};
function loadGame(id) {
  if (gameLoads[id]) return gameLoads[id];
  var p = gameLoads[id] = Promise.all(GAME_FILES[id].map(function (f) {
    return new Promise(function (res, rej) {
      var css = /\.css$/.test(f), n = document.createElement(css ? 'link' : 'script');
      if (css) { n.rel = 'stylesheet'; n.href = id + '/' + f; } else { n.src = id + '/' + f; n.async = false; }
      n.onload = res; n.onerror = function () { n.remove(); rej(new Error(id + '/' + f)); };
      document.head.appendChild(n);
    });
  })).catch(function (e) { if (gameLoads[id] === p) delete gameLoads[id]; throw e; });
  return p;
}
// 点开一个游戏：文件到了再进去（通常从离线缓存里拿，一眨眼）；没拿到就提示一下，下次再点会重新去取
function openGame(id, go) {
  loadGame(id).then(go, function (e) { console.error('loadGame failed:', e); toast('没加载出来，连上网再点一次'); });
}

/* ===================== 家长设置 / 贴纸册 ===================== */
function sheet(title, back) {
  var s = el('div', 'sheet');
  var bar = el('div', 'topbar');
  bar.appendChild(ibtn('⬅', '#fff', function () { s.remove(); if (back) back(); }));
  var t = el('div', 'barTitle'); t.appendChild(el('span', null, title)); bar.appendChild(t);
  bar.appendChild(el('div', 'grow'));
  s.appendChild(bar);
  return s;
}
function toggleRow(name, desc, get, set, warn) {
  var r = el('div', 'prow');
  var tx = el('div', 'tx'); tx.appendChild(el('b', null, name));
  tx.appendChild(el('span', warn ? 'warn' : null, desc));
  r.appendChild(tx);
  var b = el('button', 'tg' + (get() ? ' on' : ''), get() ? '开' : '关');
  b.addEventListener('click', function () { set(!get()); b.className = 'tg' + (get() ? ' on' : ''); b.textContent = get() ? '开' : '关'; save(); });
  r.appendChild(b);
  return r;
}
function openPanel() {
  if (document.querySelector('.sheet')) return;
  Audio2.init();
  var s = sheet('⚙️ 家长设置');
  var body = el('div', 'sheetBody');
  var cols = el('div', 'pcols');
  var c1 = el('div', 'pcard'); c1.appendChild(el('h3', null, '声音'));
  c1.appendChild(toggleRow('音效', '点对、消除、通关的提示音', function () { return Audio2.on; }, function (v) { Audio2.on = v; }));
  c1.appendChild(toggleRow('语音读题', '每道题自动朗读一遍，不识字也能玩', function () { return Voice.on; }, function (v) { Voice.on = v; if (!v) Voice.stop(); }));
  c1.appendChild(toggleRow('背景音乐', '朗读时自动压低', function () { return Music.on; }, function (v) { Music.on = v; if (v) Music.start(); else Music.stop(); }));
  var c2 = el('div', 'pcard'); c2.appendChild(el('h3', null, '玩法'));
  c2.appendChild(toggleRow('玩得顺时自动升关', '连续三关零失误升一级，一关错五次降一级', function () { return S.autoLevel; }, function (v) { S.autoLevel = v; }));
  c2.appendChild(toggleRow('慢慢来模式', '默认打开。题目分批出现而不是一次铺满；找数字这类关卡会拆成「先找 5 个」的小目标。孩子一看到满屏内容就发怵时开着。', function () { return S.easeIn; }, function (v) { S.easeIn = v; }));
  c2.appendChild(toggleRow('找数字：藏起要找的数', '默认关闭。打开后题目牌只显示「?」，数字只念一遍，孩子得自己记着数到几了——这部分工作记忆的负荷会回到她身上。点一下牌子能偷看 1.5 秒。', function () { return S.hideTarget; }, function (v) { S.hideTarget = v; }));
  c2.appendChild(toggleRow('卡住时发光提示', '默认关闭。打开后没动作时会点亮正确答案——等于替孩子做完了搜索，训练效果会打折。', function () { return S.hints; }, function (v) { S.hints = v; }, true));
  var c3 = el('div', 'pcard'); c3.appendChild(el('h3', null, '计时与记录'));
  c3.appendChild(toggleRow('给孩子看秒表', '关掉后孩子看不到计时，后台照常记录用时；容易紧张的孩子建议关', function () { return S.showTimer; }, function (v) { S.showTimer = v; }));
  c3.appendChild(offlineRow());
  c1.appendChild(toggleRow('古诗：用小话筒听孩子念', '「跟我念」「接下句」「我来背」时听她有没有念出声，背诗时录下来给你听（只存在这台设备上）。关掉就改成念完点小手', function () { return S.shi.mic !== false; }, function (v) { S.shi.mic = v; if (!v && typeof Mic !== 'undefined') Mic.close(); }));
  c3.appendChild(toggleRow('跨天保存进度', '关卡、星星、贴纸、每关最快用时留在这台平板上', function () { return S.persist; }, function (v) { S.persist = v; if (v) save(); }));
  var clr = el('div', 'prow');
  var ctx = el('div', 'tx'); ctx.appendChild(el('span', null, '已记录 ' + Object.keys(S.days).length + ' 天 · 星星 ' + S.stars + ' 颗 · 贴纸 ' + S.stickers.length + ' 张'));
  clr.appendChild(ctx);
  var cb = el('button', 'tg'); cb.textContent = '清空'; cb.style.color = 'var(--red)'; cb.style.width = '110px';
  cb.addEventListener('click', function () {
    S.stars = 0; S.stickers = []; S.best = {}; S.days = {}; S.shi.tk = {}; S.shi.lp = {}; loadGame('shi').then(function () { RecDB.clear(); }, function () { });
    GAMES.forEach(function (g) { S.level[g.id] = 1; S.streak[g.id] = 0; });
    save(); s.remove(); home(); toast('记录清空了');
  });
  clr.appendChild(cb); c3.appendChild(clr);
  cols.appendChild(c1); cols.appendChild(c2); cols.appendChild(c3);
  var box = el('div', 'lvbox');
  var hd = el('div'); hd.style.cssText = 'display:flex;align-items:baseline;gap:14px';
  hd.appendChild(el('h3', null, '手动调关卡'));
  hd.appendChild(el('span', null, '孩子也能在每个游戏的台阶里自己选')).style.cssText = 'font-size:19px;color:var(--ink-soft)';
  box.appendChild(hd);
  var grid = el('div', 'lvgrid');
  GAMES.forEach(function (g) {
    if (!g.levels.length) return;
    var ch = el('div', 'lvchip');
    ch.appendChild(el('span', 'n', g.emoji + ' ' + g.name));
    var mn = el('button', null, '−'), val = el('b', 'num', String(S.level[g.id]) + '/' + g.levels.length), pl = el('button', null, '+');
    mn.addEventListener('click', function () { S.level[g.id] = Math.max(1, S.level[g.id] - 1); val.textContent = S.level[g.id] + '/' + g.levels.length; save(); });
    pl.addEventListener('click', function () { S.level[g.id] = Math.min(g.levels.length, S.level[g.id] + 1); val.textContent = S.level[g.id] + '/' + g.levels.length; save(); });
    ch.appendChild(mn); ch.appendChild(val); ch.appendChild(pl);
    grid.appendChild(ch);
  });
  box.appendChild(grid);
  body.appendChild(cols); body.appendChild(box);
  s.appendChild(body);
  $('#screen').appendChild(s);
}
function openAlbum() {
  if (document.querySelector('.sheet')) return;
  var s = sheet('📖 我的贴纸 ' + S.stickers.length + '/' + STICKERS.length);
  var g = el('div', 'albumGrid');
  STICKERS.forEach(function (st) {
    var has = S.stickers.indexOf(st) >= 0;
    g.appendChild(el('s', has ? null : 'q', has ? st : '?'));
  });
  s.appendChild(g);
  $('#screen').appendChild(s);
}
function boot() {
  load();
  fitScale();
  Fit.boot();
  home();
  document.addEventListener('pointerdown', function () { Audio2.init(); Voice.unlock(); Music.start(); }, { once: true });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { Music.stop(); Voice.stop(); GAME_HOOKS.hide.forEach(function (f) { f(); }); } else Music.start(); });
}

boot();
</script>
