<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="彩虹钢琴">
<meta name="theme-color" content="#F7EDE6">
<meta name="description" content="彩虹钢琴：七个音七种颜色。一架会发光的 3D 三角钢琴，自己弹、跟着亮灯学儿歌、听钢琴自己演奏、和小鸟学唱。">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<title>彩虹钢琴</title>
<style>
:root{
  --ink:#2B2140; --ink-soft:#6B6380; --paper:rgba(255,255,255,.86); --paper-solid:#fff;
  --line:rgba(43,33,64,.08); --shadow:0 8px 22px rgba(58,36,92,.16), 0 2px 4px rgba(58,36,92,.08);
  --r1:#FF4F5E; --r2:#FF9A3C; --r3:#FFD43B; --r4:#3DD68C; --r5:#1FC8DB; --r6:#4D7CFE; --r7:#A55EEA;
  --rainbow:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6),var(--r7));
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --u:1px;      /* scaled by JS for small screens */
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",system-ui,sans-serif;
  --round:"Arial Rounded MT Bold","Avenir Next Rounded","Avenir Next","Nunito",var(--font);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#F7EDE6;color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
body.night{background:#0B0B24}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
[hidden]{display:none!important}

/* ---------- loading ---------- */
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(120% 90% at 50% 35%,#FFF8F1 0%,#F7EDE6 55%,#EFE3EF 100%);transition:opacity .8s ease, visibility .8s}
#loader.gone{opacity:0;visibility:hidden;pointer-events:none}
#loader h1{margin:14px 0 0;font-size:34px;letter-spacing:.12em;font-weight:800;
  background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.ld-sub{margin:0;color:var(--ink-soft);font-size:15px;letter-spacing:.3em}
.ld-keys{display:flex;gap:6px;height:92px;align-items:flex-start}
.ld-keys i{width:26px;height:84px;border-radius:0 0 9px 9px;background:#fff;box-shadow:0 6px 14px rgba(60,30,90,.14);position:relative;
  animation:ldk 1.6s cubic-bezier(.3,.7,.3,1) infinite}
.ld-keys i::after{content:"";position:absolute;left:5px;right:5px;bottom:8px;height:16px;border-radius:50%;background:var(--c)}
.ld-keys i:nth-child(1){--c:var(--r1);animation-delay:0s}.ld-keys i:nth-child(2){--c:var(--r2);animation-delay:.09s}
.ld-keys i:nth-child(3){--c:var(--r3);animation-delay:.18s}.ld-keys i:nth-child(4){--c:var(--r4);animation-delay:.27s}
.ld-keys i:nth-child(5){--c:var(--r5);animation-delay:.36s}.ld-keys i:nth-child(6){--c:var(--r6);animation-delay:.45s}
.ld-keys i:nth-child(7){--c:var(--r7);animation-delay:.54s}
@keyframes ldk{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(8px);box-shadow:0 2px 6px rgba(60,30,90,.14),0 0 22px var(--c)}}
.ld-bar{width:min(240px,60vw);height:8px;border-radius:99px;background:rgba(43,33,64,.08);overflow:hidden;margin-top:18px}
.ld-bar b{display:block;height:100%;width:6%;border-radius:99px;background:var(--rainbow);background-size:240px 100%;transition:width .3s ease}
.ld-msg{margin:4px 0 0;font-size:13px;color:var(--ink-soft)}

/* ---------- shared buttons ---------- */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:auto;
  background:var(--paper);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:var(--shadow), inset 0 0 0 1.5px rgba(255,255,255,.7);border-radius:20px;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1), background .25s, box-shadow .25s, opacity .3s;text-decoration:none;color:var(--ink)}
.btn:active,.btn.press{transform:scale(.9)}
.btn .ic{font-size:28px;line-height:1;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08))}
.btn .lb{font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.btn.round{width:54px;height:54px;border-radius:50%}
.btn.round .ic{font-size:25px}
body.night .btn{background:rgba(32,30,70,.62);color:#F4EEFF;box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.12)}
body.night .btn .lb{color:#E9E2FF}

/* ---------- HUD frame ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{transition:opacity .6s ease, transform .7s cubic-bezier(.22,1,.36,1)}
#hud.hidden #top{opacity:0;transform:translateY(-30px)}
#hud.hidden #rail{opacity:0;transform:translateX(-40px)}
#hud.hidden #rail2{opacity:0;transform:translateX(40px)}
#hud.hidden #nav{opacity:0;transform:translateY(-20px)}
#hud.hidden #top *, #hud.hidden #rail *, #hud.hidden #rail2 *, #hud.hidden #nav *{pointer-events:none!important}

#top{position:absolute;left:calc(14px + var(--safe-l));right:calc(14px + var(--safe-r));top:calc(12px + var(--safe-t));display:flex;align-items:center;gap:10px}
#top .grow{flex:1}
#modes{position:relative;display:flex;gap:2px;padding:5px;border-radius:26px;pointer-events:auto;
  background:var(--paper);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:var(--shadow), inset 0 0 0 1.5px rgba(255,255,255,.7)}
body.night #modes{background:rgba(32,30,70,.62);box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.12)}
#modes button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;height:46px;padding:0 16px 0 12px;border-radius:21px;font-weight:800;font-size:16px;
  transition:color .3s, transform .25s cubic-bezier(.34,1.56,.64,1)}
#modes button:active{transform:scale(.92)}
#modes button .ic{font-size:24px;line-height:1}
#modes button[aria-selected="true"]{color:#fff}
body.night #modes button{color:#E9E2FF}
#modes .thumb{position:absolute;top:5px;left:5px;height:46px;border-radius:21px;z-index:0;
  background:linear-gradient(135deg,var(--a,#FF7A59),var(--b,#FF4F8B));box-shadow:0 6px 14px rgba(255,80,110,.35);
  transition:transform .55s cubic-bezier(.34,1.4,.5,1), width .55s cubic-bezier(.34,1.4,.5,1), background .4s}

/* subtitle bubble: what the voice is saying */
#bubble{position:absolute;left:50%;top:82px;transform:translate(-50%,-8px) scale(.96);max-width:min(560px,86vw);
  padding:11px 20px;border-radius:22px;background:var(--paper-solid);box-shadow:var(--shadow);font-size:17px;font-weight:700;line-height:1.4;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .35s, transform .45s cubic-bezier(.34,1.56,.64,1)}
#bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
body.night #bubble{background:rgba(36,33,82,.92);color:#fff}

/* left: instruments; right: view, pedal, recorder */
/* above the keys, so a child reaching for the lowest or highest notes never hits a button */
#rail,#rail2{position:absolute;top:calc(104px + var(--safe-t));display:flex;flex-direction:column;gap:8px}
#rail{left:calc(14px + var(--safe-l))}
#rail2{right:calc(14px + var(--safe-r))}
.btn.inst,.btn.side{width:66px;height:60px;border-radius:18px}
.btn.inst .ic,.btn.side .ic{font-size:25px}
.btn.inst.on{background:#fff;box-shadow:0 10px 24px rgba(58,36,92,.22), 0 0 0 3px var(--c,#FF7A59)}
body.night .btn.inst.on{background:rgba(70,62,140,.9)}
.btn.inst.on .ic{animation:wig .6s ease}
@keyframes wig{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-12deg) scale(1.2)}60%{transform:rotate(10deg) scale(1.1)}100%{transform:rotate(0) scale(1)}}
#pedalBtn[aria-pressed="true"]{background:linear-gradient(160deg,#FFE7A8,#F7B94C);color:#4A2E00}
#recBtn .dot{display:block;width:24px;height:24px;border-radius:50%;background:#FF4F5E;box-shadow:0 0 0 4px rgba(255,79,94,.2)}
#recBtn.on .dot{border-radius:6px;animation:rec 1s ease-in-out infinite}
#recBtn.on{background:#FFF0F1}
@keyframes rec{50%{box-shadow:0 0 0 10px rgba(255,79,94,.0),0 0 16px rgba(255,79,94,.8)}}

/* navigator: the whole keyboard in miniature, with the part on screen lit */
#nav{position:absolute;left:50%;top:calc(80px + var(--safe-t));transform:translateX(-50%);display:flex;align-items:center;gap:10px;pointer-events:none}
#nav .arrow{width:52px;height:52px;border-radius:50%;font-size:20px;font-weight:900;color:var(--ink-soft)}
#mini{position:relative;width:min(520px,54vw);height:52px;pointer-events:auto;border-radius:14px;padding:22px 8px 6px;
  background:var(--paper);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow), inset 0 0 0 1.5px rgba(255,255,255,.7);touch-action:none;cursor:grab}
body.night #mini{background:rgba(32,30,70,.62)}
#miniKeys{position:relative;height:24px;border-radius:4px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
#miniKeys i{position:absolute;top:0;bottom:0;border-right:1px solid rgba(0,0,0,.09)}
#miniKeys i.b{bottom:42%;background:#2A2633;border:0;border-radius:0 0 1px 1px}
#miniKeys i.c4{background:linear-gradient(#fff 60%,#FFE9A6)}
#miniKeys i.lit{background:var(--c)}
#miniWin{position:absolute;top:18px;bottom:2px;border-radius:9px;box-shadow:0 0 0 3px #FF7A59, 0 4px 14px rgba(255,90,90,.35);background:rgba(255,122,89,.10);
  transition:left .12s linear,width .25s ease;pointer-events:none}
#miniAnimals{position:absolute;left:8px;right:8px;top:2px;height:18px}
#miniAnimals span{position:absolute;top:0;transform:translateX(-50%);font-size:15px;line-height:18px;opacity:.55;transition:opacity .3s, transform .3s}
#miniAnimals span.here{opacity:1;transform:translateX(-50%) scale(1.25)}

/* ---------- sheets ---------- */
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(880px,92vw);max-height:min(640px,84vh);display:flex;flex-direction:column;
  background:rgba(255,253,250,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:30px;box-shadow:0 30px 80px rgba(40,20,70,.35);
  pointer-events:auto;animation:sheetIn .5s cubic-bezier(.22,1.3,.36,1);z-index:20}
body.night .sheet{background:rgba(26,24,62,.94);color:#F4EEFF}
@keyframes sheetIn{from{opacity:0;transform:translate(-50%,-44%) scale(.94)}}
.sheet-hd{display:flex;align-items:center;padding:18px 18px 8px 26px}
.sheet-hd h2{flex:1;margin:0;font-size:24px;font-weight:800}
.sheet .close{width:46px;height:46px;background:rgba(43,33,64,.06);box-shadow:none}
.cards{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 20px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.song{position:relative;border-radius:22px;padding:14px 12px 12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;
  background:linear-gradient(160deg,var(--a),var(--b));color:#fff;box-shadow:0 10px 22px var(--s,rgba(0,0,0,.18));text-align:center;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);animation:cardIn .5s cubic-bezier(.22,1.3,.36,1) both}
.song:active{transform:scale(.94)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.95)}}
.song .em{font-size:52px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));margin-bottom:auto;padding-top:4px}
.song .nm{font-size:17px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.song .st{font-size:12px;letter-spacing:2px;opacity:.95}
.song .done{position:absolute;top:8px;right:10px;font-size:20px}
.song .new{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;background:#fff;color:#E2445C;border-radius:99px;padding:2px 8px}

/* lesson / concert / echo bars */
#lesson,#concert,#echo{position:absolute;left:50%;top:calc(80px + var(--safe-t));transform:translateX(-50%);display:flex;align-items:center;gap:10px;pointer-events:none;animation:barIn .5s cubic-bezier(.22,1.3,.36,1)}
@keyframes barIn{from{opacity:0;transform:translate(-50%,-14px)}}
.ls-card{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:22px;background:var(--paper);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow);pointer-events:auto;min-width:220px}
body.night .ls-card{background:rgba(32,30,70,.62);color:#fff}
.ls-emoji{font-size:34px;line-height:1}
.ls-tx{flex:1}
.ls-tx b{display:block;font-size:17px;font-weight:800;margin-bottom:6px}
.ls-bar{height:8px;border-radius:99px;background:rgba(43,33,64,.1);overflow:hidden;min-width:150px}
.ls-bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--rainbow);background-size:300px 100%;transition:width .35s cubic-bezier(.34,1.56,.64,1)}
.btn.pill{flex-direction:row;gap:6px;height:54px;padding:0 16px 0 12px;border-radius:27px}
.btn.pill .ic{font-size:24px}
.btn.pill .lb{font-size:15px}
#ecDots{display:flex;gap:6px}
#ecDots i{width:14px;height:14px;border-radius:50%;background:rgba(43,33,64,.12);transition:transform .3s cubic-bezier(.34,1.56,.64,1), background .3s}
#ecDots i.on{background:var(--c);transform:scale(1.25)}
.bird.sing{animation:sing .35s ease}
@keyframes sing{50%{transform:translateY(-6px) rotate(-10deg) scale(1.15)}}

/* the phrase being learnt, as coloured balls with their names and the words underneath */
#score{position:absolute;left:50%;top:calc(146px + var(--safe-t));transform:translateX(-50%);display:flex;align-items:flex-end;gap:6px;padding:12px 18px 10px;
  border-radius:24px;background:rgba(255,253,248,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow);pointer-events:none;max-width:calc(100vw - 200px);
  animation:barIn .5s cubic-bezier(.22,1.3,.36,1)}
body.night #score{background:rgba(32,30,70,.72);color:#fff}
#score .n{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:34px;transition:opacity .3s, transform .35s cubic-bezier(.34,1.56,.64,1)}
#score .b{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font:800 13px var(--round);
  box-shadow:inset 0 -4px 6px rgba(0,0,0,.15), inset 0 4px 6px rgba(255,255,255,.35);transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .3s}
#score .b.y{color:#5B4300}
#score .l{font-size:15px;font-weight:800;height:20px;line-height:20px}
#score .n.done{opacity:.35}
#score .n.now{transform:translateY(-4px);margin:0 7px}
#score .n.now .l{transform:translateY(5px)}
#score .n.now .b{transform:scale(1.32);box-shadow:inset 0 -4px 6px rgba(0,0,0,.15), inset 0 4px 6px rgba(255,255,255,.35), 0 0 0 4px #fff, 0 0 0 7px var(--c), 0 6px 18px var(--c);animation:nowB 1s ease-in-out infinite}
@keyframes nowB{50%{transform:scale(1.42) translateY(-3px)}}
#score .n.long .b{border-radius:17px;width:52px}
@media (max-width:640px){#score .b{width:26px;height:26px;font-size:10px} #score .n{min-width:26px} #score .l{font-size:12px} #score{gap:3px;padding:8px 10px;max-width:calc(100vw - 24px);top:calc(134px + var(--safe-t))}}

/* paint pot */
.pop{position:absolute;top:calc(76px + var(--safe-t));right:calc(14px + var(--safe-r));display:grid;grid-template-columns:repeat(3,58px);gap:12px;padding:16px;border-radius:26px;
  background:var(--paper-solid);box-shadow:0 18px 50px rgba(40,20,70,.28);pointer-events:auto;animation:sheetIn2 .45s cubic-bezier(.22,1.3,.36,1);transform-origin:90% 0}
body.night .pop{background:#24214F}
@keyframes sheetIn2{from{opacity:0;transform:scale(.85)}}
.swatch{width:58px;height:58px;border-radius:50%;background:var(--c);box-shadow:inset 0 -6px 10px rgba(0,0,0,.18), inset 0 6px 10px rgba(255,255,255,.35), 0 4px 10px rgba(0,0,0,.15);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.swatch:active{transform:scale(.88)}
.swatch.on{box-shadow:inset 0 -6px 10px rgba(0,0,0,.18), inset 0 6px 10px rgba(255,255,255,.35), 0 0 0 4px #fff, 0 0 0 7px var(--c)}

/* settings */
.rows{overflow:auto;padding:4px 26px 8px;touch-action:pan-y}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .k{flex:0 0 112px;font-weight:800;font-size:15px}
.row .seg{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.row .seg button{padding:9px 14px;border-radius:14px;background:rgba(43,33,64,.06);font-weight:700;font-size:14px;transition:background .2s, color .2s, transform .2s}
.row .seg button.on{background:var(--ink);color:#fff}
body.night .row .seg button{background:rgba(255,255,255,.08)}
body.night .row .seg button.on{background:#fff;color:#1E1B4B}
.row .d{flex:1 1 100%;font-size:12px;color:var(--ink-soft);padding-left:126px;margin-top:-2px}
@media (max-width:640px){.row .k{flex-basis:100%}.row .d{padding-left:0}.rows{padding:4px 18px 8px}}
.credit{margin:8px 26px 20px;font-size:12px;color:var(--ink-soft);line-height:1.6}

/* intro hint */
#hint{position:fixed;left:50%;bottom:calc(14% + var(--safe-b));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:10px;padding:14px 24px 14px 18px;
  border-radius:30px;background:#fff;box-shadow:0 14px 36px rgba(58,36,92,.25);font-size:20px;font-weight:800;pointer-events:none;animation:hintIn .8s cubic-bezier(.22,1.3,.36,1) both}
#hint .hand{font-size:30px;animation:tapHand 1.4s ease-in-out infinite}
@keyframes hintIn{from{opacity:0;transform:translate(-50%,24px)}}
@keyframes tapHand{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}55%{transform:translateY(2px) scale(.92)}}

#toast{position:absolute;left:50%;bottom:calc(20px + var(--safe-b));transform:translate(-50%,20px);padding:10px 18px;border-radius:18px;background:rgba(43,33,64,.86);color:#fff;font-weight:700;font-size:15px;
  opacity:0;transition:opacity .3s, transform .4s cubic-bezier(.34,1.56,.64,1)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* celebration */
.cheer{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;text-align:center;pointer-events:none;animation:cheer 3.2s cubic-bezier(.22,1.3,.36,1) forwards}
.cheer .big{font-size:96px;line-height:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2));animation:cheerBig 1s cubic-bezier(.34,1.8,.5,1) both}
@keyframes cheerBig{from{transform:scale(0) rotate(-30deg)}}
.cheer .t{display:inline-block;white-space:nowrap;margin-top:10px;padding:10px 30px 12px;border-radius:999px;font-size:34px;font-weight:900;color:#fff;letter-spacing:.08em;
  background:linear-gradient(90deg,#FF4F5E,#FF9A3C 30%,#FFC93B 50%,#3DD68C 70%,#4D7CFE);box-shadow:0 10px 30px rgba(80,30,120,.35), inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 4px rgba(0,0,0,.25)}
.cheer .stars{font-size:38px;letter-spacing:6px;margin-top:4px}
.cheer .stars span{display:inline-block;animation:starPop .5s cubic-bezier(.34,1.8,.5,1) both}
@keyframes starPop{from{transform:scale(0) rotate(-90deg)}}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}

/* small screens: labels go, buttons shrink */
@media (max-width:820px){
  #modes button{padding:0 11px 0 9px;font-size:14px}
  #modes button .ic{font-size:21px}
  .btn.inst,.btn.side{width:60px;height:58px}
  .btn .ic{font-size:24px}
}
@media (max-width:640px){
  #modes button .lb{display:none}
  #modes button{padding:0 12px}
  .btn.round{width:46px;height:46px}
  #nav .arrow{width:44px;height:44px}
  .btn.inst .lb,.btn.side .lb{display:none}
  .btn.inst,.btn.side{width:50px;height:50px;border-radius:16px}
  .btn.pill .lb{display:none}
  .btn.pill{width:50px;padding:0;justify-content:center}
  .ls-card{min-width:0;padding:6px 12px 6px 8px}
  .ls-tx b{font-size:15px}
  .ls-bar{min-width:80px}
  #lesson,#concert,#echo{gap:6px;max-width:calc(100vw - 16px)}
}
@media (max-height:520px){
  #rail,#rail2{gap:6px}
  .btn.inst,.btn.side{width:52px;height:48px}
  .btn.inst .lb,.btn.side .lb{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<canvas id="gl" aria-label="一架可以弹的三角钢琴"></canvas>

<div id="loader" role="status" aria-live="polite">
  <div class="ld-keys" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <h1>彩虹钢琴</h1>
  <p class="ld-sub">七个音，七种颜色</p>
  <div class="ld-bar"><b id="ldBar"></b></div>
  <p class="ld-msg" id="ldMsg">正在搬钢琴…</p>
  <noscript><p class="ld-msg">需要打开 JavaScript 才能弹钢琴</p></noscript>
</div>

<div id="hud" class="hidden">
  <header id="top">
    <a class="btn round" id="homeBtn" href="../" aria-label="回到小画本首页"><span class="ic">🏠</span></a>
    <nav id="modes" role="tablist" aria-label="玩法">
      <i class="thumb" aria-hidden="true"></i>
      <button role="tab" data-mode="free"><span class="ic">🎹</span><span class="lb">自己弹</span></button>
      <button role="tab" data-mode="learn"><span class="ic">⭐</span><span class="lb">跟我弹</span></button>
      <button role="tab" data-mode="listen"><span class="ic">🎧</span><span class="lb">听我弹</span></button>
      <button role="tab" data-mode="echo"><span class="ic">🐦</span><span class="lb">学小鸟</span></button>
    </nav>
    <div class="grow"></div>
    <button class="btn round" id="nightBtn" aria-label="白天 / 夜晚"><span class="ic">🌙</span></button>
    <button class="btn round" id="paintBtn" aria-label="给钢琴换颜色"><span class="ic">🎨</span></button>
    <button class="btn round" id="gearBtn" aria-label="家长设置"><span class="ic">⚙️</span></button>
  </header>

  <div id="bubble" aria-live="polite"></div>

  <aside id="rail" aria-label="乐器">
    <button class="btn inst" data-inst="piano"><span class="ic">🎹</span><span class="lb">钢琴</span></button>
    <button class="btn inst" data-inst="musicbox"><span class="ic">🎁</span><span class="lb">八音盒</span></button>
    <button class="btn inst" data-inst="marimba"><span class="ic">🪵</span><span class="lb">木琴</span></button>
    <button class="btn inst" data-inst="chip"><span class="ic">👾</span><span class="lb">游戏机</span></button>
  </aside>

  <aside id="rail2">
    <button class="btn side" id="viewBtn"><span class="ic">👀</span><span class="lb">看钢琴</span></button>
    <button class="btn side" id="pedalBtn" aria-pressed="false"><span class="ic">🦶</span><span class="lb">踏板</span></button>
    <button class="btn side" id="recBtn"><span class="ic"><i class="dot"></i></span><span class="lb">录下来</span></button>
    <button class="btn side" id="playRecBtn" hidden><span class="ic">▶️</span><span class="lb">听我的</span></button>
  </aside>

  <div id="nav" aria-label="在琴键上移动">
    <button class="btn arrow" id="navL" aria-label="往低音走"><span>◀</span></button>
    <div id="mini"><div id="miniKeys"></div><div id="miniWin"></div><div id="miniAnimals"></div></div>
    <button class="btn arrow" id="navR" aria-label="往高音走"><span>▶</span></button>
  </div>

  <!-- 跟我弹 / 听我弹: pick a song -->
  <section id="shelf" class="sheet" hidden aria-label="选一首歌">
    <div class="sheet-hd"><h2 id="shelfTitle">选一首歌</h2><button class="btn round close" data-close aria-label="关上"><span class="ic">✕</span></button></div>
    <div id="shelfList" class="cards"></div>
  </section>

  <!-- during a lesson -->
  <div id="lesson" hidden>
    <div class="ls-card">
      <span class="ls-emoji" id="lsEmoji">⭐</span>
      <div class="ls-tx"><b id="lsTitle">小星星</b><div class="ls-bar"><i id="lsProg"></i></div></div>
    </div>
    <button class="btn pill" id="lsListen"><span class="ic">👂</span><span class="lb">听一听</span></button>
    <button class="btn pill" id="lsRestart"><span class="ic">🔁</span><span class="lb">从头来</span></button>
    <button class="btn pill" id="lsPick"><span class="ic">🎵</span><span class="lb">换一首</span></button>
  </div>
  <div id="score" hidden aria-label="这一句的音符"></div>

  <!-- during a concert -->
  <div id="concert" hidden>
    <div class="ls-card">
      <span class="ls-emoji" id="ccEmoji">🎵</span>
      <div class="ls-tx"><b id="ccTitle">致爱丽丝</b><div class="ls-bar"><i id="ccProg"></i></div></div>
    </div>
    <button class="btn pill" id="ccPause"><span class="ic">⏸</span><span class="lb">停一下</span></button>
    <button class="btn pill" id="ccNext"><span class="ic">⏭</span><span class="lb">下一首</span></button>
    <button class="btn pill" id="ccPick"><span class="ic">🎵</span><span class="lb">选歌</span></button>
  </div>

  <!-- 学小鸟 -->
  <div id="echo" hidden>
    <div class="ls-card"><span class="ls-emoji bird" id="ecBird">🐦</span><div class="ls-tx"><b id="ecTitle">学小鸟唱歌</b><div id="ecDots"></div></div></div>
    <button class="btn pill" id="ecAgain"><span class="ic">👂</span><span class="lb">再听一遍</span></button>
  </div>

  <div id="paint" class="pop" hidden aria-label="钢琴的颜色"></div>

  <section id="panel" class="sheet" hidden aria-label="家长设置">
    <div class="sheet-hd"><h2>家长设置</h2><button class="btn round close" data-close aria-label="关上"><span class="ic">✕</span></button></div>
    <div class="rows" id="panelRows"></div>
    <p class="credit">钢琴音色：Salamander Grand Piano（Alexander Holm，CC BY 3.0）。曲目均为公有领域的旋律。画面与其它乐器由代码实时生成。</p>
  </section>

  <div id="toast" aria-live="polite"></div>
</div>
<div id="hint" hidden><span class="hand">👆</span><span id="hintTx">点一下，打开钢琴</span></div>
<script type="module" src="app.js?v=9d88fc42"></script>
</body>
</html>
