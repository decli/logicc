<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玩具盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Baloo+2:wght@700;800&display=swap">
<style>
/* 方案 C · 玩具盒: a bento box of soft clay tiles. On the left the child's day (a ring of today's games, stars, stickers);
   on the right one big "go on" tile and the twelve games, filtered by the five groups */
:root{
  --bg:#ECEFF6; --bg2:#E2E7F1; --card:#FFFFFF; --ink:#1F2433; --soft:#6A7287; --line:#D9DEEA; --go:#FF7A45; --go2:#E85A24;
  --display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --num:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 12% 0%,#F7F2FF 0,transparent 40%),radial-gradient(circle at 100% 100%,#E3F4F1 0,transparent 45%),var(--bg);
  color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{position:fixed;inset:0;display:grid;grid-template-columns:clamp(250px,25vw,320px) 1fr;gap:18px;
  padding:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.tile{background:var(--card);border-radius:28px;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(31,36,51,.05),0 14px 28px -18px rgba(31,36,51,.35)}

/* ---------- the left: the child's day ---------- */
.day{display:flex;flex-direction:column;gap:14px;min-height:0}
.hello{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:20px 16px 18px;
  background:linear-gradient(170deg,#FFF6E8 0%,#FFE9F0 100%)}
.hello .who{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:8px}
.hello .who img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}
.hello .who span{font:400 22px/1.1 var(--display);letter-spacing:1px}
.hello .who small{display:block;font:700 13px var(--body);color:var(--soft);letter-spacing:0}
.ring{position:relative;width:min(100%,210px);aspect-ratio:1;margin-top:46px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font:800 58px/1 var(--num)}
.ring b small{font-size:26px;color:var(--soft)}
.ring span{font-size:15px;font-weight:800;color:var(--soft)}
.ring .tick{position:absolute;inset:0}
.hello p{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--soft);text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{display:flex;flex-direction:column;gap:4px;padding:14px 16px;text-align:left}
.stat .k{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--soft)}
.stat .v{font:800 30px/1 var(--num)}
.stat .v small{font-size:17px;color:var(--soft)}
.stat.star .k svg{color:#F2B21B}
.stat.book .k svg{color:#EE5F94}
.stickers{display:flex;gap:2px;font-size:15px;margin-top:2px}
.tools{display:flex;gap:10px}
.tool{flex:1;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;color:var(--ink)}
.tool:active,.stat:active{transform:scale(.97)}

/* ---------- the right: go on, the groups, the games ---------- */
.main{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.hero{flex:none;display:flex;align-items:center;gap:20px;padding:16px 22px 16px 16px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#2FB5A7 0%,#3BC7B0 55%,#7FD8A5 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 30px -18px rgba(25,120,110,.8)}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .big{width:120px;height:120px;flex:none;border-radius:30px;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 10px 20px -10px rgba(0,0,0,.35)}
.hero .big .ic{width:84%;height:84%}
.hero .t{flex:1;min-width:0;text-align:left}
.hero .t small{display:block;font-size:15px;font-weight:800;opacity:.9;letter-spacing:1px}
.hero .t b{display:block;font:400 42px/1.15 var(--display);letter-spacing:2px}
.bar{display:block;height:12px;border-radius:999px;background:rgba(255,255,255,.35);margin-top:10px;overflow:hidden;max-width:360px}
.bar i{display:block;height:100%;border-radius:inherit;background:#fff;min-width:12px}
.hero .t em{display:block;margin-top:6px;font:800 16px var(--num);font-style:normal;opacity:.95}
.play{width:92px;height:92px;flex:none;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;position:relative;z-index:1;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 7px 0 var(--go2),0 16px 24px -8px rgba(232,90,36,.7);animation:breathe 2.4s ease-in-out infinite}
.play:active{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 var(--go2)}
@keyframes breathe{50%{transform:scale(1.05)}}
.chips{flex:none;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 18px;border-radius:22px;font-size:16px;font-weight:800;color:var(--soft);background:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px;
  box-shadow:inset 0 0 0 1.5px var(--line)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:14px}
.game{--c:#3F86E0;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px 14px;text-align:left;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 10%,#fff) 0%,#fff 70%);transition:transform .25s cubic-bezier(.2,1.5,.4,1),opacity .25s,filter .25s}
.game:hover{transform:translateY(-4px)}
.game:active{transform:scale(.96)}
.game .ic{width:clamp(56px,6.2vw,84px);height:clamp(56px,6.2vw,84px);filter:drop-shadow(0 8px 8px color-mix(in srgb,var(--c) 30%,transparent))}
.game .blob{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.1}
.game b{display:block;font-size:clamp(17px,1.7vw,22px);font-weight:900;letter-spacing:.5px;white-space:nowrap}
.game > span:last-child{display:block;width:100%}
.game .m{display:flex;align-items:center;gap:8px;margin-top:6px}
.game .m .bar{flex:1;height:8px;margin:0;background:color-mix(in srgb,var(--c) 15%,#fff)}
.game .m .bar i{background:var(--c)}
.game .m span{font:800 14px var(--num);color:var(--soft);white-space:nowrap}
.game .grp{position:absolute;right:12px;top:12px;font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:3px 9px;border-radius:999px}
.game.dim{opacity:.28;filter:grayscale(.6);pointer-events:none;transform:scale(.97)}
.game.last::before{content:"上次玩";position:absolute;left:12px;bottom:auto;top:12px;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- a phone held upright: the day on top, then go on, the groups, two games a row; it scrolls ---------- */
@media (max-width:760px){
  body{overflow:auto}
  .app{position:static;display:flex;flex-direction:column;gap:14px}
  .hello{flex-direction:row;justify-content:flex-start;gap:16px;padding:16px}
  .hello .who{position:static;flex-direction:column;align-items:flex-start;gap:4px}
  .ring{width:110px;margin:0 0 0 auto}.ring b{font-size:34px}.ring b small{font-size:16px}.ring span{font-size:12px}
  .hello p{display:none}
  .hero{gap:12px;padding:12px 14px 12px 12px}
  .hero .big{width:74px;height:74px;border-radius:20px}
  .hero .t b{font-size:26px}
  .play{width:64px;height:64px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:150px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="day">
    <section class="tile hello">
      <div class="who"><img src="img/panda.webp" alt=""><span id="hi"></span></div>
      <div class="ring" id="ring"></div>
      <p id="left"></p>
    </section>
    <div class="stats">
      <button class="tile stat star"><span class="k"></span><span class="v" id="stars"></span></button>
      <button class="tile stat book"><span class="k"></span><span class="v" id="stk"></span><span class="stickers">🐣🦄🐙🍓🚀</span></button>
    </div>
    <div class="tools">
      <button class="tile tool" id="snd"></button>
      <button class="tile tool" id="gear"></button>
    </div>
  </aside>
  <main class="main">
    <button class="tile hero" id="hero" aria-label="接着玩"></button>
    <nav class="chips" id="chips" aria-label="按类别看"></nav>
    <section class="grid" id="grid"></section>
  </main>
</div>
<script src="shared.js"></script>
<script>
document.getElementById('hi').innerHTML = `${greeting()}，<br>小朋友！<small>今天想玩什么？</small>`;
// the day's ring: six segments, the ones played today filled
(() => {
  const n = TODAY.goal, R = 84, C = 2 * Math.PI * R, seg = C / n, gap = 7;
  let s = '';
  for (let k = 0; k < n; k++) s += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${k < TODAY.done ? 'url(#rg)' : '#EADFD6'}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${seg - gap - 22 + 0.01} ${C}" stroke-dashoffset="${-(k * seg + gap / 2 + 11)}"/>`;
  document.getElementById('ring').innerHTML = `<svg viewBox="0 0 200 200"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A62"/><stop offset="1" stop-color="#FF5F7E"/></linearGradient></defs>${s}</svg>`
    + `<div class="in"><b>${TODAY.done}<small>/${n}</small></b><span>今天玩的关</span></div>`;
  document.getElementById('left').textContent = `再玩 ${n - TODAY.done} 关，今天的圆圈就满啦`;
})();
document.querySelector('.stat.star .k').innerHTML = glyph('star', 18) + '星星';
document.getElementById('stars').textContent = TODAY.stars;
document.querySelector('.stat.book .k').innerHTML = glyph('book', 18) + '贴纸册';
document.getElementById('stk').innerHTML = `${TODAY.stickers}<small>/${TODAY.stickersOf}</small>`;
document.getElementById('snd').innerHTML = glyph('sound', 22) + '读一遍';
document.getElementById('gear').innerHTML = glyph('gear', 22) + '家长';
// go on: the game played last, big
(() => {
  const g = byId(TODAY.last);
  document.getElementById('hero').innerHTML = `<span class="big">${icon(g.id)}</span><span class="t"><small>接着玩</small><b>${g.name}</b>`
    + `<span class="bar"><i style="width:${Math.round(progFrac(g) * 100)}%"></i></span><em>${progText(g)} · ${g.tip}</em></span><span class="play">${glyph('play', 44)}</span>`;
})();
// the groups, as filters
let on = 'all';
function chips() {
  const list = [{ id: 'all', name: '全部', color: '#1F2433' }].concat(GROUPS);
  const c = document.getElementById('chips');
  c.innerHTML = list.map(g => `<button class="chip${on === g.id ? ' on' : ''}" data-g="${g.id}" style="--c:${g.color}">${g.id === 'all' ? '' : '<i></i>'}${g.name}</button>`).join('');
  c.querySelectorAll('.chip').forEach(b => b.onclick = () => { on = b.dataset.g; chips(); filter(); });
}
function grid() {
  document.getElementById('grid').innerHTML = GAMES.map(g => `<button class="tile game${g.id === TODAY.last ? ' last' : ''}" data-g="${g.g}" style="--c:${g.color}">`
    + `<span class="blob"></span><span class="grp">${groupOf(g).name.split(' · ')[0]}</span>${icon(g.id)}`
    + `<span><b>${g.name}</b><span class="m"><span class="bar"><i style="width:${Math.max(4, Math.round(progFrac(g) * 100))}%"></i></span><span>${progText(g)}</span></span></span></button>`).join('');
}
function filter() { document.querySelectorAll('.game').forEach(n => n.classList.toggle('dim', on !== 'all' && n.dataset.g !== on)); }
chips(); grid();
</script>
</body>
</html>
