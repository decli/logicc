<title>造物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: one full-bleed living canvas. Words float over it like inscriptions on a hand scroll:
   seal + controls top-left, vertical calligraphy top-right, story line and hint at the bottom. */
:root{
  --ink:#070a16;            /* the void before the world */
  --paper:#f7f2e6;          /* rice-paper white, for words */
  --paper-dim:rgba(247,242,230,.74);
  --seal:#c8463a;           /* cinnabar seal red */
  --seal-deep:#9e2f26;
  --glass:rgba(10,14,30,.34);
  --glass-hi:rgba(10,14,30,.52);
  --glass-line:rgba(255,255,255,.18);
  --jade:#9fe3c4;           /* x-ray annotation colour */
  --font-brush:"Ma Shan Zheng","STXingkai","STKaiti","KaiTi","Kaiti SC",serif;
  --font-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-ui:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow-text:0 1px 2px rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);}
[hidden]{display:none!important}
body{color:var(--paper);font-family:var(--font-ui);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;}
#world:focus{outline:none}
#world:focus-visible{outline:2px solid rgba(255,236,190,.6);outline-offset:-4px}
#world.grab{cursor:grab}
#world.grabbing{cursor:grabbing}

/* ---------- seal + controls ---------- */
.brand{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:10px;z-index:7;max-width:calc(100% - 120px);}
.brand:not(.world) .wonly{display:none}
.brand .title{opacity:.0;transition:opacity 1.6s ease}
.brand.world .title{opacity:1}
.title{display:flex;align-items:center;gap:10px;}
.title b{font-family:var(--font-brush);font-weight:400;font-size:34px;line-height:1;letter-spacing:.04em;text-shadow:var(--shadow-text);}
.seal{display:grid;place-items:center;width:26px;height:26px;border-radius:4px;background:var(--seal);color:var(--paper);font-family:var(--font-serif);font-size:10px;line-height:1.05;text-align:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);transform:rotate(-4deg);}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;}
.btn .lbl{white-space:nowrap}
.btn.lang{font-family:var(--font-serif);font-weight:600;padding:0 13px;min-width:44px;justify-content:center}
.btn.home{text-decoration:none;padding:0 12px 0 10px}
.btn .badge{font:600 11px/1 var(--font-mono);background:rgba(255,255,255,.18);border-radius:8px;padding:3px 6px;margin-left:2px}
.btn.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.btn[aria-pressed="false"].tog{opacity:.62}
.day{font-family:var(--font-serif);font-size:13px;letter-spacing:.18em;color:var(--paper-dim);text-shadow:var(--shadow-text);margin-left:2px}
.btn{appearance:none;border:1px solid var(--glass-line);background:var(--glass);color:var(--paper);font:500 13px/1 var(--font-ui);letter-spacing:.06em;height:34px;padding:0 13px 0 10px;border-radius:17px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s ease,border-color .2s ease,transform .15s ease;}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{background:var(--glass-hi)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.btn[aria-pressed="true"]{background:rgba(159,227,196,.22);border-color:rgba(159,227,196,.6);color:#e9fff4}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,236,190,.0)}50%{box-shadow:0 0 0 7px rgba(255,236,190,.28)}}

/* ---------- vertical inscription ---------- */
.inscr{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 18px);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:6px;z-index:4;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity 1.4s ease,transform 1.4s ease;}
.inscr.on{opacity:1;transform:none}
.inscr .q{writing-mode:vertical-rl;font-family:var(--font-brush);font-size:clamp(24px,3.4vw,38px);line-height:1.18;letter-spacing:.12em;text-shadow:var(--shadow-text);max-height:58vh;}
.inscr .s{writing-mode:vertical-rl;font-family:var(--font-serif);font-size:12px;letter-spacing:.2em;color:var(--paper-dim);text-shadow:var(--shadow-text);margin-top:10px;}
.inscr .stamp{margin-top:12px;width:20px;height:20px;border-radius:3px;background:var(--seal);opacity:.92;display:grid;place-items:center;font-family:var(--font-serif);font-size:9px;line-height:1;color:var(--paper);writing-mode:horizontal-tb;}

/* ---------- story line + hint ---------- */
.story{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);width:min(680px,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;gap:12px;z-index:5;pointer-events:none;text-align:center;transition:opacity .5s ease;}
body.xray .story{opacity:0}
body.gaming .inscr,body.gaming .story{opacity:0!important}
body.xray .story .skip,body.xray .story .resume{pointer-events:none}
.line{font-family:var(--font-serif);font-weight:600;font-size:clamp(17px,2.3vw,23px);line-height:1.55;letter-spacing:.04em;text-shadow:var(--shadow-text);text-wrap:balance;opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease;}
.line.on{opacity:1;transform:none}
.hint{display:inline-flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.06em;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transform:translateY(8px);transition:opacity .7s ease,transform .7s ease;}
.hint.on{opacity:1;transform:none}
.hint i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffe7a8;box-shadow:0 0 10px #ffe7a8;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.skip{pointer-events:none;appearance:none;border:0;background:none;color:var(--paper-dim);font:13px var(--font-ui);letter-spacing:.08em;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 8px;opacity:0;transition:opacity .6s ease;}
.skip.on{opacity:.85;pointer-events:auto}
.resume{text-decoration:none;font-size:14px;padding:9px 18px;border-radius:999px;background:rgba(255,236,190,.14);border:1px solid rgba(255,236,190,.4);color:var(--paper)}
.resume.on{opacity:1}
.skip:focus-visible{outline:2px solid var(--paper);outline-offset:2px;border-radius:4px}

/* ---------- x-ray card ---------- */
.xcard{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(330px,calc(100% - 32px));padding:14px 16px 13px;border-radius:12px;background:rgba(4,16,14,.72);border:1px solid rgba(159,227,196,.35);color:#dff7ec;font:13px/1.65 var(--font-ui);z-index:6;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease;pointer-events:none;}
.xcard.on{opacity:1;transform:none;pointer-events:auto}
.xcard h3{margin:0 0 6px;font:600 14px/1.3 var(--font-serif);color:var(--jade);letter-spacing:.06em}
.xcard p{margin:0}
.xcard .tag{font-family:var(--font-mono);font-size:11px;color:rgba(159,227,196,.8);margin-top:8px;display:block}
.xcard nav{display:flex;gap:6px;margin-top:10px}
.xcard nav button{appearance:none;border:1px solid rgba(159,227,196,.35);background:transparent;color:#dff7ec;font:12px var(--font-ui);padding:4px 10px;border-radius:12px;cursor:pointer}
.xcard nav button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
/* ---------- english translation under the calligraphy ---------- */
.qen{position:absolute;right:0;top:calc(100% + 10px);width:min(250px,46vw);text-align:right;font:italic 13px/1.5 var(--font-serif);color:var(--paper);text-shadow:var(--shadow-text);writing-mode:horizontal-tb}

/* ---------- action ring ---------- */
.ring{position:fixed;left:0;top:0;display:flex;gap:6px;z-index:8;opacity:0;transition:opacity .2s ease;--bw:60px;will-change:transform}
.ring.on{opacity:1}
.act{appearance:none;border:0;background:none;padding:0;width:var(--bw);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--paper);-webkit-tap-highlight-color:transparent}
.act .ae{display:grid;place-items:center;width:calc(var(--bw) - 8px);height:calc(var(--bw) - 8px);border-radius:50%;background:rgba(255,253,246,.94);box-shadow:0 3px 10px rgba(0,0,0,.25),inset 0 -3px 0 rgba(0,0,0,.08);font-size:calc(var(--bw) * .42);line-height:1;transform:scale(.6);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ring.on .act .ae{transform:none}
.ring.on .act:nth-child(2) .ae{transition-delay:.03s}.ring.on .act:nth-child(3) .ae{transition-delay:.06s}.ring.on .act:nth-child(4) .ae{transition-delay:.09s}.ring.on .act:nth-child(5) .ae{transition-delay:.12s}
.act:active .ae{transform:scale(.9)}
.act:focus-visible .ae{outline:3px solid #ffe7a8;outline-offset:2px}
.act .al{font:600 12px/1.2 var(--font-ui);text-shadow:var(--shadow-text);white-space:nowrap}

/* ---------- sing-with-me ---------- */
.echoBtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:7;appearance:none;border:0;background:rgba(255,253,246,.95);color:#3a2a33;border-radius:999px;display:flex;align-items:center;gap:8px;padding:8px 18px 8px 8px;font:600 15px/1 var(--font-ui);box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;opacity:0;transform:translateY(16px) scale(.9);pointer-events:none;transition:opacity .4s ease,transform .4s cubic-bezier(.3,1.5,.5,1)}
.echoBtn.on{opacity:1;transform:none;pointer-events:auto}
.echoBtn .ee{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#ffe7a8;font-size:22px}
.echoBtn:focus-visible{outline:3px solid #ffe7a8;outline-offset:3px}
.echoBar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-10px);z-index:8;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;border-radius:999px;background:rgba(255,253,246,.95);color:#3a2a33;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .3s ease,transform .3s ease}
.echoBar.on{opacity:1;transform:translate(-50%,0)}
.echoBar b{font:600 16px/1 var(--font-serif)}
.echoDots{display:flex;gap:7px}
.echoDots i{width:13px;height:13px;border-radius:50%;background:#e6dccb;display:block;transition:background .3s ease,transform .3s ease}
.echoDots i.now{background:#ffcf5a;transform:scale(1.25)}
.echoDots i.done{background:#5bb37a}
.echoBar button{appearance:none;border:0;background:#3a2a33;color:#fff;border-radius:999px;padding:8px 14px;font:600 13px/1 var(--font-ui);cursor:pointer}
.echoBar button:focus-visible{outline:3px solid #ffcf5a;outline-offset:2px}

/* ---------- sticker book ---------- */
.book{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,8,18,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .3s ease;padding:16px}
.book.on{opacity:1}
.bookCard{width:min(760px,100%);max-height:calc(100% - 20px);overflow:auto;background:#fffaf0;color:#3a2a33;border-radius:22px;padding:20px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.35);transform:translateY(14px) scale(.97);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.book.on .bookCard{transform:none}
.bookHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.bookHead h2{margin:0;font:400 30px/1.1 var(--font-brush)}
.bookHead p{margin:6px 0 0;font:14px/1.5 var(--font-ui);color:#7a6a63}
.bookHead button{appearance:none;border:0;background:#3a2a33;color:#fff;border-radius:999px;padding:10px 16px;font:600 14px/1 var(--font-ui);cursor:pointer;flex:none}
.bookGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.sticker{appearance:none;border:2px dashed #e7d9c3;background:#fff;border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.sticker .se{font-size:40px;line-height:1.1}
.sticker .sn{font:600 13px/1.25 var(--font-ui);text-align:center;color:#3a2a33}
.sticker:not(.locked){border-style:solid;border-color:#f2c26b;box-shadow:0 3px 0 #f2c26b}
.sticker.locked .se{filter:grayscale(1) brightness(.35) opacity(.45)}
.sticker.locked .sn{color:#b3a59a}
.sticker:focus-visible{outline:3px solid #f2a93b;outline-offset:2px}
.sticker.wiggle{animation:wiggle .45s ease}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.bookTip{min-height:1.6em;margin:12px 2px 0;font:600 16px/1.5 var(--font-serif);color:#5a3f33}
.stickerPop{position:fixed;left:50%;top:42%;z-index:30;font-size:min(22vw,150px);line-height:1;transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .3s ease;pointer-events:none;text-align:center;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.stickerPop.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
.stickerPop.out{transition:transform .6s cubic-bezier(.6,0,.4,1),opacity .6s ease .1s;opacity:0}
.stickerCap{font:600 20px/1.3 var(--font-serif);color:var(--paper);text-shadow:var(--shadow-text);margin-top:8px;white-space:nowrap}

/* ---------- play dock: the little games ---------- */
.dock{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:7;display:flex;flex-direction:column-reverse;gap:8px;opacity:0;transform:translateX(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.3,1.5,.5,1)}
.dock.on{opacity:1;transform:none}
.dk{appearance:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--paper);width:64px;-webkit-tap-highlight-color:transparent}
.dk .di{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:rgba(255,253,246,.94);box-shadow:0 3px 12px rgba(0,0,0,.28),inset 0 -3px 0 rgba(0,0,0,.08);font-size:25px;line-height:1;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s ease}
.dk .dl{font:600 12px/1.15 var(--font-ui);text-shadow:var(--shadow-text);white-space:nowrap}
.dk:hover .di{transform:scale(1.06)}
.dk:active .di{transform:scale(.92)}
.dk:focus-visible .di{outline:3px solid #ffe7a8;outline-offset:2px}
.dock.hello .dk .di{animation:bump .6s ease 3}
.dock.hello .dk:nth-child(2) .di{animation-delay:.1s}.dock.hello .dk:nth-child(3) .di{animation-delay:.2s}.dock.hello .dk:nth-child(4) .di{animation-delay:.3s}
.dk.cur .di{background:#ffe7a8;box-shadow:0 0 0 4px rgba(255,231,168,.45),0 3px 12px rgba(0,0,0,.28)}
#echoBtn:not(.on) .di{background:rgba(255,253,246,.62)}
.modeInfo{display:flex;gap:7px;align-items:center;font:600 13px/1 var(--font-ui);color:#7a6a63;white-space:nowrap}
.modeBar{max-width:calc(100% - 24px)}
.modeBar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.modeInfo i{width:13px;height:13px;border-radius:50%;background:#e6dccb;display:block;transition:background .3s ease,transform .3s ease}
.modeInfo i.now{background:#ffcf5a;transform:scale(1.25)}
.modeInfo i.done{background:#5bb37a}

/* ---------- word card ---------- */
.wcard{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:9;transform:translate(-50%,-12px) scale(.94);opacity:0;transition:opacity .3s ease,transform .35s cubic-bezier(.3,1.5,.5,1);appearance:none;border:0;cursor:pointer;display:flex;align-items:center;gap:16px;padding:14px 22px 14px 16px;border-radius:22px;background:#fffaf0;color:#3a2a33;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 24px);text-align:left}
.wcard.on{opacity:1;transform:translate(-50%,0)}
.wcard .we{font-size:52px;line-height:1;flex:none}
.wcard .wtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.wcard .wz{font:400 40px/1.25 var(--font-brush);letter-spacing:.06em}
.wcard .wz ruby{ruby-position:over}
.wcard .wz rt{font:500 13px/1 var(--font-ui);letter-spacing:.02em;color:#b0573f}
.wcard .wn{font:600 22px/1.2 var(--font-serif);color:#2f6f8f}
.wcard .ws{font:14px/1.45 var(--font-ui);color:#7a6a63;margin-top:4px}
.wcard .ws b{display:block;font-weight:500;color:#9a8a83}

/* ---------- say it: the sentence sheet ---------- */
.sheet{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-14px);opacity:0;z-index:9;width:min(720px,calc(100% - 20px));max-height:calc(76vh - 80px);overflow:auto;overscroll-behavior:contain;background:#fffaf0;color:#3a2a33;border-radius:22px;padding:12px 14px 14px;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:opacity .3s ease,transform .35s cubic-bezier(.3,1.4,.5,1)}
.sheet.on{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{appearance:none;border:2px solid #eadcc6;background:#fff;color:#5a3f33;border-radius:999px;padding:7px 14px;font:600 14px/1 var(--font-ui);cursor:pointer}
.tabs button[aria-selected="true"]{background:#3a2a33;border-color:#3a2a33;color:#fff}
.tabs button:focus-visible{outline:3px solid #f2a93b;outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{appearance:none;border:2px solid #f2c26b;background:#fff;border-radius:16px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#3a2a33;box-shadow:0 3px 0 #f2c26b;min-width:0}
.tile .te{font-size:32px;line-height:1.1}
.tile .sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.tile .tz{font:600 15px/1.2 var(--font-ui)}
.tile .tn{font:12px/1.2 var(--font-ui);color:#7a6a63}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #f2c26b}
.tile:focus-visible{outline:3px solid #f2a93b;outline-offset:2px}
.tile.pick{background:#fff3cf}
.sheet.mini .tabs,.sheet.mini .tiles,.sheet.mini .row{display:none}
.sheet.mini .sent{margin:0;padding:0;border:0}
.sent{margin-top:12px;padding-top:12px;border-top:2px dashed #eadcc6;text-align:center}
.sent .s1{font:600 clamp(22px,4.6vw,30px)/1.35 var(--font-serif)}
.sent .s1 em,.sent .s2 em{font-style:normal;color:#d0523e}
.sent .s2{font:500 16px/1.4 var(--font-serif);color:#5a6f7f;margin-top:2px}
.sent .row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}
.mic{appearance:none;border:0;position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;background:#d0523e;color:#fff;border-radius:999px;padding:10px 20px 10px 12px;font:600 16px/1 var(--font-ui);cursor:pointer;box-shadow:0 4px 0 #9e3a2c}
.mic .mi{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font-size:20px}
.mic .lvl{position:absolute;left:0;bottom:0;height:5px;width:0;background:#ffe7a8;transition:width .08s linear}
.mic.rec{background:#2f8f5b;box-shadow:0 4px 0 #1f6a42;animation:pulse 1.2s ease-in-out infinite}
.mic:disabled{opacity:.5}
.mic:focus-visible,.pill:focus-visible{outline:3px solid #f2a93b;outline-offset:2px}
.pill{appearance:none;border:0;background:#3a2a33;color:#fff;border-radius:999px;padding:12px 18px;font:600 15px/1 var(--font-ui);cursor:pointer}
.pill.ghost{background:transparent;color:#5a3f33;border:2px solid #eadcc6;padding:10px 16px}

/* ---------- draw: the drawing board ---------- */
.pad{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(5,8,18,.38);opacity:0;transition:opacity .3s ease}
.pad.on{opacity:1}
.padTop{display:flex;align-items:center;gap:8px;width:min(760px,100%);background:rgba(255,253,246,.96);color:#3a2a33;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.padTop #padBack{background:transparent;color:#5a3f33;border:2px solid #eadcc6;padding:7px 12px}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(560px,100%);margin:auto 0;overflow:auto}
.theme{appearance:none;border:0;background:#fffaf0;border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#3a2a33;box-shadow:0 5px 0 #e2cfae,0 8px 20px rgba(0,0,0,.2)}
.theme .te{font-size:44px;line-height:1.1}
.theme .tz{font:600 17px/1.2 var(--font-ui)}
.theme .tn{font:13px/1.2 var(--font-ui);color:#7a6a63}
.theme:disabled{opacity:.45}
.theme:active{transform:translateY(3px);box-shadow:0 2px 0 #e2cfae}
.theme:focus-visible{outline:3px solid #ffe7a8;outline-offset:3px}
.board{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.board canvas{background:#fffdf6;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.06);touch-action:none;cursor:crosshair;display:block}
.padBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;width:min(760px,100%);background:rgba(255,253,246,.96);border-radius:24px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.crayon:focus-visible{outline:3px solid #f2a93b;outline-offset:3px}
.tools{display:flex;gap:6px}
.padBar .tools button{background:transparent;color:#5a3f33;border:2px solid #eadcc6;padding:8px 12px}
