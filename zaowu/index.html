/* ---------- fruit ---------- */
const FRUIT_LOOK = {
  peach: { a: '#ffd2a6', b: '#ff7f8c', leaf: '#5aa85a', r: 1 },
  pine: { a: '#b07a4a', b: '#6b4426', cone: true, r: 1.05 },
  maple: { a: '#ff7070', b: '#c81e3a', cherry: true, r: 0.8 },
  willow: { a: '#d8f08a', b: '#79b84a', leaf: '#4f8f3e', r: 0.95 },
  ginkgo: { a: '#ffe58a', b: '#e0a42a', r: 0.72 },
  grape: { a: '#c9a6ff', b: '#6b3fb5', grape: true, r: 1 },
  orange: { a: '#ffc266', b: '#f07f12', leaf: '#4f9a4a', r: 1 },
};
const Fruits = {
  drop(x, y, type, fromSky) {
    if (!world.fruits) world.fruits = [];
    if (world.fruits.length >= 14) world.fruits.shift().gone = true;
    const gy = groundY(x), r = U * 0.017 * (FRUIT_LOOK[type] || FRUIT_LOOK.peach).r;
    const f = { x, y, vx: rand(-25, 25), vy: fromSky ? U * 0.2 : rand(-60, 0), type: FRUIT_LOOK[type] ? type : 'peach', r, rot: rand(-0.4, 0.4), vr: rand(-3, 3), floor: gy + (H - gy) * rand(0.08, 0.5), rest: false, age: 0, claimed: null, sky: fromSky };
    world.fruits.push(f);
    if (fromSky) Sparks.burst(x, 40, 12, { col: '#fff', speed: U * 0.2, g: 0, life: 0.7 });
    return f;
  },
  remove(f) { f.gone = true; const i = world.fruits.indexOf(f); if (i >= 0) world.fruits.splice(i, 1); },
  nearest(x, maxD) {
    let best = null, bd = maxD;
    for (const f of world.fruits || []) { if (f.claimed && world.creatures.includes(f.claimed)) continue; const d = Math.abs(f.x - x); if (d < bd) { bd = d; best = f; } }
    return best;
  },
  update(dt) {
    const F = world.fruits || (world.fruits = []);
    for (let i = F.length - 1; i >= 0; i--) {
      const f = F[i]; f.age += dt;
      if (f.claimed && !world.creatures.includes(f.claimed)) f.claimed = null;
      if (!f.rest) {
        f.vy += U * 1.9 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
        if (f.x < 12 || f.x > W - 12) { f.vx *= -0.6; f.x = clamp(f.x, 12, W - 12); }
        if (f.y >= f.floor) {
          f.y = f.floor;
          if (f.vy > U * 0.25) { f.vy *= -0.32; f.vx *= 0.6; Snd.thump(180 + rand(40), 0.05, 0.12); }
          else { f.vy = 0; f.vx = 0; f.rest = true; }
        }
      }
      if (f.age > 80) { f.fade = (f.fade || 1) - dt * 0.5; if (f.fade <= 0) { f.gone = true; F.splice(i, 1); } }
    }
  },
  draw(c, f) {
    const L = FRUIT_LOOK[f.type], r = f.r;
    c.save(); c.globalAlpha = f.fade === undefined ? 1 : clamp(f.fade, 0, 1);
    c.fillStyle = 'rgba(30,60,40,.2)'; c.beginPath(); c.ellipse(f.x, f.floor + r * 0.9, r * 0.9, r * 0.25, 0, 0, TAU); c.fill();
    c.translate(f.x, f.y); c.rotate(f.rot);
    if (L.grape) {
      c.strokeStyle = '#5a7a3a'; c.lineWidth = Math.max(1, r * 0.12); c.beginPath(); c.moveTo(0, -r * 0.9); c.lineTo(r * 0.15, -r * 1.35); c.stroke();
      const g = c.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.05, 0, 0, r * 1.2); g.addColorStop(0, L.a); g.addColorStop(1, L.b); c.fillStyle = g;
      for (const [dx, dy] of [[-0.42, -0.55], [0.0, -0.6], [0.42, -0.55], [-0.24, -0.12], [0.24, -0.12], [0, 0.32]]) { c.beginPath(); c.arc(dx * r, dy * r, r * 0.3, 0, TAU); c.fill(); }
      c.fillStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.arc(-r * 0.5, -r * 0.65, r * 0.09, 0, TAU); c.fill();
    } else if (L.cherry) {
      c.strokeStyle = '#5a7a3a'; c.lineWidth = Math.max(1, r * 0.12); c.beginPath(); c.moveTo(-r * 0.45, 0); c.quadraticCurveTo(-r * 0.2, -r * 1.3, r * 0.2, -r * 1.5); c.moveTo(r * 0.5, r * 0.1); c.quadraticCurveTo(r * 0.4, -r * 1.1, r * 0.2, -r * 1.5); c.stroke();
      for (const dx of [-0.45, 0.5]) { const g = c.createRadialGradient(dx * r - r * 0.2, -r * 0.2, r * 0.1, dx * r, 0, r * 0.75); g.addColorStop(0, L.a); g.addColorStop(1, L.b); c.fillStyle = g; c.beginPath(); c.arc(dx * r, dx > 0 ? r * 0.1 : 0, r * 0.62, 0, TAU); c.fill(); }
    } else if (L.cone) {
      const g = c.createLinearGradient(0, -r, 0, r); g.addColorStop(0, L.a); g.addColorStop(1, L.b);
      c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, r * 0.72, r * 1.05, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(60,35,15,.6)'; c.lineWidth = Math.max(1, r * 0.08);
      for (let k = -2; k <= 2; k++) { c.beginPath(); c.arc(0, k * r * 0.38, r * 0.6, 0.25, Math.PI - 0.25); c.stroke(); }
    } else {
      const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.1); g.addColorStop(0, L.a); g.addColorStop(1, L.b);
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
      if (f.type === 'peach') { c.strokeStyle = 'rgba(200,70,90,.45)'; c.lineWidth = Math.max(1, r * 0.08); c.beginPath(); c.moveTo(0, -r * 0.9); c.quadraticCurveTo(r * 0.3, 0, 0, r * 0.85); c.stroke(); }
      c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-r * 0.35, -r * 0.42, r * 0.25, r * 0.15, -0.5, 0, TAU); c.fill();
      if (L.leaf) { c.fillStyle = L.leaf; c.beginPath(); c.ellipse(r * 0.35, -r * 0.95, r * 0.45, r * 0.2, -0.5, 0, TAU); c.fill(); }
    }
    c.restore();
  },
};

/* ---------- sticker book ---------- */
const Stickers = (() => {
  const KEY = 'zaowu-stickers-v1';
  let got = new Set(), count = { fly: 0, types: [] }, queue = [], showing = false;
  try { const d = JSON.parse(localStorage.getItem(KEY) || '{}'); got = new Set(d.got || []); Object.assign(count, d.count || {}); } catch (_) { }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ got: [...got], count })); } catch (_) { } };
  const btn = $('#bookBtn'), badge = $('#bookN'), book = $('#book'), grid = $('#bookGrid'), tip = $('#bookTip');
  function paintBadge() { badge.textContent = got.size + '/' + STICKERS.length; }
  function give(id) {
    if (got.has(id) || world.phase !== 'world') return;
    const s = STICKERS.find(q => q.id === id); if (!s) return;
    got.add(id); save(); paintBadge();
    queue.push(s); if (!showing) next();
  }
  function next() {
    const s = queue.shift(); if (!s) { showing = false; return; }
    showing = true;
    const el = document.createElement('div'); el.className = 'stickerPop'; el.textContent = s.e;
    const cap = document.createElement('div'); cap.className = 'stickerCap'; cap.textContent = L('st_' + s.id + '_n'); el.appendChild(cap);
    document.body.appendChild(el);
    Snd.jingle();
    Voice.narrate(L('sticker_got', { name: L('st_' + s.id + '_n') }), 'sticker');
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => {
      const r = btn.getBoundingClientRect(), e = el.getBoundingClientRect();
      el.style.transform = `translate(${r.left + r.width / 2 - (e.left + e.width / 2)}px, ${r.top + r.height / 2 - (e.top + e.height / 2)}px) scale(.2)`;
      el.classList.add('out');
      setTimeout(() => { el.remove(); btn.classList.add('bump'); setTimeout(() => btn.classList.remove('bump'), 500); next(); }, 650);
    }, 1700);
  }
  let tab = 'st';
  function paintTabs() { document.querySelectorAll('#bookTabs button').forEach(b => { b.setAttribute('aria-selected', b.dataset.t === tab ? 'true' : 'false'); b.textContent = L(b.dataset.t === 'st' ? 'book_tab_st' : 'book_tab_words'); }); }
  function openWords() {
    grid.innerHTML = ''; tip.textContent = '';
    $('#bookSub').textContent = L('words_sub', { n: Words.count, m: WORDS.length });
    const en = isEn();
    for (const w of WORDS) {
      const has = Words.has(w.id), b = document.createElement('button');
      b.type = 'button'; b.className = 'sticker' + (has ? '' : ' locked');
      b.innerHTML = `<span class="se">${w.e}</span><span class="sn">${has ? (en ? w.en + '<br>' + w.zh : w.zh + '<br>' + w.en) : '？'}</span>`;
      b.setAttribute('aria-label', has ? w.zh + ' ' + w.en : L('words_locked'));
      b.addEventListener('click', () => {
        if (has) { tip.textContent = en ? w.s[1] : w.s[0]; Voice.seq(en ? [w.en, w.zh, w.s[1]] : [w.zh, w.en, w.s[0]], 'learn'); }
        else { tip.textContent = L('words_locked'); Voice.say(L('words_locked'), { role: 'n', prio: 3 }); }
        b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); Snd.pop(W / 2, 0.1);
      });
      grid.appendChild(b);
    }
  }
  document.querySelectorAll('#bookTabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; paintTabs(); fill(); Snd.pop(W / 2, 0.08); }));
  function fill() { if (tab === 'words') openWords(); else openStickers(); }
  function open(which) {
    if (which) tab = which;
    $('#bookTitle').textContent = L('book_title'); paintTabs(); fill();
    book.hidden = false; requestAnimationFrame(() => book.classList.add('on'));
    Snd.pop(W / 2, 0.12);
    $('#bookClose').focus();
  }
  function openStickers() {
    grid.innerHTML = '';
    $('#bookSub').textContent = L('book_sub', { n: got.size, m: STICKERS.length });
    tip.textContent = '';
    for (const s of STICKERS) {
      const has = got.has(s.id), b = document.createElement('button');
      b.type = 'button'; b.className = 'sticker' + (has ? '' : ' locked');
      b.innerHTML = `<span class="se">${s.e}</span><span class="sn">${has ? L('st_' + s.id + '_n') : '？'}</span>`;
      b.setAttribute('aria-label', has ? L('st_' + s.id + '_n') : L('st_' + s.id + '_h'));
      b.addEventListener('click', () => {
        const text = has ? L('st_tap', { name: L('st_' + s.id + '_n') }) : L('st_' + s.id + '_h');
        tip.textContent = text; Voice.say(text, { role: 'n', prio: 3 });
        b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); Snd.pop(W / 2, 0.1);
      });

  }
  function close() { book.classList.remove('on'); setTimeout(() => { book.hidden = true; }, 300); btn.focus(); }
  btn.addEventListener('click', () => { Snd.init(); open(); });
  onLang(() => { if (!book.hidden) { $('#bookTitle').textContent = L('book_title'); paintTabs(); fill(); } });
  $('#bookClose').addEventListener('click', close);
  book.addEventListener('click', e => { if (e.target === book) close(); });
  book.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  paintBadge();
  return {
    give, has: id => got.has(id), open, close,
    tree(type) { if (!count.types.includes(type)) { count.types.push(type); save(); } give('tree'); if (count.types.length >= 5) give('forest'); },
    fly() { count.fly++; save(); if (count.fly >= 5) give('firefly'); return count.fly; },
    get total() { return got.size; },
  };
})();

/* ---------- the action ring around a creature ---------- */
const Ring = (() => {
  const el = $('#ring'), ACTS = [['sing', '🎵', 'act_sing'], ['feed', '🍑', 'act_feed'], ['color', '🎨', 'act_color'], ['flip', '🤸', 'act_flip'], ['talk', '💬', 'act_talk']];
  let target = null, life = 0;
  const btns = ACTS.map(([id, e, k]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'act'; b.dataset.id = id;
    b.innerHTML = `<span class="ae">${e}</span><span class="al"></span>`;
    b.addEventListener('pointerdown', ev => ev.stopPropagation());
    b.addEventListener('click', ev => { ev.stopPropagation(); act(id); });
    el.appendChild(b); return b;
  });
  function labels() { btns.forEach((b, i) => { b.querySelector('.al').textContent = L(ACTS[i][2]); b.setAttribute('aria-label', L(ACTS[i][2])); }); if (target) el.setAttribute('aria-label', L('act_aria', { name: target.name })); }
  function open(c) {
    if (Echo.active) return;
    const was = target; target = c; life = 7; labels();
    el.hidden = false; position();
    if (was !== c) { el.classList.remove('on'); void el.offsetWidth; }
    el.classList.add('on');
  }
  function close() { if (!target) return; target = null; el.classList.remove('on'); setTimeout(() => { if (!target) el.hidden = true; }, 250); }
  function act(id) {
    const c = target; if (!c) return; life = 7; Snd.init();
    if (id === 'sing') c.sing(); else if (id === 'feed') c.feed(); else if (id === 'color') c.recolor(); else if (id === 'flip') c.flip(); else c.talk();
  }
  function position() {
    const c = target; if (!c) return;
    let top = Infinity; for (let i = 0; i < c.N; i++) top = Math.min(top, c.py[i]);
    const bw = Math.min(64, (W - 24) / 5), rowW = bw * 5;
    let x = clamp(c.comx - rowW / 2, 12, W - rowW - 12), y = top - bw - 34;
    if (y < 70) y = c.comy + c.R + 20;

    el.style.setProperty('--bw', bw + 'px');
  }

    open, close, get target() { return target; },
    update(dt) {
      if (!target) return;
      life -= dt;
      if (life < 0 || !world.creatures.includes(target) || target.grab || Echo.active || (target.sleep && life < 6)) close(); else position();
    },
  };
})();

/* ---------- 跟我唱 · Sing With Me ---------- */
const Echo = (() => {
  const bar = $('#echoBar'), dots = $('#echoDots'), btn = $('#echoBtn');
  const NOTES = [3, 5, 7, 9];        // A3 D4 F#4 B4 — far enough apart to tell by ear
  let active = false, players = [], seq = [], len = 2, idx = 0, phase = 'idle', timers = [], invited = false;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clearT = () => { timers.forEach(clearTimeout); timers = []; };
  const awake = () => world.creatures.filter(c => c.birth >= 1 && !c.sleep && !c.grab && c.flipT <= 0);
  function paintDots() { dots.innerHTML = ''; for (let k = 2; k <= 5; k++) { const d = document.createElement('i'); if (k < len || (k === len && phase === 'won')) d.className = 'done'; else if (k === len) d.className = 'now'; dots.appendChild(d); } }
  function start() {
    Snd.init();
    if (active) { stop(false); return; }
    Learn.stop(true); Draw.close(true); Story.hush();
    const ready = awake();
    if (ready.length < 3) { Voice.narrate(L('echo_need'), 'echo', { prio: 3 }); return; }
    Ring.close();
    players = ready.sort((a, b) => Math.abs(a.comx - W / 2) - Math.abs(b.comx - W / 2)).slice(0, 4).sort((a, b) => a.comx - b.comx);
    players.forEach((c, i) => { c.echo = { deg: NOTES[i] }; c.fruit = null; c.wantFood = false; });
    active = true; len = 2; phase = 'intro'; paintDots();
    $('#echoTitle').textContent = L('echo_title');
    bar.hidden = false; requestAnimationFrame(() => bar.classList.add('on'));
    btn.classList.add('cur');
    Voice.stopAll();
    Voice.say(L('echo_start'), { role: 'n', prio: 3, tag: 'echo', onend: () => later(newRound, 300) });
    later(() => { if (phase === 'intro') newRound(); }, 7000);
  }
  function newRound() {
    if (!active || phase === 'demo') return;
    seq = []; for (let k = 0; k < len; k++) { let i; do { i = randi(0, players.length - 1); } while (k && i === seq[k - 1]); seq.push(i); }
    demo();
  }
  function demo() {
    if (!active) return;
    phase = 'demo'; idx = 0; paintDots();
    Voice.say(L('echo_listen'), { role: 'n', prio: 3, tag: 'echo' });
    const gap = 760;
    seq.forEach((i, k) => later(() => { const c = players[i]; if (c && world.creatures.includes(c)) c.echoSing(); }, 1000 + k * gap));
    later(() => { if (!active) return; phase = 'input'; Voice.say(L('echo_your'), { role: 'n', prio: 3, tag: 'echo' }); }, 1000 + seq.length * gap + 200);
  }
  function tap(c) {
    if (!active || !c.echo) return false;
    if (phase !== 'input') { c.echoSing(); return true; }
    c.echoSing();
    if (c === players[seq[idx]]) {
      idx++;
      if (idx >= seq.length) success();
    } else {
      phase = 'wait';
      later(() => { c.speak('c_echo_oops', null, { prio: 3 }); }, 350);
      later(() => Voice.say(L('echo_again'), { role: 'n', prio: 2, tag: 'echo' }), 1300);
      later(demo, 3300);
    }
    return true;
  }
  function success() {
    phase = 'wait';
    later(() => {
      players.forEach((c, i) => setTimeout(() => { if (world.creatures.includes(c)) { c.happy = 1.2; for (let k = 0; k < c.N; k++) c.vy[k] -= U * 0.6; Snd.boop(Snd.degFreq(NOTES[i] + 2), c.comx, 0.12, 0.3, 1.3); } }, i * 90));
      Sparks.burst(W / 2, H * 0.35, 30, { speed: U * 0.5, g: 0, life: 1, size: U * 0.03 });
    }, 300);
    if (len >= 5) { phase = 'won'; paintDots(); later(win, 900); return; }
    later(() => Voice.say(L('echo_good'), { role: 'n', prio: 3, tag: 'echo' }), 700);
    later(() => { len++; paintDots(); Voice.say(L('echo_more'), { role: 'n', prio: 2, tag: 'echo', onend: () => later(newRound, 250) }); later(() => { if (phase === 'wait') newRound(); }, 5000); }, 2300);
  }
  function win() {
    Stickers.give('echo');
    Voice.say(L('echo_win'), { role: 'n', prio: 3, tag: 'echo' });
    players.forEach((c, i) => setTimeout(() => world.creatures.includes(c) && c.hum(NOTES[i] + 2, true), 800 + i * 220));
    later(() => stop(true), 5200);
  }
  function stop(quiet) {
    clearT(); active = false; phase = 'idle'; btn.classList.remove('cur');
    players.forEach(c => { c.echo = null; }); players = [];
    bar.classList.remove('on'); setTimeout(() => { if (!active) bar.hidden = true; }, 300);
    if (!quiet) Voice.say(L('echo_bye'), { role: 'n', prio: 3, tag: 'echo' });
  }
  btn.addEventListener('click', start);
  $('#echoExit').addEventListener('click', () => stop(false));
  onLang(() => { $('#echoTitle').textContent = L('echo_title'); $('#echoLabel').textContent = L('echo_btn'); $('#echoExit').textContent = L('echo_exit'); });
  return {
    get active() { return active; }, tap, start, stop,
    update() {
      if (active) {
        if (players.some(c => !world.creatures.includes(c))) stop(true);
        return;
      }

    },

})();

/* ---------- catching fireflies ---------- */
const Catch = {
  flying: [],
  at(x, y) {
    if (world.sky.night < 0.45) return false;
    const R = Math.max(36, U * 0.055); let best = null, bd = R;
    for (const f of world.flies) { const d = hypot(f.x - x, f.y - y); if (d < bd) { bd = d; best = f; } }
    if (!best) return false;
    world.flies.splice(world.flies.indexOf(best), 1);
    const r = $('#bookBtn').getBoundingClientRect();
    this.flying.push({ x: best.x, y: best.y, sx: best.x, sy: best.y, tx: r.left + r.width / 2, ty: r.top + r.height / 2, t: 0 });
    const n = Stickers.fly(); Snd.catchFly(n);
    Sparks.burst(best.x, best.y, 10, { speed: U * 0.15, g: 0, life: 0.6, size: U * 0.02 });
    return true;
  },
  update(dt) {
    for (let i = this.flying.length - 1; i >= 0; i--) {
      const f = this.flying[i]; f.t += dt / 0.9;
      const k = easeInOut(f.t), arc = Math.sin(Math.min(1, f.t) * Math.PI) * U * 0.12;
      f.x = lerp(f.sx, f.tx, k); f.y = lerp(f.sy, f.ty, k) - arc;
      if (f.t >= 1) { this.flying.splice(i, 1); $('#bookBtn').classList.add('bump'); setTimeout(() => $('#bookBtn').classList.remove('bump'), 400); }
    }
  },
  draw(c) {
    const img = Sprites.get('fly');
    for (const f of this.flying) { const s = U * 0.03 * (1 - f.t * 0.5); c.globalAlpha = 1; c.drawImage(img, f.x - s, f.y - s, s * 2, s * 2); }
  },
};

/* =====================================================================
   造物 · genesis — 天地混沌如鸡子. An egg of swirling particles;
   tap to crack it, and the light rises into sky while the heavy sinks into earth.
   ===================================================================== */
const Genesis = (() => {
  let P = [], cracks = 0, crackPaths = [], shake = 0, gT = 0, ex = 0, ey = 0, rx = 1, ry = 1, flash = 0;
  const LIGHT = [[255, 226, 170], [255, 240, 205], [255, 200, 140], [250, 250, 235]];
  const HEAVY = [[70, 150, 170], [60, 110, 160], [100, 90, 170], [40, 140, 130]];

  function geom() {
    if (H > W * 1.15) { ex = W / 2; ey = H * 0.56; rx = Math.min(W * 0.3, H * 0.17); ry = rx * 1.3; }
    else { ex = W / 2; ey = H * 0.42; rx = U * 0.19; ry = U * 0.25; }
  }
  function build() {
    geom(); P = [];
    const n = clamp(Math.round((W * H) / 620), 1400, 3600);
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), r = Math.sqrt(Math.random());
      const light = Math.random() < 0.5, ci = randi(0, 3);
      P.push({ x: ex + Math.cos(a) * r * rx, y: ey + Math.sin(a) * r * ry, vx: 0, vy: 0, light, ci: (light ? 0 : 4) + ci, c: (light ? LIGHT : HEAVY)[ci], s: rand(1, 2.2), a: rand(0.5, 1), tx: 0, ty: 0 });
    }
    P.sort((p, q) => p.ci - q.ci);
    trailsReady = false;
  }
  onResize(() => { if (world.phase === 'chaos') build(); else geom(); });

  function curl(x, y, t) {
    const e = 0.5, k = 0.0065;
    const n1 = noise2(x * k, (y + e) * k + t), n2 = noise2(x * k, (y - e) * k + t);
    const n3 = noise2((x + e) * k, y * k + t), n4 = noise2((x - e) * k, y * k + t);
    return [(n1 - n2) / (2 * e), -(n3 - n4) / (2 * e)];
  }

  function updateChaos(dt) {
    const t = world.t, breath = 1 + Math.sin(t * 1.6) * 0.025 + Math.pow(Math.max(0, Math.sin(t * 1.6 * 2)), 12) * 0.03;
    const RX = rx * breath, RY = ry * breath, ptr = world.pointer;
    shake = Math.max(0, shake - dt * 2.5);
    const relax = Math.min(1, dt * 2.6);
    for (const p of P) {
      const [cx, cy] = curl(p.x, p.y, t * 0.12);
      const dx = p.x - ex, dy = p.y - ey;
      // taiji: the light and the heavy swirl against each other
      const sw = p.light ? 1 : -1;
      let tvx = cx * U * 9 - (dy / RY) * sw * U * 0.13, tvy = cy * U * 9 + (dx / RX) * sw * U * 0.13;
      const e = (dx * dx) / (RX * RX) + (dy * dy) / (RY * RY);
      if (e > 0.62) { const d = Math.sqrt(dx * dx + dy * dy) + 1, k = (e - 0.62) * U * 1.1; tvx -= dx / d * k; tvy -= dy / d * k; }
      p.vx += (tvx - p.vx) * relax; p.vy += (tvy - p.vy) * relax;
      if (ptr.active) {
        const qx = p.x - ptr.x, qy = p.y - ptr.y, d2 = qx * qx + qy * qy, R = U * 0.12;
        if (d2 < R * R) { const d = Math.sqrt(d2) + 1, f = (1 - d / R) * U * 6 * dt; p.vx += (qx / d - qy / d * 0.8) * f; p.vy += (qy / d + qx / d * 0.8) * f; }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }

  let trailsReady = false;
  function drawChaos(c) {
    // a translucent wash instead of a clear: particles leave silky trails, like ink in water
    c.fillStyle = trailsReady ? 'rgba(7,10,22,0.16)' : '#070a16'; c.fillRect(0, 0, W, H); trailsReady = true;
    const t = world.t, sx = shake ? rand(-1, 1) * shake * 6 : 0, sy = shake ? rand(-1, 1) * shake * 6 : 0;
    c.save(); c.translate(sx, sy);
    // inner glow of the egg
    const glow = c.createRadialGradient(ex, ey, 0, ex, ey, ry * 1.5);
    const gl = 0.035 + cracks * 0.025 + Math.sin(t * 1.6) * 0.01;
    glow.addColorStop(0, `rgba(255,214,160,${gl})`); glow.addColorStop(0.55, `rgba(120,140,220,${gl * 0.35})`); glow.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = glow; c.fillRect(ex - ry * 1.5, ey - ry * 1.5, ry * 3, ry * 3);
    c.globalCompositeOperation = 'lighter';
    const br = 1 + Math.sin(t * 1.6) * 0.025;
    c.strokeStyle = 'rgba(200,215,255,0.007)'; c.lineWidth = 6;
    c.beginPath(); c.ellipse(ex, ey, rx * 1.02 * br, ry * 1.02 * br, 0, 0, TAU); c.stroke();
    let ci = -1;
    for (const p of P) { if (p.ci !== ci) { ci = p.ci; c.fillStyle = rgba(p.c, p.light ? 0.42 : 0.5); } c.fillRect(p.x, p.y, p.s, p.s); }
    // cracks with light pouring through
    if (crackPaths.length) {
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (const [w, a] of [[9, 0.12], [4, 0.35], [1.6, 1]]) {
        c.strokeStyle = `rgba(255,236,190,${a})`; c.lineWidth = w;
        for (const path of crackPaths) { c.beginPath(); path.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.stroke(); }
      }
    }
    c.restore();
  }

  function addCrack() {
    const path = [];
    const a = rand(-0.5, 0.5) + (cracks % 2 ? Math.PI : 0), len = rx * rand(0.7, 1.1);
    let x = ex + rand(-0.15, 0.15) * rx, y = ey + rand(-0.2, 0.2) * ry; path.push([x, y]);
    for (let i = 0; i < 7; i++) { x += Math.cos(a + rand(-0.7, 0.7)) * len / 7; y += Math.sin(a + rand(-0.7, 0.7)) * len / 7 * 1.2; path.push([x, y]); }
    crackPaths.push(path);
  }

  function tap() {
    if (world.phase !== 'chaos') return;
    Snd.init();
    if (!Story.touched) { Story.firstTouch(); shake = 0.5; Snd.thump(70, 0.35, 0.5); return; }
    cracks++; shake = 1; addCrack(); Snd.crack(cracks);
    for (const p of P) { const dx = p.x - ex, dy = p.y - ey, d = hypot(dx, dy) + 1; p.vx += dx / d * U * 0.22; p.vy += dy / d * U * 0.22; }
    if (cracks >= 3) begin();
    else Story.chaosTap(cracks);
  }

  function begin() {
    if (world.phase !== 'chaos') return;
    Snd.init();
    world.phase = 'genesis'; gT = 0; flash = 1;
    world.time = 0.2;
    Snd.genesis();
    Story.genesis();
    for (const p of P) {
      if (p.light) { p.vx = rand(-0.4, 0.4) * U + (p.x - ex) * 1.2; p.vy = -rand(0.5, 1.5) * U; }
      else { p.vx = (p.x - ex) * rand(1.5, 4); p.vy = rand(0.1, 0.5) * U; p.tx = rand(W); }
    }
  }

  function updateGenesis(dt) {
    gT += dt; flash = Math.max(0, flash - dt * 1.4);
    world.reveal = clamp(gT / 4.6, 0, 1);
    world.time = lerp(0.2, 0.3, easeInOut(clamp((gT - 0.6) / 6.5, 0, 1)));
    for (const p of P) {
      if (p.light) { p.vy -= U * 0.6 * dt; p.vx *= 1 - dt * 0.6; }
      else { p.vy += U * 1.4 * dt; p.vx *= 1 - dt * 1.2; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.a = Math.max(0, p.a - dt * 0.38);
      if (!p.light && p.y > groundY(p.x)) { p.y = groundY(p.x); p.vy *= -0.1; p.a = Math.max(0, p.a - dt * 2); }
    }
    if (gT > 6.8) { world.phase = 'world'; P = []; crackPaths = []; Story.worldReady(); }
  }

  function drawGenesisOverlay(c) {
    c.save(); c.globalCompositeOperation = 'lighter';
    for (const p of P) { if (p.a <= 0.01) continue; c.fillStyle = rgba(p.c, p.a * 0.9); c.fillRect(p.x, p.y, p.s * 1.2, p.s * 1.2); }
    if (flash > 0) {
      const r = U * (0.3 + (1 - flash) * 2.2), g = c.createRadialGradient(ex, ey, 0, ex, ey, r);
      g.addColorStop(0, `rgba(255,250,235,${flash})`); g.addColorStop(1, 'rgba(255,250,235,0)');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    c.restore();
  }

  // how far below its home each mountain layer still is
  function rise(i) { return (1 - easeOutCubic(clamp(world.reveal * 1.5 - i * 0.12, 0, 1))) * H * 0.75; }
  function groundLift() { return (1 - easeOutCubic(clamp(world.reveal * 1.35 - 0.2, 0, 1))) * H * 0.5; }

  return { build, tap, begin, updateChaos, drawChaos, updateGenesis, drawGenesisOverlay, rise, groundLift, get cracks() { return cracks; }, get egg() { return { x: ex, y: ey, rx, ry }; } };
})();

/* =====================================================================
   造物 · story — the guided first walk through the world, told aloud with
   lines from old books. Every step can also happen out of order.
   Lines are stored as keys, so switching language re-tells them.
   ===================================================================== */
const Story = (() => {
  const el = { inscr: $('#inscr'), quote: $('#quote'), src: $('#quoteSrc'), qen: $('#quoteEn'), line: $('#line'), hint: $('#hint'), hintText: $('#hintText'), skip: $('#skip'), brand: $('#brand'), btnX: $('#btnX'), resume: $('#resume') };
  let step = 'chaos', stepT = 0, lastTreeT = -99, toastTimer = 0, lineTimers = [], touched = false;
  const flags = { born: 0, poked: false, flung: false, clouds: 0, rainbow: false, night: false, xray: false, fed: false, chorus: false };
  let dryT = 0, insTok = 0, hintTok = 0;
  let curQ = null, curLine = null, curHint = null;
  const fill = v => (v && v.c ? Object.assign({}, v, { name: v.c.name }) : v);

  function inscribe(q, src, speak = true) {
    curQ = q ? { q, src } : null;
    const tok = ++insTok;
    el.inscr.classList.remove('on');
    setTimeout(() => { if (tok !== insTok) return; paintQuote(); if (q) el.inscr.classList.add('on'); }, 700);
    if (q && speak) Voice.narrate(quoteSpeech(q), 'story');
  }
  function paintQuote() {
    if (!curQ) return;
    const zh = STR[curQ.q][0].split('|');
    el.quote.innerHTML = zh[0] + (zh[1] ? '<br>' + zh[1] : '');
    el.src.textContent = STR[curQ.src][0];
    el.qen.textContent = isEn() ? STR[curQ.q][1] + ' — ' + STR[curQ.src][1] : '';
    el.qen.hidden = !isEn();
  }
  function line(key, vars, o = {}) {
    curLine = key ? { key, vars } : null;
    const text = key ? L(key, fill(vars)) : '';
    lineTimers.forEach(clearTimeout); lineTimers = [];
    lineTimers.push(setTimeout(() => {
      el.line.classList.remove('on');
      lineTimers.push(setTimeout(() => { el.line.textContent = text; if (text) el.line.classList.add('on'); }, 450));
    }, o.delay || 0));
    if (text && o.speak !== false) Voice.narrate(text, o.tag || 'story');
    return text;
  }
  function hint(key, vars, speak = true) {
    curHint = key ? { key, vars } : null;
    const text = key ? L(key, fill(vars)) : '';
    const tok = ++hintTok;
    el.hint.classList.remove('on');
    setTimeout(() => { if (tok !== hintTok) return; el.hintText.textContent = text; if (text) el.hint.classList.add('on'); }, 350);
    if (text && speak) Voice.narrate(text, 'story');
  }
  function toast(text) {
    const prev = curLine, at = step;
    lineTimers.forEach(clearTimeout); lineTimers = [];
    el.line.classList.remove('on');
    lineTimers.push(setTimeout(() => { el.line.textContent = text; el.line.classList.add('on'); }, 350));
    Voice.narrate(text, 'toast');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { if (el.line.textContent === text) { if (step === at && prev && step !== 'done') line(prev.key, prev.vars, { speak: false }); else line(null); } }, 3600);
  }

  function go(next) {
    step = next; stepT = 0;
    Voice.clear('story');
    const S = STEPS[next]; if (S && S.enter) S.enter();
  }

  const STEPS = {
    tree: {
      enter() { inscribe('q_tree', 'q_tree_src'); line('tree_line'); hint('tree_hint'); },
      check() { const n = world.trees.length; return (n >= 2 && world.t - lastTreeT > 4) || (n >= 1 && stepT > 18); }, next: 'cloud',
    },
    cloud: {
      enter() { inscribe('q_rain', 'q_rain_src'); line('cloud_line'); hint('cloud_hint'); },
      update(dt) { if (flags.clouds > 0 && !world.clouds.some(c => c.user && c.rain > 0)) dryT += dt; else dryT = 0; },
      check() { return flags.clouds > 0 && dryT > (flags.rainbow ? 5 : 2) && world.flowers.length > 2; }, next: 'creature',
    },
    creature: {
      enter() { inscribe('q_nuwa', 'q_nuwa_src'); line('creature_line'); hint('creature_hint'); },
      check() { return flags.born > 0 && ((flags.poked || flags.flung) && stepT > 8 || stepT > 40); }, next: 'friends',
    },
    friends: {
      enter() { line('friends_line'); hint('friends_hint'); },
      check() { return (world.creatures.length >= 3 && stepT > 8) || (world.creatures.length >= 2 && stepT > 16) || stepT > 32; }, next: 'shake',
    },
    shake: {
      enter() { line('shake_line'); hint('shake_hint'); },
      check() { return (flags.fed && stepT > 5) || stepT > 35 || !world.trees.length; }, next: 'night',
    },
    night: {
      enter() { inscribe('q_night', 'q_night_src'); line('night_line'); hint('night_hint'); },
      update(dt) { if (stepT > 20 && world.sky.night < 0.7 && !Input.draggingSky) world.speedBoost = 12; },
      check() { return world.sky.night > 0.8; }, next: 'nightfall',
    },
    nightfall: {
      enter() { world.speedBoost = 1; flags.night = true; line('nightfall_line'); hint('nightfall_hint'); },
      check() { return stepT > 14; }, next: 'free',
    },
    free: {
      enter() {
        inscribe('q_one', 'q_one_src');
        line('free_line'); hint('free_hint');
        el.btnX.classList.add('pulse'); el.skip.classList.remove('on');
        setTimeout(() => { if (step === 'free' || step === 'done') line('reveal_line'); }, 12000);
        setTimeout(() => { if (step === 'free') go('done'); }, 24000);
      },
    },
    done: {
      enter() { line(null); hint('done_hint', null, false); setTimeout(() => { if (step === 'done') hint(null); }, 10000); },
    },
  };

  function update(dt) {
    stepT += dt;
    const S = STEPS[step];
    if (S) { if (S.update) S.update(dt); if (S.check && S.check()) go(S.next); }
    if (world.phase === 'world') {
      if (world.sky.night > 0.8) Stickers.give('night');
      if (world.flowers.length >= 30) Stickers.give('flowers');
    }
  }

  onLang(() => {
    paintQuote();
    if (curLine) { el.line.textContent = L(curLine.key, fill(curLine.vars)); }
    if (curHint) { el.hintText.textContent = L(curHint.key, fill(curHint.vars)); }
    Voice.stopAll();
    if (curLine && touched) Voice.narrate(el.line.textContent, 'story');
    if (curHint && touched && step !== 'done') Voice.narrate(el.hintText.textContent, 'story');
  });

  return {
    get step() { return step; },
    start(saved) {
      inscribe('q_chaos', 'q_chaos_src', false);
      line('chaos_line', null, { delay: 600, speak: false });
      setTimeout(() => { if (step === 'chaos' && !touched) hint('chaos_hint', null, false); }, 2600);
      if (saved && el.resume) { el.resume.hidden = false; setTimeout(() => el.resume.classList.add('on'), 2600); }
    },
    // the very first touch unlocks sound, so that is when the narrator starts reading
    firstTouch() {
      if (touched) return; touched = true;
      Voice.unlock();
      Voice.narrate(quoteSpeech('q_chaos'), 'story');
      Voice.narrate(L('chaos_line'), 'story');
      Voice.narrate(L('chaos_hint'), 'story');
      hint('chaos_hint', null, false);
    },
    get touched() { return touched; },
    chaosTap(n) {
      Voice.clear('story');
      if (n === 1) { line('tap1_line'); hint('tap1_hint'); }
      if (n === 2) { line('tap2_line'); hint('tap2_hint'); }
    },
    genesis() {
      step = 'genesis'; touched = true;
      Voice.stopAll();
      if (el.resume) { el.resume.classList.remove('on'); setTimeout(() => (el.resume.hidden = true), 600); }
      inscribe('q_gen', 'q_chaos_src');
      line('gen_line'); hint(null);
    },
    worldReady() {
      Main.showDay();
      el.brand.classList.add('world');
      el.skip.classList.add('on');
      Snd.startPad();
      setTimeout(() => go('tree'), 900);
    },
    resumed() {
      touched = true;
      el.brand.classList.add('world');
      inscribe('q_one', 'q_one_src', false);
      line('welcome_back'); hint('done_hint', null, false);
      setTimeout(() => { if (step === 'done') { line(null); hint(null); } }, 10000);
      Snd.startPad();
      step = 'done';
    },
    skip() {
      if (world.phase === 'chaos') { touched = true; Genesis.begin(); return; }
      world.speedBoost = 1;
      go('free');
    },
    event(kind, arg) {
      if (kind === 'tree') {
        lastTreeT = world.t;
        Stickers.tree(arg && arg.type);
        if (step === 'tree') {
          const n = world.trees.length;
          if (n === 1) { Voice.clear('story'); line('tree1_line'); hint('tree1_hint'); }
          else if (n === 2) { Voice.clear('story'); line('tree2_line'); hint(null); }
        }
      } else if (kind === 'cloud') {
        flags.clouds++; Stickers.give('rain');
        if (step === 'cloud' && flags.clouds === 1) { Voice.clear('story'); line('rain_line'); hint(null); }
      } else if (kind === 'rainbow') {
        flags.rainbow = true; Stickers.give('rainbow');
        if (step === 'cloud' || step === 'creature') line('rainbow_line');
      } else if (kind === 'born') {
        flags.born++; Stickers.give('born');
        if (flags.born === 1) { line('born_line', { c: arg }, { delay: 300 }); hint('born_hint'); }
        else if (step === 'friends' && flags.born === 2) { line('born2_line', { c: arg }); hint(null); }
      } else if (kind === 'poke') {
        if (!flags.poked && (step === 'creature' || step === 'friends')) { Voice.clear('story'); line('poke_line', { c: arg }); hint(null); }
        flags.poked = true;
      } else if (kind === 'fling') {
        if (!flags.flung && (step === 'creature' || step === 'friends')) line('fling_line');
        flags.flung = true;
      } else if (kind === 'fed') {
        flags.fed = true;
      } else if (kind === 'chorus') {
        if (!flags.chorus) { flags.chorus = true; if (['friends', 'shake', 'done', 'night'].includes(step)) toast(L('chorus_toast')); }
      } else if (kind === 'xray') {
        flags.xray = true; el.btnX.classList.remove('pulse'); Stickers.give('xray');
        if (step === 'free') go('done');
      }
    },
    wantsFlowers() { return step === 'cloud'; },
    // a game is starting: stop talking over it
    hush() { Voice.clear('story'); Voice.clear('invite'); clearTimeout(toastTimer); line(null); hint(null); },
    toast,
    update,
  };
})();

/* =====================================================================
   造物 · input — one finger does everything. The world reads the gesture:
   tap ground → tree · tap sky → cloud · closed loop → creature ·
   open stroke in the sky → wind · stroke on the ground → a row of flowers ·
   grab a creature → carry & fling · drag the sun or moon → time
   ===================================================================== */
const Input = (() => {
  const ptr = world.pointer;
  let mode = null, stroke = [], downX = 0, downY = 0, downT = 0, grabbed = null, lastX = 0, lastY = 0, lastMoveT = 0, chaosDist = 0;
  let draggingSky = false;

  function pos(e) { const r = cvs.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

  function down(e) {
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    try { cvs.setPointerCapture(e.pointerId); } catch (_) { }
    const [x, y] = pos(e);
    Object.assign(ptr, { x, y, down: true, active: true, vx: 0, vy: 0 });
    downX = lastX = x; downY = lastY = y; downT = performance.now(); lastMoveT = downT; chaosDist = 0;
    Snd.init(); Voice.unlock();
    if (world.phase === 'chaos') { mode = 'chaos'; return; }
    if (world.phase !== 'world') { mode = null; return; }
    if (Learn.capturing) { mode = 'learn'; return; }
    const cr = Creatures.at(x, y);
    if (cr && Echo.active && cr.echo) { mode = 'echo'; Echo.tap(cr); return; }
    if (Ring.target && Ring.target !== cr) Ring.close();
    if (cr) { mode = 'grab'; grabbed = cr; cr.startGrab(x, y); cvs.classList.add('grabbing'); return; }
    const s = world.sky;
    if ((s.sun.up > 0.2 && hypot(x - s.sun.x, y - s.sun.y) < Math.max(44, U * 0.085)) || (s.moon.up > 0.2 && hypot(x - s.moon.x, y - s.moon.y) < Math.max(44, U * 0.075))) {
      mode = 'sun'; draggingSky = true; Snd.pluck(5, x, 0.15, 0.8); return;
    }
    mode = 'stroke'; stroke = [{ x, y, t: downT }];
  }

  function move(e) {
    const [x, y] = pos(e), now = performance.now(), dtm = Math.max(1, now - lastMoveT) / 1000;
    ptr.vx = lerp(ptr.vx, (x - lastX) / dtm, 0.5); ptr.vy = lerp(ptr.vy, (y - lastY) / dtm, 0.5);
    ptr.x = x; ptr.y = y; ptr.active = true; lastMoveT = now;
    if (mode === 'chaos') chaosDist += hypot(x - lastX, y - lastY);
    else if (mode === 'stroke') { const l = stroke[stroke.length - 1]; if (hypot(x - l.x, y - l.y) > 2.5) stroke.push({ x, y, t: now }); }
    else if (mode === 'sun') {
      world.time = (world.time + (x - lastX) / (W * 0.86) * 0.53 + 1) % 1;
      if (Math.random() < 0.15) Sparks.burst(world.sky.sun.up > 0.2 ? world.sky.sun.x : world.sky.moon.x, world.sky.sun.up > 0.2 ? world.sky.sun.y : world.sky.moon.y, 1, { speed: U * 0.1, g: 0 });
    }
    if (!ptr.down && e.pointerType === 'mouse') updateCursor(x, y);
    lastX = x; lastY = y;
  }

  function updateCursor(x, y) {
    if (world.phase !== 'world') { cvs.className = ''; return; }
    cvs.className = Creatures.at(x, y) ? 'grab' : '';
  }

  function up(e) {
    const [x, y] = pos(e), dur = performance.now() - downT;
    ptr.down = false;
    if (e.pointerType !== 'mouse') ptr.active = false;
    cvs.classList.remove('grabbing');
    const moved = hypot(x - downX, y - downY);
    if (mode === 'chaos') { if (chaosDist > U * 0.12 && Story.touched) Genesis.begin(); else Genesis.tap(); }
    else if (mode === 'grab' && grabbed) {
      if (moved < 10 && dur < 380) { grabbed.grab = null; grabbed.poke(); Ring.open(grabbed); }
      else { grabbed.endGrab(); Ring.close(); }
      grabbed = null;
    } else if (mode === 'sun') { draggingSky = false; }
    else if (mode === 'stroke') classify(stroke, dur);
    else if (mode === 'learn' && moved < Math.max(14, U * 0.03)) Learn.tap(x, y);
    mode = null; stroke = [];
  }

  function cancel() { if (grabbed) { grabbed.endGrab(); grabbed = null; } mode = null; stroke = []; ptr.down = false; ptr.active = false; draggingSky = false; }

  function shoelace(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a.x * b.y - b.x * a.y; } return Math.abs(s / 2); }

  function classify(pts, dur) {
    if (!pts.length) return;
    let L = 0; for (let i = 1; i < pts.length; i++) L += hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    const a = pts[0], b = pts[pts.length - 1], gap = hypot(b.x - a.x, b.y - a.y);
    if (L < 14 && dur < 500) return tap(a.x, a.y);
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
    const area = shoelace(pts), boxA = Math.max(1, bw * bh);
    const closed = gap < Math.max(U * 0.1, L * 0.2);
    const blobby = area > boxA * 0.3 && gap < L * 0.35;
    if (L > U * 0.16 && Math.max(bw, bh) > U * 0.06 && Math.min(bw, bh) > U * 0.025 && ((closed && L > U * 0.22) || (closed && area > (U * 0.045) ** 2) || blobby)) {
      const c = Creatures.spawn(pts);
      return c;
    }
    // open strokes
    const midY = ys.reduce((s, v) => s + v, 0) / ys.length, midX = xs.reduce((s, v) => s + v, 0) / xs.length;
    if (midY > groundY(midX) - U * 0.01) {          // on the ground: a row of flowers
      const n = Math.min(24, Math.floor(L / (U * 0.035)));
      for (let i = 0; i <= n; i++) { const p = pts[Math.floor(i / Math.max(1, n) * (pts.length - 1))]; setTimeout(() => { Flowers.add(p.x + rand(-4, 4), Math.max(p.y, groundY(p.x) + 2)); if (i % 3 === 0) Snd.pluck(5 + (i % 7), p.x, 0.12, 0.8); }, i * 45); }
      Story.event('flowers');
      return;
    }
    const speed = L / Math.max(0.05, dur / 1000);
    if (bw > U * 0.08) Weather.gust(a.x, a.y, b.x, b.y, speed);
  }

  function tap(x, y) {
    if (Catch.at(x, y)) return;
    if (Doodles.tap(x, y)) return;
    for (let i = world.trees.length - 1; i >= 0; i--) { const t = world.trees[i]; if (t.hit(x, y)) { t.shake(false); return; } }
    const gy = groundY(x);
    if (y >= gy - U * 0.012) {
      const ty = clamp(Math.max(y, gy + 2), gy + 2, H - 8);
      plantTree(x, ty);
    } else {
      Weather.addUserCloud(x, y);
      Story.event('cloud'); Creatures.react('cloud');
    }
  }

  function plantTree(x, y, type, seed) {
    const live = world.trees.filter(t => !t.dying);
    if (live.length >= 14) live[0].dying = true;
    const t = new Tree(x, y, type, seed);
    world.trees.push(t);
    Sparks.burst(x, y, 18, { up: true, speed: U * 0.3, g: U * 0.6, life: 0.9, size: U * 0.02 });
    for (let i = 0; i < 5; i++) setTimeout(() => Snd.pluck(clamp(Math.round(x / W * 8), 0, 8) + [0, 2, 4, 5, 7][i], x, 0.2 - i * 0.025, 0.65), 380 + i * 520);
    Story.event('tree', t); setTimeout(() => Creatures.react('tree'), 1800);
    return t;
  }

  function drawStroke(c) {
    if (mode !== 'stroke' || stroke.length < 2) return;
    const a = stroke[0], b = stroke[stroke.length - 1];
    let L = 0; for (let i = 1; i < stroke.length; i++) L += hypot(stroke[i].x - stroke[i - 1].x, stroke[i].y - stroke[i - 1].y);
    const closing = L > U * 0.16 && hypot(b.x - a.x, b.y - a.y) < Math.max(U * 0.1, L * 0.2);
    c.save();
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); stroke.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y));
    if (closing) { c.closePath(); c.fillStyle = 'rgba(255,248,225,.16)'; c.fill(); }
    c.strokeStyle = 'rgba(255,236,190,.35)'; c.lineWidth = 10; c.stroke();
    c.strokeStyle = 'rgba(255,252,240,.95)'; c.lineWidth = 3; c.stroke();
    // the start point: come back here to close the shape
    if (L > U * 0.08) {
      const pulse = 1 + Math.sin(world.t * 8) * 0.15, r = (closing ? 14 : 9) * pulse;
      c.strokeStyle = closing ? 'rgba(255,230,150,.95)' : 'rgba(255,255,255,.6)'; c.lineWidth = 2;
      c.beginPath(); c.arc(a.x, a.y, r, 0, TAU); c.stroke();
    }
    c.restore();
  }

  cvs.addEventListener('pointerdown', down);
  cvs.addEventListener('pointermove', move);
  cvs.addEventListener('pointerup', up);
  cvs.addEventListener('pointercancel', cancel);
  cvs.addEventListener('pointerleave', e => { if (!ptr.down) ptr.active = false; });
  cvs.addEventListener('contextmenu', e => e.preventDefault());

  return { drawStroke, plantTree, tap, get draggingSky() { return draggingSky; }, get mode() { return mode; } };
})();

/* =====================================================================
   造物 · learn — little games for a six-year-old, built on the same world:
   认一认 (tap anything, hear its name in Chinese and English),
   找一找 (I Spy: listen, then find it), 说一说 (pick a sentence, hear it,
   say it to a friend, watch the friend do it). 画一画 lives in draw.js.
   Nothing can be failed; every tap gets an answer.
   ===================================================================== */

/* ---------- what is under the finger? ---------- */
const Look = (() => {
  const TREE_WORD = { peach: 'peach', pine: 'pine', maple: 'maple', willow: 'willow', ginkgo: 'ginkgo' };
  function rainbowHit(x, y) {
    const rb = world.rainbow; if (!rb || rb.a < 0.35 || world.sky.night > 0.6) return false;
    const cx = clamp(W - world.sky.sun.x, W * 0.2, W * 0.8), cy = GROUND + U * 0.08, R0 = U * 0.62, d = hypot(x - cx, y - cy);
    return y < cy && d < R0 + U * 0.03 && d > R0 - U * 0.16;
  }
  function cloudAt(x, y) {
    for (let i = world.clouds.length - 1; i >= 0; i--) {
      const c = world.clouds[i]; if (c.a < 0.3) continue;
      if (Math.abs(x - c.x) < c.w * 0.55 && y > c.y - c.w * 0.38 && y < c.y + c.w * 0.1) return c;
    }
    return null;
  }
  function rainAt(x, y) {
    for (const c of world.clouds) if (c.rain > 0 && Math.abs(x - c.x) < c.w * 0.5 && y > c.y && y < groundY(x)) return c;
    return null;
  }
  // returns { id, obj, x, y } — id is a key of WORD (or 'friend' with obj = creature)
  function at(x, y) {
    const s = world.sky, night = s.night;
    const cr = Creatures.at(x, y); if (cr) return { id: 'friend', obj: cr, x: cr.comx, y: cr.comy };
    const dd = Doodles.at(x, y); if (dd) return { id: Doodles.word(dd), obj: dd, x: dd.x, y: dd.y };
    if (night > 0.45) for (const f of world.flies) if (hypot(f.x - x, f.y - y) < Math.max(30, U * 0.05)) return { id: 'firefly', obj: f, x: f.x, y: f.y };
    for (const b of world.birds) if (hypot(b.x - x, b.y - y) < Math.max(26, U * 0.045)) return { id: 'bird', obj: b, x: b.x, y: b.y };
    for (const f of world.fruits || []) if (hypot(f.x - x, f.y - y) < Math.max(24, f.r * 2.2)) return { id: 'f_' + f.type, obj: f, x: f.x, y: f.y };
    for (let i = world.trees.length - 1; i >= 0; i--) { const t = world.trees[i]; if (!t.dying && t.hit(x, y)) return { id: TREE_WORD[t.type] || 'tree', obj: t, x: t.x, y: t.y - U * 0.15 }; }
    for (let i = world.flowers.length - 1; i >= 0; i--) { const f = world.flowers[i]; if (hypot(f.x - x, f.y - f.h - y) < Math.max(18, f.s * 1.3)) return { id: 'flower', obj: f, x: f.x, y: f.y - f.h }; }
    if (s.sun.up > 0.25 && hypot(x - s.sun.x, y - s.sun.y) < Math.max(44, U * 0.085)) return { id: 'sun', x: s.sun.x, y: s.sun.y };
    if (s.moon.up > 0.25 && hypot(x - s.moon.x, y - s.moon.y) < Math.max(44, U * 0.075)) return { id: 'moon', x: s.moon.x, y: s.moon.y };
    const gy = groundY(x);
    if (y < gy) {
      const rn = rainAt(x, y); if (rn && !cloudAt(x, y)) return { id: 'rain', obj: rn, x, y };
      const cl = cloudAt(x, y); if (cl) return { id: 'cloud', obj: cl, x: cl.x, y: cl.y - cl.w * 0.15 };
      if (rainbowHit(x, y)) return { id: 'rainbow', x, y };
      let ridge = Infinity; for (let i = 0; i < Sky.layers.length; i++) ridge = Math.min(ridge, Sky.ridgeY(i, x));
      if (y > ridge + U * 0.01 && y < gy - U * 0.01) return { id: 'mountain', x, y };
      if (night > 0.55) return { id: 'star', x, y };
      return { id: 'sky', x, y };
    }
    return { id: 'grass', x, y };
  }
  // is there one of these on screen right now? (for I Spy) → a spot to point at, or null
  function where(id) {
    const s = world.sky, night = s.night, live = world.trees.filter(t => !t.dying && t.g >= 0.6);
    const onScreen = o => o.x > 20 && o.x < W - 20 && o.y > 20 && o.y < H - 20;
    switch (id) {
      case 'sun': return s.sun.up > 0.5 && night < 0.4 ? { x: s.sun.x, y: s.sun.y } : null;
      case 'moon': return s.moon.up > 0.5 && night > 0.45 ? { x: s.moon.x, y: s.moon.y } : null;
      case 'star': return night > 0.7 ? { x: W * 0.5, y: H * 0.15 } : null;
      case 'cloud': { const c = world.clouds.find(c => c.a > 0.6 && c.x > c.w * 0.4 && c.x < W - c.w * 0.4); return c ? { x: c.x, y: c.y - c.w * 0.15 } : null; }
      case 'rain': { const c = world.clouds.find(c => c.rain > 2.5 && c.x > 40 && c.x < W - 40); return c ? { x: c.x, y: (c.y + groundY(c.x)) / 2 } : null; }
      case 'rainbow': return world.rainbow.a > 0.6 && night < 0.3 && world.rainbow.life > 6 ? { x: clamp(W - s.sun.x, W * 0.2, W * 0.8), y: GROUND + U * 0.08 - U * 0.55 } : null;
      case 'mountain': return { x: W * 0.5, y: (Sky.ridgeY(2, W * 0.5) + groundY(W * 0.5)) / 2 };
      case 'grass': return { x: W * 0.5, y: (groundY(W * 0.5) + H) / 2 };
      case 'sky': return night < 0.5 ? { x: W * 0.5, y: H * 0.12 } : null;
      case 'flower': { const f = world.flowers.find(f => f.x > 30 && f.x < W - 30); return f ? { x: f.x, y: f.y - f.h } : null; }
      case 'tree': return live.length ? { x: live[0].x, y: live[0].y - U * 0.15 } : null;
      case 'bird': { const b = world.birds.find(onScreen); return b ? { x: b.x, y: b.y } : null; }
      case 'firefly': { const f = night > 0.5 && world.flies.find(onScreen); return f ? { x: f.x, y: f.y } : null; }
    }
    if (TREE_WORD[id]) { const t = live.find(t => t.type === id); return t ? { x: t.x, y: t.y - U * 0.15 } : null; }
    if (id.startsWith('f_')) { const f = (world.fruits || []).find(f => 'f_' + f.type === id && f.rest); return f ? { x: f.x, y: f.y } : null; }
    if (id.startsWith('friend:')) { const k = +id.slice(7), c = world.creatures.find(c => c.birth >= 1 && c.paintIdx === k); return c ? { x: c.comx, y: c.comy } : null; }
    const d = Doodles.find(id); return d ? { x: d.x, y: d.y } : null;
  }
  // does what was tapped answer the question?
  function matches(target, hit) {
    if (target === hit.id) return true;
    if (target === 'tree' && TREE_WORD[hit.id]) return true;
    if (target === 'star' && hit.id === 'sky' && world.sky.night > 0.5) return true;
    if (target === 'rain' && hit.id === 'cloud' && hit.obj && hit.obj.rain > 0) return true;
    if (target.startsWith('friend:') && hit.id === 'friend') return hit.obj.paintIdx === +target.slice(7);
    return false;
  }
  return { at, where, matches };
})();

/* ---------- the word card ---------- */
const WordCard = (() => {
  const el = $('#wcard');
  let cur = null, hideT = 0;
  function ruby(w) {
    const chars = [...w.zh], py = w.py.split(' ');
    return chars.map((c, i) => `<ruby>${c}<rt>${py[i] || ''}</rt></ruby>`).join('');
  }
  function paint() {
    if (!cur) return;
    const w = cur.w, en = isEn();
    $('#wcE').textContent = w.e;
    $('#wcZh').innerHTML = ruby(w);
    $('#wcEn').textContent = w.en;
    $('#wcS').innerHTML = cur.sentence ? (en ? `${w.s[1]}<b>${w.s[0]}</b>` : `${w.s[0]}<b>${w.s[1]}</b>`) : '';
    el.setAttribute('aria-label', w.zh + ' ' + w.en);
  }
  // say the word in both languages (page language first), then the sentence
  function speak(o = {}) {
    if (!cur) return;
    const w = cur.w, en = isEn(), lines = en ? [w.en, w.zh] : [w.zh, w.en];
    if (o.sentence !== false && cur.sentence) lines.push(w.s[en ? 1 : 0]);
    if (o.lead) lines.unshift(o.lead);
    Voice.seq(lines, 'learn', o.onend);
  }
  function show(id, o = {}) {
    const w = WORD[id]; if (!w) return;
    cur = { w, sentence: o.sentence !== false };
    paint();
    el.hidden = false; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    clearTimeout(hideT); if (o.stay === false || o.hideAfter) hideT = setTimeout(hide, o.hideAfter || 3500);
    if (o.speak !== false) speak(o);
  }
  function hide() { clearTimeout(hideT); if (!cur) return; el.classList.remove('on'); setTimeout(() => { if (!el.classList.contains('on')) el.hidden = true; }, 300); cur = null; }
  el.addEventListener('pointerdown', e => e.stopPropagation());
  el.addEventListener('click', () => { Snd.pop(W / 2, 0.08); speak(); });
  onLang(paint);
  return { show, hide, speak, get id() { return cur && cur.w.id; } };
})();

/* ---------- words the child has met (saved in this browser) ---------- */
const Words = (() => {
  const KEY = 'zaowu-words-v1';
  let got = [];
  try { got = JSON.parse(localStorage.getItem(KEY) || '[]').filter(id => WORD[id]); } catch (_) { }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(got)); } catch (_) { } };
  return {
    meet(id) { if (!WORD[id] || got.includes(id)) return false; got.push(id); save(); if (got.length >= 10) Stickers.give('words'); return true; },
    has: id => got.includes(id),
    get count() { return got.length; },
    get list() { return got.slice(); },
  };
})();

/* ---------- a little ring that says "here it is" ---------- */
const Marks = {
  list: [],
  add(x, y, col, life = 1.4) { this.list.push({ x, y, t: 0, life, col: col || '#ffe7a8' }); },
  update(dt) { for (let i = this.list.length - 1; i >= 0; i--) { const m = this.list[i]; m.t += dt; if (m.t > m.life) this.list.splice(i, 1); } },
  draw(c) {
    for (const m of this.list) {
      const k = m.t / m.life, r = U * (0.03 + 0.07 * easeOutCubic(Math.min(1, k * 1.6)));
      c.save(); c.globalAlpha = (1 - k) * 0.95; c.strokeStyle = m.col; c.lineWidth = Math.max(2, U * 0.006);
      c.beginPath(); c.arc(m.x, m.y, r, 0, TAU); c.stroke();
      c.globalAlpha = (1 - k) * 0.5; c.beginPath(); c.arc(m.x, m.y, r * 0.62, 0, TAU); c.stroke(); c.restore();
    }
  },
};

/* ---------- a microphone that only listens when asked ----------
   The recording stays in this page and is thrown away after the
   friend has said it back. */
const Mic = (() => {
  let stream = null, src = null, proc = null, sink = null, chunks = [], state = 'idle', t0 = 0, spoke = 0, quiet = 0, floor = 0.004, cb = null;
  const ok = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.AudioContext || window.webkitAudioContext));
  async function start(o) {
    if (state !== 'idle') return false;
    cb = o; state = 'opening';
    try {
      Snd.init(); const ac = Snd.ctx; if (!ac) throw new Error('no audio');
      if (ac.state === 'suspended') await ac.resume();
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      if (state !== 'opening') { stop(true); return false; }
      src = ac.createMediaStreamSource(stream); proc = ac.createScriptProcessor(2048, 1, 1); sink = ac.createGain(); sink.gain.value = 0;
      src.connect(proc); proc.connect(sink); sink.connect(ac.destination);
      chunks = []; t0 = ac.currentTime; spoke = 0; quiet = 0; floor = 0.004; state = 'rec';
      Snd.duck(true);
      proc.onaudioprocess = e => {
        if (state !== 'rec') return;
        const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
        let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
        const rms = Math.sqrt(s / d.length), t = ac.currentTime - t0, dur = d.length / ac.sampleRate;
        if (t < 0.35) floor = Math.max(floor, rms * 1.2);
        const loud = rms > Math.max(0.018, floor * 2.5);
        if (cb && cb.level) cb.level(clamp(rms * 9, 0, 1));
        if (loud) { spoke += dur; quiet = 0; } else if (spoke > 0.25) quiet += dur;
        if ((spoke > 0.3 && quiet > 0.95) || t > 7 || (spoke === 0 && t > 5.5)) finish();
      };
      return true;
    } catch (err) { state = 'idle'; release(); if (cb && cb.fail) cb.fail(err); return false; }
  }
  function release() {
    try { if (proc) { proc.onaudioprocess = null; proc.disconnect(); } if (src) src.disconnect(); if (sink) sink.disconnect(); } catch (_) { }
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = src = proc = sink = null;
    Snd.duck(false);
  }
  function finish() {

})();

/* =====================================================================
   造物 · draw — 画一画. Pick something to draw, draw it with crayons,
   and it comes to life in the world: a sun climbs into the sky, a cloud
   drifts (and rains when tapped), a flower takes root, a hat lands on a
   friend's head. The shape is read back to the child in words:
   圆圆的 round · 尖尖的 pointy · 长长的 long · 弯弯的 curly …
   ===================================================================== */

/* ---------- a drawing turned into a picture ---------- */
const Sketch = {
  // strokes: [{ c: crayon index, w: width (0..1 of the board), p: [x0,y0,x1,y1,…] in 0..1 board units }]
  pack(strokes) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, wmax = 0;
    for (const s of strokes) { wmax = Math.max(wmax, s.w); for (let i = 0; i < s.p.length; i += 2) { x0 = Math.min(x0, s.p[i]); x1 = Math.max(x1, s.p[i]); y0 = Math.min(y0, s.p[i + 1]); y1 = Math.max(y1, s.p[i + 1]); } }
    const pad = wmax * 0.6; x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
    const bw = Math.max(1e-3, x1 - x0), bh = Math.max(1e-3, y1 - y0), m = Math.max(bw, bh);
    return {
      a: Math.round(bw / bh * 1000) / 1000,
      box: [x0, y0, bw, bh],
      s: strokes.map(s => [s.c, Math.round(s.w / m * 1000), s.p.map((v, i) => Math.round((i % 2 ? (v - y0) / bh : (v - x0) / bw) * 1000))]),
    };
  },
  render(data, size = 220) {
    const a = data.a || 1, w = a >= 1 ? size : Math.max(8, Math.round(size * a)), h = a >= 1 ? Math.max(8, Math.round(size / a)) : size, m = Math.max(w, h);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;

/* ---------- drawings living in the world ---------- */
const Doodles = (() => {
  const SKY = ['sun', 'cloud', 'bird', 'star', 'free'], WORDOF = { sun: 'sun', cloud: 'cloud', flower: 'flower', house: 'house', bird: 'bird', star: 'star', free: 'picture' };

    else if (d.t === 'star') { d.tx = rand(W * 0.08, W * 0.92); d.ty = H * rand(0.07, 0.26); }
    else if (d.t === 'cloud') { d.tx = rand(W * 0.15, W * 0.85); d.ty = Math.min(H * rand(0.16, 0.3), GROUND - U * 0.35); }
    else if (d.t === 'bird') { d.tx = rand(W * 0.2, W * 0.8); d.ty = Math.min(H * rand(0.14, 0.34), GROUND - U * 0.3); d.vx = (Math.random() < 0.5 ? -1 : 1) * U * 0.11; }
    else if (d.t === 'free') { d.tx = rand(W * 0.12, W * 0.88); d.ty = Math.min(H * rand(0.14, 0.32), GROUND - U * 0.3); }
    else { // on the ground: away from the trees if possible
      let x = rand(W * 0.08, W * 0.92);
      for (let k = 0; k < 12; k++) { if (!world.trees.some(t => Math.abs(t.x - x) < U * 0.08) && !list().some(o => o !== d && !SKY.includes(o.t) && Math.abs(o.x - x) < U * 0.1)) break; x = rand(W * 0.08, W * 0.92); }

    if (L.length >= 14) L.shift();

      if (d.t === 'cloud') { d.x += (world.gust * U * 0.25 + world.wind * 6 + 5) * dt; if (d.x > W + U * 0.2) d.x = -U * 0.2; if (d.x < -U * 0.2) d.x = W + U * 0.2; d.ty = d.y; }

      cuckooT -= dt;
      if (cuckooT < 0) { if (world.time > 0.26 && world.time < 0.4 && world.trees.length) Snd.cuckoo(rand(W)); cuckooT = rand(14, 26); }
      // night: a music-box lullaby when it gets dark, then an owl from time to time
      if (n > 0.75 && !wasNight) { wasNight = true; if (!lullabyNight) { lullabyNight = true; setTimeout(() => Snd.lullaby(), 2500); } }
      if (n < 0.3 && wasNight) { wasNight = false; lullabyNight = false; }
      owlT -= dt;
      if (owlT < 0) { if (n > 0.7 && world.trees.length) Snd.owl(rand(W)); owlT = rand(18, 34); }
      if (n > 0.6 && Math.random() < dt * 1.6 * n) Snd.cricket(rand(W));
    },
  };
})();

/* ---------- the frame ---------- */
let lastT = performance.now(), saveT = 0, birdT = 0, fpsAcc = 0, fpsN = 0, slowFrames = 0;
const drawList = [];

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt <= 0) return;
  dt = Math.min(dt, 1 / 24);
  world.t += dt; world.dt = dt;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { world.stats.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; adaptQuality(); }

  if (world.phase === 'chaos') { Genesis.updateChaos(dt); Genesis.drawChaos(ctx); Story.update(dt); Echo.update(); return; }
  if (world.phase === 'genesis') Genesis.updateGenesis(dt);
  else if (!Input.draggingSky) world.time = (world.time + dt * world.daySpeed * world.speedBoost) % 1;

  checkDawn();
  Sky.update(dt); Sky.updateAmbient(dt);
  Clock.update(dt);
  Weather.update(dt);
  for (let i = world.trees.length - 1; i >= 0; i--) { const t = world.trees[i]; t.update(dt); if (t.dying && t.fade <= 0) world.trees.splice(i, 1); }
  Petals.update(dt); Sparks.update(dt); Birds.update(dt); Flies.update(dt);
  Creatures.update(dt);
  Fruits.update(dt); Catch.update(dt); Ring.update(dt); Echo.update();
  Doodles.update(dt); Draw.update(dt); Learn.update(dt);
  Story.update(dt);
  Music.update(dt);

  // birds come once there are trees to come for
  birdT -= dt;
  if (world.phase === 'world' && birdT < 0 && world.trees.length >= 2 && world.birds.length < 6 && world.sky.night < 0.4) { Birds.spawn(randi(8, 15)); birdT = rand(25, 50); }
  saveT += dt; if (saveT > 6) { saveT = 0; Save.write(); }

  render();
}

function render() {
  const inGen = world.phase === 'genesis';
  const skyA = inGen ? smooth(0.05, 0.55, world.reveal) : 1;
  const rise = inGen ? Genesis.rise : null;
  const glift = inGen ? Genesis.groundLift() : 0;
  if (skyA < 1) { ctx.fillStyle = '#070a16'; ctx.fillRect(0, 0, W, H); }
  Sky.drawSky(ctx, skyA);
  Sky.drawStars(ctx, skyA);
  Sky.drawSunMoon(ctx, skyA);
  Sky.drawLandscape(ctx, rise);
  Weather.drawClouds(ctx);
  Doodles.drawSky(ctx);
  Birds.draw(ctx);

  // foreground: ground and everything living on it, then tinted by the hour
  fctx.clearRect(0, 0, W, H);
  Sky.drawGround(fctx, glift);
  drawList.length = 0;
  for (const t of world.trees) drawList.push({ y: t.y, o: t, k: 0 });
  for (const f of world.flowers) drawList.push({ y: f.y, o: f, k: 1 });
  for (const c of world.creatures) drawList.push({ y: c.floor(c.comx) + 0.5, o: c, k: 2 });
  for (const f of world.fruits || []) drawList.push({ y: f.rest ? f.floor : Math.min(f.y, f.floor), o: f, k: 3 });
  for (const d of Doodles.ground) drawList.push({ y: d.y, o: d, k: 4 });
  drawList.sort((a, b) => a.y - b.y);
  for (const d of drawList) { if (d.k === 1) Flowers.draw(fctx, d.o); else if (d.k === 3) Fruits.draw(fctx, d.o); else if (d.k === 4) Doodles.drawGround(fctx, d.o); else d.o.draw(fctx); }
  Petals.draw(fctx);
  Sparks.draw(fctx, 'fg');
  const s = world.sky;
  if (s.tintA > 0.01) {
    fctx.globalCompositeOperation = 'source-atop';
    fctx.fillStyle = rgba(s.tint, s.tintA * 0.82); fctx.fillRect(0, 0, W, H);
    fctx.globalCompositeOperation = 'source-over';
  }
  ctx.drawImage(fg, 0, 0, W, H);

  Weather.drawRain(ctx);
  Weather.drawStreaks(ctx);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const c of world.creatures) c.drawGlow(ctx);
  Flies.draw(ctx);
  Catch.draw(ctx);
  Sparks.draw(ctx, 'glow');
  ctx.restore();
  Sparks.draw(ctx, 'text');
  for (const c of world.creatures) c.drawBubble(ctx);
  Doodles.drawFlying(ctx); Draw.drawFlying(ctx); Marks.draw(ctx);
  Input.drawStroke(ctx);
  if (inGen) Genesis.drawGenesisOverlay(ctx);
  if (world.xray) XRay.draw(ctx);
}

function adaptQuality() {
  if (world.stats.fps < 38 && DPR > 1) { slowFrames++; if (slowFrames > 3) { maxDPR = Math.max(1, DPR - 0.5); slowFrames = 0; resize(); } }
  else slowFrames = 0;
}

/* ---------- controls ---------- */
const Prefs = (() => {
  let p = { snd: true, voi: true };
  try { Object.assign(p, JSON.parse(localStorage.getItem('zaowu-prefs') || '{}')); } catch (_) { }
  // inside 思维小画本 (logicc), follow the parent's settings for sound and reading aloud
  if (typeof BUILD !== 'undefined' && BUILD.logicc) {
    try { const r = JSON.parse(localStorage.getItem('logicc.design.v2') || 'null'); if (r) { if (typeof r.voi === 'boolean') p.voi = r.voi; if (typeof r.snd === 'boolean' && typeof r.mus === 'boolean') p.snd = r.snd || r.mus; } } catch (_) { }
  }
  return { get: k => p[k], set(k, v) { p[k] = v; try { localStorage.setItem('zaowu-prefs', JSON.stringify(p)); } catch (_) { } } };
})();
function paintControls() {
  const sOn = Snd.on, vOn = Voice.on;
  $('#btnS').setAttribute('aria-pressed', sOn); $('#sLabel').textContent = L(sOn ? 'ui_sound' : 'ui_mute'); $('#sWave').style.opacity = sOn ? 1 : 0.15;
  $('#btnV').setAttribute('aria-pressed', vOn); $('#vLabel').textContent = L(vOn ? 'ui_voice' : 'ui_voice_off'); $('#vDots').style.opacity = vOn ? 1 : 0.15;
  $('#btnL').textContent = L('ui_lang'); $('#btnL').setAttribute('aria-label', L('ui_lang_aria'));
  $('#xLabel').textContent = L('ui_xray'); $('#bookLabel').textContent = L('ui_book'); $('#homeLabel').textContent = L('ui_home');
  $('#skip').textContent = L('ui_skip'); $('#resume').textContent = L('ui_resume'); $('#bookClose').textContent = L('ui_close');
  $('#echoLabel').textContent = L('echo_btn'); $('#echoExit').textContent = L('echo_exit');
  $('#echoBtn').setAttribute('aria-label', L('echo_btn'));
  cvs.setAttribute('aria-label', L('canvas_aria'));
  ['btnS', 'btnV', 'btnX', 'bookBtn', 'homeBtn'].forEach(id => { const b = $('#' + id); const l = b.querySelector('.lbl'); if (l) b.setAttribute('aria-label', l.textContent); });
}
$('#btnS').addEventListener('click', () => { const v = !Snd.on; Snd.setOn(v); Prefs.set('snd', v); paintControls(); });
$('#btnV').addEventListener('click', () => { const v = !Voice.on; Voice.on = v; Prefs.set('voi', v); paintControls(); Snd.init(); if (v) Voice.say(L('voice_on'), { role: 'n', prio: 3 }); });
$('#btnL').addEventListener('click', () => { Snd.init(); Voice.unlock(); setLang(isEn() ? 'zh' : 'en'); });
onLang(lang => { paintControls(); Main.showDay(); Voice.load(lang); });
$('#skip').addEventListener('click', () => { Snd.init(); Voice.unlock(); Story.skip(); });
$('#resume').addEventListener('click', e => { e.stopPropagation(); Snd.init(); Voice.unlock(); const d = Save.read(); if (d) { world.phase = 'world'; Save.restore(d); } });
if (typeof BUILD !== 'undefined' && BUILD.home) { const h = $('#homeBtn'); h.href = BUILD.home; h.hidden = false; h.addEventListener('click', () => { try { Save.write(); } catch (_) { } }); }
Snd.setOn(Prefs.get('snd') !== false); Voice.on = Prefs.get('voi') !== false;
// some browsers (iPad Safari) only let sound start from a finished tap, so try again on every tap end
['touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => Snd.init(), { passive: true }));
document.documentElement.lang = isEn() ? 'en' : 'zh-CN';
paintControls();

// keyboard: a way in without a pointer
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.target.closest && e.target.closest('button') && (k === ' ' || k === 'enter')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (world.phase === 'chaos') { if (k === ' ' || k === 'enter') { Snd.init(); Genesis.tap(); } return; }
  if (world.phase !== 'world') return;
  if (k === 't') { const x = rand(W * 0.08, W * 0.92), gy = groundY(x); Input.plantTree(x, gy + rand(0.05, 0.6) * (H - gy)); }
  else if (k === 'c') { Snd.init(); Weather.addUserCloud(rand(W * 0.15, W * 0.85), rand(H * 0.15, GROUND - U * 0.35)); Story.event('cloud'); }
  else if (k === 'b') { Snd.init(); const cx = rand(W * 0.2, W * 0.8), cy = H * 0.3, r = U * rand(0.05, 0.09), pts = []; const sd = rand(100); for (let i = 0; i < 40; i++) { const a = i / 40 * TAU, rr = r * (1 + 0.35 * noise2(Math.cos(a) * 0.9 + sd, Math.sin(a) * 0.9)); pts.push({ x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr * 1.1 }); } Creatures.spawn(pts); }
  else if (k === 'n') world.time = (world.time + 0.08) % 1;
  else if (k === 'x') XRay.toggle();
  else if (k === 'l') setLang(isEn() ? 'zh' : 'en');
  else if (k === 'arrowleft' || k === 'arrowright') { const d = k === 'arrowleft' ? -1 : 1; Weather.gust(W / 2 - d * U * 0.3, H * 0.3, W / 2 + d * U * 0.3, H * 0.3, U * 3); }
});

/* ---------- go ---------- */
window.addEventListener('resize', () => resize());
resize();
Genesis.build();
Clock.on(n => {
  Creatures.tick(n);
  // trees take turns singing, more often when there are more of them
  const grown = world.trees.filter(t => t.g >= 1 && !t.dying);
  if (grown.length && n % 2 === 0 && Math.random() < Math.min(0.55, 0.12 + grown.length * 0.06) * (1 - world.sky.night * 0.5)) {
    const t = pick(grown), deg = clamp(Math.round(t.x / W * 9), 0, 9) + pick([0, 0, 2, 3, 5]);
    Snd.play(Snd.INSTRUMENT[t.type], deg, t.x, 0.13); t.pulse = 1;
  }
  if (n % 32 === 0) Snd.stepPad(world.sky.night);
});
Story.start(!!Save.read());
Voice.load(I18N.lang);
requestAnimationFrame(t => { lastT = t; frame(t); });

// for the curious: open the console and play with window.zaowu
window.zaowu = { world, Creatures, Input, Weather, XRay, Story, Snd, Sky, Voice, Stickers, Echo, Ring, Fruits, Learn, Draw, Doodles, Words, Look, Sketch, Mic, WORD, PAINTS, DRAW_THEMES, SAYS, setLang, render };

})();
</script>
</body></html>
