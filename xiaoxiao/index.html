    // the other tune next (the same one again if the other has not loaded)
    const other = this.order[(this.order.indexOf(name) + 1) % this.order.length];
    this.timer = setTimeout(() => { if (this.cur === me) this.loop(Snd.clip(other) ? other : name, Math.max(c.currentTime + 0.05, end - X), X); }, Math.max(0, (end - X - c.currentTime - 0.5) * 1000));
  },
};

// 动物消消乐 · the voices. Every Chinese line is pre-recorded (voice.bin|json next to the page, made with edge-tts by
// ../../dev/voice/build.py xiaoxiao) by 晓晓 like the rest of 思维小画本; the English cheers are decli's recordings in
// sound/. The device's own speech is never used (decli: it sounds stiff): a line missing from the bank stays silent,
// and ?debug lists it in the console so it can be added to lines.js and recorded.
const Voice = { on: true, last: '', busy: false };
(() => {
  let bank = null, state = 'idle', loadP = null, clip = null, gen = 0, tries = 0;
  const bufs = new Map(), debug = /[?&]debug\b/.test(location.search);
  const fnv = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); };
  Voice.load = function () {
    if (state !== 'idle') return loadP;
    if (!window.fetch || location.protocol === 'file:') { state = 'failed'; return (loadP = Promise.resolve()); }
    state = 'loading';
    loadP = fetch('voice.json').then(r => (r.ok ? r.json() : Promise.reject(r.status)))
      .then(ix => fetch('voice.bin' + (ix.h ? '?h=' + ix.h : '')).then(r => (r.ok ? r.arrayBuffer() : Promise.reject(r.status))).then(bin => { bank = { map: ix.u, bin }; state = 'ready'; }))
      .catch(() => {   // tried again a few times (a new version still going up, a bad connection)
        state = 'failed';
        if (++tries < 5) setTimeout(() => { state = 'idle'; Voice.load(); }, [2000, 5000, 10000, 20000][tries - 1]);
      });
    return loadP;
  };
  const entry = (role, t) => {
    const e = bank && bank.map[fnv(role + '|' + t)];
    if (!e && bank && debug) console.warn('voice: not recorded: ' + role + '|' + t);
    return e;
  };
  const decode = e => {
    const got = bufs.get(e[0]);
    if (got) return Promise.resolve(got);
    return new Promise((res, rej) => {
      try { const q = Snd.ctx.decodeAudioData(bank.bin.slice(e[0], e[0] + e[1]), res, rej); if (q && q.catch) q.catch(rej); } catch (err) { rej(err); }
    }).then(b => { bufs.set(e[0], b); if (bufs.size > 40) bufs.delete(bufs.keys().next().value); return b; });
  };
  function stopClip() { const c = clip; clip = null; if (c) { try { c.onended = null; c.stop(); } catch (_) { } } }
  function done(g, onend) { if (g !== gen) return; Voice.busy = false; Snd.duck(false); if (onend) onend(); }
  Voice.stop = function () { gen++; stopClip(); Voice.busy = false; Snd.duck(false); };

  // say a Chinese line; the newest line wins. o.onend runs when it has been said (or skipped).
  Voice.say = function (t, o = {}) {
    if (!t) return;
    Voice.last = t;
    if (!Voice.on) { if (o.onend) setTimeout(o.onend, 200); return; }
    const g = ++gen;
    const go = () => {
      if (g !== gen) return;
      const e = entry('n', t);
      if (e && Snd.ctx) play(e, g, o); else setTimeout(() => done(g, o.onend), 300);
    };
    if (state === 'loading') { let went = false; const once = () => { if (!went) { went = true; go(); } }; loadP.then(once); setTimeout(once, 2500); }
    else go();
  };
  // an English cheer (decli's recording): does not interrupt the narrator, plays over the music with a bit of room
  Voice.cheer = function (word) {
    const buf = Voice.on && word && Snd.ctx && Snd.clip(CHEER_CLIP[word]);
    if (!buf) return;
    const c = Snd.ctx, src = c.createBufferSource(), gn = c.createGain();
    src.buffer = buf; gn.gain.value = 1.1;
    src.connect(gn); gn.connect(Snd.voice); gn.connect(Snd.verb);
    src.start();
  };
  Voice.repeat = () => Voice.say(Voice.last);

  function play(e, g, o) {
    decode(e).then(buf => {
      if (g !== gen) return;
      stopClip();
      const c = Snd.ctx, src = c.createBufferSource(), gn = c.createGain();
      gn.gain.value = 1.05; src.buffer = buf; src.connect(gn); gn.connect(Snd.voice);
      src.onended = () => { if (clip !== src) return; clip = null; done(g, o.onend); };
      clip = src; src.start(); Voice.busy = true; Snd.duck(true);
    }).catch(() => done(g, o.onend));
  }
})();

// 动物消消乐 · made by dev/heads.py: the sprite sheet heads.webp, and each head's width and height in it (its cell is
// 216 px square, the head in the middle), in the order of FRIENDS (lines.js).
const HEADS = { cell: 216, cols: 10, size: [[164,141],[162,143],[160,141],[173,178],[161,140],[160,138],[208,136],[137,184],[148,154],[153,144],[158,131],[162,138],[149,142],[154,141],[142,142],[168,149],[129,164],[154,153],[148,148],[131,144],[166,136],[188,143],[195,151],[157,161],[173,172],[157,163],[163,140],[208,136],[146,144],[155,129],[152,160],[161,137],[177,143],[171,137],[150,140],[164,139],[158,142],[188,147],[187,134],[146,138],[175,129],[150,133],[162,151],[174,148],[182,140],[162,146],[157,147],[184,153],[187,142],[147,152],[139,115],[149,110],[122,125],[150,106],[133,116],[116,133],[136,124],[113,129],[110,137],[116,133],[127,139],[112,124],[124,133],[123,134],[135,134],[143,125],[138,136],[142,132],[135,117],[134,125]] };

// 动物消消乐 · drawing the pieces, the cell layers (ice, gift boxes, bubbles) and the little sprites the effects use.
// Everything that does not move is drawn once into a canvas the size it will appear on screen (re-made on resize).
const Art = {
  img: null, dpr: 1, cell: 0, T: 0, tiles: [], white: [], cache: {},
  // decli's animal heads, one sprite sheet (made by dev/heads.py; HEADS in heads.js gives each head's size). A failed
  // download is tried again: the start screen waits for the first three tries, later ones go on in the background and
  // the pictures replace the coloured balls from the next game on.
  load() {
    return new Promise(res => {
      let k = 0;
      const get = () => {
        const im = new Image();
        im.onload = () => { this.img = im; res(); };
        im.onerror = () => { k++; if (k === 3) res(); if (k < 6) setTimeout(get, [1000, 2500, 5000, 10000, 20000][k - 1]); };
        im.src = 'heads.webp' + (k ? '?try=' + k : '');
      };
      get();
    });
  },
  canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; },
  rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  },
  // FRIENDS[i]'s head drawn into x centred on (cx, cy), scaled so its longer side is fit pixels
  friendTo(x, i, cx, cy, fit) {
    const [w, h] = HEADS.size[i], C = HEADS.cell, f = fit / Math.max(w, h);
    if (!this.img) {   // the picture did not load: a coloured ball
      const col = Cast.FX[FRIENDS[i].fam[0]];
      x.fillStyle = col[0]; x.strokeStyle = col[1]; x.lineWidth = fit * 0.05;
      x.beginPath(); x.arc(cx, cy, fit * 0.42, 0, 7); x.fill(); x.stroke();
      return;
    }
    const sx = (i % HEADS.cols) * C + (C - w) / 2, sy = Math.floor(i / HEADS.cols) * C + (C - h) / 2;
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    x.drawImage(this.img, sx, sy, w, h, cx - w * f / 2, cy - h * f / 2, w * f, h * f);
  },
  friend(i, s, fit) { const c = this.canvas(s, s); this.friendTo(c.getContext('2d'), i, s / 2, s / 2, fit); return c; },
  // the board's kinds (this game's six ANIMALS, then the penguin) as FRIENDS numbers
  kindHead(k) { return k < ANIMALS.length ? ANIMALS[k].h : FRIENDS.findIndex(f => f.id === 'penguin'); },
  // an animal head (k 0-5, 6 = penguin) into a square canvas of side s, for a cell cellPx wide
  head(k, s, cellPx) { return this.friend(this.kindHead(k), s, cellPx * 0.9); },
  setCell(cell, dpr) {
    const cast = ANIMALS.map(a => a.h).join() + (this.img ? '' : '?');   // the pieces change with the game's animals too
    if (cell === this.cell && dpr === this.dpr && cast === this.cast && this.tiles.length) return;
    this.cell = cell; this.dpr = dpr; this.cast = cast;
    const D = cell * dpr, T = this.T = Math.ceil(D * 1.3);
    this.tiles = []; this.white = [];
    for (let k = 0; k < 7; k++) {
      const t = this.head(k, T, D);
      this.tiles.push(t);
      const w = this.canvas(T, T), x = w.getContext('2d');
      x.drawImage(t, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, T, T);
      this.white.push(w);
    }
    this.cache = {};
    this.cache.stripeH = this.stripes(T, D, 'h');
    this.cache.stripeV = this.stripes(T, D, 'v');
    this.cache.ring = this.ringTile(T, D);
    this.cache.orb = this.orbTile(T, D);
    this.cache.ice1 = this.iceTile(D, 1); this.cache.ice2 = this.iceTile(D, 2);
    this.cache.box1 = this.boxTile(D, 1); this.cache.box2 = this.boxTile(D, 2);
    this.cache.bub = this.bubbleTile(T, D);
  },
  stripes(T, D, dir) {
    const c = this.canvas(T, T), x = c.getContext('2d'), m = T / 2, r = D * 0.42;
    x.save(); x.beginPath(); x.arc(m, m, r, 0, 7); x.clip();
    x.fillStyle = 'rgba(255,255,255,0.62)';
    for (const o of [-0.26, 0, 0.26]) {
      if (dir === 'h') x.fillRect(m - r, m + o * D - D * 0.05, 2 * r, D * 0.1);
      else x.fillRect(m + o * D - D * 0.05, m - r, D * 0.1, 2 * r);
    }
    x.restore();
    // arrows on both ends
    x.fillStyle = '#fff'; x.strokeStyle = 'rgba(74,43,94,.85)'; x.lineWidth = D * 0.035; x.lineJoin = 'round';
    const tri = (cx, cy, ang) => {
      x.save(); x.translate(cx, cy); x.rotate(ang); x.beginPath(); x.moveTo(D * 0.11, 0); x.lineTo(-D * 0.06, -D * 0.1); x.lineTo(-D * 0.06, D * 0.1); x.closePath(); x.stroke(); x.fill(); x.restore();
    };
    if (dir === 'h') { tri(m + D * 0.5, m, 0); tri(m - D * 0.5, m, Math.PI); }
    else { tri(m, m + D * 0.5, Math.PI / 2); tri(m, m - D * 0.5, -Math.PI / 2); }
    return c;
  },
  ringTile(T, D) {
    const c = this.canvas(T, T), x = c.getContext('2d'), m = T / 2;
    // a golden eight-point star behind the head
    x.save(); x.translate(m, m);
    const g = x.createRadialGradient(0, 0, D * 0.2, 0, 0, D * 0.62);
    g.addColorStop(0, '#fff6b0'); g.addColorStop(0.6, '#ffc61a'); g.addColorStop(1, '#ff9d00');
    x.fillStyle = g; x.strokeStyle = '#c27c00'; x.lineWidth = D * 0.03; x.lineJoin = 'round';
    x.beginPath();
    for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = i % 2 ? D * 0.44 : D * 0.6; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    x.closePath(); x.fill(); x.stroke();
    x.restore();
    return c;
  },
  orbTile(T, D) {
    const c = this.canvas(T, T), x = c.getContext('2d'), m = T / 2, r = D * 0.42;
    const hues = ['#ff4f6d', '#ff9d3a', '#ffd23a', '#5fe07a', '#3ac8ff', '#7b6bff', '#e05fff'];
    for (let i = 0; i < 14; i++) {
      x.beginPath(); x.moveTo(m, m); x.arc(m, m, r, i * Math.PI / 7, (i + 1) * Math.PI / 7 + 0.01); x.closePath();
      x.fillStyle = hues[i % 7]; x.fill();
    }
    const g = x.createRadialGradient(m - r * 0.3, m - r * 0.35, r * 0.05, m, m, r);
    g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.35, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(m, m, r, 0, 7); x.fill();
    x.lineWidth = D * 0.045; x.strokeStyle = '#fff'; x.beginPath(); x.arc(m, m, r, 0, 7); x.stroke();
    x.lineWidth = D * 0.02; x.strokeStyle = 'rgba(74,43,94,.6)'; x.beginPath(); x.arc(m, m, r + D * 0.03, 0, 7); x.stroke();
    return c;
  },
  iceTile(D, n) {
    const c = this.canvas(D, D), x = c.getContext('2d'), p = D * 0.04;
    const g = x.createLinearGradient(0, 0, D, D);
    if (n === 1) { g.addColorStop(0, 'rgba(225,246,255,0.95)'); g.addColorStop(1, 'rgba(150,215,255,0.9)'); }
    else { g.addColorStop(0, 'rgba(160,215,255,0.98)'); g.addColorStop(1, 'rgba(70,150,235,0.95)'); }
    this.rr(x, p, p, D - 2 * p, D - 2 * p, D * 0.16); x.fillStyle = g; x.fill();
    x.lineWidth = D * 0.04; x.strokeStyle = n === 1 ? 'rgba(255,255,255,0.95)' : 'rgba(230,245,255,0.95)'; x.stroke();
    x.strokeStyle = 'rgba(255,255,255,0.8)'; x.lineWidth = D * 0.035; x.lineCap = 'round';
    x.beginPath(); x.moveTo(D * 0.16, D * 0.36); x.lineTo(D * 0.36, D * 0.16); x.moveTo(D * 0.16, D * 0.56); x.lineTo(D * 0.56, D * 0.16); x.stroke();
    if (n === 2) {   // a snowflake in the corner says "two layers"
      x.save(); x.translate(D * 0.8, D * 0.8); x.strokeStyle = '#fff'; x.lineWidth = D * 0.03;
      for (let i = 0; i < 3; i++) { x.rotate(Math.PI / 3); x.beginPath(); x.moveTo(-D * 0.1, 0); x.lineTo(D * 0.1, 0); x.stroke(); }
      x.restore();
    }
    return c;
  },
  boxTile(D, n) {
    const c = this.canvas(D, D), x = c.getContext('2d'), p = D * 0.07, w = D - 2 * p;
    const body = n === 1 ? ['#ffb3d6', '#ff6fae', '#c42c70'] : ['#c9a6ff', '#8b5cff', '#5328c9'];
    const rib = n === 1 ? ['#ffffff', '#f3d9ea'] : ['#ffe680', '#ffb000'];
    const g = x.createLinearGradient(0, p, 0, D - p); g.addColorStop(0, body[0]); g.addColorStop(1, body[1]);
    this.rr(x, p, p + D * 0.08, w, w - D * 0.08, D * 0.12); x.fillStyle = g; x.fill();
    x.lineWidth = D * 0.04; x.strokeStyle = body[2]; x.stroke();
    // lid
    this.rr(x, p - D * 0.02, p + D * 0.06, w + D * 0.04, D * 0.2, D * 0.08); x.fillStyle = body[0]; x.fill(); x.stroke();
    // ribbon
    x.fillStyle = rib[0]; x.strokeStyle = rib[1]; x.lineWidth = D * 0.02;
    x.fillRect(D / 2 - D * 0.07, p + D * 0.06, D * 0.14, w - D * 0.06); x.strokeRect(D / 2 - D * 0.07, p + D * 0.06, D * 0.14, w - D * 0.06);
    if (n === 2) { x.fillRect(p, D * 0.58, w, D * 0.12); }
    // bow
    x.fillStyle = rib[0]; x.strokeStyle = n === 1 ? '#e7a7c8' : '#c27c00'; x.lineWidth = D * 0.03;
    for (const s of [-1, 1]) { x.beginPath(); x.ellipse(D / 2 + s * D * 0.12, p + D * 0.04, D * 0.13, D * 0.08, s * 0.5, 0, 7); x.fill(); x.stroke(); }
    x.beginPath(); x.arc(D / 2, p + D * 0.06, D * 0.06, 0, 7); x.fill(); x.stroke();
    return c;
  },
  bubbleTile(T, D) {
    const c = this.canvas(T, T), x = c.getContext('2d'), m = T / 2, r = D * 0.49;
    const g = x.createRadialGradient(m, m, r * 0.55, m, m, r);
    g.addColorStop(0, 'rgba(180,235,255,0.05)'); g.addColorStop(0.8, 'rgba(160,220,255,0.35)'); g.addColorStop(1, 'rgba(120,200,255,0.65)');
    x.fillStyle = g; x.beginPath(); x.arc(m, m, r, 0, 7); x.fill();
    x.lineWidth = D * 0.035; x.strokeStyle = 'rgba(255,255,255,0.9)'; x.stroke();
    x.fillStyle = 'rgba(255,255,255,0.85)';
    x.beginPath(); x.ellipse(m - r * 0.45, m - r * 0.5, r * 0.22, r * 0.12, -0.7, 0, 7); x.fill();
    x.beginPath(); x.arc(m + r * 0.5, m + r * 0.45, r * 0.06, 0, 7); x.fill();
    return c;
  },

  // ---------- drawing on the board (ctx in CSS pixels) ----------
  // p: piece, (x, y) centre, sc scale, t clock ms, flash 0..1 white
  piece(ctx, p, x, y, sc, t, flash, sx, sy) {
    const s = this.T / this.dpr * sc, cell = this.cell;
    const w = s * (sx || 1), h = s * (sy || 1);
    if (p.k === 'g') { ctx.drawImage(this.tiles[PENGUIN], x - w / 2, y - h / 2, w, h); return; }
    if (p.s === 'c') {
      const pul = 1 + Math.sin(t / 180) * 0.04;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; const gl = Fx.dot('#ffffff');
      ctx.globalAlpha = 0.55 + Math.sin(t / 150) * 0.2; ctx.drawImage(gl, x - cell * 0.75, y - cell * 0.75, cell * 1.5, cell * 1.5); ctx.restore();
      ctx.save(); ctx.translate(x, y); ctx.rotate(t / 700); ctx.scale(pul, pul);
      ctx.drawImage(this.cache.orb, -w / 2, -h / 2, w, h); ctx.restore();
      // sparkles orbiting
      for (let i = 0; i < 3; i++) {
        const a = t / 400 + i * 2.1, rr = cell * 0.44;
        Fx.drawStar(ctx, x + Math.cos(a) * rr, y + Math.sin(a) * rr, cell * (0.08 + 0.03 * Math.sin(t / 120 + i)), '#fff');
      }
      if (flash > 0) { ctx.globalAlpha = flash; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, cell * 0.42 * sc, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
      return;
    }
    if (p.s === 'b') {
      ctx.save(); ctx.translate(x, y); ctx.rotate(t / 900); const pul = 1 + Math.sin(t / 160) * 0.06; ctx.scale(pul * sc, pul * sc);
      ctx.drawImage(this.cache.ring, -this.T / this.dpr / 2, -this.T / this.dpr / 2, this.T / this.dpr, this.T / this.dpr); ctx.restore();
    }
    if (p.s === 'h' || p.s === 'v') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 + 0.25 * Math.sin(t / 140);
      const gl = Fx.dot(ANIMALS[p.c].fx[0]); ctx.drawImage(gl, x - cell * 0.7, y - cell * 0.7, cell * 1.4, cell * 1.4); ctx.restore();
    }
    ctx.drawImage(this.tiles[p.c], x - w / 2, y - h / 2, w, h);
    if (p.s === 'h' || p.s === 'v') {
      const wob = 1 + Math.sin(t / 120) * 0.05;
      ctx.drawImage(p.s === 'h' ? this.cache.stripeH : this.cache.stripeV, x - w * wob / 2, y - h * wob / 2, w * wob, h * wob);
    }
    if (flash > 0) { ctx.globalAlpha = Math.min(1, flash); ctx.drawImage(this.white[p.c], x - w / 2, y - h / 2, w, h); ctx.globalAlpha = 1; }
  },
  // a small picture of a goal, for the side panel and the cards
  goalIcon(g, px) {
    const c = this.canvas(px, px), x = c.getContext('2d');
    if (g.t === 'c' || g.t === 'pg') {
      const k = g.t === 'pg' ? PENGUIN : g.color, h = this.head(k, px * 1.15, px * 0.92);
      x.drawImage(h, -px * 0.075, -px * 0.075);
    } else if (g.t === 'ice') x.drawImage(this.iceTile(px, 1), 0, 0);
    else if (g.t === 'box') x.drawImage(this.boxTile(px, 1), 0, 0);
    else if (g.t === 'bub') { x.drawImage(this.head(1, px, px * 0.8), 0, 0); x.drawImage(this.bubbleTile(px, px * 0.86), 0, 0); }
    return c;
  },
};

// 动物消消乐 · the flashy part: bursts of shards and stars, light beams, lightning, shock rings, the big English cheer,
// pieces flying to the goal panel, confetti, screen shake. Drawn on its own canvas above everything (#fx).
const Fx = {
  cv: null, ctx: null, dpr: 1, W: 0, H: 0, parts: [], items: [], dots: {}, stars: {},
  shakeA: 0, shakeT: 0, shakeD: 1, flashA: 0, flashC: '#fff',
  init(cv) { this.cv = cv; this.ctx = cv.getContext('2d'); },
  resize(W, H, dpr) {
    this.W = W; this.H = H; this.dpr = dpr;
    this.cv.width = Math.round(W * dpr); this.cv.height = Math.round(H * dpr);
    this.cv.style.width = W + 'px'; this.cv.style.height = H + 'px';
  },
  dot(color) {
    if (this.dots[color]) return this.dots[color];
    const c = Art.canvas(64, 64), x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return (this.dots[color] = c);
  },
  star(color) {
    if (this.stars[color]) return this.stars[color];
    const c = Art.canvas(48, 48), x = c.getContext('2d');
    x.translate(24, 24); x.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 9 : 21; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    x.closePath(); x.fillStyle = color; x.fill(); x.lineWidth = 3; x.strokeStyle = '#fff'; x.stroke();
    return (this.stars[color] = c);
  },
  drawStar(ctx, x, y, r, color) {   // a four-point twinkle
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
  },

  part(o) { if (this.parts.length < 900) this.parts.push(Object.assign({ t: 0, g: 0, rot: 0, vr: 0, s1: 0, a: 1, drag: 0.985 }, o)); },
  // a piece bursting: shards of its colour, glowing dots and a few stars
  burst(x, y, cols, n, power, cell) {
    const P = power || 1, c = cell || 60;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.12 + Math.random() * 0.32) * P * c / 60;
      this.part({ kind: 'shard', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.12, g: 0.0009, life: 500 + Math.random() * 400, size: c * (0.07 + Math.random() * 0.08), color: cols[i % 2], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.03 });
    }
    for (let i = 0; i < Math.ceil(n / 2); i++) {
      const a = Math.random() * Math.PI * 2, v = (0.05 + Math.random() * 0.2) * P * c / 60;
      this.part({ kind: 'img', img: this.dot(cols[0]), add: true, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 380 + Math.random() * 300, size: c * (0.35 + Math.random() * 0.3), s1: c * 0.05 });
    }
    for (let i = 0; i < 2 + Math.floor(P); i++) {
      const a = Math.random() * Math.PI * 2, v = (0.1 + Math.random() * 0.2) * c / 60;
      this.part({ kind: 'img', img: this.star(pick(['#ffd23a', '#ffffff', cols[0]])), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.1, g: 0.0006, life: 700 + Math.random() * 300, size: c * (0.22 + Math.random() * 0.15), s1: c * 0.05, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.02 });
    }
  },
  sparkles(x, y, n, spread, color) {
    for (let i = 0; i < n; i++) this.part({ kind: 'twinkle', x: x + rnd(-spread, spread), y: y + rnd(-spread, spread), vx: 0, vy: -0.02, life: 400 + Math.random() * 500, size: rnd(5, 12), color: color || '#fff', delay: Math.random() * 300 });
  },
  ring(x, y, color, r0, r1, dur, lw) {
    this.items.push({ t: 0, dur, draw(ctx, k) {
      const e = Ease.out(k);
      ctx.globalAlpha = 1 - k; ctx.lineWidth = (lw || 10) * (1 - k * 0.7); ctx.strokeStyle = color;
      ctx.beginPath(); ctx.arc(x, y, lerp(r0, r1, e), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    } });
  },
  // a beam of light along a row or column, out from (x, y) to the board's edges
  beam(x, y, dir, color, rect, wide) {
    const w0 = wide ? 0.62 : 0.5;
    this.items.push({ t: 0, dur: 520, add: true, draw(ctx, k) {
      const grow = Ease.out(Math.min(1, k / 0.45)), fade = k < 0.45 ? 1 : 1 - (k - 0.45) / 0.55;
      const cell = rect.cell, th = cell * w0 * (0.6 + 0.4 * fade);
      ctx.globalAlpha = fade;
      if (dir === 'h') {
        const L = Math.max(x - rect.x, rect.x + rect.w - x) * grow + cell;
        let g = ctx.createLinearGradient(0, y - th, 0, y + th);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, color); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(x - L, y - th, 2 * L, 2 * th);
        ctx.fillStyle = '#fff'; ctx.fillRect(x - L, y - th * 0.18, 2 * L, th * 0.36);
      } else {
        const L = Math.max(y - rect.y, rect.y + rect.h - y) * grow + cell;
        let g = ctx.createLinearGradient(x - th, 0, x + th, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, color); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(x - th, y - L, 2 * th, 2 * L);
        ctx.fillStyle = '#fff'; ctx.fillRect(x - th * 0.18, y - L, th * 0.36, 2 * L);
      }
      ctx.globalAlpha = 1;
    } });
    // sparks running out along the beam
    for (let i = 0; i < 18; i++) {
      const v = rnd(0.4, 1.0) * rect.cell / 60, s = i % 2 ? 1 : -1;
      this.part({ kind: 'img', img: this.dot(color), add: true, x, y, vx: dir === 'h' ? s * v : rnd(-0.05, 0.05), vy: dir === 'v' ? s * v : rnd(-0.05, 0.05), life: 450, size: rect.cell * 0.5, s1: 0, drag: 0.99 });
    }
  },
  // jagged lightning from the rainbow ball to a target; redrawn every few frames so it crackles
  bolt(x1, y1, x2, y2, color, delay) {
    let pts = null, last = -1;
    this.items.push({ t: -(delay || 0), dur: 420, add: true, draw(ctx, k, t) {
      if (t < 0) return;
      const f = Math.floor(t / 50);
      if (f !== last || !pts) {
        last = f; pts = [[x1, y1]];
        const n = 7, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
        for (let i = 1; i < n; i++) { const o = rnd(-1, 1) * len * 0.08; pts.push([x1 + dx * i / n + nx * o, y1 + dy * i / n + ny * o]); }
        pts.push([x2, y2]);
      }
      const reach = Math.min(1, t / 120), m = Math.max(1, Math.round(reach * (pts.length - 1)));
      ctx.globalAlpha = 1 - k * k; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      for (const [w, c] of [[9, color], [3, '#fff']]) {
        ctx.lineWidth = w; ctx.strokeStyle = c; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i <= m; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } });
  },
  // "+60" floating up from where points were made
  text(x, y, str, size, color) {
    this.items.push({ t: 0, dur: 900, word: true, draw(ctx, k) {
      const s = size * (k < 0.15 ? Ease.back(k / 0.15) : 1);
      ctx.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
      ctx.font = `900 ${s}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = s * 0.22; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
      ctx.strokeText(str, x, y - k * size * 1.6); ctx.fillStyle = color || '#ff4f9a'; ctx.fillText(str, x, y - k * size * 1.6);
      ctx.globalAlpha = 1;
    } });
  },
  // the big cheer across the board; an earlier cheer still showing gets out of the way
  praise(word, x, y, width, level) {
    this.hush();
    const size = Math.min(width / (word.length * 0.52), width * 0.17);
    const hues = level >= 5 ? ['#ff4f6d', '#ff9d3a', '#ffd23a', '#5fe07a', '#3ac8ff', '#a77bff'] : level >= 3 ? ['#ffd23a', '#ff9d3a', '#ff4f9a'] : ['#a77bff', '#ff7eb6'];
    this.items.push({ t: 0, dur: 1500, word: true, draw(ctx, k, t) {
      const inK = Math.min(1, t / 420), sc = Ease.elastic(inK) * (k > 0.75 ? 1 + (k - 0.75) * 1.2 : 1);
      ctx.save(); ctx.translate(x, y - (k > 0.75 ? (k - 0.75) * size * 1.5 : 0)); ctx.rotate(-0.06); ctx.scale(sc, sc);
      ctx.globalAlpha = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
      ctx.font = `900 ${size}px "Arial Rounded MT Bold","Trebuchet MS",${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = ctx.measureText(word).width, g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      hues.forEach((h, i) => g.addColorStop(i / Math.max(1, hues.length - 1), h));
      ctx.lineJoin = 'round';
      ctx.lineWidth = size * 0.3; ctx.strokeStyle = '#4a2b5e'; ctx.strokeText(word, 0, size * 0.06);
      ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#fff'; ctx.strokeText(word, 0, 0);
      ctx.fillStyle = g; ctx.fillText(word, 0, 0);
      ctx.restore(); ctx.globalAlpha = 1;
    } });
    const n = 8 + level * 5;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = rnd(0.25, 0.6) * width / 600;
      this.part({ kind: 'img', img: this.star(pick(hues)), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7, g: 0.0004, life: 900 + Math.random() * 500, size: rnd(18, 34) * width / 600, s1: 4, rot: Math.random() * 6, vr: rnd(-0.01, 0.01), drag: 0.975 });
    }
    if (level >= 4) this.flash(0.35, '#fff');
  },
  // something flying along an arc (a cleared animal going to its goal, a star going to a piece)
  fly(o) {
    return new Promise(res => {
      const mx = (o.x0 + o.x1) / 2 + (o.bend || 0), my = Math.min(o.y0, o.y1) - (o.lift == null ? 80 : o.lift);
      this.items.push({ t: -(o.delay || 0), dur: o.dur || 600, draw(ctx, k, t) {
        if (t < 0) return;
        const e = Ease.inOut(k), u = 1 - e;
        const x = u * u * o.x0 + 2 * u * e * mx + e * e * o.x1, y = u * u * o.y0 + 2 * u * e * my + e * e * o.y1;
        const s = lerp(o.s0, o.s1, e);
        if (o.trail && Math.random() < 0.6) Fx.part({ kind: 'img', img: Fx.dot(o.trail), add: true, x, y, vx: 0, vy: 0, life: 300, size: s * 0.8, s1: 0 });
        if (o.img) ctx.drawImage(o.img, x - s / 2, y - s / 2, s, s);
        else if (o.draw) o.draw(ctx, x, y, s);
      }, end: () => { if (o.onArrive) o.onArrive(); res(); } });
    });
  },
  confetti(n) {
    const cols = ['#ff4f9a', '#ffd23a', '#5fe0b0', '#7cc8ff', '#a77bff', '#ff9d3a'];
    for (let i = 0; i < n; i++) this.part({ kind: 'conf', x: Math.random() * this.W, y: -20 - Math.random() * this.H * 0.4, vx: rnd(-0.05, 0.05), vy: rnd(0.12, 0.3), g: 0.00012, life: 3200, size: rnd(8, 15), color: pick(cols), rot: Math.random() * 6, vr: rnd(-0.012, 0.012), drag: 0.998, wob: Math.random() * 6 });
  },
  shake(a, dur) { if (a >= this.shakeA * (1 - this.shakeT / this.shakeD)) { this.shakeA = a; this.shakeT = 0; this.shakeD = dur || 300; } },
  shakeOffset() {
    if (this.shakeT >= this.shakeD) return [0, 0];
    const k = 1 - this.shakeT / this.shakeD, a = this.shakeA * k * k;
    return [Math.sin(this.shakeT * 0.09) * a, Math.cos(this.shakeT * 0.13) * a * 0.7];
  },
  flash(a, c) { this.flashA = Math.max(this.flashA, a); this.flashC = c || '#fff'; },
  // fade out the words (cheers, +points) quickly, e.g. when a card opens over the board
  hush() { for (const it of this.items) if (it.word) it.t = Math.max(it.t, it.dur * 0.9); },
  clear() { this.parts = []; this.items.forEach(it => it.end && it.end()); this.items = []; },
  busy() { return this.items.length > 0; },

  update(dt) {
    this.shakeT += dt;
    this.flashA = Math.max(0, this.flashA - dt / 350);
    const ps = this.parts;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.t += dt;
      if (p.t >= p.life) { ps[i] = ps[ps.length - 1]; ps.pop(); continue; }
      p.vy += p.g * dt; p.vx *= Math.pow(p.drag, dt / 16); p.vy *= Math.pow(p.drag, dt / 16);
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i]; it.t += dt;
      if (it.t >= it.dur) { this.items.splice(i, 1); if (it.end) it.end(); }
    }
  },
  draw() {
    const ctx = this.ctx, d = this.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, this.cv.width, this.cv.height);
    const [sx, sy] = this.shakeOffset();
    ctx.setTransform(d, 0, 0, d, sx * d, sy * d);
    for (const it of this.items) {
      if (it.t < 0) { it.draw(ctx, 0, it.t); continue; }
      if (it.add) ctx.globalCompositeOperation = 'lighter';
      it.draw(ctx, Math.min(1, it.t / it.dur), it.t);
      ctx.globalCompositeOperation = 'source-over';
    }
    for (const p of this.parts) {
      if (p.delay > 0) continue;
      const k = p.t / p.life;
      if (p.kind === 'shard') {
        ctx.globalAlpha = 1 - k * k; ctx.fillStyle = p.color;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66); ctx.restore();
      } else if (p.kind === 'conf') {
        ctx.globalAlpha = k > 0.85 ? (1 - k) / 0.15 : 1; ctx.fillStyle = p.color;
        ctx.save(); ctx.translate(p.x + Math.sin(p.t / 300 + p.wob) * 12, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.t / 140 + p.wob)); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
      } else if (p.kind === 'twinkle') {
        const a = Math.sin(k * Math.PI); ctx.globalAlpha = a; this.drawStar(ctx, p.x, p.y, p.size * a, p.color);
      } else {
        const s = lerp(p.size, p.s1, k);
        ctx.globalAlpha = 1 - k * 0.8;
        if (p.add) ctx.globalCompositeOperation = 'lighter';
        if (p.rot) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.drawImage(p.img, -s / 2, -s / 2, s, s); ctx.restore(); }
        else ctx.drawImage(p.img, p.x - s / 2, p.y - s / 2, s, s);
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    ctx.globalAlpha = 1;
    if (this.flashA > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = this.flashA; ctx.fillStyle = this.flashC; ctx.fillRect(0, 0, this.cv.width, this.cv.height); ctx.globalAlpha = 1; }
  },
};
const FONT = '"Hiragino Maru Gothic ProN","Yuanti SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif';

// 动物消消乐 · the math page that stands between one game and the next (anti-addiction + learning by play).
// A page of 20 sums with a number pad; every sum has to be answered right before the page is done. A wrong answer
// shakes and clears; after three tries the right answer shows in grey to be copied, so she is never stuck.
// Parents choose the range (within 20 / 50 / 100), how many numbers (2 / 3 / 4) and add / subtract / both.
const MathGate = {
  // one sum: every number ≥ 1, every partial result between 0 and max
  problem(max, ops, mode, want) {
    for (let tries = 0; tries < 400; tries++) {
      const nums = [], signs = [];
      let v = mode === 'sub' ? 1 + Math.floor(Math.random() * max) : 1 + Math.floor(Math.random() * (max - 1));
      if (mode === 'sub' && v < Math.min(max, ops * 2)) continue;
      nums.push(v);
      let ok = true;
      for (let i = 1; i < ops; i++) {
        let s = mode === 'add' ? '+' : mode === 'sub' ? '-' : (i === 1 && want ? want : (Math.random() < 0.5 ? '+' : '-'));
        if (s === '+' && v >= max) s = mode === 'mix' ? '-' : null;
        if (s === '-' && v <= 0) s = mode === 'mix' ? '+' : null;
        if (!s) { ok = false; break; }
        const b = s === '+' ? 1 + Math.floor(Math.random() * (max - v)) : 1 + Math.floor(Math.random() * v);
        v = s === '+' ? v + b : v - b;
        nums.push(b); signs.push(s);
      }
      if (!ok) continue;
      if (v === 0 && Math.random() < 0.8) continue;                    // "x − x" now and then, not often
      if (nums.includes(1) && Math.random() < 0.6) continue;           // and "+ 1" / "− 1" not too often either
      if (max >= 50 && nums.some(n => n < 3) && Math.random() < 0.7) continue;   // keep the bigger ranges from being trivial
      let text = String(nums[0]);
      signs.forEach((s, i) => { text += ` ${s === '+' ? '+' : '−'} ${nums[i + 1]}`; });
      return { text, ans: v };
    }
    return { text: '1 + 1', ans: 2 };
  },
  page(cfg, count) {
    const out = [], seen = new Set();
    for (let k = 0; out.length < count && k < count * 30; k++) {
      // with both signs, the first sign alternates so a page is half adding, half taking away
      const q = this.problem(cfg.max, cfg.ops, cfg.mode, cfg.mode === 'mix' ? (out.length % 2 ? '-' : '+') : null);
      if (seen.has(q.text)) continue;
      seen.add(q.text); out.push(q);
    }
    for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
    return out;
  },
  label(cfg) {
    return `${cfg.max} 以内 · ${['', '', '两个数', '三个数', '四个数'][cfg.ops]} · ${{ mix: '加减混合', add: '只有加法', sub: '只有减法' }[cfg.mode]}`;
  },

  // o.count, o.extra (the five-sums-for-five-moves page); resolves when every sum is right
  open(o = {}) {
    return new Promise(resolve => {
      const cfg = Store.d.math, count = o.count || cfg.count || 10;
      const qs = this.page(cfg, count).map(q => Object.assign(q, { got: '', tries: 0, ok: false }));
      const root = $('#math'); root.hidden = false; root.innerHTML = '';
      $('#fx').style.zIndex = 46;   // sparkles and confetti over the page
      const t0 = Date.now();
      let cur = 0, first = 0, finished = false, praised = '';
      Music.stop();   // quiet for the sums (decli); the game starts it again
      const sheet = el('div', 'sheet'), head = el('div', 'head');
      const home = UI.homeButton(); home.style.width = home.style.height = '46px'; home.style.fontSize = '22px';
      head.appendChild(home);
      head.appendChild(el('h3', null, o.extra ? '✏️ 做对 5 道题，多 5 步' : '✏️ ' + L.math.title));
      const prog = el('div', 'prog', `0 / ${count}`);
      head.appendChild(prog);
      const lock = el('button', 'ibtn', '🔒'); lock.style.width = lock.style.height = '46px'; lock.style.fontSize = '22px';
      // a parent can skip the page, or change the settings, which starts a new page with the new kind of sums
      const before = JSON.stringify(cfg);
      lock.onclick = () => UI.parent({ fromMath: true, skip: () => finish(true), done: () => { if (JSON.stringify(Store.d.math) !== before && !finished) { cleanup(); resolve(MathGate.open(o)); } } });
      head.appendChild(lock);
      sheet.appendChild(head);
      const grid = el('div', 'grid'); sheet.appendChild(grid);
      root.appendChild(sheet);
      const cards = qs.map((q, i) => {
        const c = el('button', 'q');
        c.innerHTML = `<span>${q.text} =</span><span class="ans"></span>`;
        c.onclick = () => { if (!q.ok && !finished) { cur = i; Snd.play('tap'); draw(); } };
        grid.appendChild(c);
        return c;
      });
      const pad = el('div', 'pad');
      const disp = el('div', 'disp', '');
      pad.appendChild(disp);
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✓'];
      for (const k of keys) {
        const b = el('button', 'key' + (k === '✓' ? ' ok' : k === '⌫' ? ' del' : ''), k);
        b.addEventListener('pointerdown', e => { e.preventDefault(); press(k); });
        pad.appendChild(b);
      }
      root.appendChild(pad);
      const onKey = e => {
        if (/^[0-9]$/.test(e.key)) press(e.key);
        else if (e.key === 'Backspace') press('⌫');
        else if (e.key === 'Enter') press('✓');
      };
      window.addEventListener('keydown', onKey);

      function fit() {
        const wide = innerWidth >= innerHeight * 1.05;
        root.className = wide ? 'wide' : 'tall';
        // a full page fills the screen four across; when four across would make the sums small (a phone, or four
        // numbers in a sum) it takes the column count that gives the biggest sums, so none is cut off at the edges
        // (a clipped "14 + 11" reads as "4 + 11"). The five-sum page is one tidy column.
        const small = count <= 5;
        Object.assign(grid.style, small ? { alignContent: 'center', width: '100%', maxWidth: '600px', margin: '0 auto' } : {});
        const r = grid.getBoundingClientRect();
        cards.forEach(c => { c.style.fontSize = '100px'; });   // the widest sum in em: its two halves, the gap between them and a little air
        const em = Math.max(...cards.map(c => [...c.children].reduce((w, s) => w + s.offsetWidth, 0))) / 100 + 0.25 + 0.2;
        const size = cols => {
          const rows = Math.ceil(count / cols), cw = (r.width - (cols - 1) * 10) / cols - 8;
          const ch = small ? Math.min(110, (r.height - (rows - 1) * 10) / rows) : (r.height - (rows - 1) * 10) / rows;
          return Math.min(ch * 0.42, cw / em, 46);
        };
        let cols = small ? 1 : 4;
        if (!small && size(4) < 20) cols = [3, 2].reduce((a, c) => size(c) > size(a) + 0.5 ? c : a, 4);
        const rows = Math.ceil(count / cols);
        grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
        grid.style.gridTemplateRows = small ? `repeat(${rows},minmax(0,110px))` : `repeat(${rows},1fr)`;
        const fs = Math.max(9, size(cols));
        cards.forEach(c => { c.style.fontSize = fs + 'px'; });
      }
      function draw() {
        cards.forEach((c, i) => {
          const q = qs[i], a = c.querySelector('.ans');
          c.classList.toggle('cur', i === cur && !finished);
          c.classList.toggle('ok', q.ok);
          if (q.ok) a.textContent = q.ans;
          else if (i === cur) { a.textContent = q.got || (q.tries >= 3 ? q.ans : '?'); a.classList.toggle('hint', !q.got && q.tries >= 3); }
          else { a.textContent = q.got || ''; a.classList.remove('hint'); }
        });
        const n = qs.filter(q => q.ok).length;
        prog.textContent = `${n} / ${count}`;
        disp.textContent = finished ? '' : qs[cur].tries >= 3 ? '照着灰色的答案写一遍' : qs[cur].tries ? '再想一想' : '';
      }
      function press(k) {
        if (finished) return;
        Snd.init();
        const q = qs[cur];
        if (k === '⌫') { q.got = q.got.slice(0, -1); Snd.play('key', 2); }
        else if (k === '✓') { if (q.got) check(); return; }
        else if (q.got.length < 3) { q.got = (q.got === '0' ? '' : q.got) + k; Snd.play('key', +k); }
        draw();
      }
      function check() {
        const q = qs[cur], c = cards[cur];
        if (+q.got === q.ans) {
          q.ok = true; if (!q.tries) first++;
          Snd.play('right');
          const r = c.getBoundingClientRect();
          Fx.burst(r.left + r.width * 0.8, r.top + r.height / 2, ['#5fe0b0', '#ffd23a'], 10, 0.8, 60);
          const n = qs.filter(x => x.ok).length;
          if (n === count) { draw(); return finish(false); }
          // never the same praise twice in a row
          if (n === Math.floor(count / 2) && count >= 10) Voice.say(L.math.half);
          else { praised = pick(L.math.right.filter(t => t !== praised)); Voice.say(praised); }
          let next = qs.findIndex((x, i) => i > cur && !x.ok);
          if (next < 0) next = qs.findIndex(x => !x.ok);
          cur = next;
        } else {
          q.tries++; q.got = '';
          Snd.play('wrong');
          c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad');
          Voice.say(q.tries === 3 ? L.math.show : L.math.wrong);
        }
        draw();
      }
      function cleanup() {
        finished = true;
        window.removeEventListener('keydown', onKey);
        removeEventListener('resize', fit);
      }
      function close() { root.hidden = true; $('#fx').style.zIndex = ''; resolve(); }
      function finish(skipped) {
        cleanup();
        const secs = Math.round((Date.now() - t0) / 1000);
        if (!skipped) {
          Store.d.log.push([Date.now(), count, first, secs, MathGate.label(cfg)]);
          if (Store.d.log.length > 80) Store.d.log.splice(0, Store.d.log.length - 80);
        }
        if (!o.extra) Store.d.owed = false;
        Store.save();
        draw();
        if (skipped) { close(); return; }
        Snd.play('win'); Fx.confetti(70);
        Voice.say(o.extra ? L.math.doneExtra : L.math.done);
        const m = $('#modal'); m.hidden = false; m.style.zIndex = 45; m.innerHTML = '';
        const card = el('div', 'card');
        card.appendChild(el('h2', 'green', o.extra ? '多 5 步！' : '全部做对啦！'));
        card.appendChild(el('div', 'bigstars', '🎉'));
        const mins = Math.floor(secs / 60), s = secs % 60;
        card.appendChild(el('p', null, `${count} 道题，第一次就做对 <b>${first}</b> 道<br>用了 ${mins ? mins + ' 分 ' : ''}${s} 秒`));
        const row = el('div', 'row');
        const go = el('button', 'btn green', o.extra ? '接着玩 ▶' : '开始玩 ▶');
        go.onclick = () => { Snd.play('tap'); m.hidden = true; m.style.zIndex = ''; close(); };
        row.appendChild(go); card.appendChild(row); m.appendChild(card);
      }
      addEventListener('resize', fit);
      requestAnimationFrame(() => { fit(); draw(); });
      Voice.say(o.extra ? L.math.extra : L.math.start(count));
    });
  },
};

// 动物消消乐 · the blind box after each win (decli asked for a gift to open after a level): a box drops in, she taps it
// three times, and an animal friend from decli's picture pops out. More stars give a finer box and better odds of a
// rare friend; a friend she does not have yet always comes before one she has. The album (🎁 on the map) shows every
// friend, the missing ones as shadows to guess. Everything here is pictures and the narrator's voice: she can't read.
const Gift = {
  // chance of 稀有 and 隐藏款 for a box won with 1, 2 or 3 stars
  ODDS: [[0.12, 0], [0.12, 0], [0.25, 0.04], [0.4, 0.1]],
  // the box by stars: light, base, dark, ribbon, ribbon shade
  LOOK: [null, ['#ffd3e8', '#ff8fc4', '#d9478d', '#fff3a6', '#e0a800'], ['#e6dbff', '#a982ff', '#6a3fd6', '#ffd0e6', '#e05a9a'],
    ['#fff3bf', '#ffcf3a', '#d98e00', '#ff6b8a', '#c42c55']],
  on: false,

  owned(i) { return FRIENDS[i].tier < 0 || (Store.d.gifts[FRIENDS[i].id] || 0) > 0; },
  count() { return FRIENDS.filter(f => this.owned(f.i)).length; },
  roll(stars) {
    const [pr, ph] = this.ODDS[stars] || this.ODDS[1], r = Math.random();
    const tier = r < ph ? 2 : r < ph + pr ? 1 : 0;
    const of = t => FRIENDS.filter(f => f.tier === t), fresh = l => l.filter(f => !this.owned(f.i));
    let pool = fresh(of(tier));
    // that tier is complete: most of the time a missing ordinary or rare friend comes instead (never a free 隐藏款)
    if (!pool.length && Math.random() < 0.7) pool = fresh([...of(0), ...of(1)]);
    if (!pool.length) pool = of(tier);
    return pick(pool);
  },

  // ---------- opening a box: resolves when she has taken the friend ----------
  open(stars) {
    return new Promise(resolve => {
      const d = Store.d, f = this.roll(stars), fresh = !this.owned(f.i);
      d.gifts[f.id] = (d.gifts[f.id] || 0) + 1;
      if (fresh) d.giftFresh = [...(d.giftFresh || []), f.id];
      d.seen.boxes = (d.seen.boxes || 0) + 1;
      Store.save();   // saved before the box opens, so leaving half-way neither loses it nor rolls again
      const s = this.s = {
        f, fresh, n: d.gifts[f.id], look: this.LOOK[clamp(stars, 1, 3)], all: fresh && this.count() === FRIENDS.length,
        phase: 'drop', t: 0, taps: 0, tapT: 9e9, idleT: 0, openT: 0, popT: 9e9, leaveT: 0, rot: 0, sparkT: 0, said: false, token: {},
        resolve,
      };
      const ov = this.ov = el('div'); ov.id = 'gift';
      this.cv = el('canvas'); ov.appendChild(this.cv);
      const keep = this.keep = UI.button('收下 👍', 'green keep', () => this.leave());
      ov.appendChild(keep);
      ov.addEventListener('pointerdown', e => { if (e.target !== keep) this.tap(e.clientX, e.clientY); });
      document.body.appendChild(ov);
      Fx.hush();
      this.on = true; this.prize = null; this.W = 0;
      let last = performance.now();
      const step = now => {
        if (!this.on) return;
        const dt = Math.min(50, now - last); last = now;
        this.update(dt); this.draw();
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  },
  geo() {
    const W = innerWidth, H = innerHeight, S = Math.min(W * 0.3, H * 0.4);
    return { W, H, S, bx: W / 2, by: H * 0.8 - S * 0.36, px: W / 2, py: H * 0.43, P: Math.min(H * 0.46, W * 0.36) };
  },
  tap(x, y) {
    const s = this.s, g = this.geo();
    Snd.init();
    if (s.phase === 'show') {   // tap the friend to hear its name again
      if (Math.hypot(x - g.px, y - g.py) < g.P * 0.6) { s.popT = 0; Snd.play('select'); Voice.say(L.gift.got[s.f.i]); }
      return;
    }
    if (s.phase !== 'idle') return;
    s.taps++; s.tapT = 0; s.idleT = 0;
    Snd.play('gtap', s.taps);
    Fx.burst(g.bx, g.by - g.S * 0.2, [s.look[1], s.look[3]], 8 + s.taps * 4, 0.8 + s.taps * 0.3, g.S * 0.4);
    Fx.sparkles(g.bx, g.by - g.S * 0.4, 6 + s.taps * 3, g.S * 0.5, '#fff6b0');
    if (s.taps >= 3) this.burst();
  },
  burst() {
    const s = this.s, g = this.geo(), f = s.f;
    s.phase = 'open'; s.openT = 0;
    Voice.stop();
    Snd.play('gopen'); if (f.tier > 0) Snd.play('grare');
    Fx.flash(0.75, '#fff');
    Fx.confetti(f.tier > 0 ? 140 : 90);
    Fx.burst(g.bx, g.by - g.S * 0.4, ['#ffd23a', '#ffffff'], 30, 2.2, g.S * 0.5);
    // what the narrator says: the kind of friend, its name, and whether it is a new one
    const lines = [f.tier === 2 ? L.gift.hidden : f.tier === 1 ? L.gift.rare : null, L.gift.got[f.i], s.fresh ? null : L.gift.again, s.all ? L.gift.full : null].filter(Boolean);
    const tok = s.token;
    const next = () => { const t = lines.shift(); if (t && this.on && this.s.token === tok) Voice.say(t, { onend: () => setTimeout(next, 150) }); };
    setTimeout(next, 650);
  },
  leave() {
    const s = this.s;
    if (s.phase !== 'show') return;
    s.phase = 'leave'; s.leaveT = 0; s.token = {};
    this.keep.classList.remove('on');
    Snd.play('home');
  },
  close() {
    this.on = false; this.ov.remove(); this.ov = null;
    this.s.resolve();
  },

  update(dt) {
    const s = this.s, g = this.geo();
    s.t += dt; s.tapT += dt; s.popT += dt; s.rot += dt * (s.phase === 'show' || s.phase === 'open' ? 0.00025 : 0.00012);
    if (s.phase === 'drop' && s.t > 650) {
      s.phase = 'idle'; s.tapT = 0;
      Snd.play('gland');
      Fx.sparkles(g.bx, g.by + g.S * 0.3, 10, g.S * 0.6, '#ffffff');
      if (Store.d.seen.boxes <= 3) Voice.say(L.gift.drop);
    }
    if (s.phase === 'idle') s.idleT += dt;
    if (s.phase === 'open') { s.openT += dt; if (s.openT > 1000) { s.phase = 'show'; s.showT = 0; } }
    if (s.phase === 'show') {
      s.showT += dt;
      if (s.showT > 700 && !this.keep.classList.contains('on')) this.keep.classList.add('on');
      if (s.f.tier > 0 && (s.sparkT -= dt) < 0) { s.sparkT = 140; Fx.sparkles(g.px + rnd(-1, 1) * g.P * 0.55, g.py + rnd(-1, 1) * g.P * 0.5, 2, 10, s.f.tier === 2 ? pick(['#ff9fca', '#9fe3ff', '#fff3a6', '#c6a6ff']) : '#ffe680'); }
    }
    if (s.phase === 'leave') { s.leaveT += dt; if (s.leaveT > 480) this.close(); }
  },

  // ---------- drawing ----------
  draw() {
    const s = this.s, g = this.geo(), dpr = Math.min(devicePixelRatio || 1, 2), cv = this.cv;
    if (g.W !== this.W || g.H !== this.H) {
      this.W = g.W; this.H = g.H; cv.width = Math.round(g.W * dpr); cv.height = Math.round(g.H * dpr);
      cv.style.width = g.W + 'px'; cv.style.height = g.H + 'px'; this.prize = null;
    }
    if (!this.prize) this.prize = Art.friend(s.f.i, g.P * dpr, g.P * dpr * 0.92);
    const x = cv.getContext('2d');
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fade = s.phase === 'leave' ? 1 - s.leaveT / 480 : Math.min(1, s.t / 250);
    x.globalAlpha = fade;
    x.fillStyle = 'rgba(46,20,78,0.72)'; x.fillRect(0, 0, g.W, g.H);
    const opened = s.phase === 'open' || s.phase === 'show' || s.phase === 'leave';
    const ok = opened ? Math.min(1, s.openT / 500) : 0;
    // light rays: soft behind the box, then the friend's colour (gold for 稀有, a rainbow for 隐藏款)
    const rcx = lerp(g.bx, g.px, ok), rcy = lerp(g.by - g.S * 0.1, g.py, ok);
    this.rays(x, rcx, rcy, Math.max(g.W, g.H) * 0.75, 16, s.rot * Math.PI * 2, i => {
      if (!opened) return 'rgba(255,255,255,0.10)';
      if (s.f.tier === 2) return `hsla(${(i * 360 / 16 + s.t * 0.05) % 360},95%,70%,${0.32 * ok})`;
      return s.f.tier === 1 ? `rgba(255,214,60,${0.34 * ok})` : `rgba(255,236,190,${0.2 * ok})`;
    });
    if (!opened || s.openT < 900) this.drawBoxAt(x, g, s);
    if (opened) this.drawPrize(x, g, s, dpr);
    if (s.phase === 'idle' && s.idleT > 2600) {   // a finger showing where to tap
      const ph = (s.idleT % 900) / 900, sz = g.S * 0.32;
      x.font = `${sz}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('👆', g.bx + g.S * 0.42, g.by + g.S * 0.32 + (ph < 0.3 ? (0.3 - ph) * sz * 0.8 : 0));
    }
    x.globalAlpha = 1;
  },
  rays(x, cx, cy, R, n, rot, col) {
    for (let i = 0; i < n; i++) {
      const a0 = rot + i * Math.PI * 2 / n, gr = x.createRadialGradient(cx, cy, 0, cx, cy, R), c = col(i);
      gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = gr; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, R, a0, a0 + Math.PI / n); x.closePath(); x.fill();
    }
  },
  drawBoxAt(x, g, s) {
    const S = g.S;
    let dy = 0, sx = 1, sy = 1, rot = 0, a = 1;
    if (s.phase === 'drop') {   // falling in with a bounce
      const k = Math.min(1, s.t / 650);
      dy = -(g.by + S) * (1 - this.bounce(k));
    } else if (s.phase === 'idle') {
      const k = s.tapT / 420;   // squash and wobble after each tap (and on landing)
      if (k < 1) { const w = Math.sin(k * Math.PI * 3) * (1 - k); sx = 1 + 0.16 * w; sy = 1 - 0.16 * w; rot = 0.12 * w * (s.taps % 2 ? 1 : -1); dy = -S * 0.12 * Math.max(0, Math.sin(k * Math.PI)) * (s.taps ? 1 : 0); }
      else { sy = 1 + 0.025 * Math.sin(s.t / 260); sx = 2 - sy; const p = (s.t % 2400) / 2400; if (p > 0.85) rot = Math.sin((p - 0.85) / 0.15 * Math.PI * 4) * 0.06; }
    } else {   // opened: the lid flies off, the box sinks away
      const k = clamp((s.openT - 200) / 600, 0, 1);

      const q = Math.min(1, s.openT / 160); sx = 1 + 0.2 * Math.sin(q * Math.PI); sy = 1 - 0.2 * Math.sin(q * Math.PI);
    }
    // the shadow on the floor
    x.save(); x.globalAlpha *= a * (s.phase === 'drop' ? Math.min(1, s.t / 650) : 1);
    x.fillStyle = 'rgba(20,6,40,0.35)'; x.beginPath(); x.ellipse(g.bx, g.by + S * 0.38, S * 0.6 * sx, S * 0.09, 0, 0, 7); x.fill();

  },
  bounce(k) {   // ease out with two little bounces

    if (k < 1 / d) return n * k * k;

  },
  // the box, its body's centre at (0, 0); lid offset {x, y, r} once it is flying; glow 0-1 = light leaking out;
  // bodyA the body's opacity (it fades as it sinks away; the lid stays whole)
  drawBox(x, S, look, lid, glow, bodyA) {
    const [lt, base, dk, rb, rbd] = look, w = S, h = S * 0.72, r = S * 0.07, lw = S * 0.028, ink = '#4a2b5e', rw = S * 0.17;
    x.lineJoin = 'round';
    const ribbon = (y0, hh) => {
      const rg = x.createLinearGradient(-rw / 2, 0, rw / 2, 0);
      rg.addColorStop(0, rbd); rg.addColorStop(0.25, rb); rg.addColorStop(0.75, rb); rg.addColorStop(1, rbd);
      x.fillStyle = rg; x.fillRect(-rw / 2, y0, rw, hh);
    };
    // body
    x.save(); x.globalAlpha *= bodyA;
    const g = x.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, lt); g.addColorStop(0.3, base); g.addColorStop(1, dk);
    Art.rr(x, -w / 2, -h / 2, w, h, r); x.fillStyle = g; x.fill();
    x.save(); Art.rr(x, -w / 2, -h / 2, w, h, r); x.clip();
    ribbon(-h / 2, h);
    x.fillStyle = 'rgba(255,255,255,0.3)'; Art.rr(x, -w / 2 + S * 0.06, -h / 2 + S * 0.07, S * 0.07, h * 0.62, S * 0.035); x.fill();
    x.fillStyle = 'rgba(60,20,80,0.18)'; x.fillRect(-w / 2, -h / 2, w, S * 0.05);   // the lid's shadow
    x.restore();
    Art.rr(x, -w / 2, -h / 2, w, h, r); x.lineWidth = lw; x.strokeStyle = ink; x.stroke();
    // the question-mark sticker on the ribbon
    x.beginPath(); x.arc(0, h * 0.08, S * 0.155, 0, 7); x.fillStyle = '#fff'; x.fill(); x.lineWidth = lw * 0.8; x.stroke();
    x.font = `900 ${S * 0.23}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = dk; x.fillText('?', 0, h * 0.08 + S * 0.012);
    x.restore();
    // light leaking out under the lid, brighter with each tap
    if (glow > 0) {
      x.save(); x.globalAlpha *= bodyA; x.globalCompositeOperation = 'lighter';

      gg.addColorStop(0, `rgba(255,250,200,${0.95 * glow})`); gg.addColorStop(0.4, `rgba(255,220,120,${0.5 * glow})`); gg.addColorStop(1, 'rgba(255,200,80,0)');
      x.fillStyle = gg; x.beginPath(); x.ellipse(0, -h / 2, S * (0.45 + 0.5 * glow), S * (0.12 + 0.25 * glow), 0, 0, 7); x.fill();
      x.restore();
    }

    x.save(); x.translate(lid.x, -h / 2 + lid.y); x.rotate(lid.r);

    const lg = x.createLinearGradient(0, -LH, 0, 0); lg.addColorStop(0, lt); lg.addColorStop(0.5, base); lg.addColorStop(1, dk);
    Art.rr(x, -LW / 2, -LH, LW, LH, S * 0.05); x.fillStyle = lg; x.fill();
    x.save(); Art.rr(x, -LW / 2, -LH, LW, LH, S * 0.05); x.clip(); ribbon(-LH, LH);
    x.fillStyle = 'rgba(255,255,255,0.35)'; x.fillRect(-LW / 2, -LH + S * 0.025, LW, S * 0.035); x.restore();
    Art.rr(x, -LW / 2, -LH, LW, LH, S * 0.05); x.lineWidth = lw; x.strokeStyle = ink; x.stroke();
    for (const sd of [-1, 1]) {   // the bow's two loops
      x.save(); x.translate(sd * S * 0.12, -LH - S * 0.07); x.rotate(sd * 0.45);
      x.beginPath(); x.ellipse(0, 0, S * 0.13, S * 0.085, 0, 0, 7);
      const bg = x.createLinearGradient(0, -S * 0.08, 0, S * 0.08); bg.addColorStop(0, rb); bg.addColorStop(1, rbd);
      x.fillStyle = bg; x.fill(); x.lineWidth = lw * 0.9; x.stroke();
      x.beginPath(); x.ellipse(sd * S * 0.02, 0, S * 0.055, S * 0.03, 0, 0, 7); x.fillStyle = 'rgba(80,20,40,0.35)'; x.fill();
      x.restore();
    }
    x.beginPath(); x.arc(0, -LH - S * 0.04, S * 0.06, 0, 7); x.fillStyle = rb; x.fill(); x.lineWidth = lw * 0.9; x.stroke();
    x.beginPath(); x.arc(-S * 0.018, -LH - S * 0.058, S * 0.02, 0, 7); x.fillStyle = 'rgba(255,255,255,0.7)'; x.fill();
    x.restore();
  },
  drawPrize(x, g, s, dpr) {
    const f = s.f, P = g.P;
    let k = clamp((s.openT - 120) / 750, 0, 1), sc = 0.15 + 0.85 * Ease.back(k), cx = g.px, cy = lerp(g.by - g.S * 0.3, g.py, Ease.out(k));
    if (s.phase === 'show') cy += Math.sin(s.showT / 380) * P * 0.02;

  // NEW, ×2, and a ribbon for 稀有 / 隐藏款
  badges(x, cx, cy, P, s, k) {

      x.lineTo(w / 2 + h * 0.5, h / 2 + h * 0.15); x.lineTo(w / 2 + h * 0.15, h * 0.15); x.lineTo(w / 2 + h * 0.5, -h / 2 + h * 0.15); x.closePath();

      x.font = `900 ${h * 0.62}px ${FONT}`; x.lineJoin = 'round'; x.lineWidth = h * 0.16; x.strokeStyle = f.tier === 2 ? '#6a2a8a' : '#8a5200';

  },

  // ---------- the album: every friend on one page, ten in a row like decli's pictures ----------
  album() {
    const d = Store.d, fresh = new Set(d.giftFresh || []);
    d.giftFresh = []; Store.save();
    UI.closeModal();
    const root = $('#album'); root.hidden = false; root.innerHTML = '';
    const top = el('div', 'top');
    const back = el('button', 'ibtn', '🗺️'); back.onclick = () => { Snd.play('tap'); root.hidden = true; root.innerHTML = ''; UI.map(); };
    top.appendChild(back);
    top.appendChild(el('h1', null, '动物收集册'));
    top.appendChild(el('div', 'pill', `🎁 ${this.count()} / ${FRIENDS.length}`));
    root.appendChild(top);
    const grid = el('div', 'agrid'); root.appendChild(grid);
    const slots = FRIENDS.map(f => {
      const b = el('button', 'aslot t' + Math.max(0, f.tier) + (this.owned(f.i) ? '' : ' no'));
      if (fresh.has(f.id)) b.appendChild(el('i', 'anew', 'NEW'));

      if (n > 1) b.appendChild(el('b', null, '×' + n));
      b.onclick = () => {
        if (this.owned(f.i)) { Snd.play('select'); Voice.say(L.gift.names[f.i]); b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], 380); }
        else { Snd.play('bad'); Voice.say(L.gift.locked); b.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], 250); }

      slots.forEach((b, i) => {
        const old = $('canvas', b); if (old) old.remove();

        b.prepend(c);

    };
    requestAnimationFrame(paint);
    this._albumResize && removeEventListener('resize', this._albumResize);
    this._albumResize = () => requestAnimationFrame(paint);
    addEventListener('resize', this._albumResize);
    if (!d.seen.album) { d.seen.album = 1; Store.save(); Voice.say(L.gift.album); }
  },
  // a friend for the album: its head, or its shadow with a question mark if she has not found it yet
  slot(f, s) {
    const c = Art.friend(f.i, s, s * 0.86);
    if (this.owned(f.i)) return c;
    const x = c.getContext('2d');
    x.globalCompositeOperation = 'source-in'; x.fillStyle = f.tier === 2 ? '#d7b8f0' : '#cbbcdb'; x.fillRect(0, 0, s, s);
    x.globalCompositeOperation = 'source-over';
    x.font = `900 ${s * 0.38}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineWidth = s * 0.05; x.strokeStyle = '#a593bd'; x.strokeText('?', s / 2, s * 0.53); x.fillStyle = '#fff'; x.fillText('?', s / 2, s * 0.53);
