        if (skipped) { close(); return; }
        Snd.play('win'); Fx.confetti(70);
        Voice.say(o.extra ? L.math.doneExtra : L.math.done);
        const m = $('#modal'); m.hidden = false; m.style.zIndex = 45; m.innerHTML = '';
        const box = el('div', 'card');
        box.appendChild(el('h2', 'green', o.extra ? '多 5 步！' : '全部做对啦！'));
        box.appendChild(el('div', 'bigstars', '🎉'));
        const mins = Math.floor(secs / 60), s = secs % 60;
        box.appendChild(el('p', null, `${total} 道题，第一次就做对 <b>${first}</b> 道<br>用了 ${mins ? mins + ' 分 ' : ''}${s} 秒`));
        const row = el('div', 'row');
        const go = el('button', 'btn green', o.extra ? '接着玩 ▶' : '开始玩 ▶');
        go.onclick = () => { Snd.play('tap'); m.hidden = true; m.style.zIndex = ''; close(); };
        row.appendChild(go); box.appendChild(row); m.appendChild(box);
      }
      const refit = () => { fit(); Teach.relayout(); };
      addEventListener('resize', refit);
      requestAnimationFrame(() => { fit(); draw(); });
      // straight from the wheel, which has just said the number: no need to say it again
      if (!fresh) Voice.say(o.extra ? L.math.extra : L.math.start(total));
    });
  },
};

// 动物消消乐 · the blind box after each win (decli asked for a gift to open after a level): a box drops in, she taps it
// three times, and a friend from decli's 怪趣森林 pictures pops out. More stars give a finer box and better odds of a
// rare friend; a friend she does not have yet always comes before one she has. The album (🎁 on the map) shows every
// friend, island by island, the missing ones as shadows to guess. Everything here is pictures and the narrator's voice: she can't read.
const Gift = {
  // chance of 稀有 and 隐藏款 for a box won with 1, 2 or 3 stars
  ODDS: [[0.12, 0], [0.12, 0], [0.25, 0.04], [0.4, 0.1]],
  // the box by stars: light, base, dark, ribbon, ribbon shade
  LOOK: [null, ['#ffe2c4', '#f5a65b', '#c8742a', '#fff3c4', '#e0a800'], ['#e4f1cf', '#93be68', '#557f38', '#ffd9c2', '#e07a4a'],
    ['#fff3bf', '#ffcf3a', '#d98e00', '#ff6b8a', '#c42c55']],
  on: false,

  owned(i) { return FRIENDS[i].tier < 0 || (Store.d.gifts[FRIENDS[i].id] || 0) > 0; },
  count() { return FRIENDS.filter(f => this.owned(f.i)).length; },
  // rare: the box for a whole island won, always 稀有 or 隐藏款. isle: the island she won it on, whose friends come
  // first (decli 2026-11-05: each island has its own cast, so a new island brings new friends to find)
  roll(stars, rare, isle) {
    const [pr, ph] = rare ? [0.75, 0.25] : this.ODDS[stars] || this.ODDS[1], r = Math.random();
    const tier = r < ph ? 2 : r < ph + pr ? 1 : 0;
    const of = t => FRIENDS.filter(f => f.tier === t), fresh = l => l.filter(f => !this.owned(f.i));
    const here = l => { const h = l.filter(f => f.isle === isle); return h.length ? h : l; };
    let pool = here(fresh(of(tier)));
    // that tier is complete: most of the time a missing ordinary or rare friend comes instead (never a free 隐藏款)
    if (!pool.length && Math.random() < 0.7) pool = fresh([...of(0), ...of(1)]);
    if (!pool.length) pool = of(tier);
    return pick(pool);
  },

  // ---------- opening a box: resolves when she has taken the friend ----------
  open(stars, o = {}) {
    return new Promise(resolve => {
      const d = Store.d, f = this.roll(stars, o.rare, o.isle), fresh = !this.owned(f.i);
      Art.bigFace(f.i);   // the big picture comes in while the box drops and she taps it
      d.gifts[f.id] = (d.gifts[f.id] || 0) + 1;
      if (fresh) d.giftFresh = [...(d.giftFresh || []), f.id];
      d.seen.boxes = (d.seen.boxes || 0) + 1;
      Store.save();   // saved before the box opens, so leaving half-way neither loses it nor rolls again
      const s = this.s = {
        f, fresh, n: d.gifts[f.id], look: this.LOOK[clamp(stars, 1, 3)], all: fresh && this.count() === FRIENDS.length,
        phase: 'drop', t: 0, taps: 0, tapT: 9e9, idleT: 0, openT: 0, popT: 9e9, leaveT: 0, rot: 0, sparkT: 0, said: false, token: {},
        resolve,
      };
      const ov = this.ov = el('div'); ov.id = 'gift';
      this.cv = el('canvas'); ov.appendChild(this.cv);
      const keep = this.keep = UI.button('收下 👍', 'green keep', () => this.leave());
      ov.appendChild(keep);
      ov.addEventListener('pointerdown', e => { if (e.target !== keep) this.tap(e.clientX, e.clientY); });
      document.body.appendChild(ov);
      Fx.hush();
      this.on = true; this.prize = null; this.prizeBig = false; this.W = 0;
      let last = performance.now();
      const step = now => {
        if (!this.on) return;
        const dt = Math.min(50, now - last); last = now;

  },
  geo() {
    const W = innerWidth, H = innerHeight, S = Math.min(W * 0.3, H * 0.4);
    return { W, H, S, bx: W / 2, by: H * 0.8 - S * 0.36, px: W / 2, py: H * 0.43, P: Math.min(H * 0.46, W * 0.36) };
  },
  tap(x, y) {
    const s = this.s, g = this.geo();
    Snd.init();
    if (s.phase === 'show') {   // tap the friend to hear its name again
      if (Math.hypot(x - g.px, y - g.py) < g.P * 0.6) { s.popT = 0; Snd.play('select'); Voice.say(L.gift.got[s.f.i]); }
      return;
    }
    if (s.phase !== 'idle') return;
    s.taps++; s.tapT = 0; s.idleT = 0;
    Snd.play('gtap', s.taps);
    Fx.burst(g.bx, g.by - g.S * 0.2, [s.look[1], s.look[3]], 8 + s.taps * 4, 0.8 + s.taps * 0.3, g.S * 0.4);
    Fx.sparkles(g.bx, g.by - g.S * 0.4, 6 + s.taps * 3, g.S * 0.5, '#fff6b0');
    if (s.taps >= 3) this.burst();
  },
  burst() {
    const s = this.s, g = this.geo(), f = s.f;
    s.phase = 'open'; s.openT = 0;
    Voice.stop();
    Snd.play('gopen'); if (f.tier > 0 || s.n === 2) Snd.play('grare');
    Fx.flash(0.75, '#fff');
    Fx.confetti(f.tier > 0 ? 140 : 90);
    Fx.burst(g.bx, g.by - g.S * 0.4, ['#ffd23a', '#ffffff'], 30, 2.2, g.S * 0.5);
    // what the narrator says: the kind of friend, its name, and whether it is a new one
    // a friend's second copy makes it 闪光版 (season two: more levels than friends, so the album goes on)
    const lines = [f.tier === 2 ? L.gift.hidden : f.tier === 1 ? L.gift.rare : null, L.gift.got[f.i], s.fresh ? null : s.n === 2 ? L.gift.shiny : L.gift.again, s.all ? L.gift.full : null].filter(Boolean);
    const tok = s.token;
    const next = () => { const t = lines.shift(); if (t && this.on && this.s.token === tok) Voice.say(t, { onend: () => setTimeout(next, 150) }); };
    setTimeout(next, 650);
  },
  leave() {
    const s = this.s;
    if (s.phase !== 'show') return;
    s.phase = 'leave'; s.leaveT = 0; s.token = {};
    this.keep.classList.remove('on');
    Snd.play('home');
  },
  close() {
    this.on = false; this.ov.remove(); this.ov = null;
    this.s.resolve();
  },

  update(dt) {
    const s = this.s, g = this.geo();
    s.t += dt; s.tapT += dt; s.popT += dt; s.rot += dt * (s.phase === 'show' || s.phase === 'open' ? 0.00025 : 0.00012);
    if (s.phase === 'drop' && s.t > 650) {
      s.phase = 'idle'; s.tapT = 0;
      Snd.play('gland');
      Fx.sparkles(g.bx, g.by + g.S * 0.3, 10, g.S * 0.6, '#ffffff');
      if (Store.d.seen.boxes <= 3) Voice.say(L.gift.drop);
    }
    if (s.phase === 'idle') s.idleT += dt;
    if (s.phase === 'open') { s.openT += dt; if (s.openT > 1000) { s.phase = 'show'; s.showT = 0; } }
    if (s.phase === 'show') {
      s.showT += dt;
      if (s.showT > 700 && !this.keep.classList.contains('on')) this.keep.classList.add('on');
      if (s.f.tier > 0 && (s.sparkT -= dt) < 0) { s.sparkT = 140; Fx.sparkles(g.px + rnd(-1, 1) * g.P * 0.55, g.py + rnd(-1, 1) * g.P * 0.5, 2, 10, s.f.tier === 2 ? pick(['#ff9fca', '#9fe3ff', '#fff3a6', '#c6a6ff']) : '#ffe680'); }
    }
    if (s.phase === 'leave') { s.leaveT += dt; if (s.leaveT > 480) this.close(); }
  },

  // ---------- drawing ----------
  draw() {
    const s = this.s, g = this.geo(), dpr = Math.min(devicePixelRatio || 1, 2), cv = this.cv;
    if (g.W !== this.W || g.H !== this.H) {
      this.W = g.W; this.H = g.H; cv.width = Math.round(g.W * dpr); cv.height = Math.round(g.H * dpr);
      cv.style.width = g.W + 'px'; cv.style.height = g.H + 'px'; this.prize = null; this.prizeBig = false;
    }
    // the friend's big fun face (big/<id>.webp, asked for when the box opened), or its fun face from the sheet until it is in
    if (!this.prize || (!this.prizeBig && Art.bigFace(s.f.i))) {
      const big = Art.bigFace(s.f.i), side = g.P * dpr;
      if (big) { this.prize = Art.canvas(side, side); const x2 = this.prize.getContext('2d'); x2.imageSmoothingQuality = 'high'; x2.drawImage(big, 0, 0, side, side); this.prizeBig = true; }
      else this.prize = Art.friend(s.f.i, side, side * HEADS.fill, 'f');
    }
    const x = cv.getContext('2d');
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fade = s.phase === 'leave' ? 1 - s.leaveT / 480 : Math.min(1, s.t / 250);
    x.globalAlpha = fade;
    x.fillStyle = 'rgba(30,44,22,0.72)'; x.fillRect(0, 0, g.W, g.H);
    const opened = s.phase === 'open' || s.phase === 'show' || s.phase === 'leave';
    const ok = opened ? Math.min(1, s.openT / 500) : 0;
    // light rays: soft behind the box, then the friend's colour (gold for 稀有, a rainbow for 隐藏款)
    const rcx = lerp(g.bx, g.px, ok), rcy = lerp(g.by - g.S * 0.1, g.py, ok);
    this.rays(x, rcx, rcy, Math.max(g.W, g.H) * 0.75, 16, s.rot * Math.PI * 2, i => {
      if (!opened) return 'rgba(255,255,255,0.10)';
      if (s.f.tier === 2) return `hsla(${(i * 360 / 16 + s.t * 0.05) % 360},95%,70%,${0.32 * ok})`;
      return s.f.tier === 1 ? `rgba(255,214,60,${0.34 * ok})` : `rgba(255,236,190,${0.2 * ok})`;
    });
    if (!opened || s.openT < 900) this.drawBoxAt(x, g, s);
    if (opened) this.drawPrize(x, g, s, dpr);
    if (s.phase === 'idle' && s.idleT > 2600) {   // a finger showing where to tap
      const ph = (s.idleT % 900) / 900, sz = g.S * 0.32;
      x.font = `${sz}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('👆', g.bx + g.S * 0.42, g.by + g.S * 0.32 + (ph < 0.3 ? (0.3 - ph) * sz * 0.8 : 0));
    }
    x.globalAlpha = 1;
  },
  rays(x, cx, cy, R, n, rot, col) {
    for (let i = 0; i < n; i++) {
      const a0 = rot + i * Math.PI * 2 / n, gr = x.createRadialGradient(cx, cy, 0, cx, cy, R), c = col(i);
      gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = gr; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, R, a0, a0 + Math.PI / n); x.closePath(); x.fill();
    }
  },
  drawBoxAt(x, g, s) {
    const S = g.S;
    let dy = 0, sx = 1, sy = 1, rot = 0, a = 1;
    if (s.phase === 'drop') {   // falling in with a bounce
      const k = Math.min(1, s.t / 650);
      dy = -(g.by + S) * (1 - this.bounce(k));
    } else if (s.phase === 'idle') {
      const k = s.tapT / 420;   // squash and wobble after each tap (and on landing)
      if (k < 1) { const w = Math.sin(k * Math.PI * 3) * (1 - k); sx = 1 + 0.16 * w; sy = 1 - 0.16 * w; rot = 0.12 * w * (s.taps % 2 ? 1 : -1); dy = -S * 0.12 * Math.max(0, Math.sin(k * Math.PI)) * (s.taps ? 1 : 0); }
      else { sy = 1 + 0.025 * Math.sin(s.t / 260); sx = 2 - sy; const p = (s.t % 2400) / 2400; if (p > 0.85) rot = Math.sin((p - 0.85) / 0.15 * Math.PI * 4) * 0.06; }
    } else {   // opened: the lid flies off, the box sinks away
      const k = clamp((s.openT - 200) / 600, 0, 1);
      dy = S * 1.4 * Ease.in(k); a = 1 - k;
      const q = Math.min(1, s.openT / 160); sx = 1 + 0.2 * Math.sin(q * Math.PI); sy = 1 - 0.2 * Math.sin(q * Math.PI);
    }
    // the shadow on the floor
    x.save(); x.globalAlpha *= a * (s.phase === 'drop' ? Math.min(1, s.t / 650) : 1);
    x.fillStyle = 'rgba(14,24,8,0.35)'; x.beginPath(); x.ellipse(g.bx, g.by + S * 0.38, S * 0.6 * sx, S * 0.09, 0, 0, 7); x.fill();
    x.restore();
    x.save();
    x.translate(g.bx, g.by + S * 0.36 + dy); x.rotate(rot); x.scale(sx, sy); x.translate(0, -S * 0.36);
    let lid = { x: 0, y: 0, r: 0 }, glow = s.phase === 'idle' ? s.taps / 3 : 0;

      const e = Math.min(1, s.openT / 900);
      lid = { x: -S * 1.3 * e, y: -dy - g.H * 0.9 * e + g.H * 1.4 * e * e, r: -2.4 * e };

  },
  bounce(k) {   // ease out with two little bounces
    const n = 7.5625, d = 2.75;
    if (k < 1 / d) return n * k * k;
    if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;

  },
  // the box, its body's centre at (0, 0); lid offset {x, y, r} once it is flying; glow 0-1 = light leaking out;
  // bodyA the body's opacity (it fades as it sinks away; the lid stays whole)
  drawBox(x, S, look, lid, glow, bodyA) {
    const [lt, base, dk, rb, rbd] = look, w = S, h = S * 0.72, r = S * 0.07, lw = S * 0.028, ink = '#3d5229', rw = S * 0.17;
    x.lineJoin = 'round';
    const ribbon = (y0, hh) => {
      const rg = x.createLinearGradient(-rw / 2, 0, rw / 2, 0);
      rg.addColorStop(0, rbd); rg.addColorStop(0.25, rb); rg.addColorStop(0.75, rb); rg.addColorStop(1, rbd);
      x.fillStyle = rg; x.fillRect(-rw / 2, y0, rw, hh);
    };
    // body
    x.save(); x.globalAlpha *= bodyA;
    const g = x.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, lt); g.addColorStop(0.3, base); g.addColorStop(1, dk);
    Art.rr(x, -w / 2, -h / 2, w, h, r); x.fillStyle = g; x.fill();
    x.save(); Art.rr(x, -w / 2, -h / 2, w, h, r); x.clip();
    ribbon(-h / 2, h);
    x.fillStyle = 'rgba(255,255,255,0.3)'; Art.rr(x, -w / 2 + S * 0.06, -h / 2 + S * 0.07, S * 0.07, h * 0.62, S * 0.035); x.fill();
    x.fillStyle = 'rgba(40,60,20,0.18)'; x.fillRect(-w / 2, -h / 2, w, S * 0.05);   // the lid's shadow
    x.restore();
    Art.rr(x, -w / 2, -h / 2, w, h, r); x.lineWidth = lw; x.strokeStyle = ink; x.stroke();
    // the question-mark sticker on the ribbon
    x.beginPath(); x.arc(0, h * 0.08, S * 0.155, 0, 7); x.fillStyle = '#fff'; x.fill(); x.lineWidth = lw * 0.8; x.stroke();
    x.font = `900 ${S * 0.23}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = dk; x.fillText('?', 0, h * 0.08 + S * 0.012);
    x.restore();
    // light leaking out under the lid, brighter with each tap
    if (glow > 0) {
      x.save(); x.globalAlpha *= bodyA; x.globalCompositeOperation = 'lighter';
      const gg = x.createRadialGradient(0, -h / 2, 0, 0, -h / 2, S * (0.45 + 0.5 * glow));
      gg.addColorStop(0, `rgba(255,250,200,${0.95 * glow})`); gg.addColorStop(0.4, `rgba(255,220,120,${0.5 * glow})`); gg.addColorStop(1, 'rgba(255,200,80,0)');
      x.fillStyle = gg; x.beginPath(); x.ellipse(0, -h / 2, S * (0.45 + 0.5 * glow), S * (0.12 + 0.25 * glow), 0, 0, 7); x.fill();

    }
    // lid with the bow
    x.save(); x.translate(lid.x, -h / 2 + lid.y); x.rotate(lid.r);
    const LW = w * 1.1, LH = S * 0.22;
    const lg = x.createLinearGradient(0, -LH, 0, 0); lg.addColorStop(0, lt); lg.addColorStop(0.5, base); lg.addColorStop(1, dk);
    Art.rr(x, -LW / 2, -LH, LW, LH, S * 0.05); x.fillStyle = lg; x.fill();
    x.save(); Art.rr(x, -LW / 2, -LH, LW, LH, S * 0.05); x.clip(); ribbon(-LH, LH);
    x.fillStyle = 'rgba(255,255,255,0.35)'; x.fillRect(-LW / 2, -LH + S * 0.025, LW, S * 0.035); x.restore();
    Art.rr(x, -LW / 2, -LH, LW, LH, S * 0.05); x.lineWidth = lw; x.strokeStyle = ink; x.stroke();
    for (const sd of [-1, 1]) {   // the bow's two loops

      x.beginPath(); x.ellipse(0, 0, S * 0.13, S * 0.085, 0, 0, 7);
      const bg = x.createLinearGradient(0, -S * 0.08, 0, S * 0.08); bg.addColorStop(0, rb); bg.addColorStop(1, rbd);
      x.fillStyle = bg; x.fill(); x.lineWidth = lw * 0.9; x.stroke();
      x.beginPath(); x.ellipse(sd * S * 0.02, 0, S * 0.055, S * 0.03, 0, 0, 7); x.fillStyle = 'rgba(80,20,40,0.35)'; x.fill();
      x.restore();

    x.beginPath(); x.arc(0, -LH - S * 0.04, S * 0.06, 0, 7); x.fillStyle = rb; x.fill(); x.lineWidth = lw * 0.9; x.stroke();
    x.beginPath(); x.arc(-S * 0.018, -LH - S * 0.058, S * 0.02, 0, 7); x.fillStyle = 'rgba(255,255,255,0.7)'; x.fill();
    x.restore();
  },
  drawPrize(x, g, s, dpr) {
    const f = s.f, P = g.P;
    let k = clamp((s.openT - 120) / 750, 0, 1), sc = 0.15 + 0.85 * Ease.back(k), cx = g.px, cy = lerp(g.by - g.S * 0.3, g.py, Ease.out(k));
    if (s.phase === 'show') cy += Math.sin(s.showT / 380) * P * 0.02;
    if (s.popT < 400) sc *= 1 + 0.12 * Math.sin(s.popT / 400 * Math.PI);
    let a = 1;
    if (s.phase === 'leave') { const q = Ease.in(Math.min(1, s.leaveT / 480)); sc *= 1 - 0.7 * q; cy -= g.H * 0.35 * q; a = 1 - q; }
    x.save(); x.globalAlpha *= a;

    const R = P * 0.62 * sc, gl = x.createRadialGradient(cx, cy, 0, cx, cy, R);
    const c = f.tier === 1 ? '255,214,60' : f.tier === 2 ? '255,170,230' : '255,250,235';
    gl.addColorStop(0, `rgba(255,255,255,0.95)`); gl.addColorStop(0.55, `rgba(${c},0.7)`); gl.addColorStop(1, `rgba(${c},0)`);
    x.fillStyle = gl; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fill();
    const D = P * sc;
    x.drawImage(this.prize, cx - D / 2, cy - D / 2, D, D);
    if (s.phase === 'show' || s.phase === 'leave') this.badges(x, cx, cy, P * sc, s, Math.min(1, (s.showT || 0) / 300));
    x.restore();
  },
  // NEW, ×2, and a ribbon for 稀有 / 隐藏款
  badges(x, cx, cy, P, s, k) {
    const f = s.f, e = Ease.back(k);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    if (s.fresh) {
      x.save(); x.translate(cx + P * 0.38, cy - P * 0.36); x.rotate(-0.25 + Math.sin(s.t / 300) * 0.06); x.scale(e, e);
      x.beginPath();
      for (let i = 0; i < 24; i++) { const ang = i * Math.PI / 12, rr = i % 2 ? P * 0.1 : P * 0.13; x.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr); }
      x.closePath(); x.fillStyle = '#ff4f6d'; x.fill(); x.lineWidth = P * 0.018; x.strokeStyle = '#fff'; x.stroke();
      x.font = `900 ${P * 0.075}px "Arial Rounded MT Bold","Trebuchet MS",${FONT}`; x.fillStyle = '#fff'; x.fillText('NEW', 0, P * 0.004);
      x.restore();
    } else {
      x.save(); x.translate(cx + P * 0.38, cy + P * 0.34); x.scale(e, e);
      Art.rr(x, -P * 0.1, -P * 0.06, P * 0.2, P * 0.12, P * 0.06); x.fillStyle = '#8466c4'; x.fill(); x.lineWidth = P * 0.014; x.strokeStyle = '#fff'; x.stroke();
      x.font = `900 ${P * 0.075}px ${FONT}`; x.fillStyle = '#fff'; x.fillText('×' + s.n, 0, P * 0.004);
      x.restore();
    }
    if (f.tier > 0) {
      const w = P * 0.62, h = P * 0.15;
      x.save(); x.translate(cx, cy + P * 0.56); x.scale(e, e);
      x.beginPath(); x.moveTo(-w / 2 - h * 0.5, -h / 2 + h * 0.15); x.lineTo(-w / 2 - h * 0.15, 0 + h * 0.15); x.lineTo(-w / 2 - h * 0.5, h / 2 + h * 0.15);
      x.lineTo(w / 2 + h * 0.5, h / 2 + h * 0.15); x.lineTo(w / 2 + h * 0.15, h * 0.15); x.lineTo(w / 2 + h * 0.5, -h / 2 + h * 0.15); x.closePath();
      x.fillStyle = f.tier === 2 ? '#c06ad6' : '#d98e00'; x.fill();
      const gr = x.createLinearGradient(-w / 2, 0, w / 2, 0);
      if (f.tier === 2) ['#ff5f8f', '#ffb13a', '#ffe04a', '#5fe07a', '#4ac8ff', '#a77bff'].forEach((c2, i) => gr.addColorStop(i / 5, c2));
      else { gr.addColorStop(0, '#ffe680'); gr.addColorStop(0.5, '#ffcf3a'); gr.addColorStop(1, '#ffe680'); }
      Art.rr(x, -w / 2, -h / 2, w, h, h * 0.3); x.fillStyle = gr; x.fill(); x.lineWidth = P * 0.014; x.strokeStyle = '#fff'; x.stroke();
      x.font = `900 ${h * 0.62}px ${FONT}`; x.lineJoin = 'round'; x.lineWidth = h * 0.16; x.strokeStyle = f.tier === 2 ? '#6a2a8a' : '#8a5200';
      const label = f.tier === 2 ? '隐藏款' : '稀有';
      x.strokeText(label, 0, h * 0.04); x.fillStyle = '#fff'; x.fillText(label, 0, h * 0.04);
      x.restore();
    }
  },

  // ---------- the album (decli 2026-11-05): a page for each island and the friends who live there ----------
  // The islands are tabs along the top, each with how many of its friends she has. A friend she has found shows its fun
  // face (and its name and nickname when tapped); one still in a box is a shadow with a question mark. The twelve
  // partners (PALS) wear a heart: tapping one she has makes it her companion (Pal), shown with a ring.
  album(k) {
    const d = Store.d;
    if (k == null) {   // from the map: what is new is shown once, on the island it came from
      this.fresh = new Set(d.giftFresh || []);
      d.giftFresh = []; Store.save();
      const nf = FRIENDS.find(f => this.fresh.has(f.id));
      k = nf ? nf.isle : d.albumIsle >= 0 ? d.albumIsle : Math.max(0, d.isle);
    }
    if (d.albumIsle !== k) { d.albumIsle = k; Store.save(); }
    UI.closeModal();
    const root = $('#album'); root.hidden = false; root.innerHTML = '';
    const top = el('div', 'top');
    const back = el('button', 'ibtn', '🗺️'); back.onclick = () => { Snd.play('tap'); root.hidden = true; root.innerHTML = ''; UI.map(); };
    top.appendChild(back);
    top.appendChild(el('h1', null, '小伙伴收集册'));
    top.appendChild(el('div', 'pill', `🎁 ${this.count()} / ${FRIENDS.length}`));
    root.appendChild(top);
    const tabs = el('div', 'atabs');
    ISLANDS.forEach((s, j) => {
      const all = FRIENDS.filter(f => f.isle === j), got = all.filter(f => this.owned(f.i)).length;
      const t = el('button', 'atab' + (j === k ? ' on' : '') + (got === all.length ? ' full' : '') + (all.some(f => this.fresh && this.fresh.has(f.id)) ? ' new' : ''));
      const pic = Art2.img['island-' + (j + 1)];
      if (pic) { const im = el('img'); im.src = pic.src; im.alt = ''; t.appendChild(im); } else t.appendChild(el('span', 'ic', s.icon));
      t.appendChild(el('small', null, `${got}/${all.length}`));
      t.onclick = () => { if (j === k) return; Snd.play('swap'); this.album(j); };
      tabs.appendChild(t);
    });
    root.appendChild(tabs);
    const page = el('div', 'apage'), grid = el('div', 'agrid');
    page.appendChild(el('div', 'aname', `${ISLANDS[k].icon} ${ISLANDS[k].name}`));
    page.appendChild(grid); root.appendChild(page);
    const list = FRIENDS.filter(f => f.isle === k), pal = Pal.id();
    const slots = list.map(f => {
      const n = d.gifts[f.id] || 0, has = this.owned(f.i), isPal = PALS.includes(f.id);
      const b = el('button', 'aslot t' + Math.max(0, f.tier) + (has ? '' : ' no') + (n >= 2 ? ' shiny' : '') + (isPal ? ' pal' : '') + (f.id === pal ? ' mine' : ''));
      if (this.fresh && this.fresh.has(f.id)) b.appendChild(el('i', 'anew', 'NEW'));
      if (n > 1) b.appendChild(el('b', null, '×' + n));
      if (isPal) b.appendChild(el('u', null, f.id === pal ? '✓' : '♥'));
      b.onclick = () => {
        if (!has) { Snd.play('bad'); Voice.say(L.gift.locked); b.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], 250); return; }
        b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.15) rotate(-3deg)' }, { transform: 'scale(1)' }], 380);
        if (isPal && f.id !== Pal.id()) {
          Snd.play('make'); Pal.choose(f.id);
          $$('.aslot.mine', grid).forEach(o => { o.classList.remove('mine'); const u = $('u', o); if (u) u.textContent = '♥'; });
          b.classList.add('mine'); $('u', b).textContent = '✓';
          const r = b.getBoundingClientRect(); Fx.sparkles(r.left + r.width / 2, r.top + r.height / 2, 14, r.width * 0.6, '#ffd23a');
        } else { Snd.play('select'); Voice.say(L.gift.who[f.i]); }
      };
      grid.appendChild(b);
      return b;
    });
    // as many columns as keep the slots square and as big as they can be
    const paint = () => {
      if (root.hidden || !grid.isConnected) return;
      const W = grid.clientWidth, H = grid.clientHeight, n = list.length, gap = 10;
      let best = 0, cols = 1;
      for (let c = 1; c <= n; c++) { const r = Math.ceil(n / c), q = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r); if (q > best) { best = q; cols = c; } }
      const px = Math.max(30, Math.floor(Math.min(best, 170)));

      const dpr = Math.min(devicePixelRatio || 1, 2), cp = Math.floor(px * 0.96);

    this._albumResize = () => requestAnimationFrame(paint);
    addEventListener('resize', this._albumResize);
    if (!d.seen.album2) { d.seen.album2 = 1; Store.save(); Voice.say(L.gift.album); }
  },
  // a friend for the album: its fun face, or its shadow with a question mark if she has not found it yet
  slot(f, s) {
    const has = this.owned(f.i), c = Art.friend(f.i, s, s * 0.86, has ? 'f' : 'b');
    if (has) return c;
    const x = c.getContext('2d');
    x.globalCompositeOperation = 'source-in'; x.fillStyle = f.tier === 2 ? '#d9cbe6' : f.tier === 1 ? '#e6d9b8' : '#d3d9c4'; x.fillRect(0, 0, s, s);
    x.globalCompositeOperation = 'source-over';

    x.lineWidth = s * 0.05; x.strokeStyle = '#9aa58a'; x.strokeText('?', s / 2, s * 0.53); x.fillStyle = '#fff'; x.fillText('?', s / 2, s * 0.53);
    return c;
  },
};

// 动物消消乐 · 伙伴 (decli 2026-11-05, from her 怪趣森林 style sketch): one of the twelve partners — the characters
// decli drew with four faces (PALS in lines.js, HEADS.pals) — keeps the child company. It sits at the top of the side
// panel while they play and reacts with its faces: listening (the board face), leaning in when a piece is picked up
// (tap), cheering big moves and wins (fun), and encouraging when the moves run low, the 小帮手 comes or a game is lost
// (cheer). It also stands for the child on the map and in the middle of the wheel. The child picks it in the album,
// from the partners they have; the panda keeps them company until then.
const Pal = {
  root: null, cv: null, bub: null, face: 'b', timer: 0,
  id() { const id = Store.d.pal; return id && PALS.includes(id) && Gift.owned(Art.byId(id)) ? id : 'panda'; },
  i() { return Art.byId(this.id()); },
  // the companion's panel, first in the HUD
  mount(parent) {
    const p = el('div', 'panel pal'), cv = this.cv = el('canvas'), bub = this.bub = el('span', 'bub');
    p.appendChild(cv); p.appendChild(bub); parent.appendChild(p);
    p.onclick = () => { Snd.play('tap'); this.react('tap'); Voice.say(L.gift.who[this.i()]); };
    clearTimeout(this.timer);
    this.root = p; this.face = 'b';
    requestAnimationFrame(() => this.draw());
    return p;
  },
  draw() {
    if (!this.cv || !this.root.isConnected) return;
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2), s = Math.max(48, Math.round(Math.max(r.width, r.height) * dpr * 1.5));
    if (this.cv.width !== s) this.cv.width = this.cv.height = s;
    const x = this.cv.getContext('2d'); x.clearRect(0, 0, s, s);
    Art.friendTo(x, this.i(), s / 2, s / 2, s * 0.92, this.face);
  },
  // a face for a while (ms, or its own time), with a little bubble, then back to listening
  react(kind, ms) {
    if (!this.root || !this.root.isConnected) return;
    const [face, t, emo] = { tap: ['t', 1300, '👀'], joy: ['f', 2200, '🎉'], cheer: ['c', 2800, '💪'] }[kind];
    if (kind === 'tap' && this.face !== 'b' && this.face !== 't') return;   // a cheer is not cut short by a tap
    this.face = face; this.draw();
    if (kind !== 'tap') {
      this.root.animate([{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-8px) scale(1.06)' }, { transform: 'translateY(0) scale(1)' }], { duration: 420, easing: 'ease-out' });
      this.bub.textContent = emo; this.bub.classList.remove('on'); void this.bub.offsetWidth; this.bub.classList.add('on');
    }
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.face = 'b'; this.draw(); this.bub.classList.remove('on'); }, Math.min(ms || t, 2e9));
  },
  // from the album: the new companion
  choose(id) {
    Store.d.pal = id; Store.save();
    Voice.say(L.pal.chosen[id]);
  },
};

// 动物消消乐 · one level being played: drawing the board, the finger, playing back what board.js worked out,
// the side panel (moves, goals, score) and the end of the level.
const Game = {
  b: null, lv: null, li: 0, sprites: new Map(), vis: [], cv: null, ctx: null, dpr: 1,
  G: { cell: 60, ox: 0, oy: 0, w: 0, h: 0 }, base: null, clip: null, active: false, busy: false, over: false,
  sel: -1, down: null, hint: null, lastAct: 0, cheered: 0, lastCheer: -1e9, hudScore: 0, hudGoals: [], extraUsed: false,
  saidLow: false, popSnd: 0, bg: [], hintT: 0, hintAfter: 7000,

  init() {
    this.cv = $('#cv'); this.ctx = this.cv.getContext('2d');
    for (let i = 0; i < 14; i++) this.bg.push({ x: Math.random(), y: Math.random(), r: rnd(20, 70), v: rnd(0.004, 0.012), h: pick(['255,255,255', '200,225,160', '245,215,150', '240,195,170']) });
    const cv = this.cv;
    cv.addEventListener('pointerdown', e => this.pdown(e));
    cv.addEventListener('pointermove', e => this.pmove(e));
    cv.addEventListener('pointerup', e => this.pup(e));
    cv.addEventListener('pointercancel', () => { this.down = null; });
    addEventListener('resize', () => { if (this.active) this.layout(); });
  },

  // ---------- starting a level ----------
  start(li) {
    Cast.take(li);
    this.li = li; this.lv = LEVELS[li];
    this.b = new Board(this.lv);
    // 小帮手: two lost games in a row on this level start the next with a striped animal already made (four: and a bomb)
    const streak = (Store.d.fails || {})[li] || 0;
    this.helped = streak >= 2 ? this.b.helper(streak >= 4 ? [pick(['h', 'v']), 'b'] : [pick(['h', 'v'])]) : [];
    this.active = true; this.busy = false; this.over = false; this.sel = -1; this.hint = null; this.extraUsed = false; this.saidLow = false;
    this.cheered = 0; this.hudScore = 0;
    this.hintAfter = Store.d.seen.swipe ? 7000 : 1500;   // the very first game: the finger shows how to swipe straight away
    Fx.clear(); Clock.clear();
    this.sprites.clear();
    this.vis = this.b.cells.map(x => ({ ice: x.ice, box: x.box, bub: x.bub, dirt: x.dirt, grass: x.grass, cage: x.cage, hit: -1e9, grew: -1e9 }));
    this.b.cells.forEach((x, i) => { if (x.p) this.addSprite(x.p, i); });
    this.hudGoals = this.b.goals.map(g => g.left);
    this.buildHud();
    $('#hud').hidden = false; $('#map').hidden = true; $('#album').hidden = true;
    this.layout();
    // drop the animals in from the top, row by row
    for (const s of this.sprites.values()) { s.r0 = s.r; s.r -= this.b.R + 1; s.delay = (this.b.R - s.r0) * 35 + s.c * 12; }
    this.busy = true;
    Clock.tween(700 + this.b.R * 35, (k, raw) => {
      const t = raw * (700 + this.b.R * 35);
      for (const s of this.sprites.values()) {
        if (s.r0 == null) continue;
        const kk = clamp((t - s.delay) / 420, 0, 1);
        s.r = s.r0 - (1 - Ease.back(kk)) * (this.b.R + 1);
      }
    }).then(() => {
      for (const s of this.sprites.values()) { if (s.r0 != null) s.r = s.r0; s.r0 = null; }
      this.busy = false; this.lastAct = Clock.now;
      if (this.helped.length) {   // the helping hand shows itself
        Voice.say(L.helper); Pal.react('cheer');
        this.helped.forEach(i => { const [r, c] = this.b.rc(i), [x, y] = this.cellXY(r, c); Fx.ring(x, y, '#ffd23a', this.G.cell * 0.2, this.G.cell, 600, 8); Fx.sparkles(x, y, 12, this.G.cell * 0.6, '#ffd23a'); const p = this.b.cells[i].p; if (p) this.showOff(p); });
        Snd.play('make');
      }
    });
    Music.start();
  },
  addSprite(p, i) {
    const [r, c] = this.b.rc(i);
    const s = { id: p.id, p, r, c, sc: 1, sx: 1, sy: 1, flash: 0, land: -1e9, born: Clock.now, wig: 0, hp: p.hp };
    this.sprites.set(p.id, s);
    return s;
  },
  stop() { this.active = false; $('#hud').hidden = true; Fx.clear(); Clock.clear(); },

  // ---------- layout ----------
  layout() {
    const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2), hud = $('#hud');
    this.dpr = dpr;
    this.cv.width = Math.round(W * dpr); this.cv.height = Math.round(H * dpr);
    this.cv.style.width = W + 'px'; this.cv.style.height = H + 'px';
    Fx.resize(W, H, dpr);
    if (!this.b) return;
    const wide = W >= H * 1.1;
    hud.className = wide ? 'side' : 'top';
    // a landscape phone is too short for the side panel (and a very narrow phone too narrow for the top one):
    // measure the panels at full size, then shrink the whole column (or row) until it fits
    hud.style.transform = ''; hud.style.height = ''; hud.style.bottom = wide ? 'auto' : '';
    hud.style.width = wide ? clamp(W * 0.25, 200, 290) + 'px' : '';
    const k = Math.min(1, wide ? H / hud.offsetHeight : W / hud.scrollWidth);
    if (wide) hud.style.height = H / k + 'px'; else if (k < 1) hud.style.width = W / k + 'px';
    if (k < 1) hud.style.transform = `scale(${k})`;
    const box = hud.getBoundingClientRect();
    let area;
    if (wide) area = { x: 0, y: 0, w: W - box.width, h: H };
    else area = { x: 0, y: box.height, w: W, h: H - box.height };
    const pad = 26, R = this.b.R, C = this.b.C, extra = this.b.pg.total ? 0.35 : 0;
    const cell = Math.floor(Math.min((area.w - 2 * pad) / C, (area.h - 2 * pad) / (R + extra), 120));
    const G = this.G;
    G.cell = cell; G.w = cell * C; G.h = cell * R;
    G.ox = Math.round(area.x + (area.w - G.w) / 2);
    G.oy = Math.round(area.y + (area.h - G.h - extra * cell) / 2);
    Art.setCell(cell, dpr);
    this.makeBase();
  },
  cellXY(r, c) { const G = this.G; return [G.ox + (c + 0.5) * G.cell, G.oy + (r + 0.5) * G.cell]; },
  makeBase() {
    const G = this.G, b = this.b, d = this.dpr, cell = G.cell, f = cell * 0.13, pad = cell * 0.5;
    const W = (G.w + 2 * pad) * d, H = (G.h + 2 * pad) * d;
    const frame = Art.canvas(W, H), fx = frame.getContext('2d');
    fx.scale(d, d); fx.translate(pad, pad);
    // 怪趣森林: a leaf-green felt board with cream cells (decli's sketch, 2026-11-05)
    fx.fillStyle = '#a3c77a';
    b.cells.forEach((x, i) => { if (x.v) return; const [r, c] = b.rc(i); Art.rr(fx, c * cell - f, r * cell - f, cell + 2 * f, cell + 2 * f, cell * 0.28); fx.fill(); });
    const base = Art.canvas(W, H), x = base.getContext('2d');
    x.save(); x.shadowColor = 'rgba(61,82,41,0.3)'; x.shadowBlur = 18 * d; x.shadowOffsetY = 6 * d; x.drawImage(frame, 0, 0); x.restore();
    x.scale(d, d); x.translate(pad, pad);
    b.cells.forEach((cl, i) => {
      if (cl.v) return;
      const [r, c] = b.rc(i);
      Art.rr(x, c * cell + 2, r * cell + 2, cell - 4, cell - 4, cell * 0.2);
      x.fillStyle = (r + c) % 2 ? '#f3ecd7' : '#fcf7ea'; x.fill();
    });
    if (b.pg.total) {   // where the penguins go home
      x.fillStyle = '#73a848'; x.strokeStyle = '#fff'; x.lineWidth = 3; x.lineJoin = 'round';
      b.cells.forEach((cl, i) => {
        if (!b.exit[i]) return;
        const [r, c] = b.rc(i), cx = (c + 0.5) * cell, cy = (r + 1) * cell + cell * 0.16;
        x.beginPath(); x.moveTo(cx - cell * 0.16, cy - cell * 0.02); x.lineTo(cx + cell * 0.16, cy - cell * 0.02); x.lineTo(cx, cy + cell * 0.16); x.closePath(); x.stroke(); x.fill();
      });
    }
    this.base = { c: base, pad };
    const clip = new Path2D();
    b.cells.forEach((cl, i) => { if (cl.v) return; const [r, c] = b.rc(i); clip.rect(G.ox + c * cell - f, G.oy + r * cell - f, cell + 2 * f, cell + 2 * f); });
    this.clip = clip;
  },

  // ---------- drawing ----------
  draw() {
    const ctx = this.ctx, d = this.dpr, W = this.cv.width / d, H = this.cv.height / d;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, this.cv.width, this.cv.height);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    // floating bubbles in the background
    for (const o of this.bg) {
      o.y -= o.v * 0.016; if (o.y < -0.15) { o.y = 1.15; o.x = Math.random(); }
      ctx.fillStyle = `rgba(${o.h},0.35)`; ctx.beginPath(); ctx.arc(o.x * W + Math.sin(Clock.now / 2000 + o.r) * 20, o.y * H, o.r, 0, 7); ctx.fill();
    }
    if (!this.active || !this.base) return;
    const G = this.G, b = this.b, cell = G.cell, t = Clock.now;
    const [sx, sy] = Fx.shakeOffset();
    ctx.setTransform(d, 0, 0, d, sx * d, sy * d);
    ctx.drawImage(this.base.c, G.ox - this.base.pad, G.oy - this.base.pad, this.base.c.width / d, this.base.c.height / d);
    this.vis.forEach((v, i) => {   // 种草地: bare soil, or the grass that grew there (popping up when it has just grown)
      if (!v.dirt) return;
      const [r, c] = b.rc(i), k = clamp((t - v.grew) / 380, 0, 1);
      if (!v.grass || k < 1) ctx.drawImage(Art.cache.dirt, G.ox + c * cell, G.oy + r * cell, cell, cell);
      if (v.grass) { const sc = Ease.back(k); ctx.globalAlpha = Math.min(1, k * 2); ctx.drawImage(Art.cache.grass, G.ox + (c + 0.5 - sc / 2) * cell, G.oy + (r + 0.5 - sc / 2) * cell, cell * sc, cell * sc); ctx.globalAlpha = 1; }
    });
    this.vis.forEach((v, i) => {
      if (!v.ice) return;
      const [r, c] = b.rc(i);
      ctx.drawImage(Art.cache['ice' + v.ice], G.ox + c * cell, G.oy + r * cell, cell, cell);
    });
    if (this.sel >= 0) {
      const [r, c] = b.rc(this.sel), pul = 0.5 + 0.5 * Math.sin(t / 160);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6 + 0.4 * pul;
      ctx.drawImage(Fx.dot('#ffd23a'), G.ox + (c - 0.35) * cell, G.oy + (r - 0.35) * cell, cell * 1.7, cell * 1.7); ctx.restore();
    }
    ctx.save(); ctx.clip(this.clip);
    const list = [...this.sprites.values()].sort((a, c) => (a.z || 0) - (c.z || 0));
    for (const s of list) {
      let [x, y] = this.cellXY(s.r, s.c);
      let sc = s.sc, sxx = s.sx, syy = s.sy;
      const since = t - s.land;
      if (since < 260) { const k = since / 260, a = Math.sin(k * Math.PI) * (1 - k) * 0.22; syy *= 1 - a; sxx *= 1 + a; y += a * cell * 0.25; }
      if (this.sel >= 0 && this.b.cells[this.sel].p === s.p && !this.busy) { const k = Math.abs(Math.sin(t / 180)); y -= k * cell * 0.08; syy *= 1 + k * 0.04; }
      if (s.wig) { const k = Math.sin(t / 90) * s.wig; x += k * cell * 0.08 * (s.wdx || 0); y += k * cell * 0.08 * (s.wdy || 0); }
      if (s.p.k === 'g' || s.p.k === 'l') y += Math.sin(t / 300 + s.c) * cell * 0.03;
      ctx.globalAlpha = s.a == null ? 1 : s.a;
      // its fun face when she picks it up, when the hint wiggles it and as it pops (怪趣森林, decli 2026-11-05)
      const fun = s.fun || s.wig > 0 || (this.sel >= 0 && this.b.cells[this.sel].p === s.p);
      Art.piece(ctx, s.p, x, y, sc, t, s.flash, sxx, syy, s.hp, fun);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    this.vis.forEach((v, i) => {
      if (!v.bub && !v.box && v.cage < 0) return;
      const [r, c] = b.rc(i), [x, y] = this.cellXY(r, c);
      const hk = clamp((t - v.hit) / 260, 0, 1), hit = hk < 1 ? Math.sin(hk * Math.PI) * 0.12 : 0;
      if (v.cage >= 0) Art.cageAt(ctx, v.cage, x, y, cell * (1.04 + hit * 0.5));
      if (v.box) { const s = cell * (1 - hit); ctx.drawImage(Art.cache['box' + v.box], x - s / 2, y - s / 2, s, s); }
      if (v.bub) { const w = 1 + Math.sin(t / 400 + i) * 0.03, s = Art.T / d * w; ctx.drawImage(Art.cache.bub, x - s / 2, y - s / 2, s, s); }
    });
    if (this.hint && !this.busy && $('#modal').hidden) {
      const [r1, c1] = b.rc(this.hint.a), [r2, c2] = b.rc(this.hint.b), [x1, y1] = this.cellXY(r1, c1), [x2, y2] = this.cellXY(r2, c2);
      this.drawFinger(ctx, x1, y1, x2, y2, t - this.hintT, 1);
    }
  },
  frame(dt) {
    if (!this.active) return;
    for (const s of this.sprites.values()) { if (s.flash > 0 && !s.holdFlash) s.flash = Math.max(0, s.flash - dt / 250); }
    // a gentle nudge when she has not moved for a while: the two pieces wiggle and a finger shows the swipe
    if (!this.busy && !this.over && Clock.now - this.lastAct > this.hintAfter && !this.hint && $('#modal').hidden) {
      const h = this.b.hint();
      if (h) {
        this.hint = h;
        const [r1, c1] = this.b.rc(h.a), [r2, c2] = this.b.rc(h.b);
        const A = this.sprites.get(this.b.cells[h.a].p.id), B = this.sprites.get(this.b.cells[h.b].p.id);
        if (A && B) { A.wig = 1; A.wdx = c2 - c1; A.wdy = r2 - r1; B.wig = 1; B.wdx = c1 - c2; B.wdy = r1 - r2; }
        this.hintT = Clock.now;
      }
    }
    const want = this.b.score;
    if (this.hudScore < want) { this.hudScore = Math.min(want, this.hudScore + Math.max(10, (want - this.hudScore) * dt / 180)); this.drawScore(); }
  },
  // the hint's finger, drawn like the one in drawShowOff: press on (x0, y0), slide to (x1, y1), lift; t: ms since it began
  drawFinger(ctx, x0, y0, x1, y1, t, a) {
    const cell = this.G.cell, ph = (t % 1300) / 1300, slide = Ease.inOut(clamp((ph - 0.25) / 0.4, 0, 1));
    const fx = lerp(x0, x1, slide), fy = lerp(y0, y1, slide), sz = cell * 0.95;
    ctx.save();
    ctx.globalAlpha = a * (ph < 0.08 ? ph / 0.08 : ph > 0.85 ? (1 - ph) / 0.15 : 1);
    if (ph > 0.2 && ph < 0.75) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(fx, fy, cell * 0.2, 0, 7); ctx.fill(); }
    ctx.font = `${sz}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.shadowColor = 'rgba(74,43,94,0.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
    ctx.fillText('👆', fx + sz * 0.08, fy - sz * 0.06 + (ph < 0.25 ? (0.25 - ph) * cell * 0.6 : 0));
