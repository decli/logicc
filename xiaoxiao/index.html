<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ffd9ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="icon" href="../icon-192.png"><meta name="description" content="动物消消乐：三个连成一排就消掉，十关闯关，每局之后做一页数学题。"><title>动物消消乐</title>
<style>
:root{
  /* 怪趣森林 (decli 2026-11-05): felt and clay on a cream table, leaf-green frames, orange buttons (the names are older) */
  --ink:#3d5229;           /* deep forest green for text and outlines */
  --pink:#f7a95a; --pink2:#ee8a3c;   /* orange felt: the main buttons */
  --violet:#a68fdc; --violet2:#8466c4;
  --leaf:#a8cc7c; --leaf2:#7aa651; --leaf3:#557f38; --cream:#fffbf1; --stitch:rgba(122,166,81,.5);
  --sky:#7cc8ff; --mint:#5fe0b0; --sun:#ffd23a; --orange:#ff9d3a; --red:#ff5a5a;
  --card:#fffbf2;
  --shadow:0 6px 0 rgba(61,82,41,.18),0 10px 24px rgba(61,82,41,.18);
  --font:"Hiragino Maru Gothic ProN","Yuanti SC","PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 10% 14%,rgba(255,255,255,.7) 0 70px,transparent 71px),radial-gradient(circle at 92% 88%,rgba(190,215,150,.35) 0 130px,transparent 131px),
  radial-gradient(circle at 6% 92%,rgba(245,205,140,.25) 0 90px,transparent 91px),linear-gradient(170deg,#f8f2e4 0%,#f1ead4 50%,#e2edcd 100%);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#cv,#fx{display:block;position:fixed;left:0;top:0}
#cv{z-index:1;touch-action:none}
#fx{z-index:32;pointer-events:none}

/* ---------- candy buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35em;min-height:58px;padding:0 26px;border-radius:999px;font-size:24px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#f9b46b,var(--pink2));box-shadow:0 5px 0 #b9601c,0 10px 18px rgba(185,96,28,.3);text-shadow:0 2px 0 rgba(0,0,0,.15);
  transition:transform .12s, box-shadow .12s;position:relative}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:6px;height:30%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b9601c,0 4px 10px rgba(185,96,28,.3)}
.btn.green{background:linear-gradient(180deg,#b2d887,#73a848);box-shadow:0 5px 0 #4d7c2e,0 10px 18px rgba(77,124,46,.3)}
.btn.green:active{box-shadow:0 1px 0 #4d7c2e}
.btn.violet{background:linear-gradient(180deg,#c4b0ea,var(--violet2));box-shadow:0 5px 0 #5e4796,0 10px 18px rgba(94,71,150,.3)}
.btn.violet:active{box-shadow:0 1px 0 #5e4796}
.btn.sun{background:linear-gradient(180deg,#ffe08a,#f2b630);box-shadow:0 5px 0 #b98516,0 10px 18px rgba(185,133,22,.3);color:#6b4a10;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.sun:active{box-shadow:0 1px 0 #b98516}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d8d2b4,0 10px 18px rgba(61,82,41,.12);text-shadow:none}
.btn.ghost:active{box-shadow:0 1px 0 #d8d2b4}
.btn.small{min-height:46px;font-size:19px;padding:0 18px}
.ibtn{width:56px;height:56px;border-radius:50%;background:var(--cream);box-shadow:0 4px 0 #d8d2b4,0 8px 16px rgba(61,82,41,.15);font-size:28px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d8d2b4}

/* ---------- map ---------- */
#map{position:fixed;inset:0;z-index:10;overflow:hidden;
  background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.75) 0 60px,transparent 61px),radial-gradient(circle at 80% 85%,rgba(255,255,255,.5) 0 90px,transparent 91px),linear-gradient(170deg,#f8f2e4 0%,#f1ead4 50%,#e2edcd 100%)}
#map .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
#map h1{margin:0;font-size:34px;font-weight:900;letter-spacing:2px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);flex:1;text-align:center;white-space:nowrap}
#map .pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 16px;font-size:22px;font-weight:800;box-shadow:0 4px 0 #d8d2b4}
#path{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#fff 0 18%,#f8c690 19% 100%);box-shadow:0 6px 0 #c8742a,0 12px 20px rgba(200,116,42,.35);font-size:40px;font-weight:900;color:#fff;
  -webkit-text-stroke:2px #a85a18;paint-order:stroke fill;transition:transform .15s}
.node:active{transform:scale(.94)}
.node.done{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#f5cf55 19% 100%);box-shadow:0 6px 0 #b98a16,0 12px 20px rgba(185,138,22,.35);-webkit-text-stroke-color:#a86b00}
.node.lock{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#d6d6c6 19% 100%);box-shadow:0 6px 0 #a7a891;-webkit-text-stroke-color:#87887a;font-size:30px}
.node.cur{animation:bob 1.2s ease-in-out infinite}
.node .st{position:absolute;bottom:-28px;font-size:22px;-webkit-text-stroke:0;letter-spacing:-2px;white-space:nowrap;filter:drop-shadow(0 2px 0 rgba(61,82,41,.25))}
.node .nm{position:absolute;bottom:-60px;font-size:17px;font-weight:800;-webkit-text-stroke:0;color:var(--ink);background:rgba(255,255,255,.85);padding:2px 10px;border-radius:999px;white-space:nowrap}
.avatar{position:absolute;width:76px;height:76px;margin:-118px 0 0 -38px;pointer-events:none;animation:hop 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{50%{transform:translateY(-12px) rotate(-4deg)}}

/* season two: islands */
#map .deco{position:absolute;inset:0;pointer-events:none}
#map .deco span{position:absolute;transform:translate(-50%,-50%);opacity:.85;animation:sway 4s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(61,82,41,.15))}
@keyframes sway{50%{transform:translate(-50%,-58%) rotate(4deg)}}
.node.boss{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#c4b0ea 19% 100%);box-shadow:0 6px 0 #5e4796,0 12px 20px rgba(94,71,150,.35);-webkit-text-stroke-color:#5e4796}
.node.boss::before{content:"👑";position:absolute;top:-.62em;font-size:.6em;-webkit-text-stroke:0}
.node.boss.done{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#f5cf55 19% 100%);box-shadow:0 6px 0 #b98a16,0 12px 20px rgba(185,138,22,.35);-webkit-text-stroke-color:#a86b00}
.isle-arrow{position:absolute;top:52%;width:62px;height:62px;margin-top:-31px;border-radius:50%;background:#fff;box-shadow:0 5px 0 #d8d2b4,0 10px 18px rgba(61,82,41,.18);
  font-size:30px;color:var(--violet2);display:flex;align-items:center;justify-content:center;z-index:2}
.isle-arrow.prev{left:max(10px,env(safe-area-inset-left))}
.isle-arrow.next{right:max(10px,env(safe-area-inset-right))}
.isle-arrow.shut{color:#b4b59e}
.isle-arrow:active{transform:translateY(3px)}
#map .isles{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;padding:8px 12px;background:rgba(255,255,255,.7);border-radius:999px;box-shadow:0 4px 0 rgba(217,198,234,.8)}
.isle{width:50px;height:50px;border-radius:50%;background:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #d8d2b4;position:relative}
.isle img{width:118%;height:118%;object-fit:contain;pointer-events:none}
.isle.on{box-shadow:0 0 0 4px #ffd23a,0 3px 0 #d8d2b4;transform:scale(1.14)}
.isle.shut{filter:grayscale(1);opacity:.55}
.isle.full::after{content:"⭐";position:absolute;right:-8px;top:-10px;font-size:18px}
.isle-lock{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:120px;opacity:.35;pointer-events:none}
.card .isle-pic{width:220px;height:220px;object-fit:contain;display:block;margin:4px auto}
#map.tight .node .nm{display:none}
#map.tight .node .st{bottom:-22px;font-size:16px}
@media (max-width:600px),(max-height:500px){
  #map h1{font-size:24px;letter-spacing:0;-webkit-text-stroke-width:1.5px;text-shadow:0 3px 0 var(--ink)}
  #map .pill{font-size:16px;padding:6px 10px}
  #map .top{gap:8px}
  #map .isles{gap:6px;padding:5px 8px}
  .isle{width:38px;height:38px;font-size:21px}
}
@media (max-width:600px){.isle-arrow{display:none}}
#map .top .pill{white-space:nowrap;flex:none}
#map h1{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){#map .top .pill.stars{display:none}#map h1{font-size:20px}#map h1 .ic{display:none}#map .top{gap:6px}}
#map .pill.book{cursor:pointer}
#map .pill.book.new{animation:wig 1.1s ease-in-out infinite;box-shadow:0 4px 0 #d8d2b4,0 0 0 4px #e2483d}
@keyframes wig{0%,60%,100%{transform:none}70%{transform:rotate(-6deg) scale(1.08)}80%{transform:rotate(6deg) scale(1.08)}90%{transform:rotate(-3deg)}}

/* ---------- the blind box and the album (gift.js) ---------- */
#gift{position:fixed;inset:0;z-index:31;touch-action:none}
#gift canvas{position:absolute;left:0;top:0}
#gift .keep{position:absolute;left:50%;bottom:max(34px,env(safe-area-inset-bottom));min-height:68px;font-size:30px;padding:0 40px;
  transform:translate(-50%,60px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,1.6,.4,1),opacity .25s}
#gift .keep.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#album{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.7) 0 70px,transparent 71px),linear-gradient(170deg,#fbf6e8 0%,#f4eedb 55%,#e6efd6 100%);
  padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
#album .top{display:flex;align-items:center;gap:14px}
#album h1{margin:0;font-size:34px;font-weight:900;letter-spacing:2px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);flex:1;text-align:center;white-space:nowrap}
#album .pill{background:#fff;border-radius:999px;padding:8px 16px;font-size:22px;font-weight:800;box-shadow:0 4px 0 #d8d2b4}
#album .atabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.atab{position:relative;width:76px;height:76px;border-radius:22px;background:var(--cream);box-shadow:0 4px 0 #d8d2b4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .15s}
.atab img{width:56px;height:46px;object-fit:contain;pointer-events:none}
.atab .ic{font-size:34px;line-height:1.25}
.atab small{font-size:14px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.atab.on{background:var(--leaf);box-shadow:0 4px 0 var(--leaf3),0 0 0 4px #fff;transform:translateY(-3px) scale(1.06);color:#fff;text-shadow:0 1px 0 var(--leaf3)}
.atab.full::after{content:"⭐";position:absolute;right:-8px;top:-10px;font-size:18px}
.atab.new::before{content:"";position:absolute;left:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:#e2483d;border:3px solid #fff;animation:pulse .8s ease-in-out infinite}
#album .apage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--cream);border-radius:30px;padding:14px 16px 18px;
  box-shadow:0 6px 0 #c9d6a8,0 12px 26px rgba(61,82,41,.12);outline:2px dashed var(--stitch);outline-offset:-9px}
#album .aname{font-size:22px;font-weight:900;letter-spacing:1px}
#album .agrid{flex:1;min-height:0;align-self:stretch;display:grid;gap:10px;justify-content:center;align-content:center}
.aslot{position:relative;min-width:0;min-height:0;border-radius:22px;background:#f7f3e3;box-shadow:0 4px 0 #e0d6b8;display:flex;align-items:center;justify-content:center}
.aslot.t1{background:radial-gradient(circle at 50% 45%,#fffdf0 0 35%,#f8dc86 100%);box-shadow:0 4px 0 #c99a1e}
.aslot.t2{background:conic-gradient(#ffc6dc,#ffe3a8,#fff6a8,#c8f5d2,#c4e9ff,#e0d0ff,#ffc6dc);box-shadow:0 4px 0 #8fae6a}
.aslot.no{background:#efeedd;box-shadow:0 4px 0 #dcdcc4}
.aslot.no.t1{background:#fbf3d6;box-shadow:0 4px 0 #ecd9a0}
.aslot.no.t2{background:conic-gradient(#f6e3ee,#f8efdc,#f7f4dc,#e3f4e7,#e2eff8,#ece4f8,#f6e3ee);box-shadow:0 4px 0 #d4d8bc}
.aslot canvas{display:block;pointer-events:none}
.aslot.shiny{box-shadow:0 4px 0 #e0a800,0 0 0 3px #ffd23a,0 0 14px 4px rgba(255,210,58,.75);animation:shine 1.6s ease-in-out infinite}
.aslot.shiny::before{content:"✨";position:absolute;left:-8px;top:-10px;font-size:20px}
@keyframes shine{50%{box-shadow:0 4px 0 #e0a800,0 0 0 3px #fff3a6,0 0 22px 8px rgba(255,210,58,.9)}}
@media (max-width:600px),(max-height:500px){
  #album h1{font-size:24px;letter-spacing:0;-webkit-text-stroke-width:1.5px;text-shadow:0 3px 0 var(--ink)}
  #album .pill{font-size:16px;padding:6px 10px;white-space:nowrap}
  #album .top{gap:8px}
  #album .atabs{gap:6px}
  .atab{width:52px;height:58px;border-radius:16px}
  .atab img{width:42px;height:34px}
  .atab .ic{font-size:26px}
  .atab small{font-size:12px}
  #album .apage{padding:10px 8px 12px;border-radius:24px}
  #album .aname{font-size:18px}
}
@media (max-height:500px){#album{flex-direction:column;gap:6px}#album .aname{display:none}}
.aslot.pal u{position:absolute;left:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;background:var(--pink2);color:#fff;font-size:16px;font-weight:900;text-decoration:none;
  display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 0 rgba(61,82,41,.25)}
.aslot.pal.no u{background:#c9c9b4}
.aslot.mine{box-shadow:0 0 0 4px var(--pink2),0 4px 0 4px #b9601c}
.aslot.mine u{background:var(--leaf2)}
.aslot b{position:absolute;right:-5px;bottom:-5px;min-width:30px;height:26px;padding:0 6px;border-radius:999px;background:var(--violet2);color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.aslot .anew{position:absolute;left:-6px;top:-6px;background:#e2483d;color:#fff;font-size:13px;font-weight:900;font-style:normal;padding:2px 7px;border-radius:999px;border:2px solid #fff;animation:pulse .8s ease-in-out infinite}

/* ---------- in-game HUD ---------- */
#hud{position:fixed;z-index:5;display:flex;gap:12px;pointer-events:none}
#hud > *{pointer-events:auto}
#hud.side{right:0;top:0;bottom:0;transform-origin:100% 0;flex-direction:column;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) 16px;
  background:linear-gradient(180deg,var(--leaf),#8fb866);border-radius:34px 0 0 34px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),-4px 0 22px rgba(61,82,41,.2)}
#hud.side::before{content:"";position:absolute;inset:9px 0 9px 9px;border:2px dashed rgba(255,255,255,.45);border-right:0;border-radius:27px 0 0 27px;pointer-events:none}
#hud.top{left:0;right:0;top:0;transform-origin:0 0;flex-direction:row;align-items:stretch;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#8fb866,var(--leaf));border-radius:0 0 30px 30px;box-shadow:0 4px 22px rgba(61,82,41,.2)}
.panel{background:var(--cream);border-radius:26px;box-shadow:0 5px 0 var(--leaf3),0 10px 18px rgba(61,82,41,.18);padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;
  outline:2px dashed var(--stitch);outline-offset:-6px}
/* the companion (pal.js): its face at the top of the panel, a bubble when it reacts */
.panel.pal{position:relative;padding:4px;cursor:pointer;background:radial-gradient(circle at 50% 42%,#fff 0 38%,var(--cream) 70%)}
.panel.pal canvas{width:128px;height:128px;display:block;pointer-events:none}
.pal .bub{position:absolute;right:-8px;top:-10px;font-size:30px;line-height:1;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(61,82,41,.25))}
.pal .bub.on{animation:bub 1.8s ease-out forwards}
@keyframes bub{0%{opacity:0;transform:scale(.3) translateY(12px)}18%{opacity:1;transform:scale(1.2)}30%{transform:scale(1)}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
.moves{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 14%,#93be68 15% 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 5px 0 #557f38;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:transform .15s}
.moves b{font-size:48px;line-height:1;font-weight:900;-webkit-text-stroke:2px #3f6326;paint-order:stroke fill}
.moves span{font-size:15px;font-weight:800;opacity:.95}
.moves.low{background:radial-gradient(circle at 35% 30%,#fff 0 14%,#ef8a57 15% 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 5px 0 #b6502c;animation:pulse .8s ease-in-out infinite}
.moves.low b{-webkit-text-stroke-color:#8f3c1c}
@keyframes pulse{50%{transform:scale(1.07)}}
.goals{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.goal{position:relative;width:74px;height:74px;border-radius:20px;background:#f1efdc;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.goal img,.goal canvas{width:60px;height:60px;object-fit:contain}
.goal b{position:absolute;right:-6px;bottom:-6px;min-width:34px;height:30px;padding:0 7px;border-radius:999px;background:var(--ink);color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.goal.ok b{background:#73a848;font-size:20px}
.goal.bump{transform:scale(1.18)}
.score{width:100%;min-width:150px}
.score .num{font-size:24px;font-weight:900;text-align:center}
.bar{position:relative;align-self:stretch;height:18px;border-radius:999px;background:#e6e3c9;margin:18px 10px 6px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#f9b46b,#ffd23a);width:0;transition:width .35s}
.bar s{position:absolute;top:-18px;margin-left:-14px;font-size:26px;text-decoration:none;filter:grayscale(1) opacity(.45);transition:filter .3s,transform .3s}
.bar s.on{filter:none;transform:scale(1.25)}
.hbtns{display:flex;gap:12px;justify-content:center}
#hud.top .panel{padding:8px 10px;border-radius:22px;justify-content:center}
#hud.top .moves{width:86px;height:86px}
#hud.top .moves b{font-size:38px}
#hud.top .goal{width:62px;height:62px;border-radius:16px}
#hud.top .goal img,#hud.top .goal canvas{width:50px;height:50px}
#hud.top .score{min-width:120px}
#hud.top .panel.pal canvas{width:80px;height:80px}
#hud.top .goals{flex-wrap:nowrap}
.score .sub{font-size:16px;font-weight:800;opacity:.7;text-align:center}
#hud.top .ibtn{width:48px;height:48px;font-size:24px}
/* phones held upright: one row is too narrow for everything, so the score goes on a second row under the moves and goals */
@media (max-width:560px){
  #hud.top{flex-wrap:wrap;gap:8px 10px}
  #hud.top .moves{width:clamp(58px,18vw,78px);height:clamp(58px,18vw,78px)}
  #hud.top .moves b{font-size:clamp(26px,8.5vw,34px)}

}

/* ---------- cards and modals ---------- */

.tstage{flex:1;min-height:0;position:relative;touch-action:none;cursor:pointer;overflow:hidden}
.tframe{position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);background:#fff;box-shadow:0 4px 0 #ecd3b0;box-sizing:border-box}

<body>
<div id="loader"><div style="font-size:64px">🐼</div><div>小伙伴们正在赶来…</div><div class="ld"><i id="ldBar"></i></div></div>

<script>
(() => {
'use strict';
// 动物消消乐 · small helpers shared by everything: DOM, maths, the game clock, saved progress.
const $ = (q, r) => (r || document).querySelector(q);
const $$ = (q, r) => [...(r || document).querySelectorAll(q)];
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;

const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const Ease = {
  out: k => 1 - (1 - k) * (1 - k),
  in: k => k * k,
  inOut: k => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  back: k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  elastic: k => (k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI / 3)) + 1),

// The game clock only moves while frames are drawn, so a hidden tab or the pause card freezes every animation and wait.
const Clock = {
  now: 0, paused: false, jobs: [],
  tick(dt) {
    if (this.paused) return;
    this.now += dt;
    const due = this.jobs;
    this.jobs = [];
    for (const j of due) {
      const k = j.dur > 0 ? clamp((this.now - j.t0) / j.dur, 0, 1) : 1;
      if (j.fn) j.fn(j.ease ? j.ease(k) : k, k);
      if (k >= 1) j.res(); else this.jobs.push(j);
    }
  },

  tween(dur, fn, ease) { return new Promise(res => this.jobs.push({ t0: this.now, dur, fn, ease, res })); },
  wait(ms) { return this.tween(ms, null); },

  clear() { this.jobs = []; },
};

// Saved on this device: progress, the math settings, the record of math pages.
const Store = {
  key: 'logicc.xiaoxiao.v1',
  d: null,
  defaults() {
    return {
      open: 1,               // highest level that can be played
      stars: {}, best: {},   // per level
      owed: false,           // a math page is due before the next game
      played: 0,
      // count: 'wheel', 'ramp' (MATH_RAMP) or a fixed size (MATH_COUNTS); wheel: the numbers on the wheel (0 to MATH_MOST); 家长设置
      math: { max: 100, ops: 2, mode: 'mix', count: 'wheel', wheel: MATH_WHEEL.slice() },
      mathV: 7,              // 7: the wheel's numbers set by a parent (2 to 12 by default), the first game of a day free; 6: the wheel draws 2 to 16, pages go from easy to hard; 5: 10 to 20, within 100, 列竖式 first; 4: the wheel (2 to 10); 3: the day's ramp; 2: a fixed size (10 by default); before that always 20
      today: { day: '', pages: 0 },   // math pages finished today (not the 5-sum page for 5 more moves): where the ramp is
      freeDay: '',           // the day whose first game was let off its math page (Store.newDay)
      spin: null,            // what the wheel landed on for the page owed now, { n, p: played }, so leaving can't spin again
      log: [],               // finished math pages: [time, count, right first time, seconds, settings label]
      way: 'col',            // 小老师 (teach.js) starts with: one way ('col' 'frame' 'line' 'split'), 'pick' (she chooses each time) or 'random', 家长设置
      ways: {},              // how each way went: way -> [times used, then right without counting together]
      wayLast: '',           // the way used last, which glows on the choice
      seen: {},              // tips already shown
      isle: -1,              // the island the map showed last (ISLANDS)
      fails: {},             // level -> games lost in a row (two or more: the next starts with a 小帮手)
      s2: 1,                 // season two: progress made in season one has been carried over
      gifts: {},             // friends from the blind box (gift.js): id -> how many
      giftFresh: [],         // new friends not yet seen in the album
      albumIsle: -1,         // the album's page shown last (an island)
      pal: '',               // the companion she picked in the album (PALS; pal.js), the panda until then
      snd: true, voi: true, mus: true,
    };
  },
  load() {
    this.d = this.defaults();
    try {
      // first visit: follow 思维小画本's sound switches
      const home = JSON.parse(localStorage.getItem('logicc.design.v2') || 'null');
      if (home) { if (typeof home.snd === 'boolean') this.d.snd = home.snd; if (typeof home.voi === 'boolean') this.d.voi = home.voi; if (typeof home.mus === 'boolean') this.d.mus = home.mus; }
      const raw = JSON.parse(localStorage.getItem(this.key) || 'null');
      if (raw) {
        Object.assign(this.d, raw); this.d.math = Object.assign(this.defaults().math, raw.math || {});
        // saved before the wheel: the 20 was fixed in the code, 10 and then the ramp were defaults, so they become the
        // wheel (decli 2026-10-19); a size a parent picked from the settings since the ramp (5, 10, 15, 20) stays
        const v = raw.mathV || 0;
        if (v < 3 || (v < 4 && this.d.math.count === 'ramp')) this.d.math.count = this.defaults().math.count;
        // decli 2026-11-02: harder now, sums within 100 on a wheel of 10 to 20 (a spin of the old wheel is dropped, so
        // the page owed is drawn again), and 小老师 starts with 列竖式 instead of asking her to choose
        if (v < 5) { this.d.math.max = 100; this.d.spin = null; if (!raw.way || raw.way === 'pick') this.d.way = 'col'; }
        if (v < 7) this.d.spin = null;   // decli 2026-11-05 and 11-06: the wheel's numbers changed, a page owed is drawn again
        this.d.mathV = 7;
        // season two: a level won in season one now opens the next (the eleventh after the tenth); the map starts on
        // the island she is up to
        if (!raw.s2) {
          let last = -1; for (const i in this.d.stars) if (this.d.stars[i] > 0) last = Math.max(last, +i);
          this.d.open = Math.max(this.d.open, Math.min(LEVELS.length, last + 2));
          this.d.isle = -1; this.d.s2 = 1;
        }
      }
    } catch (e) { }
    return this.d;
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (e) { } },
  // decli 2026-11-06: the first game of each day needs no math page; the page comes after it (before the next game, or
  // when she comes back later the same day). Called before a game starts; true when it let go a page owed from before.
  newDay() {
    const d = this.d, t = new Date().toDateString();
    if (d.freeDay === t) return false;
    const freed = d.owed;
    d.freeDay = t; d.owed = false; d.spin = null; this.save();
    return freed;
  },
};

// 动物消消乐 · the rules, with no drawing in it (dev/sim.js runs it in node to test the levels).
//
// A turn is worked out all at once: the swap, every match, every special that goes off, every piece that falls and
// every new one that drops in. What happened is returned as a list of phases, each with time-stamped events, and the
// page plays them back (game.js). The board itself is already in its final state when the animation starts.
//
// Cells: v (void, not part of the board), ice (0-2 layers under the piece), box (0-2 layers, a gift box that takes the
// whole cell), bub (a bubble around the piece: it cannot be moved or fall, a match or a blast pops the bubble and the
// piece stays), p (the piece). Season two (decli 2026-11-02, after she won all ten levels): dirt (bare soil: anything
// cleared in it grows grass, 种草地), cage (-1, or the kind of the animal locked in it: it cannot move or fall, and only
// a match of that kind in it or next to it opens it — blasts pass it by, 彩色笼子).
// Pieces: k 'a' animal of colour c, k 'g' penguin (cannot be matched or blown up; walks out at the bottom),
// k 'e' egg (hp 2, 蛋宝宝: falls like an animal but is never matched; a match next to it or a blast cracks it, the
// second time a chick hatches), k 'l' balloon (气球: never moves or falls on its own; a match next to it or a blast
// lifts it one row, swapping with what is above, and once it is in the top row it flies away).
// Specials: s 'h' clears its row, 'v' its column, 'b' bomb (diamond of radius 2), 'c' rainbow ball (no colour).

const ANIMALS = [];   // this game's six animals { id, name, fx colours, h: FRIENDS number }, filled in by cast.js
const PENGUIN = 6;   // the kind after the six animals (always FRIENDS' penguin)

const PTS = { piece: 20, blast: 30, make: { h: 100, v: 100, b: 150, c: 250 }, ice: 80, box: 60, bub: 50, home: 1000, bonus: 200,
  crack: 40, egg: 150, grass: 40, balloon: 600, cage: 120 };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

// a small binary heap of timed events, so blasts are applied in the order they reach each cell
function Heap() { this.a = []; this.n = 0; }

  while (i > 0) { const p = (i - 1) >> 1; if (Heap.lt(a[i], a[p])) { [a[i], a[p]] = [a[p], a[i]]; i = p; } else break; }
};
Heap.prototype.pop = function () {
  const a = this.a, top = a[0], last = a.pop();

    a[0] = last; let i = 0;
    for (;;) {
      const l = 2 * i + 1, r = l + 1; let m = i;
      if (l < a.length && Heap.lt(a[l], a[m])) m = l;
      if (r < a.length && Heap.lt(a[r], a[m])) m = r;
      if (m === i) break;[a[i], a[m]] = [a[m], a[i]]; i = m;
    }

};
Heap.lt = (x, y) => x.t < y.t || (x.t === y.t && x.q < y.q);

// layout characters: . cell  _ void  i/I ice 1/2  b/B gift box 1/2  o bubble  q bubble on ice  g penguin  k ice under a penguin
// e egg  l balloon  d dirt  0-5 a cage with an animal of that kind in it; lv.soil (optional, the same shape as layout):
// 'd' marks dirt under whatever the layout puts there
function Board(lv, rng) {
  this.lv = lv;
  this.rng = rng || Math.random;
  const lay = lv.layout || Array(8).fill('........');
  this.R = lay.length; this.C = Math.max(...lay.map(s => s.length));
  this.cells = [];
  this.nextId = 1;
  this.colors = lv.colors;
  this.moves = lv.moves; this.score = 0;
  this.pg = { total: lv.penguins ? lv.penguins.total : 0, max: lv.penguins ? lv.penguins.max : 0, made: 0, home: 0, gap: 0 };
  const preset = [];
  this.lift = new Set();   // balloons (piece ids) a clearing phase lifted, moved up by rise()
  for (let r = 0; r < this.R; r++) for (let c = 0; c < this.C; c++) {
    const ch = lay[r][c] || '_';
    const cell = { v: ch === '_' || ch === ' ', ice: 0, box: 0, bub: false, p: null, dirt: false, grass: false, cage: -1 };
    if (ch === 'i' || ch === 'q' || ch === 'k') cell.ice = 1;
    if (ch === 'I') cell.ice = 2;
    if (ch === 'b') cell.box = 1;
    if (ch === 'B') cell.box = 2;
    if (ch === 'o' || ch === 'q') cell.bub = true;
    if (ch === 'g' || ch === 'k') preset.push({ i: this.cells.length, k: 'g' });
    if (ch === 'e' || ch === 'l') preset.push({ i: this.cells.length, k: ch });
    if (ch === 'd' || (!cell.v && lv.soil && (lv.soil[r] || '')[c] === 'd')) cell.dirt = true;
    if (ch >= '0' && ch <= '5') cell.cage = +ch;
    this.cells.push(cell);
  }

  this.spawn = this.cells.map((cell, i) => !cell.v && (this.rc(i)[0] === 0 || this.cells[i - this.C].v));
  this.exit = this.cells.map((cell, i) => !cell.v && (this.rc(i)[0] === this.R - 1 || this.cells[i + this.C].v));
  this.goals = lv.goals.map(g => {
    const n = g.n != null ? g.n
      : g.t === 'ice' ? this.cells.filter(x => x.ice > 0).length
      : g.t === 'box' ? this.cells.filter(x => x.box > 0).length
      : g.t === 'bub' ? this.cells.filter(x => x.bub).length
      : g.t === 'pg' ? this.pg.total
      : g.t === 'egg' ? preset.filter(x => x.k === 'e').length
      : g.t === 'bl' ? preset.filter(x => x.k === 'l').length
      : g.t === 'grass' ? this.cells.filter(x => x.dirt && !x.grass).length
      : g.t === 'cage' ? this.cells.filter(x => x.cage >= 0).length : 0;
    return Object.assign({}, g, { n, left: n });
  });
  this.fillInitial(preset);
}

Board.prototype.rc = function (i) { return [Math.floor(i / this.C), i % this.C]; };
Board.prototype.idx = function (r, c) { return r < 0 || c < 0 || r >= this.R || c >= this.C ? -1 : r * this.C + c; };
Board.prototype.on = function (i) { return i >= 0 && !this.cells[i].v; };
Board.prototype.newPiece = function (c, s) { return { id: this.nextId++, k: 'a', c, s: s || null }; };
Board.prototype.randColor = function () { return this.colors[Math.floor(this.rng() * this.colors.length)]; };

Board.prototype.colorAt = function (i) {
  if (i < 0) return -1;
  const x = this.cells[i];
  if (x.v || x.box || !x.p || x.p.k !== 'a' || x.p.s === 'c') return -1;
  return x.p.c;
};
Board.prototype.neighbors = function (i) {
  const [r, c] = this.rc(i), out = [];
  for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) { const j = this.idx(r + dr, c + dc); if (this.on(j)) out.push(j); }
  return out;
};

Board.prototype.fillInitial = function (preset) {
  // would colour col at i make three in a row with what is already placed (either side, or both)?
  const run = (i, col) => {
    const [r, c] = this.rc(i), n = (dr, dc) => { let k = 1; while (this.colorAt(this.idx(r + dr * k, c + dc * k)) === col) k++; return k - 1; };
    return 1 + n(0, -1) + n(0, 1) >= 3 || 1 + n(-1, 0) + n(1, 0) >= 3;
  };
  for (let tries = 0; tries < 200; tries++) {
    this.cells.forEach(x => { x.p = null; });
    preset.forEach(({ i, k }) => { this.cells[i].p = k === 'e' ? { id: this.nextId++, k, hp: 2 } : { id: this.nextId++, k }; });
    this.pg.made = preset.filter(x => x.k === 'g').length;
    this.cells.forEach(x => { if (x.cage >= 0) x.p = this.newPiece(x.cage); });   // a caged animal is of the cage's kind
    for (let i = 0; i < this.cells.length; i++) {
      const x = this.cells[i];
      if (x.v || x.box || x.p) continue;
      let col, guard = 0;
      do { col = this.randColor(); guard++; } while (guard < 50 && run(i, col));
      x.p = this.newPiece(col);
    }
    if (!this.findMatches().length && this.hasMove()) return;
  }
};

// ---------- matching ----------
Board.prototype.findMatches = function () {
  const runs = [];
  const scan = (outer, inner, at, dir) => {
    for (let a = 0; a < outer; a++) {
      let b = 0;
      while (b < inner) {
        const col = this.colorAt(at(a, b));
        if (col < 0) { b++; continue; }
        let e = b + 1;
        while (e < inner && this.colorAt(at(a, e)) === col) e++;
        if (e - b >= 3) { const cells = []; for (let k = b; k < e; k++) cells.push(at(a, k)); runs.push({ dir, cells, color: col }); }
        b = e;
      }
    }
  };
  scan(this.R, this.C, (r, c) => this.idx(r, c), 'h');
  scan(this.C, this.R, (c, r) => this.idx(r, c), 'v');
  // runs that share a cell are one group (an L, a T or a cross)
  const owner = new Map(), groups = [];
  for (const run of runs) {
    const hit = new Set(run.cells.map(i => owner.get(i)).filter(g => g));
    let g;
    if (!hit.size) { g = { color: run.color, cells: new Set(), runs: [] }; groups.push(g); }
    else {
      const [first, ...rest] = [...hit]; g = first;
      for (const o of rest) { o.cells.forEach(i => g.cells.add(i)); g.runs.push(...o.runs); groups.splice(groups.indexOf(o), 1); }
    }
    g.runs.push(run); run.cells.forEach(i => g.cells.add(i));
    g.cells.forEach(i => owner.set(i, g));
  }

};
Board.prototype.specialFor = function (g) {

  if (g.runs.some(r => r.dir === 'h') && g.runs.some(r => r.dir === 'v')) return 'b';
  if (max === 4) return g.runs.find(r => r.cells.length === 4).dir;

Board.prototype.pickSpawn = function (g, type, prefer) {

  for (const i of prefer) if (g.cells.has(i) && ok(i)) return i;

    const h = new Set(), both = [];
    g.runs.filter(r => r.dir === 'h').forEach(r => r.cells.forEach(i => h.add(i)));
    g.runs.filter(r => r.dir === 'v').forEach(r => r.cells.forEach(i => { if (h.has(i)) both.push(i); }));
    for (const i of both) if (ok(i)) return i;
  }
  const run = g.runs.slice().sort((a, b) => b.cells.length - a.cells.length)[0];
  const mid = run.cells.slice().sort((a, b) => Math.abs(run.cells.indexOf(a) - (run.cells.length - 1) / 2) - Math.abs(run.cells.indexOf(b) - (run.cells.length - 1) / 2));
  for (const i of mid) if (ok(i)) return i;
  for (const i of g.cells) if (ok(i)) return i;

// ---------- clearing ----------
// ctx: one clearing phase. ev = what the page will animate, t in ms from the start of the phase.
Board.prototype.newCtx = function (cascade) {

Board.prototype.goal = function (t, c, amount) {

Board.prototype.hitBox = function (i, t, ctx) {

// 种草地: whatever is cleared in a dirt cell (an animal, a bubble, a gift box, a hatched egg) leaves grass behind
Board.prototype.grow = function (i, t, ctx) {

// 蛋宝宝: once per phase; the first crack, then the chick

  x.p = null; ctx.done.add(i); this.score += PTS.egg;

// 气球: tugged now (once per phase), moved up a row by rise() when the board has settled
Board.prototype.liftAt = function (i, t, ctx) {

// 彩色笼子: a match of the caged animal's kind in it or next to it; the animal stays where it is, free
Board.prototype.openCage = function (i, t, ctx) {

  const p = x.p;

  if (x.bub) {

Board.prototype.line = function (i, dir) {

Board.prototype.piecesOf = function (col, ctx) {

// one round of matches: clear them, make the specials they earn

    for (const i of g.cells) if (i !== at) ctx.heap.push({ t: 0, k: 'clear', i, by: 'match', to: at >= 0 ? at : undefined });

    // animals in the match itself)

      else if (x.p && x.p.k === 'l') ctx.heap.push({ t: 40, k: 'lift', i: j });

// ---------- falling ----------
// Pieces fall one cell per step; new ones drop in at the top cells. When nothing can fall straight down any more,
// a piece may slide diagonally into a hole under a gift box, a bubble or the edge of the board.
Board.prototype.settle = function () {

  const canFall = i => this.on(i) && !this.cells[i].box && !this.cells[i].bub && this.cells[i].cage < 0 && !!this.cells[i].p && this.cells[i].p.k !== 'l';
  const rec = (p, from, to, s) => {
    if (!paths.has(p.id)) paths.set(p.id, { p, pts: [{ s: s - 1, r: from[0], c: from[1] }] });
    paths.get(p.id).pts.push({ s, r: to[0], c: to[1] });
  };
  let step = 0;
  for (; step < 400; step++) {
    let any = false;
    const s = step + 1, moved = new Set();
    for (let r = this.R - 1; r >= 0; r--) for (let c = 0; c < this.C; c++) {
      const i = this.idx(r, c);

      const j = this.idx(r - 1, c);

        const p = this.cells[j].p; this.cells[j].p = null; this.cells[i].p = p; moved.add(p.id);
        rec(p, [r - 1, c], [r, c], s); any = true;
      } else if (this.spawn[i]) {
        const p = this.spawnPiece(c);
        this.cells[i].p = p; moved.add(p.id); news.push(p.id);
        rec(p, [r - 1, c], [r, c], s); any = true;
      }
    }
    if (!any) {
      for (let r = this.R - 1; r >= 0 && !any; r--) for (let c = 0; c < this.C; c++) {
        const i = this.idx(r, c);

};
Board.prototype.exits = function () {
  const out = [];

    if (this.exit[i] && x.p && x.p.k === 'g') { out.push({ i, p: x.p }); x.p = null; this.pg.home++; this.score += PTS.home; this.goal('pg'); }

// the balloons lifted since the board last settled go up a row each (the top ones first), swapping places with what is

Board.prototype.rise = function () {
  if (!this.lift.size) return null;

  this.cells.forEach((x, i) => { if (x.p && x.p.k === 'l') at.set(x.p.id, i); });
  const ids = [...this.lift].filter(id => at.has(id)).sort((a, b) => at.get(a) - at.get(b));
  this.lift.clear();

  for (const id of ids) {
    const i = at.get(id);

    const j = i - this.C, x = this.cells[i], y = this.cells[j];
    if (y.box || y.bub || y.cage >= 0 || !y.p || y.p.k === 'l') continue;
    const p = x.p; x.p = y.p; y.p = p;

// after the first clearing phase: fall, penguins out, match again, until the board is still

// ---------- the player's move ----------

};
Board.prototype.isCombo = function (pa, pb) {

// a = where the finger started, b = where it moved to

      }
    }

    // two stripes: a cross
    consume(a, 0); consume(b, 0);

    for (const dir of ['h', 'v']) {

// ---------- end of the level: every move left turns a piece into a stripe ----------
Board.prototype.bonus = function () {
  const phases = [];
  let guard = 0;
  while (guard++ < 40) {
    const ctx = this.newCtx(1);
    let t = 0;
    const left = this.moves;
    if (left > 0) {
      const pool = [];
      this.cells.forEach((x, i) => { if (!x.v && !x.box && !x.bub && x.cage < 0 && x.p && x.p.k === 'a' && !x.p.s) pool.push(i); });
      for (let n = 0; n < left && pool.length; n++) {
        const i = pool.splice(Math.floor(this.rng() * pool.length), 1)[0];
        const x = this.cells[i], old = x.p.id;
        x.p = this.newPiece(x.p.c, this.rng() < 0.5 ? 'h' : 'v');

      }
      this.moves = 0;

    if (!specials.length) break;
    specials.forEach((i, n) => ctx.heap.push({ t: t + 300 + n * 160, k: 'clear', i, by: 'blast' }));
    phases.push(this.run(ctx));
    this.cascade(phases, 1, []);
  }
  return phases;
};

// ---------- moves left? hints, shuffling ----------
Board.prototype.lineLen = function (i, col, dr, dc) {
  const [r, c] = this.rc(i); let n = 0;
  for (let k = 1; ; k++) { if (this.colorAt(this.idx(r + dr * k, c + dc * k)) !== col) break; n++; }
  return n;
};
Board.prototype.matchAt = function (i) {
  const col = this.colorAt(i);

  const h = 1 + this.lineLen(i, col, 0, -1) + this.lineLen(i, col, 0, 1);
  const v = 1 + this.lineLen(i, col, -1, 0) + this.lineLen(i, col, 1, 0);

};
Board.prototype.allMoves = function () {
  const out = [];
  for (let i = 0; i < this.cells.length; i++) {
    if (!this.movable(i)) continue;
    const [r, c] = this.rc(i);
    for (const j of [this.idx(r, c + 1), this.idx(r + 1, c)]) {
      if (j < 0 || !this.movable(j)) continue;
      const A = this.cells[i], B = this.cells[j];
      if (this.isCombo(A.p, B.p)) {
        const v = (A.p.s === 'c' || B.p.s === 'c' ? 12 : 8) + (A.p.s === 'c' && B.p.s === 'c' ? 30 : 0);
        out.push({ a: i, b: j, v }); continue;
      }
      const pa = A.p, pb = B.p; A.p = pb; B.p = pa;
      const v = this.matchAt(i) + this.matchAt(j);
      A.p = pa; B.p = pb;
      if (v) out.push({ a: i, b: j, v });

Board.prototype.hasMove = function () { return this.allMoves().length > 0; };
Board.prototype.hint = function () {

// shuffle the plain animals among their cells until there is a move and no ready-made match
Board.prototype.shuffle = function () {
  const cells = [];
  this.cells.forEach((x, i) => { if (!x.v && !x.box && !x.bub && x.cage < 0 && x.p && x.p.k === 'a' && !x.p.s) cells.push(i); });
  const before = new Map(cells.map(i => [this.cells[i].p.id, i]));
  const pieces = cells.map(i => this.cells[i].p);
  for (let tries = 0; tries < 300; tries++) {
    for (let k = pieces.length - 1; k > 0; k--) { const j = Math.floor(this.rng() * (k + 1)); [pieces[k], pieces[j]] = [pieces[j], pieces[k]]; }

    cells.forEach((i, k) => { this.cells[i].p = pieces[k]; });

  }

// 小帮手 (decli 2026-11-02): after two lost games in a row the next one starts with a special or two already on the
// board (kinds: their s, 'h' 'v' or 'b'); returns where they are
Board.prototype.helper = function (kinds) {
  const pool = [], out = [];
  this.cells.forEach((x, i) => { if (!x.v && !x.box && !x.bub && x.cage < 0 && x.p && x.p.k === 'a' && !x.p.s) pool.push(i); });
  for (const s of kinds) {
    if (!pool.length) break;
    const i = pool.splice(Math.floor(this.rng() * pool.length), 1)[0], x = this.cells[i];
    x.p = this.newPiece(x.p.c, s); out.push(i);
  }
  return out;
};
Board.prototype.won = function () { return this.goals.every(g => g.left <= 0); };
Board.prototype.stars = function () {
  if (!this.won()) return 0;
  const s = this.lv.stars;
  return this.score >= s[2] ? 3 : this.score >= s[1] ? 2 : 1;
};

// how excited to sound after (part of) a turn: 0 nothing, 1 Good … 5 Unbelievable
function excitement(phases) {
  let cascades = 0, cleared = 0, acts = 0, big = 0;
  for (const ph of phases) if (ph.type === 'clear') { cascades = Math.max(cascades, ph.cascade); cleared += ph.cleared; acts += ph.acts; big = Math.max(big, ph.big || 0); }
  const made = phases.reduce((n, ph) => n + (ph.makes ? ph.makes.filter(m => m.s === 'c').length * 2 + ph.makes.length : 0), 0);
  const x = Math.max(cascades - 1, 0) * 1.0 + cleared / 9 + acts * 0.6 + made * 0.5 + big * 1.5;
  let lvl = x >= 7 ? 5 : x >= 5.2 ? 4 : x >= 3.8 ? 3 : x >= 2.6 ? 2 : x >= 1.7 ? 1 : 0;
  // making a special piece always gets a cheer: "Great!" for a striped one, "Excellent!" for a bomb, "Unbelievable!" for a rainbow ball
  for (const ph of phases) for (const m of ph.makes || []) lvl = Math.max(lvl, m.s === 'c' ? 5 : m.s === 'b' ? 3 : 2);
  return lvl;
}

// 动物消消乐 · everything the narrator says. dev/voice/collect.js reads this file (with levels.js and board.js) to
// list every line for recording, so a line built from a level must be built here and nowhere else.
const KID = '小朋友';   // how the narrator calls the child (decli 2026-11-05: no names, for privacy)
// how many sums a math page has (家长设置). By default the child spins a wheel before each page and does what it lands
// on (decli 2026-10-19, evening: sums feel like a chore, make drawing them a game). decli 2026-11-05: short pages too,
// so nobody dreads it; each page goes from easy to hard (MathGate.page). decli 2026-11-06: 2, 4, 6, 8, 9, 10, 11, 12 by
// default (16 was a lot), and a parent can put any of 0 to MATH_MOST on the wheel (Store.d.math.wheel; landing on 0
// means no sums this time). A parent can also pick the day's ramp (2, 6, 12, then 20 every time after, back to 2 the
// next day) or one fixed size.
const MATH_WHEEL = [2, 4, 6, 8, 9, 10, 11, 12];
const MATH_MOST = 20;
const MATH_RAMP = [2, 6, 12, 20];
const MATH_COUNTS = [5, 10, 15, 20];
const NUM_ZH = n => String(n);   // the voice reads digits naturally ("18只" → 十八只)

// the animals change every game (cast.js), so a line never names them: the intro says how many kinds to collect and
// their names follow as clips of their own (L.gift.names), each with its goal picture bouncing (UI.intro)
function goalSay(g, lv) {
  const count = chs => (lv.layout || []).join('').split('').filter(ch => chs.includes(ch)).length;
  if (g.t === 'ice') return '敲碎所有冰块';
  if (g.t === 'box') return '拆开所有礼物盒';
  if (g.t === 'bub') return '戳破所有泡泡';
  if (g.t === 'pg') return `把${lv.penguins.total}只小企鹅送回家`;
  // season two
  if (g.t === 'egg') return `把${count('e')}个蛋宝宝都孵出来`;
  if (g.t === 'grass') return '把土地都种上小草';
  if (g.t === 'bl') return `把${count('l')}个气球都送上天`;
  if (g.t === 'cage') return `把笼子里的${count('012345')}个小伙伴都救出来`;
  return '';
}

// 动物消消乐 · which six animals play in a game (decli: the same ones every time got boring). Every game draws six from
// decli's animals (FRIENDS in lines.js), each a different colour so they are easy to tell apart on the board: animals
// that look alike (the blue dolphin, shark and whale; the orange fox, corgi and kangaroo ...) share a colour and so
// never play together. A level with penguins leaves out the black-and-white ones, and the 隐藏款 stay a surprise of the
// blind box.
const Cast = {
  // effect colours by main colour (FRIENDS' last field): base, dark, light
  FX: {
    p: ['#ffa3c8', '#e2668f', '#ffe0ec'], w: ['#ffffff', '#9aa3b8', '#eef1f7'], k: ['#ffffff', '#2f3040', '#e4e6ee'],
    v: ['#b48cff', '#7b52e0', '#e6dbff'], y: ['#ffd23a', '#e0a000', '#fff0b8'], o: ['#ff9a3a', '#d9661a', '#ffd9b0'],
    r: ['#ff4a3a', '#c8231a', '#ffc0b2'], g: ['#6fd65a', '#2f9e3a', '#d2f8b4'], l: ['#5aa6ff', '#2d6fd8', '#c4e2ff'],
    t: ['#3ad6c4', '#1a9e90', '#c4f5ee'], b: ['#c08a5e', '#7a4f30', '#ecd2bd'], a: ['#a9adbd', '#6b7082', '#e4e6ee'],
  },
  // colours too close to share a board (besides the same colour twice)
  NEAR: ['lt', 'gt', 'lv', 'ob', 'or', 'ka', 'wk', 'wa'],
  pending: -1,
  // two animals' colours (one or two letters each) clash
  near(a, b) { return [...a].some(x => [...b].some(y => x === y || this.NEAR.includes(x + y) || this.NEAR.includes(y + x))); },
  // six new animals for level li: they show at once everywhere (intro card, pieces, goals, effects) and are kept for
  // Game.start(li)
  // decli 2026-11-05: each island has its own cast (FRIENDS' island), so up to four of the six are from the level's
  // island and the rest from anywhere — a new island looks new, and no two games are the same
  pick(li) {
    const lv = LEVELS[li], penguins = lv.goals.some(g => g.t === 'pg'), eggs = lv.goals.some(g => g.t === 'egg'), isle = isleOf(li);
    // the chicks that hatch from eggs are their own surprise, not one of the six
    const pool = FRIENDS.filter(f => f.tier <= 1 && f.id !== 'penguin' && !(penguins && this.near(f.fam, 'k')) && !(eggs && f.id === 'chick'));
    const mix = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    let got = [];
    for (let tries = 0; got.length < 6 && tries < 50; tries++) {   // an unlucky early pick can leave fewer than six colours: draw again
      got = [];
      const fits = f => got.every(g => g !== f && !this.near(g.fam, f.fam));
      for (const f of mix(pool.filter(f => f.isle === isle))) if (got.length < 4 && fits(f)) got.push(f);
      for (const f of mix(pool.slice())) if (got.length < 6 && fits(f)) got.push(f);
    }
    if (got.length < 6) got = this.FIRST();
    this.set(got);
    this.pending = li;
  },
  // when a level starts: the six its intro card showed, or new ones (a replay, the next level from the result card)
  take(li) { if (this.pending !== li) this.pick(li); this.pending = -1; },
  set(fs) { ANIMALS.length = 0; fs.forEach(f => ANIMALS.push({ id: f.id, name: f.name, fx: this.FX[f.fam[0]], h: f.i })); },
  // the first six (the start screen, before any game)
  FIRST: () => ['pig', 'panda', 'hippo', 'giraffe', 'parrot', 'frog'].map(id => FRIENDS.find(f => f.id === id)),

// The background music: decli's two cheerful tunes, sound/bg1.mp3 and sound/bg2.mp3, one after the other. decli: it
// keeps playing all through the game (map, levels, cards, the blind box) and stops only for the pause card and the
// math page; the narrator turns it down a little while speaking. Each tune crossfades into the next, so there is no
// gap or click at the seam, and starting it while it plays changes nothing.
const Music = {
  want: false, order: ['bg1', 'bg2'], cur: null, timer: 0, X: 0.8,
  get playing() { return this.want; },
  start() {
    this.want = true;
    this.sync();
    if (Snd.mus) Snd.mus.gain.setTargetAtTime(Snd.musicLevel(), Snd.ctx.currentTime, 0.3);
  },
  stop() {
    this.want = false; clearTimeout(this.timer);
    const o = this.cur; this.cur = null;
    if (!o || !Snd.ctx) return;
    const now = Snd.ctx.currentTime;
    o.g.gain.cancelScheduledValues(now); o.g.gain.setValueAtTime(Math.max(0.0001, o.g.gain.value), now); o.g.gain.linearRampToValueAtTime(0.0001, now + 0.5);
    try { o.src.stop(now + 0.55); } catch (_) { }
  },
  refresh() { if (Snd.mus) Snd.mus.gain.setTargetAtTime(Snd.musicLevel(), Snd.ctx.currentTime, 0.2); },
  // start the first tune that has been decoded, if none is playing yet (called again when a tune finishes decoding)
  sync() {
    const c = Snd.ctx, name = this.order.find(n => Snd.clip(n));
    if (!c || !this.want || this.cur || !name) return;
    this.loop(name, c.currentTime + 0.05, 0.6);
  },
  loop(name, at, fadeIn) {
    const c = Snd.ctx, X = this.X, buf = Snd.clip(name), src = c.createBufferSource(), g = c.createGain(), end = at + buf.duration;
    src.buffer = buf; src.connect(g); g.connect(Snd.mus);
    g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(1, at + fadeIn);
    g.gain.setValueAtTime(1, end - X); g.gain.linearRampToValueAtTime(0.0001, end);
    src.start(at); src.stop(end + 0.05);
    const me = this.cur = { name, src, g };
    clearTimeout(this.timer);
    // the other tune next (the same one again if the other has not loaded)
    const other = this.order[(this.order.indexOf(name) + 1) % this.order.length];
    this.timer = setTimeout(() => { if (this.cur === me) this.loop(Snd.clip(other) ? other : name, Math.max(c.currentTime + 0.05, end - X), X); }, Math.max(0, (end - X - c.currentTime - 0.5) * 1000));
  },
};

// 动物消消乐 · the voices. Every Chinese line is pre-recorded (voice.bin|json next to the page, made with edge-tts by
// ../../dev/voice/build.py xiaoxiao) by 晓晓 like the rest of 思维小画本; the English cheers are decli's recordings in
// sound/. The device's own speech is never used (decli: it sounds stiff): a line missing from the bank stays silent,
// and ?debug lists it in the console so it can be added to lines.js and recorded.
const Voice = { on: true, last: '', busy: false };
(() => {
  let bank = null, state = 'idle', loadP = null, clip = null, gen = 0, tries = 0;
  const bufs = new Map(), debug = /[?&]debug\b/.test(location.search);

    state = 'loading';

      .then(ix => fetch('voice.bin' + (ix.h ? '?h=' + ix.h : '')).then(r => (r.ok ? r.arrayBuffer() : Promise.reject(r.status))).then(bin => { bank = { map: ix.u, bin }; state = 'ready'; }))
      .catch(() => {   // tried again a few times (a new version still going up, a bad connection)
        state = 'failed';

      });
    return loadP;
  };

    return e;
  };

    const got = bufs.get(e[0]);
    if (got) return Promise.resolve(got);

      try { const q = Snd.ctx.decodeAudioData(bank.bin.slice(e[0], e[0] + e[1]), res, rej); if (q && q.catch) q.catch(rej); } catch (err) { rej(err); }

  };

    else go();

    const buf = Voice.on && word && Snd.ctx && Snd.clip(CHEER_CLIP[word]);
    if (!buf) return;

// 动物消消乐 · made by dev/heads2.py: how the 怪趣森林 heads are laid out in heads.webp (board faces), funs.webp (fun
// faces) and pals.webp (the partners' tap and cheer faces, then the chick hatching); cells in the order of FRIENDS.
// fill: how much of a cell a board face's longer side takes; h: the pictures' fingerprint (in their addresses).
const HEADS = {"cell":224,"cols":10,"n":100,"fill":0.942,"big":640,"h":"8c9909c4d5","pals":{"pig":[0,1],"panda":[2,3],"hippo":[4,5],"giraffe":[6,7],"parrot":[8,9],"frog":[10,11],"owl":[12,13],"corgi":[14,15],"bee":[16,17],"cloud":[18,19],"monkey":[20,21],"princess":[22,23]},"palCell":256,"palCols":5,"hatch":24};

// made from dev/art/season2/*.png by dev/art2.py into ../s2/*.webp, which also writes the list below. Until a picture
// is in, the code draws its own (art.js, ui.js), so the game never waits for them; when they load, the board's tiles
// are made again with them.

  badge: [0.4979, 0.8594, 0.1172],   // the cage picture's badge: centre x (of its width), y and radius (of its height); art2.py measures it
  img: {},
  load() {
    for (const n of this.names) {

  img: null, funs: null, pals: null, big: {}, dpr: 1, cell: 0, T: 0, tiles: [], funTiles: [], white: [], cache: {},
  // decli's 怪趣森林 heads (made by dev/heads2.py, laid out as HEADS in heads.js): the board faces, which the start
  // screen waits for, and the fun faces and the partners' faces, which come in behind them (the board face stands in

  // ---------- drawing on the board (ctx in CSS pixels) ----------
  // p: piece, (x, y) centre, sc scale, t clock ms, flash 0..1 white
  piece(ctx, p, x, y, sc, t, flash, sx, sy, hp, fun) {

    const w = s * (sx || 1), h = s * (sy || 1);
    if (p.k === 'g') { ctx.drawImage((fun ? this.funTiles : this.tiles)[PENGUIN], x - w / 2, y - h / 2, w, h); return; }
    if (p.k === 'e') { ctx.drawImage(this.cache[(hp != null ? hp : p.hp) === 2 ? 'egg2' : 'egg1'], x - w / 2, y - h / 2, w, h); if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.7; ctx.drawImage(Fx.dot('#ffffff'), x - w / 2, y - h / 2, w, h); ctx.globalAlpha = 1; } return; }
    if (p.k === 'l') { ctx.save(); ctx.translate(x, y + cell * 0.04); ctx.rotate(Math.sin(t / 520 + p.id) * 0.08); ctx.drawImage(this.cache.balloon, -w / 2, -h / 2, w, h); ctx.restore(); return; }

      ctx.save(); ctx.globalCompositeOperation = 'lighter'; const gl = Fx.dot('#ffffff');
      ctx.globalAlpha = 0.55 + Math.sin(t / 150) * 0.2; ctx.drawImage(gl, x - cell * 0.75, y - cell * 0.75, cell * 1.5, cell * 1.5); ctx.restore();
      ctx.save(); ctx.translate(x, y); ctx.rotate(t / 700); ctx.scale(pul, pul);
      ctx.drawImage(this.cache.orb, -w / 2, -h / 2, w, h); ctx.restore();

        const a = t / 400 + i * 2.1, rr = cell * 0.44;

      }

    }

      ctx.save(); ctx.translate(x, y); ctx.rotate(t / 900); const pul = 1 + Math.sin(t / 160) * 0.06; ctx.scale(pul * sc, pul * sc);
      ctx.drawImage(this.cache.ring, -this.T / this.dpr / 2, -this.T / this.dpr / 2, this.T / this.dpr, this.T / this.dpr); ctx.restore();

  },
  // a small picture of a goal, for the side panel and the cards
  goalIcon(g, px) {

      const k = g.t === 'pg' ? PENGUIN : g.color, h = this.head(k, px * 1.15, px * 0.92);

// 动物消消乐 · the flashy part: bursts of shards and stars, light beams, lightning, shock rings, the big English cheer,
// pieces flying to the goal panel, confetti, screen shake. Drawn on its own canvas above everything (#fx).
const Fx = {
  cv: null, ctx: null, dpr: 1, W: 0, H: 0, parts: [], items: [], dots: {}, stars: {},
  shakeA: 0, shakeT: 0, shakeD: 1, flashA: 0, flashC: '#fff',
  init(cv) { this.cv = cv; this.ctx = cv.getContext('2d'); },
  resize(W, H, dpr) {
    this.W = W; this.H = H; this.dpr = dpr;
    this.cv.width = Math.round(W * dpr); this.cv.height = Math.round(H * dpr);
    this.cv.style.width = W + 'px'; this.cv.style.height = H + 'px';
  },
  dot(color) {
    if (this.dots[color]) return this.dots[color];
    const c = Art.canvas(64, 64), x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);

  },
  star(color) {
    if (this.stars[color]) return this.stars[color];
    const c = Art.canvas(48, 48), x = c.getContext('2d');
    x.translate(24, 24); x.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 9 : 21; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    x.closePath(); x.fillStyle = color; x.fill(); x.lineWidth = 3; x.strokeStyle = '#fff'; x.stroke();

  },
  heart(color) {   // for an animal let out of its cage
    const key = 'h' + color;
    if (this.stars[key]) return this.stars[key];
    const c = Art.canvas(48, 48), x = c.getContext('2d');
    x.beginPath(); x.moveTo(24, 40); x.bezierCurveTo(4, 26, 6, 8, 24, 16); x.bezierCurveTo(42, 8, 44, 26, 24, 40); x.closePath();
    x.fillStyle = color; x.fill(); x.lineWidth = 3; x.strokeStyle = '#fff'; x.stroke();
    return (this.stars[key] = c);
  },
  drawStar(ctx, x, y, r, color) {   // a four-point twinkle
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
  },

  part(o) { if (this.parts.length < 900) this.parts.push(Object.assign({ t: 0, g: 0, rot: 0, vr: 0, s1: 0, a: 1, drag: 0.985 }, o)); },
  // a piece bursting: shards of its colour, glowing dots and a few stars
  burst(x, y, cols, n, power, cell) {
    const P = power || 1, c = cell || 60;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.12 + Math.random() * 0.32) * P * c / 60;
      this.part({ kind: 'shard', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.12, g: 0.0009, life: 500 + Math.random() * 400, size: c * (0.07 + Math.random() * 0.08), color: cols[i % 2], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.03 });
    }
    for (let i = 0; i < Math.ceil(n / 2); i++) {
      const a = Math.random() * Math.PI * 2, v = (0.05 + Math.random() * 0.2) * P * c / 60;
      this.part({ kind: 'img', img: this.dot(cols[0]), add: true, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 380 + Math.random() * 300, size: c * (0.35 + Math.random() * 0.3), s1: c * 0.05 });
    }
    for (let i = 0; i < 2 + Math.floor(P); i++) {
      const a = Math.random() * Math.PI * 2, v = (0.1 + Math.random() * 0.2) * c / 60;
      this.part({ kind: 'img', img: this.star(pick(['#ffd23a', '#ffffff', cols[0]])), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.1, g: 0.0006, life: 700 + Math.random() * 300, size: c * (0.22 + Math.random() * 0.15), s1: c * 0.05, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.02 });
    }
  },
  sparkles(x, y, n, spread, color) {
    for (let i = 0; i < n; i++) this.part({ kind: 'twinkle', x: x + rnd(-spread, spread), y: y + rnd(-spread, spread), vx: 0, vy: -0.02, life: 400 + Math.random() * 500, size: rnd(5, 12), color: color || '#fff', delay: Math.random() * 300 });
  },
  ring(x, y, color, r0, r1, dur, lw) {
    this.items.push({ t: 0, dur, draw(ctx, k) {
      const e = Ease.out(k);
      ctx.globalAlpha = 1 - k; ctx.lineWidth = (lw || 10) * (1 - k * 0.7); ctx.strokeStyle = color;
      ctx.beginPath(); ctx.arc(x, y, lerp(r0, r1, e), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    } });
  },
  // a beam of light along a row or column, out from (x, y) to the board's edges
  beam(x, y, dir, color, rect, wide) {
    const w0 = wide ? 0.62 : 0.5;
    this.items.push({ t: 0, dur: 520, add: true, draw(ctx, k) {
      const grow = Ease.out(Math.min(1, k / 0.45)), fade = k < 0.45 ? 1 : 1 - (k - 0.45) / 0.55;
      const cell = rect.cell, th = cell * w0 * (0.6 + 0.4 * fade);

      if (dir === 'h') {

        let g = ctx.createLinearGradient(0, y - th, 0, y + th);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, color); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(x - L, y - th, 2 * L, 2 * th);
        ctx.fillStyle = '#fff'; ctx.fillRect(x - L, y - th * 0.18, 2 * L, th * 0.36);
      } else {
        const L = Math.max(y - rect.y, rect.y + rect.h - y) * grow + cell;
        let g = ctx.createLinearGradient(x - th, 0, x + th, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, color); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(x - th, y - L, 2 * th, 2 * L);
        ctx.fillStyle = '#fff'; ctx.fillRect(x - th * 0.18, y - L, th * 0.36, 2 * L);
      }
      ctx.globalAlpha = 1;
    } });
    // sparks running out along the beam
    for (let i = 0; i < 18; i++) {
      const v = rnd(0.4, 1.0) * rect.cell / 60, s = i % 2 ? 1 : -1;
      this.part({ kind: 'img', img: this.dot(color), add: true, x, y, vx: dir === 'h' ? s * v : rnd(-0.05, 0.05), vy: dir === 'v' ? s * v : rnd(-0.05, 0.05), life: 450, size: rect.cell * 0.5, s1: 0, drag: 0.99 });
    }
  },
  // jagged lightning from the rainbow ball to a target; redrawn every few frames so it crackles
  bolt(x1, y1, x2, y2, color, delay) {
    let pts = null, last = -1;
    this.items.push({ t: -(delay || 0), dur: 420, add: true, draw(ctx, k, t) {
      if (t < 0) return;
      const f = Math.floor(t / 50);
      if (f !== last || !pts) {
        last = f; pts = [[x1, y1]];
        const n = 7, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
        for (let i = 1; i < n; i++) { const o = rnd(-1, 1) * len * 0.08; pts.push([x1 + dx * i / n + nx * o, y1 + dy * i / n + ny * o]); }
        pts.push([x2, y2]);
      }
      const reach = Math.min(1, t / 120), m = Math.max(1, Math.round(reach * (pts.length - 1)));
      ctx.globalAlpha = 1 - k * k; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      for (const [w, c] of [[9, color], [3, '#fff']]) {
        ctx.lineWidth = w; ctx.strokeStyle = c; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i <= m; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } });
  },
  // "+60" floating up from where points were made
  text(x, y, str, size, color) {
    this.items.push({ t: 0, dur: 900, word: true, draw(ctx, k) {
      const s = size * (k < 0.15 ? Ease.back(k / 0.15) : 1);
      ctx.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
      ctx.font = `900 ${s}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = s * 0.22; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
      ctx.strokeText(str, x, y - k * size * 1.6); ctx.fillStyle = color || '#ff4f9a'; ctx.fillText(str, x, y - k * size * 1.6);
      ctx.globalAlpha = 1;
    } });
  },
  // the big cheer across the board; an earlier cheer still showing gets out of the way
  praise(word, x, y, width, level) {
    this.hush();
    const size = Math.min(width / (word.length * 0.52), width * 0.17);
    const hues = level >= 5 ? ['#ff4f6d', '#ff9d3a', '#ffd23a', '#5fe07a', '#3ac8ff', '#a77bff'] : level >= 3 ? ['#ffd23a', '#ff9d3a', '#ff4f9a'] : ['#a77bff', '#ff7eb6'];
    this.items.push({ t: 0, dur: 1500, word: true, draw(ctx, k, t) {
      const inK = Math.min(1, t / 420), sc = Ease.elastic(inK) * (k > 0.75 ? 1 + (k - 0.75) * 1.2 : 1);
      ctx.save(); ctx.translate(x, y - (k > 0.75 ? (k - 0.75) * size * 1.5 : 0)); ctx.rotate(-0.06); ctx.scale(sc, sc);
      ctx.globalAlpha = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
      ctx.font = `900 ${size}px "Arial Rounded MT Bold","Trebuchet MS",${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = ctx.measureText(word).width, g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      hues.forEach((h, i) => g.addColorStop(i / Math.max(1, hues.length - 1), h));
      ctx.lineJoin = 'round';
      ctx.lineWidth = size * 0.3; ctx.strokeStyle = '#3d5229'; ctx.strokeText(word, 0, size * 0.06);
      ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#fff'; ctx.strokeText(word, 0, 0);
      ctx.fillStyle = g; ctx.fillText(word, 0, 0);
      ctx.restore(); ctx.globalAlpha = 1;
    } });
    const n = 8 + level * 5;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = rnd(0.25, 0.6) * width / 600;
      this.part({ kind: 'img', img: this.star(pick(hues)), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7, g: 0.0004, life: 900 + Math.random() * 500, size: rnd(18, 34) * width / 600, s1: 4, rot: Math.random() * 6, vr: rnd(-0.01, 0.01), drag: 0.975 });
    }
    if (level >= 4) this.flash(0.35, '#fff');
  },
  // something flying along an arc (a cleared animal going to its goal, a star going to a piece)
  fly(o) {
    return new Promise(res => {
      const mx = (o.x0 + o.x1) / 2 + (o.bend || 0), my = Math.min(o.y0, o.y1) - (o.lift == null ? 80 : o.lift);
      this.items.push({ t: -(o.delay || 0), dur: o.dur || 600, draw(ctx, k, t) {
        if (t < 0) return;
        const e = Ease.inOut(k), u = 1 - e;
        const x = u * u * o.x0 + 2 * u * e * mx + e * e * o.x1, y = u * u * o.y0 + 2 * u * e * my + e * e * o.y1;
        const s = lerp(o.s0, o.s1, e);

        if (o.img) ctx.drawImage(o.img, x - s / 2, y - s / 2, s, s);

    });
  },
  confetti(n) {
    const cols = ['#ff4f9a', '#ffd23a', '#5fe0b0', '#7cc8ff', '#a77bff', '#ff9d3a'];
    for (let i = 0; i < n; i++) this.part({ kind: 'conf', x: Math.random() * this.W, y: -20 - Math.random() * this.H * 0.4, vx: rnd(-0.05, 0.05), vy: rnd(0.12, 0.3), g: 0.00012, life: 3200, size: rnd(8, 15), color: pick(cols), rot: Math.random() * 6, vr: rnd(-0.012, 0.012), drag: 0.998, wob: Math.random() * 6 });
  },
  shake(a, dur) { if (a >= this.shakeA * (1 - this.shakeT / this.shakeD)) { this.shakeA = a; this.shakeT = 0; this.shakeD = dur || 300; } },
  shakeOffset() {
    if (this.shakeT >= this.shakeD) return [0, 0];
    const k = 1 - this.shakeT / this.shakeD, a = this.shakeA * k * k;
    return [Math.sin(this.shakeT * 0.09) * a, Math.cos(this.shakeT * 0.13) * a * 0.7];
  },
  flash(a, c) { this.flashA = Math.max(this.flashA, a); this.flashC = c || '#fff'; },
  // fade out the words (cheers, +points) quickly, e.g. when a card opens over the board
  hush() { for (const it of this.items) if (it.word) it.t = Math.max(it.t, it.dur * 0.9); },
  clear() { this.parts = []; this.items.forEach(it => it.end && it.end()); this.items = []; },
  busy() { return this.items.length > 0; },

  update(dt) {
    this.shakeT += dt;
    this.flashA = Math.max(0, this.flashA - dt / 350);
    const ps = this.parts;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.t += dt;
      if (p.t >= p.life) { ps[i] = ps[ps.length - 1]; ps.pop(); continue; }
      p.vy += p.g * dt; p.vx *= Math.pow(p.drag, dt / 16); p.vy *= Math.pow(p.drag, dt / 16);
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i]; it.t += dt;
      if (it.t >= it.dur) { this.items.splice(i, 1); if (it.end) it.end(); }
    }
  },

// 动物消消乐 · the wheel before a math page (decli 2026-10-19: draw how many sums like a lucky draw, so the page starts
// with a bit of fun instead of a chore; its numbers set by a parent since decli 2026-11-06). She taps it; it winds back a little and spins, slows down with a
// tick and a flick of the pointer at every peg, and lands with lights, confetti and her number popping up. Every slice
// is the same size and the number is drawn fairly before the spin (never steered to a near miss); every number is good
// news, a few a warm-up and many a challenge (L.wheel.land). What it lands on is kept until the page is done, so
// leaving and coming back can't spin again.
const Wheel = {
  // one colour a slice: the 怪趣森林 felt colours round the rainbow, then again (the wheel has 1 to 21 numbers)
  COLS: ['#ef8fa8', '#ee8a3c', '#f2c443', '#79b956', '#3fb0a3', '#5c9ddc', '#a385d8', '#b98559'],
  // slice i of n: its colour, never the same as the slice next to it round the circle
  col(i, n) { const C = this.COLS.length, c = i % C; return this.COLS[n > 1 && i === n - 1 && c === 0 ? 3 : c]; },
  // on the math layer; resolves with the number, 'skip' (a parent skipped the page) or 'again' (a parent changed the
  // settings, so the page starts over the new way)
  spin() {
    return new Promise(resolve => {
      const root = $('#math'); root.hidden = false; root.innerHTML = ''; root.className = 'spin';
      $('#fx').style.zIndex = 46;
      Music.stop();   // quiet for the sums, as on the page itself
      const NUMS = MathGate.wheelNums(), N = NUMS.length, A = Math.PI * 2 / N, TAU = Math.PI * 2;
      const FS = Math.min(0.22, 0.22 * Math.sqrt(9 / N));   // the numbers' size: smaller when there are many slices
      const head = el('div', 'head');
      const home = UI.homeButton(); home.style.width = home.style.height = '46px'; home.style.fontSize = '22px';
      head.appendChild(home);
      head.appendChild(el('h3', null, '✏️ ' + L.math.title));
      const lock = el('button', 'ibtn', '🔒'); lock.style.width = lock.style.height = '46px'; lock.style.fontSize = '22px';
      // a parent changed how many sums, or the wheel's numbers: start again the new way
      lock.onclick = () => UI.parent({ fromMath: true, skip: () => end('skip'), done: () => { if (state !== 'gone' && (Store.d.math.count !== 'wheel' || MathGate.wheelNums().join() !== NUMS.join())) end('again'); } });
      head.appendChild(lock);
      root.appendChild(head);
      const stage = el('div', 'wstage'), cv = el('canvas'), big = el('div', 'wbig'), hand = el('div', 'whand', '👆');
      stage.appendChild(cv); stage.appendChild(big); stage.appendChild(hand);
      root.appendChild(stage);
      const x = cv.getContext('2d'), pal = Art.friend(Pal.i(), 256, 236);   // the companion in the hub
      let S = 0, dpr = 1, rot = Math.random() * TAU, state = 'idle', t = 0, from = 0, to = 0, flap = 0, peg = 0, tickAt = 0, won = -1, n = 0;
      let last = performance.now(), raf = 0, idle = 0, asked = 1;
      const DUR = 3000;   // short: the wheel is a moment of fun before the sums, not a show to sit through

      function size() {
        const r = stage.getBoundingClientRect();
        S = Math.max(200, Math.min(r.width, r.height) * 0.98); dpr = Math.min(devicePixelRatio || 1, 2);
        cv.width = Math.round(S * dpr); cv.height = Math.round(S * dpr); cv.style.width = cv.style.height = S + 'px';
        big.style.fontSize = Math.round(S * 0.2) + 'px';
      }
      const circle = (cx, cy, r) => { x.beginPath(); x.arc(cx, cy, r, 0, TAU); };
      function draw(now) {
        x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, S, S);
        const cx = S / 2, cy = S * 0.52, R = S * 0.39;
        // shadow, golden rim and its light bulbs: a slow chase while waiting, a fast one while spinning, all blinking together when it lands
        x.fillStyle = 'rgba(60,80,40,.18)'; circle(cx, cy + R * 0.06, R * 1.14); x.fill();
        const rim = x.createLinearGradient(0, cy - R, 0, cy + R);
        rim.addColorStop(0, '#a8cc7c'); rim.addColorStop(0.5, '#7aa651'); rim.addColorStop(1, '#557f38');   // a leafy felt rim
        x.fillStyle = rim; circle(cx, cy, R * 1.12); x.fill();
        x.lineWidth = R * 0.02; x.strokeStyle = '#eef6d8'; circle(cx, cy, R * 1.1); x.stroke();
        const B = 18, step = state === 'spin' ? Math.floor(now / 70) : Math.floor(now / 380);
        for (let i = 0; i < B; i++) {
          const a = -Math.PI / 2 + i * TAU / B, bx = cx + Math.cos(a) * R * 1.055, by = cy + Math.sin(a) * R * 1.055;
          const on = state === 'won' ? Math.floor(now / 160) % 2 === 0 : (i + step) % 3 === 0;
          if (on) { x.fillStyle = 'rgba(255,255,255,.55)'; circle(bx, by, R * 0.06); x.fill(); }
          x.fillStyle = on ? (i % 2 ? '#fff6c8' : '#ffe2c4') : '#4a6e30'; circle(bx, by, R * 0.032); x.fill();
        }
        // the slices (their numbers are drawn upright afterwards, so a 6 never turns into a 9)
        x.save(); x.translate(cx, cy); x.rotate(rot);
        for (let i = 0; i < N; i++) {
          const a0 = -Math.PI / 2 + i * A, g = x.createRadialGradient(0, 0, R * 0.2, 0, 0, R);
          g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, Wheel.col(i, N)); g.addColorStop(1, Wheel.col(i, N));
          x.fillStyle = g; x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, a0, a0 + A); x.closePath(); x.fill();
          if (won >= 0) {   // the winner glows, the rest step back
            x.fillStyle = i === won ? `rgba(255,255,255,${0.15 + 0.25 * Math.sin(now / 90) ** 2})` : 'rgba(255,255,255,.5)'; x.fill();
          }
        }
        x.strokeStyle = '#fff'; x.lineWidth = R * 0.018;
        for (let i = 0; i < N; i++) { const a = -Math.PI / 2 + i * A; x.beginPath(); x.moveTo(Math.cos(a) * R * 0.24, Math.sin(a) * R * 0.24); x.lineTo(Math.cos(a) * R, Math.sin(a) * R); x.stroke(); }
        for (let i = 0; i < N; i++) {   // the pegs that flick the pointer
          const a = -Math.PI / 2 + i * A;
          x.fillStyle = '#fff'; circle(Math.cos(a) * R * 0.95, Math.sin(a) * R * 0.95, R * 0.035); x.fill();
          x.fillStyle = '#557f38'; circle(Math.cos(a) * R * 0.95, Math.sin(a) * R * 0.95, R * 0.015); x.fill();
        }
        x.restore();
        x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
        for (let i = 0; i < N; i++) {
          const m = -Math.PI / 2 + (i + 0.5) * A + rot, tx = cx + Math.cos(m) * R * 0.68, ty = cy + Math.sin(m) * R * 0.68;
          x.font = `900 ${Math.round(R * (i === won ? FS * 1.23 : FS))}px ${FONT}`;
          x.lineWidth = R * FS * 0.23; x.strokeStyle = 'rgba(52,64,34,.55)'; x.strokeText(NUMS[i], tx, ty + R * 0.01);
          x.fillStyle = '#fff'; x.fillText(NUMS[i], tx, ty + R * 0.01);
        }
        // the hub with her companion, breathing while it waits to be tapped
        const pulse = state === 'idle' ? 1 + 0.05 * Math.sin(now / 220) : 1, hr = R * 0.25 * pulse;
        if (state === 'idle') { x.fillStyle = `rgba(255,255,255,${0.3 + 0.2 * Math.sin(now / 220)})`; circle(cx, cy, hr * 1.25); x.fill(); }
        x.fillStyle = '#fff'; circle(cx, cy, hr); x.fill();
        x.lineWidth = R * 0.03; x.strokeStyle = '#7aa651'; x.stroke();
        if (won < 0) x.drawImage(pal, cx - hr * 0.92, cy - hr * 0.92, hr * 1.84, hr * 1.84);   // her number takes its place
        // the pointer at the top, flicked by each peg and springing back
        x.save(); x.translate(cx, cy - R * 1.2); x.rotate(flap);
        x.beginPath(); x.moveTo(-R * 0.11, 0); x.quadraticCurveTo(-R * 0.1, R * 0.16, 0, R * 0.32); x.quadraticCurveTo(R * 0.1, R * 0.16, R * 0.11, 0);
        x.arc(0, 0, R * 0.11, 0, Math.PI, true); x.closePath();
        x.fillStyle = '#ee8a3c'; x.fill(); x.lineWidth = R * 0.025; x.strokeStyle = '#fff'; x.stroke();
        x.fillStyle = '#ffd23a'; circle(0, 0, R * 0.05); x.fill();
        x.restore();
      }
      function frame(now) {
        const dt = Math.min(50, now - last); last = now;
        if (state === 'wind') {   // a little wind-up backwards before the push (anticipation)
          t += dt; const k = Math.min(1, t / 220); rot = from - 0.22 * Math.sin(k * Math.PI / 2);
          if (k >= 1) { state = 'spin'; t = 0; from = rot; Snd.play('whirl'); }
        } else if (state === 'spin') {
          t += dt; const k = Math.min(1, t / DUR); rot = from + (to - from) * (1 - Math.pow(1 - k, 4));
          const p = Math.floor(rot / A);
          if (p !== peg) { peg = p; flap = Math.min(flap, -0.42); if (now - tickAt > 45) { tickAt = now; Snd.play('tick'); } }
          if (k >= 1) land();
        } else if (state === 'idle') {
          idle += dt;
          hand.classList.toggle('on', idle > 2500);
          if (idle > 15000 && asked < 2) { asked++; Voice.say(L.wheel.ask); }
        }
        flap *= Math.pow(0.86, dt / 16);

      // the number is drawn first and the wheel is sent to a spot well inside its slice, five turns on

        Store.d.spin = { n, p: Store.d.played }; Store.save();
        Snd.play('win'); Fx.confetti(60);
        const r = cv.getBoundingClientRect();
        Fx.sparkles(r.left + r.width / 2, r.top + r.height * 0.52, 16, r.width * 0.2, '#ffd23a');

        resolve(r);
