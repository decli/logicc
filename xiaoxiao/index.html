<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ffd9ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="icon" href="../icon-192.png"><meta name="description" content="动物消消乐：三个连成一排就消掉，十关闯关，每局之后做一页数学题。"><title>动物消消乐</title>
<style>
:root{
  --ink:#4a2b5e;           /* deep plum for text and outlines */
  --pink:#ff7eb6; --pink2:#ff4f9a;
  --violet:#a77bff; --violet2:#7b4dff;
  --sky:#7cc8ff; --mint:#5fe0b0; --sun:#ffd23a; --orange:#ff9d3a; --red:#ff5a5a;
  --card:#fffaff;
  --shadow:0 6px 0 rgba(74,43,94,.18),0 10px 24px rgba(74,43,94,.18);
  --font:"Hiragino Maru Gothic ProN","Yuanti SC","PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(170deg,#ffd9ef 0%,#e9d9ff 45%,#c9ecff 100%);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#cv,#fx{display:block;position:fixed;left:0;top:0}
#cv{z-index:1;touch-action:none}
#fx{z-index:32;pointer-events:none}

/* ---------- candy buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35em;min-height:58px;padding:0 26px;border-radius:999px;font-size:24px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#ff9fca,var(--pink2));box-shadow:0 5px 0 #c42c70,0 10px 18px rgba(196,44,112,.3);text-shadow:0 2px 0 rgba(0,0,0,.15);
  transition:transform .12s, box-shadow .12s;position:relative}
.btn::after{content:"";position:absolute;left:14%;right:14%;top:6px;height:30%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c42c70,0 4px 10px rgba(196,44,112,.3)}
.btn.green{background:linear-gradient(180deg,#8ff0c6,#22c38a);box-shadow:0 5px 0 #15895f,0 10px 18px rgba(21,137,95,.3)}
.btn.green:active{box-shadow:0 1px 0 #15895f}
.btn.violet{background:linear-gradient(180deg,#c6a6ff,var(--violet2));box-shadow:0 5px 0 #5328c9,0 10px 18px rgba(83,40,201,.3)}
.btn.violet:active{box-shadow:0 1px 0 #5328c9}
.btn.sun{background:linear-gradient(180deg,#ffe680,#ffb000);box-shadow:0 5px 0 #c27c00,0 10px 18px rgba(194,124,0,.3);color:#6b3d00;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.sun:active{box-shadow:0 1px 0 #c27c00}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d9c6ea,0 10px 18px rgba(74,43,94,.12);text-shadow:none}
.btn.ghost:active{box-shadow:0 1px 0 #d9c6ea}
.btn.small{min-height:46px;font-size:19px;padding:0 18px}
.ibtn{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #d9c6ea,0 8px 16px rgba(74,43,94,.15);font-size:28px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9c6ea}

/* ---------- map ---------- */
#map{position:fixed;inset:0;z-index:10;overflow:hidden;
  background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.75) 0 60px,transparent 61px),radial-gradient(circle at 80% 85%,rgba(255,255,255,.5) 0 90px,transparent 91px),linear-gradient(170deg,#ffd9ef 0%,#e9d9ff 45%,#c9ecff 100%)}
#map .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
#map h1{margin:0;font-size:34px;font-weight:900;letter-spacing:2px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);flex:1;text-align:center;white-space:nowrap}
#map .pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 16px;font-size:22px;font-weight:800;box-shadow:0 4px 0 #d9c6ea}
#path{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ffb3d6 19% 100%);box-shadow:0 6px 0 #d4448a,0 12px 20px rgba(212,68,138,.35);font-size:40px;font-weight:900;color:#fff;
  -webkit-text-stroke:2px #b8306f;paint-order:stroke fill;transition:transform .15s}
.node:active{transform:scale(.94)}
.node.done{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ffd84d 19% 100%);box-shadow:0 6px 0 #d19a00,0 12px 20px rgba(209,154,0,.35);-webkit-text-stroke-color:#a86b00}
.node.lock{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#d5cde0 19% 100%);box-shadow:0 6px 0 #a99bbb;-webkit-text-stroke-color:#8a7c9b;font-size:30px}
.node.cur{animation:bob 1.2s ease-in-out infinite}
.node .st{position:absolute;bottom:-28px;font-size:22px;-webkit-text-stroke:0;letter-spacing:-2px;white-space:nowrap;filter:drop-shadow(0 2px 0 rgba(74,43,94,.25))}
.node .nm{position:absolute;bottom:-60px;font-size:17px;font-weight:800;-webkit-text-stroke:0;color:var(--ink);background:rgba(255,255,255,.85);padding:2px 10px;border-radius:999px;white-space:nowrap}
.avatar{position:absolute;width:76px;height:76px;margin:-118px 0 0 -38px;pointer-events:none;animation:hop 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{50%{transform:translateY(-12px) rotate(-4deg)}}

#map .pill.book{cursor:pointer}
#map .pill.book.new{animation:wig 1.1s ease-in-out infinite;box-shadow:0 4px 0 #d9c6ea,0 0 0 4px #ff4f6d}
@keyframes wig{0%,60%,100%{transform:none}70%{transform:rotate(-6deg) scale(1.08)}80%{transform:rotate(6deg) scale(1.08)}90%{transform:rotate(-3deg)}}

/* ---------- the blind box and the album (gift.js) ---------- */
#gift{position:fixed;inset:0;z-index:31;touch-action:none}
#gift canvas{position:absolute;left:0;top:0}
#gift .keep{position:absolute;left:50%;bottom:max(34px,env(safe-area-inset-bottom));min-height:68px;font-size:30px;padding:0 40px;
  transform:translate(-50%,60px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,1.6,.4,1),opacity .25s}
#gift .keep.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#album{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.7) 0 70px,transparent 71px),linear-gradient(170deg,#fff4d6 0%,#ffe3f1 55%,#e3e9ff 100%);
  padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
#album .top{display:flex;align-items:center;gap:14px}
#album h1{margin:0;font-size:34px;font-weight:900;letter-spacing:2px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);flex:1;text-align:center;white-space:nowrap}
#album .pill{background:#fff;border-radius:999px;padding:8px 16px;font-size:22px;font-weight:800;box-shadow:0 4px 0 #d9c6ea}
#album .agrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:8px}
.aslot{position:relative;min-width:0;min-height:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #ecd3b0;display:flex;align-items:center;justify-content:center}
.aslot.t1{background:radial-gradient(circle at 50% 45%,#fffdf0 0 35%,#ffe27a 100%);box-shadow:0 4px 0 #e0a800}
.aslot.t2{background:conic-gradient(#ffc6dc,#ffe3a8,#fff6a8,#c8f5d2,#c4e9ff,#e0d0ff,#ffc6dc);box-shadow:0 4px 0 #a982ff}
.aslot.no{background:#f3ebfb;box-shadow:0 4px 0 #ddd0ea}
.aslot.no.t1{background:#fbf3d6;box-shadow:0 4px 0 #ecd9a0}
.aslot.no.t2{background:conic-gradient(#f6e3ee,#f8efdc,#f7f4dc,#e3f4e7,#e2eff8,#ece4f8,#f6e3ee);box-shadow:0 4px 0 #d3c4ef}
.aslot canvas{display:block;pointer-events:none}
.aslot b{position:absolute;right:-5px;bottom:-5px;min-width:30px;height:26px;padding:0 6px;border-radius:999px;background:var(--violet2);color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.aslot .anew{position:absolute;left:-6px;top:-6px;background:#ff4f6d;color:#fff;font-size:13px;font-weight:900;font-style:normal;padding:2px 7px;border-radius:999px;border:2px solid #fff;animation:pulse .8s ease-in-out infinite}

/* ---------- in-game HUD ---------- */
#hud{position:fixed;z-index:5;display:flex;gap:12px;pointer-events:none}
#hud > *{pointer-events:auto}
#hud.side{right:0;top:0;bottom:0;transform-origin:100% 0;flex-direction:column;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) 6px}
#hud.top{left:0;right:0;top:0;transform-origin:0 0;flex-direction:row;align-items:stretch;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.panel{background:rgba(255,255,255,.88);border-radius:26px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lvname{font-size:20px;font-weight:900;text-align:center;line-height:1.2}
.lvname small{display:block;font-size:15px;font-weight:700;opacity:.65}
.moves{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 14%,#b993ff 15% 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 5px 0 #6c40d9;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:transform .15s}
.moves b{font-size:48px;line-height:1;font-weight:900;-webkit-text-stroke:2px #5a2fc0;paint-order:stroke fill}
.moves span{font-size:15px;font-weight:800;opacity:.95}
.moves.low{background:radial-gradient(circle at 35% 30%,#fff 0 14%,#ff7a9c 15% 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 5px 0 #c73560;animation:pulse .8s ease-in-out infinite}
.moves.low b{-webkit-text-stroke-color:#a3214a}
@keyframes pulse{50%{transform:scale(1.07)}}
.goals{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.goal{position:relative;width:74px;height:74px;border-radius:20px;background:#f6edff;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.goal img,.goal canvas{width:60px;height:60px;object-fit:contain}
.goal b{position:absolute;right:-6px;bottom:-6px;min-width:34px;height:30px;padding:0 7px;border-radius:999px;background:var(--ink);color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.goal.ok b{background:#22c38a;font-size:20px}
.goal.bump{transform:scale(1.18)}
.score{width:100%;min-width:150px}
.score .num{font-size:24px;font-weight:900;text-align:center}
.bar{position:relative;align-self:stretch;height:18px;border-radius:999px;background:#eadcf7;margin:18px 10px 6px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#ff9fca,#ffd23a);width:0;transition:width .35s}
.bar s{position:absolute;top:-18px;margin-left:-14px;font-size:26px;text-decoration:none;filter:grayscale(1) opacity(.45);transition:filter .3s,transform .3s}
.bar s.on{filter:none;transform:scale(1.25)}
.hbtns{display:flex;gap:12px;justify-content:center}
#hud.top .panel{padding:8px 10px;border-radius:22px;justify-content:center}
#hud.top .moves{width:86px;height:86px}
#hud.top .moves b{font-size:38px}
#hud.top .goal{width:62px;height:62px;border-radius:16px}
#hud.top .goal img,#hud.top .goal canvas{width:50px;height:50px}
#hud.top .score{min-width:120px}
#hud.top .lvname{font-size:17px}
#hud.top .panel.name{display:none}
#hud.top .goals{flex-wrap:nowrap}
.score .sub{display:none;font-size:16px;font-weight:800;opacity:.7;text-align:center}
#hud.top .score .sub{display:block}
#hud.top .ibtn{width:48px;height:48px;font-size:24px}
/* phones held upright: one row is too narrow for everything, so the score goes on a second row under the moves and goals */
@media (max-width:560px){
  #hud.top{flex-wrap:wrap;gap:8px 10px}
  #hud.top .moves{width:clamp(58px,18vw,78px);height:clamp(58px,18vw,78px)}
  #hud.top .moves b{font-size:clamp(26px,8.5vw,34px)}
  #hud.top .moves span{font-size:13px}
  #hud.top .goals{gap:6px}
  #hud.top .goal{width:clamp(42px,13vw,56px);height:clamp(42px,13vw,56px);border-radius:14px}
  #hud.top .goal img,#hud.top .goal canvas{width:80%;height:80%}
  #hud.top .goal b{min-width:28px;height:26px;font-size:16px;right:-5px;bottom:-5px;padding:0 5px}
  #hud.top .hbtns{margin-left:auto;align-items:center}
  #hud.top .score{order:9;flex:1 1 100%;min-width:0;flex-direction:row;align-items:center;gap:10px;padding:4px 14px 6px}
  #hud.top .score .sub{white-space:nowrap;font-size:15px}
  #hud.top .score .num{font-size:20px;min-width:62px}
  #hud.top .bar{flex:1;margin:16px 10px 2px}
}

/* ---------- cards and modals ---------- */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(74,43,94,.35);padding:20px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.card{position:relative;background:var(--card);border-radius:34px;box-shadow:0 10px 0 rgba(74,43,94,.2),0 24px 50px rgba(74,43,94,.3);padding:26px 30px 30px;max-width:min(560px,100%);width:100%;
  text-align:center;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:-56px auto 10px;width:max-content;max-width:100%;padding:10px 30px;border-radius:999px;background:linear-gradient(180deg,#ffb3d6,var(--pink2));color:#fff;font-size:28px;font-weight:900;
  box-shadow:0 5px 0 #c42c70;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.card h2.green{background:linear-gradient(180deg,#8ff0c6,#22c38a);box-shadow:0 5px 0 #15895f}
.card h2.violet{background:linear-gradient(180deg,#c6a6ff,var(--violet2));box-shadow:0 5px 0 #5328c9}
.card p{font-size:22px;line-height:1.5;margin:10px 0}
.card .row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:18px}
.card .goals{margin:14px 0 4px;gap:16px}
.card .goal{width:84px;height:84px}
.card .goal img,.card .goal canvas{width:68px;height:68px}
.card .moves{width:84px;height:84px;margin-right:6px}
.card .moves b{font-size:36px}
.card .moves span{font-size:13px}
.card p.best{font-size:22px;font-weight:900;opacity:.75;margin:6px 0 0}
.bigstars{font-size:64px;letter-spacing:4px;margin:4px 0 0;height:80px}
.bigstars span{display:inline-block;filter:grayscale(1) opacity(.3)}
.bigstars span.on{filter:none;animation:starIn .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-120deg)}}
.tipart{display:flex;justify-content:center;margin:8px 0}
.tipart canvas{width:240px;height:96px}
.big{font-size:34px;font-weight:900}

/* ---------- math page ---------- */
#math{position:fixed;inset:0;z-index:40;display:flex;background:linear-gradient(170deg,#fff4d6 0%,#ffe3f1 60%,#e3e9ff 100%);
  padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));gap:14px}
#math.wide{flex-direction:row}
#math.tall{flex-direction:column}
#math .sheet{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
#math .head{display:flex;align-items:center;gap:12px}
#math .head h3{margin:0;font-size:26px;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#math .prog{font-size:22px;font-weight:900;background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 #ecd3b0;white-space:nowrap}
#math .grid{flex:1;min-height:0;display:grid;gap:10px}
.q{background:#fff;border-radius:18px;box-shadow:0 4px 0 #ecd3b0;display:flex;align-items:center;justify-content:center;gap:.25em;font-weight:900;font-variant-numeric:tabular-nums;
  border:4px solid transparent;transition:transform .1s,border-color .15s,background .2s;white-space:nowrap;min-width:0;overflow:hidden;position:relative}
.q.cur{border-color:#ffb000;background:#fffbe8;transform:scale(1.03)}
.q.ok{background:#e6fff4;box-shadow:0 4px 0 #9fe3c4}
.q.ok::after{content:"✓";position:absolute;right:8px;top:2px;color:#22c38a;font-size:.8em}
.q .ans{display:inline-block;min-width:1.9em;padding:0 .15em;border-bottom:4px solid #d8c3a5;text-align:center;color:#7b4dff}
.q.ok .ans{color:#15895f;border-color:#9fe3c4}
.q .ans.hint{color:#c9b8dd}
.q.bad{animation:shake .35s;border-color:var(--red);background:#fff0f0}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#math .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center}
#math.wide .pad{width:clamp(250px,30vw,330px)}
#math.tall .pad{grid-template-columns:repeat(6,1fr);height:clamp(150px,26vh,230px)}
.key{border-radius:20px;background:#fff;box-shadow:0 5px 0 #d9c6ea;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;min-height:62px}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #d9c6ea;background:#f6edff}
.key.ok{background:linear-gradient(180deg,#8ff0c6,#22c38a);color:#fff;box-shadow:0 5px 0 #15895f}
.key.del{background:#ffe9f2;color:#c42c70}
#math .disp{grid-column:1/-1;text-align:center;font-size:24px;font-weight:800;min-height:34px}

/* ---------- parent settings ---------- */
.set{text-align:left;max-height:calc(100vh - 80px);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.set h2{margin:0 auto 10px}
.set h3{font-size:19px;margin:16px 0 8px}
.set .done{position:sticky;bottom:-30px;margin:10px -30px -30px;padding:14px 0 18px;background:linear-gradient(rgba(255,255,255,0),#fff 35%)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:10px 16px;border-radius:14px;background:#f1e8fb;font-size:19px;font-weight:800;box-shadow:0 3px 0 #d9c6ea}
.seg button.on{background:var(--violet2);color:#fff;box-shadow:0 3px 0 #5328c9}
.set .sample{font-size:18px;opacity:.75;margin-top:8px}
.set table{width:100%;border-collapse:collapse;font-size:16px}
.set td{padding:5px 4px;border-bottom:1px solid #eee3f5}
.gate .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.gate .key{font-size:28px;min-height:54px}

#toast{position:fixed;z-index:55;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,200%);width:max-content;max-width:min(640px,92vw);background:#fff;border-radius:24px;box-shadow:var(--shadow);
  padding:14px 22px;font-size:21px;font-weight:800;line-height:1.4;transition:transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#toast.on{transform:translate(-50%,0)}
#loader{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(170deg,#ffd9ef 0%,#e9d9ff 45%,#c9ecff 100%);
  font-size:24px;font-weight:800;transition:opacity .4s}
#loader.gone{opacity:0;pointer-events:none}
#loader .ld{width:220px;height:16px;border-radius:999px;background:#fff;overflow:hidden}
#loader .ld i{display:block;height:100%;width:10%;background:linear-gradient(90deg,#ff9fca,#ffd23a);transition:width .3s}
</style>

<body>
<div id="loader"><div style="font-size:64px">🐼</div><div>动物们正在赶来…</div><div class="ld"><i id="ldBar"></i></div></div>
<canvas id="cv"></canvas>
<div id="hud" hidden></div>
<div id="map" hidden></div>
<div id="album" hidden></div>
<canvas id="fx"></canvas>
<div id="modal" class="modal" hidden></div>
<div id="math" hidden></div>
<div id="toast"></div>
<script>
(() => {
'use strict';
// 动物消消乐 · small helpers shared by everything: DOM, maths, the game clock, saved progress.
const $ = (q, r) => (r || document).querySelector(q);
const $$ = (q, r) => [...(r || document).querySelectorAll(q)];
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const Ease = {
  out: k => 1 - (1 - k) * (1 - k),
  in: k => k * k,
  inOut: k => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  back: k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  elastic: k => (k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI / 3)) + 1),
};

// The game clock only moves while frames are drawn, so a hidden tab or the pause card freezes every animation and wait.
const Clock = {
  now: 0, paused: false, jobs: [],
  tick(dt) {
    if (this.paused) return;
    this.now += dt;
    const due = this.jobs;
    this.jobs = [];
    for (const j of due) {
      const k = j.dur > 0 ? clamp((this.now - j.t0) / j.dur, 0, 1) : 1;
      if (j.fn) j.fn(j.ease ? j.ease(k) : k, k);
      if (k >= 1) j.res(); else this.jobs.push(j);
    }
  },
  // run fn(easedK, k) every frame for dur ms; resolves when done
  tween(dur, fn, ease) { return new Promise(res => this.jobs.push({ t0: this.now, dur, fn, ease, res })); },
  wait(ms) { return this.tween(ms, null); },
  // drop everything still running without resolving it, so a turn that was playing when the level was left just stops
  clear() { this.jobs = []; },
};

// Saved on this device: progress, the math settings, the record of math pages.
const Store = {
  key: 'logicc.xiaoxiao.v1',
  d: null,
  defaults() {
    return {
      open: 1,               // highest level that can be played
      stars: {}, best: {},   // per level
      owed: false,           // a math page is due before the next game
      played: 0,
      math: { max: 20, ops: 2, mode: 'mix', count: 10 },   // count: sums per page, 家长设置 (MATH_COUNTS)
      mathV: 2,              // 2: the page size can be set; before that it was always 20
      log: [],               // finished math pages: [time, count, right first time, seconds, settings label]
      seen: {},              // tips already shown
      gifts: {},             // friends from the blind box (gift.js): id -> how many
      giftFresh: [],         // new friends not yet seen in the album
      snd: true, voi: true, mus: true,
    };
  },
  load() {
    this.d = this.defaults();
    try {
      // first visit: follow 思维小画本's sound switches
      const home = JSON.parse(localStorage.getItem('logicc.design.v2') || 'null');
      if (home) { if (typeof home.snd === 'boolean') this.d.snd = home.snd; if (typeof home.voi === 'boolean') this.d.voi = home.voi; if (typeof home.mus === 'boolean') this.d.mus = home.mus; }
      const raw = JSON.parse(localStorage.getItem(this.key) || 'null');
      if (raw) {
        Object.assign(this.d, raw); this.d.math = Object.assign(this.defaults().math, raw.math || {});
        // saved before the page size could be set: that 20 was nobody's choice, so take the new default (decli: 10)
        if (!raw.mathV) { this.d.math.count = this.defaults().math.count; this.d.mathV = 2; }
      }
    } catch (e) { }
    return this.d;
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (e) { } },
};

// 动物消消乐 · the rules, with no drawing in it (dev/sim.js runs it in node to test the levels).
//
// A turn is worked out all at once: the swap, every match, every special that goes off, every piece that falls and
// every new one that drops in. What happened is returned as a list of phases, each with time-stamped events, and the
// page plays them back (game.js). The board itself is already in its final state when the animation starts.
//
// Cells: v (void, not part of the board), ice (0-2 layers under the piece), box (0-2 layers, a gift box that takes the
// whole cell), bub (a bubble around the piece: it cannot be moved or fall, a match or a blast pops the bubble and the
// piece stays), p (the piece).
// Pieces: k 'a' animal of colour c, k 'g' penguin (cannot be matched or blown up; walks out at the bottom).
// Specials: s 'h' clears its row, 'v' its column, 'b' bomb (diamond of radius 2), 'c' rainbow ball (no colour).

const ANIMALS = [];   // this game's six animals { id, name, fx colours, h: FRIENDS number }, filled in by cast.js
const PENGUIN = 6;   // the kind after the six animals (always FRIENDS' penguin)

const PTS = { piece: 20, blast: 30, make: { h: 100, v: 100, b: 150, c: 250 }, ice: 80, box: 60, bub: 50, home: 1000, bonus: 200 };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// a small binary heap of timed events, so blasts are applied in the order they reach each cell
function Heap() { this.a = []; this.n = 0; }
Heap.prototype.push = function (e) {
  e.q = this.n++; const a = this.a; a.push(e); let i = a.length - 1;
  while (i > 0) { const p = (i - 1) >> 1; if (Heap.lt(a[i], a[p])) { [a[i], a[p]] = [a[p], a[i]]; i = p; } else break; }
};
Heap.prototype.pop = function () {
  const a = this.a, top = a[0], last = a.pop();
  if (a.length) {
    a[0] = last; let i = 0;
    for (;;) {
      const l = 2 * i + 1, r = l + 1; let m = i;
      if (l < a.length && Heap.lt(a[l], a[m])) m = l;
      if (r < a.length && Heap.lt(a[r], a[m])) m = r;
      if (m === i) break;[a[i], a[m]] = [a[m], a[i]]; i = m;
    }
  }
  return top;
};
Heap.lt = (x, y) => x.t < y.t || (x.t === y.t && x.q < y.q);

// layout characters: . cell  _ void  i/I ice 1/2  b/B gift box 1/2  o bubble  q bubble on ice  g penguin  k ice under a penguin
function Board(lv, rng) {
  this.lv = lv;
  this.rng = rng || Math.random;
  const lay = lv.layout || Array(8).fill('........');
  this.R = lay.length; this.C = Math.max(...lay.map(s => s.length));
  this.cells = [];
  this.nextId = 1;
  this.colors = lv.colors;
  this.moves = lv.moves; this.score = 0;
  this.pg = { total: lv.penguins ? lv.penguins.total : 0, max: lv.penguins ? lv.penguins.max : 0, made: 0, home: 0, gap: 0 };
  const preset = [];
  for (let r = 0; r < this.R; r++) for (let c = 0; c < this.C; c++) {
    const ch = lay[r][c] || '_';
    const cell = { v: ch === '_' || ch === ' ', ice: 0, box: 0, bub: false, p: null };
    if (ch === 'i' || ch === 'q' || ch === 'k') cell.ice = 1;
    if (ch === 'I') cell.ice = 2;
    if (ch === 'b') cell.box = 1;
    if (ch === 'B') cell.box = 2;
    if (ch === 'o' || ch === 'q') cell.bub = true;
    if (ch === 'g' || ch === 'k') preset.push(this.cells.length);
    this.cells.push(cell);
  }
  // new pieces drop in at the top cell of each column; penguins leave from the bottom cell
  this.spawn = this.cells.map((cell, i) => !cell.v && (this.rc(i)[0] === 0 || this.cells[i - this.C].v));
  this.exit = this.cells.map((cell, i) => !cell.v && (this.rc(i)[0] === this.R - 1 || this.cells[i + this.C].v));
  this.goals = lv.goals.map(g => {
    const n = g.n != null ? g.n
      : g.t === 'ice' ? this.cells.filter(x => x.ice > 0).length
      : g.t === 'box' ? this.cells.filter(x => x.box > 0).length
      : g.t === 'bub' ? this.cells.filter(x => x.bub).length
      : g.t === 'pg' ? this.pg.total : 0;
    return Object.assign({}, g, { n, left: n });
  });
  this.fillInitial(preset);
}

Board.prototype.rc = function (i) { return [Math.floor(i / this.C), i % this.C]; };
Board.prototype.idx = function (r, c) { return r < 0 || c < 0 || r >= this.R || c >= this.C ? -1 : r * this.C + c; };
Board.prototype.on = function (i) { return i >= 0 && !this.cells[i].v; };
Board.prototype.newPiece = function (c, s) { return { id: this.nextId++, k: 'a', c, s: s || null }; };
Board.prototype.randColor = function () { return this.colors[Math.floor(this.rng() * this.colors.length)]; };
Board.prototype.movable = function (i) { const x = this.cells[i]; return i >= 0 && !x.v && !x.box && !x.bub && !!x.p; };
Board.prototype.colorAt = function (i) {
  if (i < 0) return -1;
  const x = this.cells[i];
  if (x.v || x.box || !x.p || x.p.k !== 'a' || x.p.s === 'c') return -1;
  return x.p.c;
};
Board.prototype.neighbors = function (i) {
  const [r, c] = this.rc(i), out = [];
  for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) { const j = this.idx(r + dr, c + dc); if (this.on(j)) out.push(j); }
  return out;
};

Board.prototype.fillInitial = function (preset) {
  for (let tries = 0; tries < 200; tries++) {
    this.cells.forEach(x => { x.p = null; });
    preset.forEach(i => { this.cells[i].p = { id: this.nextId++, k: 'g' }; });
    this.pg.made = preset.length;
    for (let i = 0; i < this.cells.length; i++) {
      const x = this.cells[i];
      if (x.v || x.box || x.p) continue;
      const [r, c] = this.rc(i);
      let col, guard = 0;
      do {
        col = this.randColor();
        guard++;
      } while (guard < 50 && ((this.colorAt(this.idx(r, c - 1)) === col && this.colorAt(this.idx(r, c - 2)) === col) ||
        (this.colorAt(this.idx(r - 1, c)) === col && this.colorAt(this.idx(r - 2, c)) === col)));
      x.p = this.newPiece(col);
    }
    if (!this.findMatches().length && this.hasMove()) return;
  }
};

// ---------- matching ----------
Board.prototype.findMatches = function () {
  const runs = [];
  const scan = (outer, inner, at, dir) => {
    for (let a = 0; a < outer; a++) {
      let b = 0;
      while (b < inner) {
        const col = this.colorAt(at(a, b));
        if (col < 0) { b++; continue; }
        let e = b + 1;
        while (e < inner && this.colorAt(at(a, e)) === col) e++;
        if (e - b >= 3) { const cells = []; for (let k = b; k < e; k++) cells.push(at(a, k)); runs.push({ dir, cells, color: col }); }
        b = e;
      }
    }
  };
  scan(this.R, this.C, (r, c) => this.idx(r, c), 'h');
  scan(this.C, this.R, (c, r) => this.idx(r, c), 'v');
  // runs that share a cell are one group (an L, a T or a cross)
  const owner = new Map(), groups = [];
  for (const run of runs) {
    const hit = new Set(run.cells.map(i => owner.get(i)).filter(g => g));
    let g;
    if (!hit.size) { g = { color: run.color, cells: new Set(), runs: [] }; groups.push(g); }
    else {
      const [first, ...rest] = [...hit]; g = first;
      for (const o of rest) { o.cells.forEach(i => g.cells.add(i)); g.runs.push(...o.runs); groups.splice(groups.indexOf(o), 1); }
    }
    g.runs.push(run); run.cells.forEach(i => g.cells.add(i));
    g.cells.forEach(i => owner.set(i, g));
  }
  return groups;
};
Board.prototype.specialFor = function (g) {
  const max = Math.max(...g.runs.map(r => r.cells.length));
  if (max >= 5) return 'c';
  if (g.runs.some(r => r.dir === 'h') && g.runs.some(r => r.dir === 'v')) return 'b';
  if (max === 4) return g.runs.find(r => r.cells.length === 4).dir;
  return null;
};
Board.prototype.pickSpawn = function (g, type, prefer) {
  const ok = i => !this.cells[i].bub && this.cells[i].p && !this.cells[i].p.s;
  for (const i of prefer) if (g.cells.has(i) && ok(i)) return i;
  if (type === 'b') {
    const h = new Set(), both = [];
    g.runs.filter(r => r.dir === 'h').forEach(r => r.cells.forEach(i => h.add(i)));
    g.runs.filter(r => r.dir === 'v').forEach(r => r.cells.forEach(i => { if (h.has(i)) both.push(i); }));
    for (const i of both) if (ok(i)) return i;
  }
  const run = g.runs.slice().sort((a, b) => b.cells.length - a.cells.length)[0];
  const mid = run.cells.slice().sort((a, b) => Math.abs(run.cells.indexOf(a) - (run.cells.length - 1) / 2) - Math.abs(run.cells.indexOf(b) - (run.cells.length - 1) / 2));
  for (const i of mid) if (ok(i)) return i;
  for (const i of g.cells) if (ok(i)) return i;
  return -1;
};

// ---------- clearing ----------
// ctx: one clearing phase. ev = what the page will animate, t in ms from the start of the phase.
Board.prototype.newCtx = function (cascade) {
  return { cascade, heap: new Heap(), ev: [], done: new Set(), boxHit: new Set(), protect: new Set(), acts: 0, cleared: 0, big: 0 };
};
Board.prototype.goal = function (t, c, amount) {
  for (const g of this.goals) if (g.t === t && (t !== 'c' || g.color === c) && g.left > 0) { g.left = Math.max(0, g.left - (amount || 1)); return g; }
  return null;
};
Board.prototype.hitBox = function (i, t, ctx) {
  const x = this.cells[i];
  if (!x.box || ctx.boxHit.has(i)) return;
  ctx.boxHit.add(i); x.box--;
  this.score += PTS.box;
  const g = x.box === 0 ? this.goal('box') : null;
  ctx.ev.push({ t, k: 'box', i, left: x.box, goal: !!g, pts: PTS.box });
};
Board.prototype.clearCell = function (i, t, by, ctx, to) {
  const x = this.cells[i];
  if (x.v || ctx.done.has(i) || ctx.protect.has(i)) return;
  if (x.box) { if (by !== 'match') this.hitBox(i, t, ctx); return; }
  const p = x.p;
  if (!p) return;
  if (x.bub) {
    x.bub = false; ctx.done.add(i);
    this.score += PTS.bub;
    const g = this.goal('bub');
    ctx.ev.push({ t, k: 'bub', i, goal: !!g, pts: PTS.bub });
    return;
  }
  if (p.k === 'g') return;
  ctx.done.add(i); x.p = null; ctx.cleared++;
  const pts = by === 'match' ? PTS.piece * Math.min(ctx.cascade, 6) : PTS.blast;
  this.score += pts;
  const g = p.s !== 'c' ? this.goal('c', p.c) : null;
  ctx.ev.push({ t, k: 'pop', i, p, by, to, goal: !!g, pts });
  if (x.ice > 0) {
    x.ice--; this.score += PTS.ice;
    const gi = x.ice === 0 ? this.goal('ice') : null;
    ctx.ev.push({ t, k: 'ice', i, left: x.ice, goal: !!gi, pts: PTS.ice });
  }
  if (p.s) ctx.heap.push({ t: t + (by === 'match' ? 90 : 60), k: 'act', i, p });
};
Board.prototype.diamond = function (i, rad) {
  const [r, c] = this.rc(i), out = [];
  for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
    if (Math.abs(dr) + Math.abs(dc) > rad) continue;
    const j = this.idx(r + dr, c + dc); if (this.on(j)) out.push([j, Math.abs(dr) + Math.abs(dc)]);
  }
  return out;
};
Board.prototype.line = function (i, dir) {
  const [r, c] = this.rc(i), out = [];
  if (dir === 'h') for (let k = 0; k < this.C; k++) { const j = this.idx(r, k); if (this.on(j)) out.push([j, Math.abs(k - c)]); }
  else for (let k = 0; k < this.R; k++) { const j = this.idx(k, c); if (this.on(j)) out.push([j, Math.abs(k - r)]); }
  return out;
};
Board.prototype.piecesOf = function (col, ctx) {
  const out = [];
  this.cells.forEach((x, j) => { if (!x.v && !x.box && x.p && x.p.k === 'a' && x.p.s !== 'c' && x.p.c === col && !ctx.done.has(j)) out.push(j); });
  return out;
};
Board.prototype.commonColor = function (ctx) {
  const n = {};
  this.cells.forEach((x, j) => { if (!x.v && !x.box && x.p && x.p.k === 'a' && x.p.s !== 'c' && !ctx.done.has(j)) n[x.p.c] = (n[x.p.c] || 0) + 1; });
  let best = -1, bn = 0;
  for (const k in n) if (n[k] > bn) { bn = n[k]; best = +k; }
  return best;
};
Board.prototype.activate = function (e, ctx) {
  const { i, p, t } = e;
  ctx.acts++;
  if (p.s === 'h' || p.s === 'v') {
    ctx.ev.push({ t, k: 'beam', i, dir: p.s, c: p.c });
    for (const [j, d] of this.line(i, p.s)) if (j !== i) ctx.heap.push({ t: t + d * 26, k: 'clear', i: j, by: 'blast' });
  } else if (p.s === 'b') {
    ctx.ev.push({ t, k: 'bomb', i, rad: 2, c: p.c });
    for (const [j, d] of this.diamond(i, 2)) if (j !== i) ctx.heap.push({ t: t + d * 45, k: 'clear', i: j, by: 'blast' });
  } else if (p.s === 'c') {
    const col = this.commonColor(ctx);
    const targets = col >= 0 ? this.piecesOf(col, ctx) : [];
    ctx.ev.push({ t, k: 'zap', i, to: targets, c: col });
    targets.forEach((j, n) => ctx.heap.push({ t: t + 160 + n * 28, k: 'clear', i: j, by: 'blast' }));
  }
};
Board.prototype.run = function (ctx) {
  while (ctx.heap.a.length) {
    const e = ctx.heap.pop();
    if (e.k === 'clear') this.clearCell(e.i, e.t, e.by, ctx, e.to);
    else if (e.k === 'act') this.activate(e, ctx);
    else if (e.k === 'box') this.hitBox(e.i, e.t, ctx);
    else if (e.k === 'fn') e.fn(e.t);
  }
  const end = ctx.ev.reduce((m, e) => Math.max(m, e.t), 0);
  ctx.ev.sort((a, b) => a.t - b.t);
  return { type: 'clear', cascade: ctx.cascade, ev: ctx.ev, dur: end + 260, acts: ctx.acts, cleared: ctx.cleared, big: ctx.big };
};

// one round of matches: clear them, make the specials they earn
Board.prototype.matchPhase = function (groups, cascade, prefer) {
  const ctx = this.newCtx(cascade), makes = [];
  for (const g of groups) {
    const s = this.specialFor(g);
    const at = s ? this.pickSpawn(g, s, prefer) : -1;
    if (at >= 0) { ctx.protect.add(at); makes.push({ i: at, s, c: g.color }); }
    for (const i of g.cells) if (i !== at) ctx.heap.push({ t: 0, k: 'clear', i, by: 'match', to: at >= 0 ? at : undefined });
    const near = new Set();
    for (const i of g.cells) for (const j of this.neighbors(i)) if (this.cells[j].box) near.add(j);
    near.forEach(j => ctx.heap.push({ t: 40, k: 'box', i: j }));
  }
  const ph = this.run(ctx);
  for (const m of makes) {
    const x = this.cells[m.i], old = x.p;
    x.p = this.newPiece(m.c, m.s);
    this.score += PTS.make[m.s];
    ph.ev.push({ t: 150, k: 'make', i: m.i, p: x.p, old: old ? old.id : 0, pts: PTS.make[m.s] });
  }
  ph.makes = makes;
  ph.ev.sort((a, b) => a.t - b.t);
  ph.dur = Math.max(ph.dur, makes.length ? 420 : 0);
  return ph;
};

// ---------- falling ----------
// Pieces fall one cell per step; new ones drop in at the top cells. When nothing can fall straight down any more,
// a piece may slide diagonally into a hole under a gift box, a bubble or the edge of the board.
Board.prototype.settle = function () {
  const paths = new Map(), landed = new Set(), news = [];
  const empty = i => this.on(i) && !this.cells[i].box && !this.cells[i].p;
  const canFall = i => this.on(i) && !this.cells[i].box && !this.cells[i].bub && !!this.cells[i].p;
  const rec = (p, from, to, s) => {
    if (!paths.has(p.id)) paths.set(p.id, { p, pts: [{ s: s - 1, r: from[0], c: from[1] }] });
    paths.get(p.id).pts.push({ s, r: to[0], c: to[1] });
  };
  let step = 0;
  for (; step < 400; step++) {
    let any = false;
    const s = step + 1, moved = new Set();
    for (let r = this.R - 1; r >= 0; r--) for (let c = 0; c < this.C; c++) {
      const i = this.idx(r, c);
      if (!empty(i)) continue;
      const j = this.idx(r - 1, c);
      if (j >= 0 && canFall(j) && !moved.has(this.cells[j].p.id)) {
        const p = this.cells[j].p; this.cells[j].p = null; this.cells[i].p = p; moved.add(p.id);
        rec(p, [r - 1, c], [r, c], s); any = true;
      } else if (this.spawn[i]) {
        const p = this.spawnPiece(c);
        this.cells[i].p = p; moved.add(p.id); news.push(p.id);
        rec(p, [r - 1, c], [r, c], s); any = true;
      }
    }
    if (!any) {
      for (let r = this.R - 1; r >= 0 && !any; r--) for (let c = 0; c < this.C; c++) {
        const i = this.idx(r, c);
        if (!empty(i)) continue;
        for (const dc of this.rng() < 0.5 ? [-1, 1] : [1, -1]) {
          const j = this.idx(r - 1, c + dc);
          if (j < 0 || !canFall(j)) continue;
          const below = this.idx(r, c + dc);
          if (below >= 0 && empty(below)) continue;   // it would rather fall straight down
          const p = this.cells[j].p; this.cells[j].p = null; this.cells[i].p = p;
          rec(p, [r - 1, c + dc], [r, c], s); any = true; break;
        }
      }
    }
    if (!any) break;
  }
  paths.forEach(v => { const e = v.pts[v.pts.length - 1]; landed.add(this.idx(e.r, e.c)); });
  return { type: 'fall', paths: [...paths.values()], steps: step, news, landed: [...landed] };
};
Board.prototype.spawnPiece = function () {
  const pg = this.pg;
  if (pg.made < pg.total && pg.gap <= 0) {
    let on = 0; this.cells.forEach(x => { if (x.p && x.p.k === 'g') on++; });
    if (on < pg.max && this.rng() < 0.25) { pg.made++; pg.gap = 3; return { id: this.nextId++, k: 'g' }; }
  }
  return this.newPiece(this.randColor());
};
Board.prototype.exits = function () {
  const out = [];
  this.cells.forEach((x, i) => {
    if (this.exit[i] && x.p && x.p.k === 'g') { out.push({ i, p: x.p }); x.p = null; this.pg.home++; this.score += PTS.home; this.goal('pg'); }
  });
  return out.length ? { type: 'exit', out, pts: PTS.home } : null;
};

// after the first clearing phase: fall, penguins out, match again, until the board is still
Board.prototype.cascade = function (phases, first, prefer) {
  let cascade = first;
  for (let guard = 0; guard < 60; guard++) {
    const fall = this.settle();
    if (fall.paths.length) phases.push(fall);
    const ex = this.exits();
    if (ex) { phases.push(ex); const f2 = this.settle(); if (f2.paths.length) phases.push(f2); fall.landed.push(...f2.landed); }
    const groups = this.findMatches();
    if (!groups.length) break;
    cascade++;
    phases.push(this.matchPhase(groups, cascade, fall.landed));
  }
  return cascade;
};

// ---------- the player's move ----------
Board.prototype.adjacent = function (a, b) {
  const [r1, c1] = this.rc(a), [r2, c2] = this.rc(b);
  return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
};
Board.prototype.isCombo = function (pa, pb) {
  if (pa.k !== 'a' || pb.k !== 'a') return false;
  return pa.s === 'c' || pb.s === 'c' || (!!pa.s && !!pb.s);
};
// a = where the finger started, b = where it moved to
Board.prototype.swap = function (a, b) {
  if (!this.adjacent(a, b) || !this.movable(a) || !this.movable(b) || this.moves <= 0) return { ok: false };
  const A = this.cells[a], B = this.cells[b], pa = A.p, pb = B.p;
  A.p = pb; B.p = pa;
  const phases = [{ type: 'swap', a, b, ida: pa.id, idb: pb.id }];
  let cascade = 1;
  this.pg.gap--;
  const combo = this.isCombo(pa, pb);
  if (combo) {
    this.moves--;
    phases.push(this.comboPhase(b, pa, a, pb));
  } else {
    const groups = this.findMatches();
    if (!groups.length) { A.p = pa; B.p = pb; this.pg.gap++; return { ok: false, bounce: true }; }
    this.moves--;
    phases.push(this.matchPhase(groups, 1, [b, a]));
  }
  cascade = this.cascade(phases, cascade, []);
  return { ok: true, phases, two: combo && !!pa.s && !!pb.s };   // two: two special pieces swapped together
};
// two specials, or a rainbow ball with anything: pa now sits at b, pb at a
Board.prototype.comboPhase = function (b, pa, a, pb) {
  const ctx = this.newCtx(1);
  const S = new Set([pa.s, pb.s]);
  const consume = (i, t) => {   // the two swapped pieces are used up by the combo instead of going off on their own
    const x = this.cells[i], p = x.p; ctx.done.add(i); x.p = null;
    const g = p.s !== 'c' ? this.goal('c', p.c) : null;
    ctx.ev.push({ t, k: 'pop', i, p, by: 'combo', goal: !!g, pts: 0 });
    if (x.ice > 0) { x.ice--; const gi = x.ice === 0 ? this.goal('ice') : null; ctx.ev.push({ t, k: 'ice', i, left: x.ice, goal: !!gi, pts: PTS.ice }); }
  };
  ctx.big = 1;
  if (S.has('c')) {
    const ball = pa.s === 'c' ? b : a, other = pa.s === 'c' ? pb : pa, oi = pa.s === 'c' ? a : b;
    if (other.s === 'c') {
      // two rainbow balls: everything goes, in a wave from the middle
      ctx.big = 3;
      consume(ball, 0); consume(oi, 0);
      ctx.ev.push({ t: 0, k: 'nova', i: b });
      const [r0, c0] = this.rc(b);
      this.cells.forEach((x, j) => { if (!x.v) { const [r, c] = this.rc(j); ctx.heap.push({ t: 250 + Math.hypot(r - r0, c - c0) * 70, k: 'clear', i: j, by: 'blast' }); } });
    } else {
      const col = other.c;
      consume(ball, 0);
      const targets = this.piecesOf(col, ctx);
      if (!other.s) {
        ctx.big = 1;
        ctx.ev.push({ t: 0, k: 'zap', i: ball, to: targets, c: col });
        targets.forEach((j, n) => ctx.heap.push({ t: 200 + n * 30, k: 'clear', i: j, by: 'blast' }));
      } else {
        // every piece of that colour turns into a stripe (or a bomb), then they all go off
        ctx.big = 2;
        ctx.ev.push({ t: 0, k: 'zap', i: ball, to: targets, c: col });
        targets.forEach((j, n) => {
          const x = this.cells[j];
          const s = other.s === 'b' ? 'b' : (this.rng() < 0.5 ? 'h' : 'v');
          if (j !== oi && !x.bub) { const old = x.p.id; x.p = this.newPiece(col, s); ctx.ev.push({ t: 200 + n * 30, k: 'make', i: j, p: x.p, old, quiet: true }); }
          ctx.heap.push({ t: 700 + n * 110, k: 'clear', i: j, by: 'blast' });
        });
      }
    }
  } else if (S.has('b') && S.size === 1) {
    consume(a, 0); consume(b, 0);
    ctx.big = 2;
    ctx.ev.push({ t: 0, k: 'bomb', i: b, rad: 4, c: pa.c });
    for (const [j, d] of this.diamond(b, 4)) ctx.heap.push({ t: 60 + d * 45, k: 'clear', i: j, by: 'blast' });
  } else if (S.has('b')) {
    // stripe + bomb: three rows and three columns
    consume(a, 0); consume(b, 0);
    ctx.big = 2;
    const [r, c] = this.rc(b);
    for (let k = -1; k <= 1; k++) {
      for (const [dir, j0] of [['h', this.idx(r + k, c)], ['v', this.idx(r, c + k)]]) {
        if (j0 < 0) continue;
        ctx.ev.push({ t: 40, k: 'beam', i: j0, dir, c: pa.c, wide: true });
        for (const [j, d] of this.line(j0, dir)) ctx.heap.push({ t: 40 + d * 26, k: 'clear', i: j, by: 'blast' });
      }
    }
  } else {
    // two stripes: a cross
    consume(a, 0); consume(b, 0);
    ctx.big = 1;
    for (const dir of ['h', 'v']) {
      ctx.ev.push({ t: 0, k: 'beam', i: b, dir, c: pa.c });
      for (const [j, d] of this.line(b, dir)) ctx.heap.push({ t: d * 26, k: 'clear', i: j, by: 'blast' });
    }
  }
  return this.run(ctx);
};

// ---------- end of the level: every move left turns a piece into a stripe ----------
Board.prototype.bonus = function () {
  const phases = [];
  let guard = 0;
  while (guard++ < 40) {
    const ctx = this.newCtx(1);
    let t = 0;
    const left = this.moves;
    if (left > 0) {
      const pool = [];
      this.cells.forEach((x, i) => { if (!x.v && !x.box && !x.bub && x.p && x.p.k === 'a' && !x.p.s) pool.push(i); });
      for (let n = 0; n < left && pool.length; n++) {
        const i = pool.splice(Math.floor(this.rng() * pool.length), 1)[0];
        const x = this.cells[i], old = x.p.id;
        x.p = this.newPiece(x.p.c, this.rng() < 0.5 ? 'h' : 'v');
        this.score += PTS.bonus;
        ctx.ev.push({ t, k: 'make', i, p: x.p, old, bonus: true, pts: PTS.bonus });
        t += 140;
      }
      this.moves = 0;
    }
    const specials = [];
    this.cells.forEach((x, i) => { if (!x.v && !x.box && x.p && x.p.k === 'a' && x.p.s) specials.push(i); });
    if (!specials.length) break;
    specials.forEach((i, n) => ctx.heap.push({ t: t + 300 + n * 160, k: 'clear', i, by: 'blast' }));
    phases.push(this.run(ctx));
    this.cascade(phases, 1, []);
  }
  return phases;
};

// ---------- moves left? hints, shuffling ----------
Board.prototype.lineLen = function (i, col, dr, dc) {
  const [r, c] = this.rc(i); let n = 0;
  for (let k = 1; ; k++) { if (this.colorAt(this.idx(r + dr * k, c + dc * k)) !== col) break; n++; }
  return n;
};
Board.prototype.matchAt = function (i) {
  const col = this.colorAt(i);
  if (col < 0) return 0;
  const h = 1 + this.lineLen(i, col, 0, -1) + this.lineLen(i, col, 0, 1);
  const v = 1 + this.lineLen(i, col, -1, 0) + this.lineLen(i, col, 1, 0);
  return (h >= 3 ? h : 0) + (v >= 3 ? v : 0);
};
Board.prototype.allMoves = function () {
  const out = [];
  for (let i = 0; i < this.cells.length; i++) {
    if (!this.movable(i)) continue;
    const [r, c] = this.rc(i);
    for (const j of [this.idx(r, c + 1), this.idx(r + 1, c)]) {
      if (j < 0 || !this.movable(j)) continue;
      const A = this.cells[i], B = this.cells[j];
      if (this.isCombo(A.p, B.p)) {
        const v = (A.p.s === 'c' || B.p.s === 'c' ? 12 : 8) + (A.p.s === 'c' && B.p.s === 'c' ? 30 : 0);
        out.push({ a: i, b: j, v }); continue;
      }
      const pa = A.p, pb = B.p; A.p = pb; B.p = pa;
      const v = this.matchAt(i) + this.matchAt(j);
      A.p = pa; B.p = pb;
      if (v) out.push({ a: i, b: j, v });
    }
  }
  return out;
};
Board.prototype.hasMove = function () { return this.allMoves().length > 0; };
Board.prototype.hint = function () {
  const m = this.allMoves();
  if (!m.length) return null;
  m.sort((x, y) => y.v - x.v);
  const top = m.filter(x => x.v === m[0].v);
  return top[Math.floor(this.rng() * top.length)];
};
// shuffle the plain animals among their cells until there is a move and no ready-made match
Board.prototype.shuffle = function () {
  const cells = [];
  this.cells.forEach((x, i) => { if (!x.v && !x.box && !x.bub && x.p && x.p.k === 'a' && !x.p.s) cells.push(i); });
  const before = new Map(cells.map(i => [this.cells[i].p.id, i]));
  const pieces = cells.map(i => this.cells[i].p);
  for (let tries = 0; tries < 300; tries++) {
    for (let k = pieces.length - 1; k > 0; k--) { const j = Math.floor(this.rng() * (k + 1)); [pieces[k], pieces[j]] = [pieces[j], pieces[k]]; }
    if (tries > 150) pieces.forEach(p => { p.c = this.randColor(); });
    cells.forEach((i, k) => { this.cells[i].p = pieces[k]; });
    if (!this.findMatches().length && this.hasMove()) break;
  }
  return { type: 'shuffle', moves: cells.map(i => ({ id: this.cells[i].p.id, from: before.get(this.cells[i].p.id), to: i, c: this.cells[i].p.c })) };
};

Board.prototype.won = function () { return this.goals.every(g => g.left <= 0); };
Board.prototype.stars = function () {
  if (!this.won()) return 0;
  const s = this.lv.stars;
  return this.score >= s[2] ? 3 : this.score >= s[1] ? 2 : 1;
};

// how excited to sound after (part of) a turn: 0 nothing, 1 Good … 5 Unbelievable
function excitement(phases) {
  let cascades = 0, cleared = 0, acts = 0, big = 0;
  for (const ph of phases) if (ph.type === 'clear') { cascades = Math.max(cascades, ph.cascade); cleared += ph.cleared; acts += ph.acts; big = Math.max(big, ph.big || 0); }
  const made = phases.reduce((n, ph) => n + (ph.makes ? ph.makes.filter(m => m.s === 'c').length * 2 + ph.makes.length : 0), 0);
  const x = Math.max(cascades - 1, 0) * 1.0 + cleared / 9 + acts * 0.6 + made * 0.5 + big * 1.5;
  let lvl = x >= 7 ? 5 : x >= 5.2 ? 4 : x >= 3.8 ? 3 : x >= 2.6 ? 2 : x >= 1.7 ? 1 : 0;
  // making a special piece always gets a cheer: "Great!" for a striped one, "Excellent!" for a bomb, "Unbelievable!" for a rainbow ball
  for (const ph of phases) for (const m of ph.makes || []) lvl = Math.max(lvl, m.s === 'c' ? 5 : m.s === 'b' ? 3 : 2);
  return lvl;
}

// 动物消消乐 · which six animals play in a game (decli: the same ones every time got boring). Every game draws six from
// decli's animals (FRIENDS in lines.js), each a different colour so they are easy to tell apart on the board: animals
// that look alike (the blue dolphin, shark and whale; the orange fox, corgi and kangaroo ...) share a colour and so
// never play together. A level with penguins leaves out the black-and-white ones, and the 隐藏款 stay a surprise of the
// blind box.
const Cast = {
  // effect colours by main colour (FRIENDS' last field): base, dark, light
  FX: {
    p: ['#ffa3c8', '#e2668f', '#ffe0ec'], w: ['#ffffff', '#9aa3b8', '#eef1f7'], k: ['#ffffff', '#2f3040', '#e4e6ee'],
    v: ['#b48cff', '#7b52e0', '#e6dbff'], y: ['#ffd23a', '#e0a000', '#fff0b8'], o: ['#ff9a3a', '#d9661a', '#ffd9b0'],
    r: ['#ff4a3a', '#c8231a', '#ffc0b2'], g: ['#6fd65a', '#2f9e3a', '#d2f8b4'], l: ['#5aa6ff', '#2d6fd8', '#c4e2ff'],
    t: ['#3ad6c4', '#1a9e90', '#c4f5ee'], b: ['#c08a5e', '#7a4f30', '#ecd2bd'], a: ['#a9adbd', '#6b7082', '#e4e6ee'],
  },
  // colours too close to share a board (besides the same colour twice)
  NEAR: ['lt', 'gt', 'lv', 'ob', 'or', 'ka', 'wk', 'wa'],
  pending: -1,
  // two animals' colours (one or two letters each) clash
  near(a, b) { return [...a].some(x => [...b].some(y => x === y || this.NEAR.includes(x + y) || this.NEAR.includes(y + x))); },
  // six new animals for level li: they show at once everywhere (intro card, pieces, goals, effects) and are kept for
  // Game.start(li)
  pick(li) {
    const lv = LEVELS[li], penguins = lv.goals.some(g => g.t === 'pg');
    const pool = FRIENDS.filter(f => f.tier <= 1 && f.id !== 'penguin' && !(penguins && this.near(f.fam, 'k')));
    let got = [];
    for (let tries = 0; got.length < 6 && tries < 50; tries++) {   // an unlucky early pick can leave fewer than six colours: draw again
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      got = [];
      for (const f of pool) if (got.length < 6 && got.every(g => !this.near(g.fam, f.fam))) got.push(f);
    }
    if (got.length < 6) got = this.FIRST();
    this.set(got);
    this.pending = li;
  },
  // when a level starts: the six its intro card showed, or new ones (a replay, the next level from the result card)
  take(li) { if (this.pending !== li) this.pick(li); this.pending = -1; },
  set(fs) { ANIMALS.length = 0; fs.forEach(f => ANIMALS.push({ id: f.id, name: f.name, fx: this.FX[f.fam[0]], h: f.i })); },
  // the first six (the start screen, before any game)
  FIRST: () => ['pig', 'panda', 'hippo', 'giraffe', 'parrot', 'frog'].map(id => FRIENDS.find(f => f.id === id)),
};
Cast.set(Cast.FIRST());

// 动物消消乐 · sound effects, made on the spot with Web Audio, and the recorded sounds in sound/ (decli's background
// music and English cheers). Notes come from C major pentatonic so a long cascade of pops still sounds like a melody going up.
const Snd = {
  ctx: null, on: true, music: true, master: null, sfx: null, bus: null, mus: null, noiseBuf: null, ducked: false,
  raw: {}, bufs: {}, tries: {},
  // fetch the recorded sounds; they are decoded once sound is allowed (the first touch)
  load(names) {
    if (!window.fetch || location.protocol === 'file:') return;
    names.forEach(n => this.get(n));
  },
  // one sound. A download that fails (a new version still going up, a bad connection) or does not decode is tried
  // again a few times, so a cheer is not silent until the page is opened again.
  get(n) {
    const k = this.tries[n] = (this.tries[n] || 0) + 1;
    fetch(`sound/${n}.mp3`, k > 1 ? { cache: 'reload' } : undefined).then(r => (r.ok ? r.arrayBuffer() : Promise.reject(r.status)))
      .then(ab => { this.raw[n] = ab; this.decode(n); }).catch(() => this.again(n));
  },
  again(n) { const k = this.tries[n]; if (k < 5) setTimeout(() => this.get(n), [2000, 5000, 10000, 20000][k - 1]); },
  decode(n) {
    const ab = this.raw[n];
    if (!this.ctx || !ab) return;
    delete this.raw[n];
    new Promise((res, rej) => { const q = this.ctx.decodeAudioData(ab, res, rej); if (q && q.catch) q.catch(rej); })
      .then(b => { this.bufs[n] = b; Music.sync(); }).catch(() => this.again(n));
  },
  clip(n) { return this.bufs[n] || null; },
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = 0.9;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 6;
    this.master.connect(comp); comp.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.gain.value = this.on ? 0.8 : 0; this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.gain.value = 0; this.mus.connect(this.master);
    this.voice = c.createGain(); this.voice.gain.value = 1; this.voice.connect(this.master);
    // a little room for the cheers
    const len = c.sampleRate * 1.2, ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    this.verb = c.createConvolver(); this.verb.buffer = ir;
    const vg = c.createGain(); vg.gain.value = 0.25; this.verb.connect(vg); vg.connect(this.master);
    const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.noiseBuf = nb;
    if (c.state === 'suspended') c.resume();
    Object.keys(this.raw).forEach(n => this.decode(n));
  },
  setOn(v) { this.on = v; if (this.sfx) this.sfx.gain.value = v ? 0.8 : 0; },
  duck(v) { this.ducked = v; if (this.mus) this.mus.gain.setTargetAtTime(this.musicLevel(), this.ctx.currentTime, 0.15); },
  musicLevel() { return this.music && Music.playing ? (this.ducked ? 0.36 : 0.6) : 0; },

  tone(f, dur, o = {}) {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || dur));
    const v = o.vol == null ? 0.3 : o.vol, a = o.att || 0.005;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.dest || this.sfx);
    if (o.verb) g.connect(this.verb);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(dur, o = {}) {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime + (o.at || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.f || 1200, t); f.Q.value = o.q || 1;
    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + dur);
    const g = c.createGain(), v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.sfx);
    if (o.verb) g.connect(this.verb);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  },
  // pentatonic step n (0 = C5) -> Hz
  pent(n) { const steps = [0, 2, 4, 7, 9], o = Math.floor(n / 5), s = ((n % 5) + 5) % 5; return 523.25 * Math.pow(2, (o * 12 + steps[s]) / 12); },

  play(name, k = 0) {
    if (!this.ctx || !this.on) return;
    switch (name) {
      case 'tap': this.tone(880, 0.08, { type: 'triangle', vol: 0.15 }); break;
      case 'select': this.tone(660, 0.1, { type: 'triangle', vol: 0.18, to: 990, glide: 0.08 }); break;
      case 'swap': this.noise(0.16, { f: 600, fto: 2400, q: 0.8, vol: 0.12 }); this.tone(500, 0.12, { type: 'sine', to: 760, vol: 0.08 }); break;
      case 'bad': this.tone(330, 0.14, { type: 'triangle', to: 220, vol: 0.2 }); this.tone(262, 0.18, { type: 'triangle', to: 180, vol: 0.18, at: 0.12 }); break;
      case 'pop': {   // k = cascade step: each one a note higher
        const f = this.pent(k + Math.floor(Math.random() * 2));
        this.tone(f, 0.22, { type: 'sine', vol: 0.22, verb: true });
        this.tone(f * 2, 0.12, { type: 'triangle', vol: 0.06 });
        this.tone(900 + k * 60, 0.07, { type: 'sine', to: 300, vol: 0.12 });
        break;
      }
      case 'pip': this.tone(this.pent(8 + k), 0.06, { type: 'sine', vol: 0.06 }); break;
      case 'land': this.tone(160, 0.06, { type: 'sine', to: 90, vol: 0.05 }); break;
      case 'make': [0, 2, 4, 7].forEach((n, i) => this.tone(this.pent(5 + n), 0.35, { type: 'triangle', vol: 0.12, at: i * 0.05, verb: true })); this.tone(2600, 0.4, { type: 'sine', vol: 0.05, at: 0.2, verb: true }); break;
      case 'stripe':
        this.tone(1800, 0.35, { type: 'sawtooth', to: 140, vol: 0.09 });
        this.noise(0.35, { filter: 'highpass', f: 3000, fto: 600, vol: 0.12 });
        this.tone(2400, 0.25, { type: 'square', to: 600, vol: 0.03, at: 0.03 });
        break;
      case 'bomb':
        this.tone(150, 0.6, { type: 'sine', to: 38, vol: 0.5 });
        this.noise(0.55, { filter: 'lowpass', f: 1800, fto: 120, vol: 0.45, verb: true });
        this.noise(0.12, { filter: 'highpass', f: 2500, vol: 0.15 });
        break;
      case 'zap':
        for (let i = 0; i < 10; i++) this.tone(this.pent(5 + i), 0.18, { type: 'sine', vol: 0.09, at: i * 0.035, verb: true });
        this.noise(0.7, { filter: 'bandpass', f: 4000, fto: 9000, q: 3, vol: 0.08 });
        break;
      case 'nova':
        this.play('bomb');
        for (let i = 0; i < 16; i++) this.tone(this.pent(i), 0.3, { type: 'triangle', vol: 0.08, at: i * 0.04, verb: true });
        break;
      case 'ice': this.noise(0.12, { filter: 'highpass', f: 4000, vol: 0.18 }); this.tone(2200 + Math.random() * 600, 0.18, { type: 'sine', vol: 0.06, verb: true }); break;
      case 'box': this.noise(0.1, { f: 500, q: 2, vol: 0.3 }); this.tone(200, 0.12, { type: 'triangle', to: 120, vol: 0.2 }); this.tone(this.pent(3), 0.2, { type: 'triangle', vol: 0.06, at: 0.06 }); break;
      case 'bub': this.tone(400, 0.09, { type: 'sine', to: 1400, vol: 0.22 }); break;
      case 'home': [0, 2, 4, 5].forEach((n, i) => this.tone(this.pent(5 + n), 0.28, { type: 'triangle', vol: 0.14, at: i * 0.09, verb: true })); break;
      case 'fly': this.tone(this.pent(6 + (k % 6)), 0.08, { type: 'sine', vol: 0.06 }); break;
      case 'goal': this.tone(this.pent(10), 0.25, { type: 'triangle', vol: 0.15, verb: true }); this.tone(this.pent(12), 0.3, { type: 'triangle', vol: 0.12, at: 0.08, verb: true }); break;
      case 'star': this.tone(this.pent(7 + k * 2), 0.6, { type: 'triangle', vol: 0.2, verb: true }); this.tone(this.pent(12 + k * 2), 0.5, { type: 'sine', vol: 0.08, at: 0.03, verb: true }); break;
      case 'win': [0, 2, 4, 5, 7, 10].forEach((n, i) => this.tone(this.pent(n), 0.5, { type: 'triangle', vol: 0.16, at: i * 0.11, verb: true })); this.tone(this.pent(10), 1.1, { type: 'sine', vol: 0.12, at: 0.66, verb: true }); break;
      case 'lose': [4, 3, 2, 0].forEach((n, i) => this.tone(this.pent(n) / 2, 0.4, { type: 'triangle', vol: 0.14, at: i * 0.22, to: this.pent(n) / 2 * 0.97 })); break;
      case 'shuffle': for (let i = 0; i < 8; i++) this.noise(0.08, { f: 1500 + i * 300, q: 3, vol: 0.08, at: i * 0.05 }); break;
      case 'right': this.tone(this.pent(7), 0.15, { type: 'triangle', vol: 0.18 }); this.tone(this.pent(9), 0.3, { type: 'triangle', vol: 0.18, at: 0.1, verb: true }); break;
      case 'wrong': this.tone(220, 0.25, { type: 'triangle', vol: 0.15, to: 190 }); break;
      case 'key': this.tone(700 + k * 30, 0.05, { type: 'sine', vol: 0.1 }); break;
      // the blind box (gift.js): landing, each tap (k = 1-3, higher each time), bursting open, and a rare friend
      case 'gland': this.tone(150, 0.3, { type: 'sine', to: 70, vol: 0.35 }); this.noise(0.14, { f: 320, q: 1, vol: 0.22 }); this.tone(this.pent(4), 0.25, { type: 'triangle', vol: 0.1, at: 0.06, verb: true }); break;
      case 'gtap':
        this.noise(0.12, { f: 1600 + k * 500, q: 1.2, vol: 0.22 }); this.tone(220 + k * 40, 0.1, { type: 'triangle', to: 140, vol: 0.18 });
        this.tone(this.pent(5 + k * 2), 0.22, { type: 'triangle', vol: 0.16, at: 0.04, verb: true }); this.tone(this.pent(8 + k * 2), 0.25, { type: 'sine', vol: 0.08, at: 0.08, verb: true }); break;
      case 'gopen':
        this.noise(0.4, { f: 700, fto: 7000, q: 0.7, vol: 0.3 }); this.tone(110, 0.35, { type: 'sine', to: 55, vol: 0.3 });
        [0, 2, 4, 5, 7, 9, 10, 12].forEach((n, i) => this.tone(this.pent(5 + n), 0.45, { type: 'triangle', vol: 0.13, at: 0.08 + i * 0.05, verb: true }));
        this.tone(this.pent(17), 1.3, { type: 'sine', vol: 0.06, at: 0.5, verb: true }); break;
      case 'grare': [0, 2, 4, 5, 7, 9].forEach((n, i) => this.tone(this.pent(12 + n), 0.9, { type: 'sine', vol: 0.06, at: 0.55 + i * 0.07, verb: true })); break;
      case 'sparkle': for (let i = 0; i < 5; i++) this.tone(this.pent(10 + Math.floor(Math.random() * 6)), 0.15, { type: 'sine', vol: 0.05, at: i * 0.04, verb: true }); break;
    }
  },
};

// The background music: decli's two cheerful tunes, sound/bg1.mp3 and sound/bg2.mp3, one after the other. decli: it
// keeps playing all through the game (map, levels, cards, the blind box) and stops only for the pause card and the
// math page; the narrator turns it down a little while speaking. Each tune crossfades into the next, so there is no
// gap or click at the seam, and starting it while it plays changes nothing.
const Music = {
  want: false, order: ['bg1', 'bg2'], cur: null, timer: 0, X: 0.8,
  get playing() { return this.want; },
  start() {
    this.want = true;
    this.sync();
    if (Snd.mus) Snd.mus.gain.setTargetAtTime(Snd.musicLevel(), Snd.ctx.currentTime, 0.3);
  },
  stop() {
    this.want = false; clearTimeout(this.timer);
    const o = this.cur; this.cur = null;
    if (!o || !Snd.ctx) return;
    const now = Snd.ctx.currentTime;
    o.g.gain.cancelScheduledValues(now); o.g.gain.setValueAtTime(Math.max(0.0001, o.g.gain.value), now); o.g.gain.linearRampToValueAtTime(0.0001, now + 0.5);
    try { o.src.stop(now + 0.55); } catch (_) { }
  },
  refresh() { if (Snd.mus) Snd.mus.gain.setTargetAtTime(Snd.musicLevel(), Snd.ctx.currentTime, 0.2); },
  // start the first tune that has been decoded, if none is playing yet (called again when a tune finishes decoding)
  sync() {
    const c = Snd.ctx, name = this.order.find(n => Snd.clip(n));
    if (!c || !this.want || this.cur || !name) return;
    this.loop(name, c.currentTime + 0.05, 0.6);
  },
  loop(name, at, fadeIn) {
    const c = Snd.ctx, X = this.X, buf = Snd.clip(name), src = c.createBufferSource(), g = c.createGain(), end = at + buf.duration;
    src.buffer = buf; src.connect(g); g.connect(Snd.mus);
    g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(1, at + fadeIn);
    g.gain.setValueAtTime(1, end - X); g.gain.linearRampToValueAtTime(0.0001, end);
    src.start(at); src.stop(end + 0.05);
    const me = this.cur = { name, src, g };
