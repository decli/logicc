  },
  clearHint() {
    this.lastAct = Clock.now;
    if (!this.hint) return;
    for (const s of this.sprites.values()) s.wig = 0;
    this.hint = null;
  },

  // ---------- the finger ----------
  cellAt(e) {
    const G = this.G, c = Math.floor((e.clientX - G.ox) / G.cell), r = Math.floor((e.clientY - G.oy) / G.cell);
    const i = this.b.idx(r, c);
    return this.b.on(i) ? i : -1;
  },
  pdown(e) {
    Snd.init();
    if (!this.active || this.over) return;
    this.hideShowOff();
    const i = this.cellAt(e);
    if (i < 0) { this.sel = -1; return; }
    this.down = { i, x: e.clientX, y: e.clientY, moved: false };
    try { this.cv.setPointerCapture(e.pointerId); } catch (_) { }
  },
  pmove(e) {
    const d = this.down;
    if (!d || d.moved || this.busy) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y, th = this.G.cell * 0.32;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
    d.moved = true;
    const [r, c] = this.b.rc(d.i);
    const j = Math.abs(dx) > Math.abs(dy) ? this.b.idx(r, c + Math.sign(dx)) : this.b.idx(r + Math.sign(dy), c);
    this.sel = -1;
    if (j >= 0 && this.b.on(j)) this.trySwap(d.i, j);
  },
  pup(e) {
    const d = this.down; this.down = null;
    if (!d || d.moved || this.busy || this.over) return;
    const i = d.i;
    if (this.sel >= 0 && this.sel !== i && this.b.adjacent(this.sel, i)) { const a = this.sel; this.sel = -1; this.trySwap(a, i); return; }
    if (this.sel === i) { this.sel = -1; return; }
    const x = this.b.cells[i];
    if (x.bub && x.p) { this.nudge(i); this.tip('bubStuck'); return; }
    if (x.cage >= 0) { this.nudge(i); this.tip('cageStuck'); return; }
    if (x.p && x.p.k === 'l') { this.nudge(i); this.tip('balloonStuck'); return; }
    if (!this.b.movable(i)) return;
    this.sel = i; Snd.play('select'); this.clearHint(); Pal.react('tap');
  },
  nudge(i) {
    const p = this.b.cells[i].p; const s = p && this.sprites.get(p.id);
    Snd.play('bad');
    this.vis[i].hit = Clock.now;
    if (s) Clock.tween(300, k => { s.sx = 1 + Math.sin(k * Math.PI * 3) * 0.08 * (1 - k); });
  },
  async trySwap(a, b) {
    if (this.busy || this.over) return;
    this.clearHint();
    const B = this.b;
    if (!B.movable(a) || !B.movable(b)) {
      for (const i of [a, b]) {
        const x = B.cells[i];
        if (x.bub) { this.nudge(i); this.tip('bubStuck'); return; }
        if (x.cage >= 0) { this.nudge(i); this.tip('cageStuck'); return; }
        if (x.p && x.p.k === 'l') { this.nudge(i); this.tip('balloonStuck'); return; }
      }
      return;
    }
    this.busy = true;
    const res = B.swap(a, b);
    if (!res.ok) {
      await this.animBounce(a, b);
      this.busy = false; this.lastAct = Clock.now;
      return;
    }
    if (!Store.d.owed) { Store.d.owed = true; Store.d.played++; Store.save(); }
    if (!Store.d.seen.swipe) { Store.d.seen.swipe = 1; Store.save(); this.hintAfter = 7000; }
    this.setMoves(B.moves);
    this.cheered = 0;
    if (res.two) this.sayOnce('combo', L.combo);
    await this.play(res.phases);
    await this.afterTurn();
  },

  // ---------- playing back a turn ----------
  async play(phases) {
    const done = [];
    for (const ph of phases) {
      done.push(ph);
      if (ph.type === 'swap') await this.animSwap(ph);
      else if (ph.type === 'clear') { await this.animClear(ph); this.maybeCheer(done); }
      else if (ph.type === 'fall') await this.animFall(ph);
      else if (ph.type === 'exit') await this.animExit(ph);
      else if (ph.type === 'rise') await this.animRise(ph);
    }
  },
  maybeCheer(done) {
    const lvl = excitement(done), word = CHEER[lvl];
    // a word only once per turn: Excellent! for level 3 and again for 4 would just repeat itself
    if (lvl > this.cheered && word !== CHEER[this.cheered] && Clock.now - this.lastCheer > 650) {
      this.cheered = lvl; this.lastCheer = Clock.now;
      const G = this.G;
      Voice.cheer(word);
      Fx.praise(word, G.ox + G.w / 2, G.oy + G.h * 0.42, G.w, lvl);
      if (lvl >= 4) Fx.shake(6, 300);
      if (lvl >= 3) Pal.react('joy');
    }
  },
  animSwap(ph) {
    const { a, b } = ph, A = this.sprites.get(ph.ida), B = this.sprites.get(ph.idb);   // the board is already at the end of the turn
    const [ra, ca] = this.b.rc(a), [rb, cb] = this.b.rc(b);
    Snd.play('swap');
    A.z = 2;
    return Clock.tween(170, k => { A.r = lerp(ra, rb, k); A.c = lerp(ca, cb, k); B.r = lerp(rb, ra, k); B.c = lerp(cb, ca, k); A.sc = 1 + Math.sin(k * Math.PI) * 0.12; }, Ease.inOut)
      .then(() => { A.z = 0; A.sc = 1; });
  },
  async animBounce(a, b) {
    const A = this.sprites.get(this.b.cells[a].p.id), B = this.sprites.get(this.b.cells[b].p.id);
    const [ra, ca] = this.b.rc(a), [rb, cb] = this.b.rc(b);
    Snd.play('swap');
    const f = k => { A.r = lerp(ra, rb, k); A.c = lerp(ca, cb, k); B.r = lerp(rb, ra, k); B.c = lerp(cb, ca, k); };
    await Clock.tween(140, k => f(k * 0.55), Ease.out);
    Snd.play('bad');
    await Clock.tween(200, k => f(0.55 * (1 - k)), Ease.back);
    f(0);
  },
  async animClear(ph) {
    const t0 = Clock.now, G = this.G;
    // one "+points" per group of matched pieces
    const firsts = ph.ev.filter(e => e.k === 'pop' && e.by === 'match' && e.t === 0);
    if (firsts.length) {
      let sx = 0, sy = 0; firsts.forEach(e => { const [r, c] = this.b.rc(e.i); sx += c; sy += r; });
      const [x, y] = this.cellXY(sy / firsts.length, sx / firsts.length);
      Fx.text(x, y, '+' + firsts.reduce((n, e) => n + e.pts, 0), G.cell * 0.42, pick(['#ff4f9a', '#7b4dff', '#ff9d3a']));
    }
    for (const e of ph.ev) {
      const wait = t0 + e.t - Clock.now;
      if (wait > 0) await Clock.wait(wait);
      this.event(e, ph);
    }
    const rest = t0 + ph.dur - Clock.now;
    if (rest > 0) await Clock.wait(rest);
  },
  event(e, ph) {
    const G = this.G, b = this.b, [r, c] = b.rc(e.i), [x, y] = this.cellXY(r, c), cell = G.cell;
    switch (e.k) {
      case 'pop': {
        const s = this.sprites.get(e.p.id);
        if (!s) break;
        const col = e.p.s === 'c' ? ['#ffffff', '#ffd23a'] : ANIMALS[e.p.c].fx;
        if (e.to != null) {   // sliding into the special it is turning into
          const [tr, tc] = b.rc(e.to), r0 = s.r, c0 = s.c;
          s.z = 1;
          s.fun = true;
          Clock.tween(150, k => { s.r = lerp(r0, tr, k); s.c = lerp(c0, tc, k); s.sc = 1 - k * 0.5; s.flash = k; }, Ease.in).then(() => this.sprites.delete(s.id));
        } else {
          s.z = 3; s.holdFlash = true; s.fun = true;
          Clock.tween(110, k => { s.sc = 1 + k * 0.35; s.flash = k; }, Ease.out).then(() => {
            this.sprites.delete(s.id);
            Fx.burst(x, y, col, e.by === 'match' ? 10 : 8, e.by === 'match' ? 1 : 1.3, cell);
          });
        }
        if (Clock.now - this.popSnd > 40) { this.popSnd = Clock.now; Snd.play('pop', ph.cascade - 1 + (e.by === 'blast' ? 2 : 0)); }
        if (e.goal) this.flyGoal(this.goalIndex('c', e.p.c), Art.tiles[e.p.c], x, y);
        break;
      }
      case 'make': {
        if (e.old) { const o = this.sprites.get(e.old); if (o) this.sprites.delete(e.old); }
        const appear = () => {
          const s = this.addSprite(e.p, e.i); s.sc = 0; s.flash = 1; s.z = 1;
          Clock.tween(380, k => { s.sc = Ease.elastic(k); }).then(() => { s.z = 0; });
          Fx.ring(x, y, '#fff', cell * 0.2, cell * 1.1, 420, 8);
          Fx.sparkles(x, y, 8, cell * 0.5, '#fff');
          if (!e.quiet) Snd.play('make');
          if (!e.bonus && !e.quiet) { this.showOff(e.p); this.sayOnce('made_' + e.p.s, L.made[e.p.s]); }
        };
        if (e.bonus) {
          const m = $('.moves', $('#hud')).getBoundingClientRect();
          this.setMoves(Math.max(0, +$('.moves b').textContent - 1));
          Fx.fly({ x0: m.left + m.width / 2, y0: m.top + m.height / 2, x1: x, y1: y, s0: 40, s1: cell * 0.6, dur: 280, lift: 40, img: Fx.star('#ffd23a'), trail: '#ffd23a', onArrive: appear });
          Snd.play('fly', e.i);
        } else appear();
        break;
      }
      case 'beam': {
        Fx.beam(x, y, e.dir, ANIMALS[e.c] ? ANIMALS[e.c].fx[0] : '#fff', { x: G.ox, y: G.oy, w: G.w, h: G.h, cell }, e.wide);
        Snd.play('stripe'); Fx.shake(4, 220);
        break;
      }
      case 'bomb': {
        const col = ANIMALS[e.c] ? ANIMALS[e.c].fx[0] : '#ffd23a';
        Fx.ring(x, y, '#ffd23a', cell * 0.3, cell * (e.rad + 0.8), 480, 16);
        Fx.ring(x, y, col, cell * 0.2, cell * (e.rad + 0.3), 380, 10);
        Fx.part({ kind: 'img', img: Fx.dot('#fff6b0'), add: true, x, y, vx: 0, vy: 0, life: 350, size: cell * (e.rad + 1) * 1.6, s1: cell });
        Fx.burst(x, y, ['#ffd23a', col], 18, 1.8, cell);
        Fx.shake(e.rad > 2 ? 16 : 9, 380); Fx.flash(e.rad > 2 ? 0.35 : 0.15, '#fff6d0');
        Snd.play('bomb');
        break;
      }
      case 'zap': {
        const col = ANIMALS[e.c] ? ANIMALS[e.c].fx[0] : '#fff';
        e.to.forEach((j, n) => { const [rr, cc] = b.rc(j), [tx, ty] = this.cellXY(rr, cc); Fx.bolt(x, y, tx, ty, col, n * 28); });
        Fx.ring(x, y, '#fff', cell * 0.3, cell * 1.8, 500, 10);
        Fx.part({ kind: 'img', img: Fx.dot('#ffffff'), add: true, x, y, vx: 0, vy: 0, life: 700, size: cell * 3, s1: cell * 0.5 });
        Fx.flash(0.2, '#fff'); Snd.play('zap');
        break;
      }
      case 'nova': {
        Fx.flash(0.7, '#fff'); Fx.shake(18, 600); Snd.play('nova');
        ['#ff4f6d', '#ffd23a', '#5fe07a', '#3ac8ff', '#a77bff'].forEach((col, n) => Fx.ring(x, y, col, cell * 0.2, cell * (4 + n * 1.5), 700 + n * 120, 14));
        break;
      }
      case 'ice': {
        this.vis[e.i].ice = e.left;
        Fx.burst(x, y, ['#ffffff', '#a8dcff'], 8, 0.9, cell);
        Snd.play('ice');
        if (e.goal) this.flyGoal(this.goalIndex('ice'), Art.cache.ice1, x, y);
        break;
      }
      case 'box': {
        const v = this.vis[e.i]; v.box = e.left; v.hit = Clock.now;
        Fx.burst(x, y, e.left ? ['#c9a6ff', '#ffe680'] : ['#ff9fca', '#ffffff'], 14, 1.2, cell);
        if (!e.left) Fx.sparkles(x, y, 8, cell * 0.5, '#ffd23a');
        Snd.play('box'); Fx.shake(3, 150);
        if (e.goal) this.flyGoal(this.goalIndex('box'), Art.cache.box1, x, y);
        break;
      }
      case 'bub': {
        this.vis[e.i].bub = false;
        Fx.ring(x, y, '#bfe9ff', cell * 0.4, cell * 0.8, 300, 6);
        Fx.burst(x, y, ['#ffffff', '#bfe9ff'], 8, 0.8, cell);
        Snd.play('bub');
        if (e.goal) this.flyGoal(this.goalIndex('bub'), Art.cache.bub, x, y);
        break;
      }
      case 'grass': {   // 种草地
        const v = this.vis[e.i]; v.grass = true; v.grew = Clock.now;
        Fx.burst(x, y, ['#8edb6b', '#fff27a', '#ffffff'], 6, 0.7, cell);
        if (Clock.now - (this.growSnd || 0) > 60) { this.growSnd = Clock.now; Snd.play('grow', e.i); }
        if (e.goal) this.flyGoal(this.goalIndex('grass'), Art.cache.grass, x, y);
        break;
      }
      case 'crack': {   // 蛋宝宝, the first knock
        const s = this.sprites.get(e.p.id);
        if (s) { s.hp = e.left; Clock.tween(320, k => { s.sx = 1 + Math.sin(k * Math.PI * 4) * 0.1 * (1 - k); }); }
        Fx.burst(x, y, ['#fffdf6', '#ffd23a', '#ffb3cf'], 8, 0.8, cell);
        Snd.play('crack');
        break;
      }
      case 'hatch': {   // the second: the shell bursts and a chick hops out and flies to the goal
        const s = this.sprites.get(e.p.id);
        if (s) { s.hp = 0; s.z = 3; Clock.tween(160, k => { s.sc = 1 + k * 0.3; s.a = 1 - k; }).then(() => this.sprites.delete(e.p.id)); }
        Fx.burst(x, y, ['#fffdf6', '#fbefd8', '#ffd23a'], 14, 1.2, cell);
        Fx.sparkles(x, y, 8, cell * 0.5, '#ffd23a');
        Snd.play('hatch');
        const chick = Art.friend(Art.byId('chick'), 128, 112, 'h');   // still wearing half its shell
        this.flyGoal(this.goalIndex('egg'), chick, x, y - cell * 0.2, true, !e.goal);
        break;
      }
      case 'tug': {   // 气球: a match next to it gives it a tug; it goes up when the board has settled (animRise)
        const s = this.sprites.get(e.p.id);
        if (s) Clock.tween(300, k => { s.sy = 1 + Math.sin(k * Math.PI) * 0.14; s.sx = 1 - Math.sin(k * Math.PI) * 0.06; });
        Fx.sparkles(x, y - cell * 0.3, 5, cell * 0.4, '#ffffff');
        break;
      }
      case 'free': {   // 彩色笼子 opens: the bars spring away and the animal inside jumps for joy
        const v = this.vis[e.i]; v.cage = -1; v.hit = Clock.now;
        Fx.ring(x, y, '#ffd56b', cell * 0.3, cell * 1.1, 420, 10);
        Fx.burst(x, y, ['#ffd56b', '#fff3cf', ANIMALS[e.c].fx[0]], 14, 1.2, cell);
        for (let k = 0; k < 4; k++) Fx.part({ kind: 'img', img: Fx.heart('#ff6fae'), x, y, vx: rnd(-0.12, 0.12), vy: rnd(-0.32, -0.18), g: 0.0006, life: 700, size: cell * 0.32 });
        const s = e.p && this.sprites.get(e.p.id);
        if (s) Clock.tween(420, k => { s.sy = 1 + Math.sin(k * Math.PI * 2) * 0.12 * (1 - k); s.land = Clock.now - 300; });
        Snd.play('free');
        const cg = Art.canvas(cell * 1.2, cell * 1.2); Art.cageAt(cg.getContext('2d'), e.c, cell * 0.6, cell * 0.6, cell * 1.1);
        if (e.goal) this.flyGoal(this.goalIndex('cage'), cg, x, y);
        break;
      }
    }
  },
  // pieces fall: logic already moved them; follow each one's path, faster and faster, with a little squash on landing
  animFall(ph) {
    const A = 0.00011, V = 0.019, T1 = V / A, S1 = 0.5 * A * T1 * T1;
    const sAt = t => (t < T1 ? 0.5 * A * t * t : S1 + V * (t - T1));
    const paths = ph.paths.map(pa => {
      let s = this.sprites.get(pa.p.id);
      if (!s) { s = this.addSprite(pa.p, 0); }
      s.r = pa.pts[0].r; s.c = pa.pts[0].c; s.sc = 1;
      return { s, pts: pa.pts, end: pa.pts[pa.pts.length - 1].s, landed: false };
    });
    const total = ph.steps;
    const dur = total <= S1 ? Math.sqrt(2 * total / A) : T1 + (total - S1) / V;
    let landSnd = 0;
    return Clock.tween(dur, (k, raw) => {
      const s = sAt(raw * dur);
      for (const P of paths) {
        const pts = P.pts;
        let pos;
        if (s >= P.end) pos = pts[pts.length - 1];
        else {
          let i = 0; while (i < pts.length - 1 && pts[i + 1].s <= s) i++;
          const a = pts[i], bb = pts[i + 1];
          const start = bb.s - 1, f = clamp(s - start, 0, 1);
          pos = { r: lerp(a.r, bb.r, f), c: lerp(a.c, bb.c, f) };
        }
        P.s.r = pos.r; P.s.c = pos.c;
        if (!P.landed && s >= P.end) { P.landed = true; P.s.land = Clock.now; if (landSnd++ < 3) Snd.play('land'); }
      }
    }).then(() => { for (const P of paths) { const e = P.pts[P.pts.length - 1]; P.s.r = e.r; P.s.c = e.c; if (!P.landed) P.s.land = Clock.now; } });
  },
  async animExit(ph) {
    for (const o of ph.out) {
      const s = this.sprites.get(o.p.id); this.sprites.delete(o.p.id);
      const [r, c] = this.b.rc(o.i), [x, y] = this.cellXY(r, c);
      Snd.play('home');
      Fx.text(x, y, '+' + ph.pts, this.G.cell * 0.45, '#22c38a');
      Fx.sparkles(x, y, 12, this.G.cell * 0.6, '#ffd23a');
      this.flyGoal(this.goalIndex('pg'), Art.funTiles[PENGUIN] || Art.tiles[PENGUIN], x, y, true);
      if (s) s.a = 0;
    }
    this.sayOnce('penguinHome', L.penguinHome);
    await Clock.wait(350);
  },
  // 气球: the lifted ones swap places with what is above them; one that reached the top floats off to the goal
  async animRise(ph) {
    const from = new Map();
    for (const m of ph.moves) { const s = this.sprites.get(m.id); if (s) from.set(m.id, [s, s.r, s.c]); }
    if (ph.moves.length) {
      Snd.play('rise');
      await Clock.tween(300, k => {
        for (const m of ph.moves) {
          const f = from.get(m.id); if (!f) continue;
          const [s] = f, [r1, c1] = this.b.rc(m.to);
          s.r = lerp(f[1], r1, k); s.c = lerp(f[2], c1, k);
        }
      }, Ease.inOut);
      for (const m of ph.moves) { const f = from.get(m.id); if (f) { const [r1, c1] = this.b.rc(m.to); f[0].r = r1; f[0].c = c1; f[0].land = Clock.now; } }
    }
    for (const o of ph.away) {
      const s = this.sprites.get(o.p.id), [r, c] = this.b.rc(o.i), [x, y] = this.cellXY(r, c);
      Snd.play('balloon');
      Fx.sparkles(x, y, 10, this.G.cell * 0.6, '#ffd0e4');
      Fx.text(x, y, '+' + ph.pts, this.G.cell * 0.45, '#ff4f9a');
      if (s) { s.z = 3; await Clock.tween(260, k => { s.r = r - k * 0.8; s.a = 1 - k; }); this.sprites.delete(o.p.id); }
      this.flyGoal(this.goalIndex('bl'), Art.cache.balloon, x, y - this.G.cell * 0.8, true);
    }
    if (ph.away.length) this.sayOnce('balloonAway', L.balloonAway);
  },
  // sprites and board must agree after a turn (a safety net: an animation that was cut short leaves nothing behind)
  reconcile() {
    const live = new Set();
    this.b.cells.forEach((x, i) => {
      if (!x.p) return;
      live.add(x.p.id);
      const [r, c] = this.b.rc(i);
      let s = this.sprites.get(x.p.id);
      if (!s) s = this.addSprite(x.p, i);
      s.p = x.p; s.r = r; s.c = c; s.sc = 1; s.sx = 1; s.sy = 1; s.flash = 0; s.holdFlash = false; s.z = 0; s.a = 1; s.hp = x.p.hp; s.fun = false;
    });
    for (const id of [...this.sprites.keys()]) if (!live.has(id)) this.sprites.delete(id);
    this.b.cells.forEach((x, i) => { const v = this.vis[i]; v.ice = x.ice; v.box = x.box; v.bub = x.bub; v.grass = x.grass; v.cage = x.cage; });
  },
  async afterTurn() {
    this.reconcile();
    this.syncHud();
    const B = this.b;
    if (B.won()) { this.over = true; await this.win(); return; }
    if (B.moves <= 0) { this.over = true; await this.fail(); return; }
    if (!B.hasMove()) await this.reshuffle();
    if (B.moves === 5 && !this.saidLow) { this.saidLow = true; Voice.say(L.movesLow); Pal.react('cheer'); }
    this.busy = false; this.lastAct = Clock.now;
  },
  async reshuffle() {
    Voice.say(L.noMoves);
    await Clock.wait(500);
    const ph = this.b.shuffle();
    Snd.play('shuffle');
    const from = new Map(ph.moves.map(m => { const s = this.sprites.get(m.id); return [m.id, [s.r, s.c]]; }));
    await Clock.tween(600, k => {
      for (const m of ph.moves) {
        const s = this.sprites.get(m.id), [r0, c0] = from.get(m.id), [r1, c1] = this.b.rc(m.to);
        const sw = Math.sin(k * Math.PI);
        s.r = lerp(r0, r1, k) - sw * 0.6; s.c = lerp(c0, c1, k); s.sc = 1 - sw * 0.3;
      }
    }, Ease.inOut);
    for (const m of ph.moves) { const s = this.sprites.get(m.id); const [r1, c1] = this.b.rc(m.to); s.r = r1; s.c = c1; s.sc = 1; }
  },

  // ---------- end of the level ----------
  async win() {
    const B = this.b, G = this.G;
    await Clock.wait(300);
    Snd.play('win');
    Voice.say(pick(L.win));
    Pal.react('joy', 4000);
    Fx.confetti(60);
    if (B.moves > 0) {
      await Clock.wait(900);
      Snd.play('sparkle');
      Fx.praise(BONUS, G.ox + G.w / 2, G.oy + G.h * 0.42, G.w, 3);
      await Clock.wait(600);
      await this.play(B.bonus());
    } else {
      const ph = B.bonus();
      if (ph.length) await this.play(ph);
    }
    this.syncHud();
    await Clock.wait(500);
    const stars = B.stars(), li = this.li, d = Store.d, before = d.stars[li] || 0;
    d.stars[li] = Math.max(before, stars);
    d.best[li] = Math.max(d.best[li] || 0, B.score);
    d.open = Math.max(d.open, Math.min(LEVELS.length, li + 2));
    if (d.fails) delete d.fails[li];
    // the last level of an island won for the first time: the map goes on to the next island
    const k = isleOf(li), isle = ISLANDS[k];
    const isleDone = !before && isle && li === isle.from + isle.n - 1;
    if (isleDone && k + 1 < ISLANDS.length) d.isle = k + 1;
    Store.save();
    // the blind box first, then the stars card (decli 2026-11-02, with so many levels: a box the first time a level is
    // won, and a better one the first time it gets three stars; replays only for the stars)
    const box = !before || (stars === 3 && before < 3);
    if (box) await Gift.open(stars, { isle: k });
    if (isleDone) await UI.isleDone(k);
    UI.result({ win: true, stars, score: B.score, li, box });
  },
  async fail() {
    const d = Store.d; d.fails = d.fails || {}; d.fails[this.li] = (d.fails[this.li] || 0) + 1; Store.save();   // for the 小帮手
    await Clock.wait(400);
    Snd.play('lose');
    Voice.say(L.fail);
    Pal.react('cheer', 9e9);
    UI.result({ win: false, li: this.li, goals: this.b.goals, extra: !this.extraUsed });
  },
  // five sums for five more moves, once per game
  async moreMoves() {
    this.extraUsed = true;
    await MathGate.open({ count: 5, extra: true });
    this.b.moves += 5; this.setMoves(this.b.moves);
    this.over = false; this.busy = false; this.saidLow = false; this.lastAct = Clock.now;
    Voice.say(L.extraDone); Pal.react('joy');
    Music.start();
    if (!this.b.hasMove()) { this.busy = true; await this.reshuffle(); this.busy = false; }
  },

  // ---------- new things: shown on the board and said in a few words, never written (she can't read them yet) ----------
  sayOnce(key, line) {
    if (Store.d.seen[key]) return;
    Store.d.seen[key] = 1; Store.save();
    setTimeout(() => Voice.say(line), 700);
  },
  // what can't be moved says why, once a game
  tip(key) {
    this._told = this._told || {};
    if (L[key] && !this._told[key]) { this._told[key] = true; Voice.say(L[key]); }
  },
  // a special piece just made shows off what it will do: a glowing ring, plus arrows along its row or column or a spinning
  // rainbow (the bomb only glows: decli found its big diamond outline across the board got in the way, 2026-10-19).
  // The first few times of each kind a finger also shows the swipe.
  // It follows the piece while it falls, ends when the piece is used, and gets out of the way when she touches the board.
  showOff(p) {
    const kind = p.s, hand = (Store.d.seen['hand_' + kind] || 0) < 3;   // counted only when a finger is really shown
    const it = { t: -380, dur: hand ? 3400 : 1500, id: p.id, kind, hand };
    it.draw = (ctx, k, t) => this.drawShowOff(ctx, it, t);
    Fx.items.push(it);
  },
  hideShowOff() { for (const it of Fx.items) if (it.kind && it.t < it.dur - 220) it.t = Math.max(it.t, it.dur - 220); },
  drawShowOff(ctx, it, t) {
    if (t < 0) return;
    const s = this.active && $('#modal').hidden && this.sprites.get(it.id);
    if (!s) { it.t = it.dur; return; }   // the piece was used up, or a card (pause, result) opened over the board
    const G = this.G, cell = G.cell, [x, y] = this.cellXY(s.r, s.c), kind = it.kind;
    const a = Math.min(1, t / 200, (it.dur - t) / 220), pul = 0.5 + 0.5 * Math.sin(t / 130);
    const col = kind === 'c' ? '#ffffff' : ANIMALS[s.p.c].fx[0];
    ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // the glow ring and four twinkles going round it
    ctx.lineWidth = cell * 0.07; ctx.strokeStyle = '#ffd23a';
    ctx.beginPath(); ctx.arc(x, y, cell * (0.56 + 0.05 * pul), 0, 7); ctx.stroke();
    for (let i = 0; i < 4; i++) { const an = t / 500 + i * Math.PI / 2; Fx.drawStar(ctx, x + Math.cos(an) * cell * 0.62, y + Math.sin(an) * cell * 0.62, cell * (0.1 + 0.05 * pul), '#fff6b0'); }
    // what it will do
    if (kind === 'h' || kind === 'v') {
      ctx.save(); ctx.beginPath(); ctx.rect(G.ox, G.oy, G.w, G.h); ctx.clip();
      const along = kind === 'h' ? [1, 0] : [0, 1], room = kind === 'h' ? G.w : G.h;
      for (const sg of [-1, 1]) for (let i = 0; i < 3; i++) {
        const d = cell * 0.85 + ((t / 650 + i / 3) % 1) * room * 0.45, f = 1 - d / (room * 0.6);
        if (f <= 0) continue;
        const cx = x + along[0] * sg * d, cy = y + along[1] * sg * d, w = cell * 0.18;
        ctx.globalAlpha = a * Math.min(1, f * 1.6);
        ctx.beginPath();
        ctx.moveTo(cx - along[0] * sg * w + along[1] * w * 1.3, cy - along[1] * sg * w + along[0] * w * 1.3);
        ctx.lineTo(cx + along[0] * sg * w, cy + along[1] * sg * w);
        ctx.lineTo(cx - along[0] * sg * w - along[1] * w * 1.3, cy - along[1] * sg * w - along[0] * w * 1.3);
        ctx.lineWidth = cell * 0.16; ctx.strokeStyle = '#fff'; ctx.stroke();
        ctx.lineWidth = cell * 0.08; ctx.strokeStyle = col; ctx.stroke();
      }
      ctx.restore();
    } else if (kind === 'c') {
      const hues = ['#ff4f6d', '#ff9d3a', '#ffd23a', '#5fe07a', '#3ac8ff', '#a77bff'];
      ctx.lineWidth = cell * 0.09;
      hues.forEach((h, i) => { const a0 = t / 300 + i * Math.PI / 3; ctx.strokeStyle = h; ctx.beginPath(); ctx.arc(x, y, cell * 0.74, a0, a0 + Math.PI / 3 - 0.12); ctx.stroke(); });
    }
    // the finger: press on the piece, slide it the way that really works, lift; again and again. Once the board has
    // settled it picks the best real move for this piece; if the piece has none right now, there is no finger.
    if (it.hand && !this.busy && it.dir === undefined) {
      const at = this.b.cells.findIndex(x => x.p === s.p);
      const m = at < 0 ? null : this.b.allMoves().filter(m => m.a === at || m.b === at).sort((x, y) => y.v - x.v)[0];
      if (m) { const [r1, c1] = this.b.rc(at), [r2, c2] = this.b.rc(m.a === at ? m.b : m.a); it.dir = [r2 - r1, c2 - c1]; } else it.dir = null;
      if (it.dir) { const d = Store.d.seen; d['hand_' + it.kind] = (d['hand_' + it.kind] || 0) + 1; Store.save(); }
    }
    if (it.hand && !this.busy && it.dir) {
      const dir = it.dir;
      const ph = (t % 1300) / 1300, slide = Ease.inOut(clamp((ph - 0.25) / 0.4, 0, 1));
      const fx = x + dir[1] * slide * cell, fy = y + dir[0] * slide * cell, sz = cell * 0.95;
      ctx.globalAlpha = a * (ph < 0.08 ? ph / 0.08 : ph > 0.85 ? (1 - ph) / 0.15 : 1);
      if (ph > 0.2 && ph < 0.75) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(fx, fy, cell * 0.2, 0, 7); ctx.fill(); }
      ctx.font = `${sz}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.shadowColor = 'rgba(74,43,94,0.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
      ctx.fillText('👆', fx + sz * 0.08, fy - sz * 0.06 + (ph < 0.25 ? (0.25 - ph) * cell * 0.6 : 0));
    }
    ctx.restore();
  },

  // ---------- side panel ----------
  buildHud() {
    const hud = $('#hud'), b = this.b, lv = this.lv;
    hud.innerHTML = '';
    Pal.mount(hud);   // the companion (pal.js) on top, the level's name under the score
    const mv = el('div', 'panel'); const moves = el('div', 'moves', `<b>${b.moves}</b><span>步</span>`); mv.appendChild(moves);
    const gp = el('div', 'panel'), goals = el('div', 'goals');
    b.goals.forEach(g => {
      const d = el('div', 'goal');
      d.appendChild(Art.goalIcon(g, 120));
      d.appendChild(el('b', null, g.left));
      goals.appendChild(d);
    });
    gp.appendChild(goals);
    const sp = el('div', 'panel score');
    sp.innerHTML = `<div class="sub">第 ${this.li + 1} 关<span> · ${lv.name}</span></div><div class="num">0</div><div class="bar"><i></i><s>⭐</s><s>⭐</s><s>⭐</s></div>`;
    const btns = el('div', 'hbtns');
    const pause = el('button', 'ibtn', '⏸'); pause.onclick = () => { Snd.play('tap'); UI.pause(); };
    btns.appendChild(UI.homeButton()); btns.appendChild(pause);
    [mv, gp, sp, btns].forEach(n => hud.appendChild(n));
    const s = lv.stars, max = s[2] * 1.12, marks = $$('.bar s', sp);
    [s[1] * 0.45, s[1], s[2]].forEach((v, i) => { marks[i].style.left = (100 * v / max) + '%'; });
    this.drawScore();
  },
  drawScore() {
    const hud = $('#hud'), s = this.lv.stars, max = s[2] * 1.12, v = Math.round(this.hudScore);
    const num = $('.score .num', hud); if (!num) return;
    num.textContent = v.toLocaleString('en-US');
    $('.bar i', hud).style.width = Math.min(100, 100 * v / max) + '%';
    const marks = $$('.bar s', hud), won = this.b.won();
    marks[0].classList.toggle('on', won); marks[1].classList.toggle('on', won && v >= s[1]); marks[2].classList.toggle('on', won && v >= s[2]);
  },
  setMoves(n) {
    const m = $('#hud .moves'); if (!m) return;
    $('b', m).textContent = n;
    m.classList.toggle('low', n <= 5 && !this.b.won());
    m.style.transform = 'scale(1.15)'; setTimeout(() => { m.style.transform = ''; }, 150);
  },
  goalIndex(t, c) { return this.b.goals.findIndex(g => g.t === t && (t !== 'c' || g.color === c)); },
  flyGoal(gi, img, x, y, big, quiet) {
    if (gi < 0 || quiet) return;
    const node = $$('#hud .goal')[gi]; if (!node) return;
    const r = node.getBoundingClientRect(), cell = this.G.cell;
    Fx.fly({ x0: x, y0: y, x1: r.left + r.width / 2, y1: r.top + r.height / 2, s0: cell * (big ? 1.1 : 0.9), s1: r.width * 0.8, dur: 520 + Math.random() * 160, lift: 60 + Math.random() * 60, img, trail: '#ffffff',
      onArrive: () => {
        this.hudGoals[gi] = Math.max(0, this.hudGoals[gi] - 1);
        this.showGoal(gi);
        Snd.play('fly', gi * 3 + (this.hudGoals[gi] % 5));
        node.classList.add('bump'); setTimeout(() => node.classList.remove('bump'), 120);
      } });
  },
  showGoal(gi) {
    const node = $$('#hud .goal')[gi]; if (!node) return;
    const n = this.hudGoals[gi], b = $('b', node);
    if (n <= 0 && !node.classList.contains('ok')) { node.classList.add('ok'); b.textContent = '✓'; Snd.play('goal'); const r = node.getBoundingClientRect(); Fx.sparkles(r.left + r.width / 2, r.top + r.height / 2, 10, r.width / 2, '#ffd23a'); }
    else if (n > 0) b.textContent = n;
  },
  syncHud() {
    const b = this.b;
    b.goals.forEach((g, i) => { if (this.hudGoals[i] !== g.left) { setTimeout(() => { if (this.b !== b) return; this.hudGoals[i] = g.left; this.showGoal(i); }, 700); } });
    this.setMoves(this.b.moves);
  },
};

// 动物消消乐 · the screens around the game: the level map, the cards (level start, result, pause), the parents'
// corner behind a grown-up question, and the little toast that confirms a setting there.
// The cards a child sees use pictures, numbers and the narrator's voice, not sentences: she can't read yet.
const UI = {
  modal(build, o = {}) {
    const m = $('#modal'); m.hidden = false; m.innerHTML = '';
    Fx.hush(); $('#toast').classList.remove('on');
    const card = el('div', 'card' + (o.cls ? ' ' + o.cls : ''));
    build(card);
    m.appendChild(card);
    m.onclick = e => { if (e.target === m && o.close) { Snd.play('tap'); o.close(); } };
    return card;
  },
  closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; m.onclick = null; },
  button(label, cls, fn) { const b = el('button', 'btn ' + (cls || ''), label); b.onclick = () => { Snd.init(); Snd.play('tap'); fn(); }; return b; },
  // the little house back to 思维小画本, on the map, in the game and on the math page (a math page still owed stays owed)
  homeButton() {
    const b = el('button', 'ibtn home', '🏠'); b.title = '回思维小画本'; b.setAttribute('aria-label', '回思维小画本');
    b.onclick = () => { Snd.play('tap'); Voice.stop(); setTimeout(() => { location.href = '../'; }, 120); };
    return b;
  },

  // ---------- the level map: one island at a time ----------
  // 第二季 (decli 2026-11-02): the levels are islands (ISLANDS in levels.js); ◀ ▶, a swipe or the row of islands at the
  // bottom goes to another one. An island she can't play yet can be looked at, its levels locked. The first time she
  // arrives on a new island it is welcomed by name.
  isleOpen(k) { return Store.d.open > ISLANDS[k].from; },
  isleStars(k) { const s = ISLANDS[k]; let n = 0; for (let i = s.from; i < s.from + s.n; i++) n += Store.d.stars[i] || 0; return n; },
  map(k) {
    Game.stop(); this.closeModal(); $('#album').hidden = true;
    Music.start();
    const d = Store.d, cur = Math.min(d.open, LEVELS.length) - 1;
    if (k == null) k = d.isle >= 0 && d.isle < ISLANDS.length ? d.isle : isleOf(cur);
    if (k !== d.isle) { d.isle = k; Store.save(); }
    const isle = ISLANDS[k], open = this.isleOpen(k);
    const map = $('#map'); map.hidden = false; map.innerHTML = '';
    // the island's own picture when decli's is in, else its colours and things growing round the edges
    const bg = Art2.img['island-' + (k + 1) + '-bg'];
    map.style.background = bg ? `center/cover no-repeat url(${bg.src})` : `radial-gradient(ellipse at 50% 58%,${isle.land} 0 34%,transparent 62%),linear-gradient(170deg,${isle.sky.join(',')})`;
    if (!bg) {
      const deco = el('div', 'deco');
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * Math.PI * 2 + 0.3, e = el('span', null, isle.deco[i % isle.deco.length]);
        Object.assign(e.style, { left: 50 + Math.cos(a) * 47 + '%', top: 54 + Math.sin(a) * 44 + '%', fontSize: 34 + (i * 7) % 22 + 'px', animationDelay: -i * 0.7 + 's' });
        deco.appendChild(e);
      }
      map.appendChild(deco);
    }
    const top = el('div', 'top');
    top.appendChild(this.homeButton());
    const title = el('h1', null, `<span class="ic">${isle.icon} </span>${isle.name}`);
    top.appendChild(title);
    top.appendChild(el('div', 'pill stars', `⭐ ${this.isleStars(k)} / ${isle.n * 3}`));
    const book = el('button', 'pill book' + ((d.giftFresh || []).length ? ' new' : ''), `🎁 ${Gift.count()} / ${FRIENDS.length}`);
    book.onclick = () => { Snd.init(); Snd.play('select'); Gift.album(); };
    top.appendChild(book);
    const gear = el('button', 'ibtn', '⚙️'); gear.onclick = () => { Snd.play('tap'); this.parent({}); };
    top.appendChild(gear);
    map.appendChild(top);
    if (!open) map.appendChild(el('div', 'isle-lock', '🔒'));   // behind the path and the levels
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.id = 'path';
    map.appendChild(svg);
    const idx = Array.from({ length: isle.n }, (_, j) => isle.from + j);
    const nodes = idx.map(i => {
      const lv = LEVELS[i], n = el('button', 'node' + (i === isle.from + isle.n - 1 ? ' boss' : ''));
      const on = i < d.open, st = d.stars[i] || 0;
      if (!on) { n.classList.add('lock'); n.innerHTML = '🔒'; }
      else { n.textContent = i + 1; if (st) n.classList.add('done'); }
      if (on && i === d.open - 1 && !st) n.classList.add('cur');
      n.appendChild(el('span', 'st', on ? '⭐'.repeat(st) + '<span style="opacity:.3">' + '⭐'.repeat(3 - st) + '</span>' : ''));
      if (on) n.appendChild(el('span', 'nm', lv.name));
      n.onclick = () => {
        Snd.init();
        if (!on) { Snd.play('bad'); Voice.say(open ? L.locked : L.isle.locked); n.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], 250); return; }
        Snd.play('select'); this.intro(i);
      };
      map.appendChild(n);
      return n;
    });
    const av = el('canvas', 'avatar'); av.width = av.height = 152;
    av.getContext('2d').drawImage(Art.friend(Pal.i(), 152, 132), 0, 0);   // the companion stands for her on the map
    av.hidden = !idx.includes(cur);
    map.appendChild(av);
    // travelling between islands
    const go = j => { if (j < 0 || j >= ISLANDS.length || j === k) return; Snd.init(); Snd.play('swap'); this.map(j); };
    const prev = el('button', 'isle-arrow prev', '◀'), next = el('button', 'isle-arrow next' + (k + 1 < ISLANDS.length && !this.isleOpen(k + 1) ? ' shut' : ''), '▶');
    prev.hidden = k === 0; next.hidden = k === ISLANDS.length - 1;
    prev.onclick = () => go(k - 1); next.onclick = () => go(k + 1);
    map.appendChild(prev); map.appendChild(next);
    const row = el('div', 'isles');
    ISLANDS.forEach((s, j) => {
      const b = el('button', 'isle' + (j === k ? ' on' : '') + (this.isleOpen(j) ? '' : ' shut'));
      const pic = Art2.img['island-' + (j + 1)];
      if (pic) { const im = el('img'); im.src = pic.src; im.alt = ''; b.appendChild(im); } else b.textContent = s.icon;
      if (this.isleStars(j) >= s.n * 3) b.classList.add('full');
      b.onclick = () => go(j);
      row.appendChild(b);
    });
    map.appendChild(row);
    let sx = null;
    map.onpointerdown = e => { sx = e.target === map || e.target === svg || e.target.closest('.deco') ? e.clientX : null; };
    map.onpointerup = e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 70) go(k + (dx < 0 ? 1 : -1)); };
    const place = () => {
      const W = innerWidth, H = innerHeight, wide = W >= H;
      const cols = wide ? 5 : 3, rows = Math.ceil(isle.n / cols);
      const topH = top.getBoundingClientRect().bottom + (H < 500 ? 24 : 40), bottom = row.getBoundingClientRect().height + (H < 500 ? 34 : 50);
      const x0 = W * (wide ? 0.14 : 0.19), x1 = W * (wide ? 0.86 : 0.81);
      const pts = idx.map((_, j) => {
        const r = Math.floor(j / cols), c = j % cols, col = r % 2 ? cols - 1 - c : c;
        const y = topH + (H - bottom - topH) * (r + 0.5) / rows;
        return [x0 + (x1 - x0) * col / (cols - 1), y + Math.sin(j * 1.7) * 10];
      });
      const sz = clamp(Math.min(W / (cols * 2.5), (H - topH - bottom) / (rows * 1.95)), 44, 104);
      map.classList.toggle('tight', sz < 62);   // a short screen: the stars stay, the names go
      nodes.forEach((n, j) => {
        const big = j === isle.n - 1 ? 1.18 : 1;
        n.style.left = pts[j][0] + 'px'; n.style.top = pts[j][1] + 'px';
        n.style.width = n.style.height = sz * big + 'px'; n.style.margin = `${-sz * big / 2}px 0 0 ${-sz * big / 2}px`; n.style.fontSize = sz * 0.4 + 'px';
      });
      let dd = `M${pts[0][0]},${pts[0][1]}`;
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[Math.max(0, i - 2)], p1 = pts[i - 1], p2 = pts[i], p3 = pts[Math.min(pts.length - 1, i + 1)];
        dd += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
      }
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.innerHTML = `<path d="${dd}" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="${sz * 0.42}" stroke-linecap="round"/>` +
        `<path d="${dd}" fill="none" stroke="#e9a35a" stroke-width="${sz * 0.12}" stroke-dasharray="${sz * 0.05} ${sz * 0.28}" stroke-linecap="round"/>`;
      const at = idx.indexOf(cur);
      if (at >= 0) { av.style.left = pts[at][0] + 'px'; av.style.top = pts[at][1] + 'px'; av.style.width = av.style.height = sz * 0.75 + 'px'; av.style.margin = `${-sz * 1.15}px 0 0 ${sz * 0.05}px`; }
    };
    place();
    this._mapResize && removeEventListener('resize', this._mapResize);
    this._mapResize = () => { if (!map.hidden) place(); };
    addEventListener('resize', this._mapResize);
    // a new island, the first time she gets there
    if (open && k > 0 && !d.seen['isle_' + k]) { d.seen['isle_' + k] = 1; Store.save(); Voice.say(L.isle.hi[k]); title.animate([{ transform: 'scale(.6)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 600, easing: 'ease-out' }); Fx.confetti(50); }
  },
  // the last level of an island won for the first time: a card for the island and a blind box that is always 稀有 or
  // better
  async isleDone(k) {
    const isle = ISLANDS[k];
    Snd.play('win'); Fx.confetti(120);
    Voice.say(L.isle.done[k]);
    await new Promise(res => {
      this.modal(card => {
        card.appendChild(el('h2', 'green', `${isle.icon} ${isle.name}`));
        const pic = Art2.img['island-' + (k + 1)];
        if (pic) { const im = el('img', 'isle-pic'); im.src = pic.src; im.alt = ''; card.appendChild(im); } else card.appendChild(el('div', 'bigstars', '🏝️'));
        card.appendChild(el('p', null, `<span class="big">${isle.n} / ${isle.n}</span> 关 · ⭐ ${this.isleStars(k)}`));
        const row = el('div', 'row');
        row.appendChild(this.button('🎁 打开', 'sun', () => { this.closeModal(); res(); }));
        card.appendChild(row);
      });
    });
    await Gift.open(3, { rare: true, isle: k });
  },

  // ---------- before a level ----------
  intro(li) {
    const lv = LEVELS[li], goalEls = [];
    Store.newDay();   // the first game of a day needs no math page (decli 2026-11-06), even with the game left open overnight
    Cast.pick(li);   // new animals every game
    this.modal(card => {
      card.appendChild(el('h2', null, `第 ${li + 1} 关`));
      card.appendChild(el('div', 'big', lv.name));
      // the moves and the goals as pictures, the same as the panels she will see while playing (the narrator says the rest)
      const goals = el('div', 'goals');
      goals.appendChild(el('div', 'moves', `<b>${lv.moves}</b><span>步</span>`));
      const probe = new Board(lv, mulberry32(1));
      probe.goals.forEach(g => { const d = el('div', 'goal'); d.appendChild(Art.goalIcon(g, 136)); d.appendChild(el('b', null, g.n)); goals.appendChild(d); goalEls.push(d); });
      card.appendChild(goals);
      if (Store.d.best[li]) card.appendChild(el('p', 'best', `🏆 ${Store.d.best[li].toLocaleString('en-US')}`));
      const row = el('div', 'row');
      row.appendChild(this.button('🗺️', 'ghost', () => this.closeModal()));
      row.appendChild(Store.d.owed ? this.button('✏️ 先做数学题', 'sun', () => this.play(li)) : this.button('开始 ▶', 'green', () => this.play(li)));
      card.appendChild(row);
    }, { close: () => this.closeModal() });
    const line = L.intro(lv, li + 1);
    const tip = lv.tip && !Store.d.seen['tip_' + lv.tip] ? L.tip[lv.tip] : null;
    // the intro, then this game's animals by name, each goal picture bouncing as it is named, then the tip
    const open = () => !$('#modal').hidden && $('#modal .goals') === goalEls[0]?.parentNode;
    const named = lv.goals.map((g, j) => (g.t === 'c' ? j : -1)).filter(j => j >= 0);
    const names = k => {
      if (!open()) return;
      if (k >= named.length) { if (tip) Voice.say(tip); return; }
      const j = named[k];
      goalEls[j].animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25) rotate(-6deg)' }, { transform: 'scale(1)' }], 520);
      Voice.say(L.gift.names[ANIMALS[lv.goals[j].color].h], { onend: () => setTimeout(() => names(k + 1), 120) });
    };
    Voice.say(line, { onend: () => names(0) });
    if (tip) { Store.d.seen['tip_' + lv.tip] = 1; Store.save(); }
  },
  // start a level, through the math page when one is owed (never before the first game of the day)
  async play(li) {
    this.closeModal();
    Store.newDay();
    if (Store.d.owed) { Game.stop(); await MathGate.open(); }
    Game.start(li);
  },

  // ---------- after a level ----------
  result(o) {
    const lv = LEVELS[o.li], last = o.li >= LEVELS.length - 1;
    this.modal(card => {
      if (o.win) {
        card.appendChild(el('h2', 'green', '过关啦！'));
        const st = el('div', 'bigstars', '<span>⭐</span><span>⭐</span><span>⭐</span>');
        card.appendChild(st);
        [...st.children].forEach((s, i) => { if (i < o.stars) setTimeout(() => { s.classList.add('on'); Snd.play('star', i); Fx.sparkles(s.getBoundingClientRect().left + 30, s.getBoundingClientRect().top + 30, 8, 30, '#ffd23a'); }, 300 + i * 380); });
        card.appendChild(el('p', null, `<span class="big">${o.score.toLocaleString('en-US')}</span> 分`));
        if (last) card.appendChild(el('p', null, '🏆 所有小岛全部通关啦！'));
        const row = el('div', 'row');
        row.appendChild(this.button('🗺️', 'ghost', () => this.map()));
        row.appendChild(this.button('↻ 再玩一次', 'violet', () => this.play(o.li)));
        if (!last) row.appendChild(this.button('下一关 ▶', 'green', () => this.play(o.li + 1)));
        card.appendChild(row);
        // a replay that opened no box: she hears that three stars still would (if she hasn't had them)
        setTimeout(() => Voice.say(last ? L.allDone : !o.box && o.stars < 3 && (Store.d.stars[o.li] || 0) < 3 ? L.gift.more : L.stars[o.stars]), 1500);
        if (last) setTimeout(() => Fx.confetti(120), 600);
      } else {
        card.appendChild(el('h2', 'violet', '差一点点！'));
        const goals = el('div', 'goals');
        o.goals.forEach(g => { if (g.left <= 0) return; const d = el('div', 'goal'); d.appendChild(Art.goalIcon(g, 136)); d.appendChild(el('b', null, g.left)); goals.appendChild(d); });
        card.appendChild(goals);
        const row = el('div', 'row');
        if (o.extra) row.appendChild(this.button('✏️ +5 步', 'sun', () => { this.closeModal(); Game.moreMoves(); }));
        row.appendChild(this.button('↻ 再试一次', 'violet', () => this.play(o.li)));
        row.appendChild(this.button('🗺️', 'ghost', () => this.map()));
        card.appendChild(row);
        if (o.extra) setTimeout(() => Voice.say(L.extraOffer), 1800);
      }
    });
  },

  pause() {
    Clock.paused = true; Music.stop();
    const resume = () => { this.closeModal(); Clock.paused = false; Music.start(); };
    this.modal(card => {
      card.appendChild(el('h2', 'violet', '休息一下'));
      card.appendChild(this.soundRow());
      const row = el('div', 'row');
      row.appendChild(this.button('🗺️ 地图', 'ghost', () => { Clock.paused = false; this.map(); }));
      row.appendChild(this.button('↻ 重新开始', 'violet', () => { Clock.paused = false; this.play(Game.li); }));
      row.appendChild(this.button('▶ 继续', 'green', resume));
      card.appendChild(row);
    }, { close: resume });
  },
  soundRow() {
    const d = Store.d, row = el('div', 'seg');
    row.style.justifyContent = 'center';
    const mk = (label, key, apply) => {
      const b = el('button', d[key] ? 'on' : '', label);
      b.onclick = () => { d[key] = !d[key]; b.classList.toggle('on', d[key]); apply(d[key]); Store.save(); Snd.play('tap'); };
      row.appendChild(b);
    };
    mk('🔊 音效', 'snd', v => Snd.setOn(v));
    mk('🗣️ 语音', 'voi', v => { Voice.on = v; if (!v) Voice.stop(); });
    mk('🎵 音乐', 'mus', v => { Snd.music = v; Music.refresh(); });
    return row;
  },

  // ---------- parents' corner ----------
  parent(o) {
    const zh = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4);
    let got = '';
    const m = $('#modal'); const prevZ = m.style.zIndex; m.style.zIndex = 50;
    const close = () => { m.style.zIndex = prevZ; this.closeModal(); };
    const card = this.modal(card => {
      card.classList.add('gate');
      card.appendChild(el('h2', 'violet', '家长专区'));
      card.appendChild(el('p', null, `请爸爸妈妈回答：<br><b style="font-size:30px">${zh[a]}乘以${zh[b]}等于多少？</b>`));
      const disp = el('div', 'big', '&nbsp;'); card.appendChild(disp);
      const keys = el('div', 'keys');
      '1234567890'.split('').forEach(k => {
        const kb = el('button', 'key', k);
        kb.onclick = () => {
          Snd.play('key', +k); got = (got + k).slice(-2); disp.textContent = got;
          if (got.length === 2 || +got === a * b) {
            if (+got === a * b) { Snd.play('right'); close(); this.settings(o); }
            else if (got.length === 2) { Snd.play('wrong'); disp.textContent = '再试试'; got = ''; }
          }
        };
        keys.appendChild(kb);
      });
      card.appendChild(keys);
      const row = el('div', 'row'); row.appendChild(this.button('取消', 'ghost small', close)); card.appendChild(row);
    }, { close });
    if (o.fromMath) m.style.zIndex = 50;
    Voice.say(L.parent);
    return card;
  },
  settings(o) {
    const d = Store.d, cfg = d.math;
    const m = $('#modal'); m.style.zIndex = 50;
    const close = () => { m.style.zIndex = ''; this.closeModal(); if (!$('#map').hidden) this.map(); if (o.done) o.done(); };
    this.modal(card => {
      card.classList.add('set');
      card.appendChild(el('h2', 'violet', '家长设置'));
      const seg = (title, key, opts, obj = cfg) => {
        card.appendChild(el('h3', null, title));
        const s = el('div', 'seg');
        opts.forEach(([v, label]) => {
          const b = el('button', obj[key] === v ? 'on' : '', label);
          b.onclick = () => { obj[key] = v; $$('button', s).forEach(x => x.classList.toggle('on', x === b)); Store.save(); Snd.play('tap'); sample(); };
          s.appendChild(b);
        });
        card.appendChild(s);
      };
      card.appendChild(el('p', null, '<span style="font-size:17px">每天第一局直接玩，不用做题；之后每玩完一局，再玩、进下一关或当天再进来，都要先做一页数学题，全部做对才能接着玩。</span>'));
      seg('📝 每页几道题', 'count', [['wheel', '🎡 转盘抽']].concat([['ramp', '越做越多']], MATH_COUNTS.map(n => [n, n + ' 道'])));
      // the numbers on the wheel (decli 2026-11-06): any of 0 to MATH_MOST, ticked one by one
      card.appendChild(el('h3', null, '🎡 转盘上有哪些数（点一下选上 / 去掉）'));
      const chips = el('div', 'seg chips'), wnote = el('p', 'note');
      const showW = () => {
        const w = MathGate.wheelNums();
        $$('button', chips).forEach(b => b.classList.toggle('on', w.includes(+b.dataset.n)));
        wnote.textContent = `转盘现在有 ${w.length} 格：${w.join('、')} 道` + (w.includes(0) ? '（转到 0 这次就不用做题）' : '') + '。每格一样大，转到哪个数的机会都一样；改了以后，下一次转盘就用新的数。';
      };
      for (let n = 0; n <= MATH_MOST; n++) {
        const b = el('button', null, String(n)); b.dataset.n = n;
        b.onclick = () => {
          const w = MathGate.wheelNums(), has = w.includes(n);
          if (has && w.length === 1) { Snd.play('bad'); this.toast('转盘上至少要留一个数'); return; }
          cfg.wheel = has ? w.filter(x => x !== n) : w.concat(n).sort((a, b) => a - b);
          d.spin = null;   // a page owed is drawn again on the new wheel
          Store.save(); Snd.play('tap'); showW();
        };
        chips.appendChild(b);
      }
      chips.appendChild(this.button('恢复默认', 'ghost small', () => { cfg.wheel = MATH_WHEEL.slice(); d.spin = null; Store.save(); Snd.play('tap'); showW(); }));
      card.appendChild(chips); card.appendChild(wnote); showW();
      card.appendChild(el('p', 'note', `转盘抽：每页之前孩子自己转一下转盘，转到几就做几道（默认 ${MATH_WHEEL.join('、')} 道）。越做越多：当天第 1 页 ${MATH_RAMP[0]} 道、第 2 页 ${MATH_RAMP[1]} 道、第 3 页 ${MATH_RAMP[2]} 道，之后每页 ${MATH_RAMP[3]} 道，第二天重新从 ${MATH_RAMP[0]} 道开始。今天已经做完 ${MathGate.pagesToday()} 页。`));
      card.appendChild(el('p', 'note', '做题时不逐题判对错，免得打断她的思路：✓ 只是跳到下一道，整页都写好了点「交卷」，小老师一次批改完，对的打 ✓，错的圈出来让她订正。订正时先语音提示错在哪（看错符号、差一点、写反了……）并出现 💡；再错或点 💡，小老师来帮忙，答案始终让她自己数、自己写，不直接给答案；看着图还是数错，小老师就带着她一个一个数。'));
      seg('🦉 小老师先用哪种办法', 'way', [['col', '列竖式'], ['pick', '她自己选'], ['random', '随机换'], ['frame', '摆一摆'], ['line', '跳一跳'], ['split', '拆一拆']], d);
      const used = Teach.WAYS.map((w, i) => { const r = (d.ways || {})[w]; return r && r[0] ? `${L.teach.ways[i]} 用了 ${r[0]} 次，其中 ${r[1]} 次看图自己数对` : ''; }).filter(Boolean);
      card.appendChild(el('p', 'note', '列竖式（默认）：学校里的竖式，个位对个位、十位对十位，旁边的数位表里个位是小动物、十位是一捆捆；满十捆一捆进到十位（记小 1），不够减从十位借一捆拆开（点退位点），她一位一位数、一位一位写，最后把得数写回横式。摆一摆：小动物摆进十格框，满十捆一捆、不够拆一捆。跳一跳：小青蛙在数轴上往前、往回跳，整十跳大步，数轴上标着整十。拆一拆：拆成几小步自己填（凑十、平十、破十、先算整十），每步配图数一数。小老师里点 🔄 随时换一种。'
        + (used.length ? '<br>她的记录：' + used.join('；') + (d.wayLast ? `；上次用的是${L.teach.ways[Teach.WAYS.indexOf(d.wayLast)]}。` : '。') : '')));
      seg('📏 数的范围', 'max', [[20, '20 以内'], [50, '50 以内'], [100, '100 以内']]);
      card.appendChild(el('p', 'note', '每一页都由易到难：先是 20 以内不进位不退位的，再是两位数不进位的，然后 20 以内进位退位的，最后两位数进位退位的。选 50 或 100 以内时，20 以内的题和更大的数大约各占一半；选 20 以内就全是 20 以内。'));
      seg('🔢 几个数一起算', 'ops', [[2, '两个数'], [3, '三个数'], [4, '四个数']]);
      seg('➕ 题型', 'mode', [['mix', '加减混合'], ['add', '只有加法'], ['sub', '只有减法']]);
      const smp = el('div', 'sample'); card.appendChild(smp);
      const sample = () => { smp.textContent = '例题：' + MathGate.page(cfg, 4).map(q => q.text + ' = ' + q.ans).join('　　'); };
      sample();
      card.appendChild(el('h3', null, '🔊 声音'));
      card.appendChild(this.soundRow());
      // the record
      card.appendChild(el('h3', null, '📒 做题记录'));
      const today = new Date().toDateString();
      const tl = d.log.filter(r => new Date(r[0]).toDateString() === today);
      const sum = (a, k) => a.reduce((n, r) => n + r[k], 0);
      card.appendChild(el('p', null, `<span style="font-size:17px">今天做了 <b>${tl.length}</b> 页、${sum(tl, 1)} 道题，第一次就做对 ${sum(tl, 1) ? Math.round(100 * sum(tl, 2) / sum(tl, 1)) : 0}%；一共玩了 ${d.played} 局。</span>`));
      if (d.log.length) {
        const tb = el('table');
        d.log.slice(-8).reverse().forEach(r => {
          const t = new Date(r[0]), pad = n => String(n).padStart(2, '0');
          const tr = el('tr', null, `<td>${t.getMonth() + 1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}</td><td>${r[4]}</td><td>${r[2]}/${r[1]} 一次对</td><td>${Math.floor(r[3] / 60)}分${r[3] % 60}秒</td>`);
          tb.appendChild(tr);
        });
        card.appendChild(tb);
      }
      card.appendChild(el('h3', null, '🛠️ 其他'));
      const row = el('div', 'row'); row.style.justifyContent = 'flex-start'; row.style.marginTop = '4px';
      if (o.fromMath && o.skip) row.appendChild(this.button('跳过这一页', 'sun small', () => { m.style.zIndex = ''; this.closeModal(); o.skip(); }));
      else row.appendChild(this.button(d.owed ? '免做下一页数学题' : '下一局不用做题 ✓', 'sun small', () => { d.owed = false; Store.save(); this.toast('好的，下一局不用先做题'); }));
      row.appendChild(this.button('解锁全部关卡', 'ghost small', () => { d.open = LEVELS.length; Store.save(); this.toast(`${LEVELS.length} 关都打开了`); }));
      row.appendChild(this.button('清空进度', 'ghost small', () => {
        if (!confirm('清空关卡、星星、收集册和做题记录？')) return;
        const keep = { math: d.math, way: d.way, snd: d.snd, voi: d.voi, mus: d.mus };
        Store.d = Object.assign(Store.defaults(), keep); Store.save(); this.toast('已清空');
      }));
      card.appendChild(row);
      card.appendChild(el('p', null, '<span style="font-size:14px;opacity:.6">中文旁白由微软神经网络语音（edge-tts）预先录制。</span>'));
      const done = el('div', 'row done'); done.appendChild(this.button('完成', 'green', close)); card.appendChild(done);
    }, { close });
  },

  toast(text) {
    const t = $('#toast'); t.textContent = text;
    t.classList.add('on'); clearTimeout(this._toastT);
    this._toastT = setTimeout(() => t.classList.remove('on'), 2600 + text.length * 120);
  },
};

// 动物消消乐 · start-up and the frame loop.
(function boot() {
  Store.load();
  if (/[?&]debug\b/.test(location.search)) window.XX = { Game, Board, Store, UI, Fx, Clock, MathGate, Wheel, Teach, L, LEVELS, ISLANDS, Snd, Voice, Music, Gift, Cast, ANIMALS, FRIENDS, Art, Art2, Pal };
  Snd.on = Store.d.snd; Snd.music = Store.d.mus; Voice.on = Store.d.voi;
  Fx.init($('#fx'));
  Game.init();
  Game.layout();
  const bar = $('#ldBar');
  bar.style.width = '30%';
  Voice.load();
  Art2.load();
  Snd.load(['bg1', 'bg2', 'great', 'excellent', 'unbelievable']);
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(50, now - last); last = now;
    Clock.tick(dt);
    Fx.update(dt);
    Game.frame(dt);
    Game.draw();
    Fx.draw();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  // the first touch anywhere wakes up sound (browsers keep it off until then)
  const wake = () => { Snd.init(); if (Snd.ctx) { Snd.setOn(Store.d.snd); } };
  addEventListener('pointerdown', wake, true);
  Art.load().then(() => {
    bar.style.width = '100%';
    Art.setCell(64, Math.min(devicePixelRatio || 1, 2));
    const ld = $('#loader');
    ld.innerHTML = '';
    const pic = el('canvas'); pic.width = pic.height = 300; pic.style.width = pic.style.height = '150px';
    const px = pic.getContext('2d');
    [[0, 30, 120], [1, 150, 100], [2, 80, 190], [3, 200, 200]].forEach(([k, x, y]) => px.drawImage(Art.head(k, 130, 110), x - 65, y - 65));
    ld.appendChild(pic);
    ld.appendChild(el('div', null, '<span style="font-size:40px;font-weight:900;color:#fff;-webkit-text-stroke:2px #3d5229;paint-order:stroke fill;text-shadow:0 4px 0 #3d5229">动物消消乐</span>'));
    const go = el('button', 'btn green', '开始玩 ▶');
    go.onclick = () => {
      wake(); Snd.play('tap');
      ld.classList.add('gone'); setTimeout(() => ld.remove(), 450);
      const freed = Store.newDay();   // the first game of the day: a page owed from before is let go, and she is told
      UI.map();
      Voice.say(freed ? L.math.freeDay : Store.d.played ? L.pick : L.welcome);
    };
    ld.appendChild(go);
    if (/[?&]go\b/.test(location.search)) go.onclick();   // ?go skips the start button (for testing)
  });
  document.addEventListener('visibilitychange', () => {
    if (!Snd.ctx) return;
    if (document.hidden) { Snd.ctx.suspend(); Voice.stop(); } else Snd.ctx.resume();
  });
})();

})();
</script>
